<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>墨山 · 装配台</title>
<style>
  :root{
    --bg:#fbfbfa; --panel:#fff; --side:#f7f6f2; --line:#e6e4df; --line2:#efedE8;
    --ink:#1d1d1b; --dim:#6b6a66; --faint:#a3a099; --soft:#f4f2ee;
    --brand:#3c3a35; --green:#2f6f4e; --red:#b3261e; --amber:#8a6d1f;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer}
  a{color:inherit;text-decoration:none}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  /* ── 外壳 ── */
  .app{display:grid;grid-template-columns:208px minmax(0,1fr);height:100vh}
  aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px}
  .logo{display:flex;align-items:center;gap:8px;padding:2px 8px 16px}
  .logo i{width:22px;height:22px;border-radius:6px;background:var(--brand);display:grid;place-items:center;
    color:#fff;font-style:normal;font-size:12px;font-weight:700}
  .logo b{font-size:14px;font-weight:640;letter-spacing:.3px}
  .logo span{font-size:11px;color:var(--faint);margin-left:2px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav #navFlow{display:flex;flex-direction:column;gap:2px;min-width:0}
  .nav a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;font-size:13px;color:#4a4944}
  .nav a:hover{background:#eeece6}
  .nav a.on{background:#e9e6de;color:var(--ink);font-weight:600}
  .nav a i{font-style:normal;width:15px;text-align:center;color:var(--faint);font-size:13px}
  .nav a.on i{color:var(--brand)}
  .nav .lbl{font-size:11px;color:var(--faint);padding:16px 10px 6px;letter-spacing:.5px}
  .sidefoot{margin-top:auto;padding:10px 8px 2px;font-size:11.5px;color:var(--faint);line-height:1.7}

  main{overflow:auto;min-width:0}
  .top{position:sticky;top:0;z-index:20;background:rgba(251,251,250,.92);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);padding:0 28px;height:52px;display:flex;align-items:center;gap:14px}
  .crumb{font-size:12.5px;color:var(--faint);display:flex;align-items:center;gap:7px}
  .crumb b{color:var(--ink);font-weight:600}
  .top .right{margin-left:auto;display:flex;gap:8px;align-items:center}

  /* 步骤条 */
  .steps{display:flex;align-items:center;gap:0;font-size:12px;color:var(--faint)}
  .steps .s{display:flex;align-items:center;gap:6px;padding:0 4px}
  .steps .s em{font-style:normal;width:17px;height:17px;border-radius:50%;border:1px solid var(--line);
    background:#fff;display:grid;place-items:center;font-size:10.5px;color:var(--faint)}
  .steps .s.on{color:var(--ink);font-weight:600}
  .steps .s.on em{background:var(--brand);border-color:var(--brand);color:#fff}
  .steps .s.done em{background:#eef6f1;border-color:#bcd8c8;color:var(--green)}
  .steps .bar{width:22px;height:1px;background:var(--line)}

  /* ── 通用 ── */
  .page{padding:26px 28px 70px;max-width:1180px}
  .pagehd{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
  .pagehd h1{margin:0;font-size:20px;font-weight:650;letter-spacing:.2px}
  .pagehd p{margin:4px 0 0;font-size:12.5px;color:var(--dim)}
  .pagehd .right{margin-left:auto;display:flex;gap:8px}

  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 13px;font-size:13px;
    display:inline-flex;align-items:center;gap:6px;transition:.12s}
  .btn:hover{background:var(--soft);border-color:#d5d1c7}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:#2b2a26}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--dim)}
  .btn.ghost:hover{background:var(--soft);color:var(--ink)}
  .btn.danger{color:var(--red);border-color:#e8c3bf;background:#fdf6f5}
  .btn.danger:hover{background:#fbeeec}
  .btn.sm{padding:3px 9px;font-size:12px;border-radius:6px}
  .btn.lg{padding:9px 20px;font-size:14px;border-radius:9px}
  .btn:disabled{opacity:.45;cursor:not-allowed;background:#f6f5f2}
  .btn.icon{padding:4px 7px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px}
  .box{padding:14px 16px}
  .bh{font-size:12.5px;font-weight:640;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .bh .sp{margin-left:auto;font-weight:400;font-size:11.5px;color:var(--faint)}
  .badge{font-size:11.5px;border-radius:20px;padding:1px 9px;border:1px solid;font-weight:400}
  .badge.ok{color:var(--green);border-color:#bcd8c8;background:#eef6f1}
  .badge.bad{color:var(--red);border-color:#e8c3bf;background:#fcf0ef}
  .badge.warn{color:#8a4a12;border-color:#f0e0c6;background:#fdf6ec}
  .badge.mute{color:var(--dim);border-color:var(--line);background:#faf9f7}
  .muted{color:var(--dim)}
  .faint{color:var(--faint)}
  .warnbox{font-size:12.5px;color:#8a4a12;background:#fdf6ec;border:1px solid #f0e0c6;border-radius:8px;padding:8px 10px;margin:7px 0}
  .brk{border-left:2px solid #e8c3bf;padding:1px 0 1px 10px;margin:9px 0;font-size:12.5px}
  .brk .fix{color:var(--dim);font-size:12px;margin-top:2px}
  .brk .fix em{font-style:normal;color:var(--green)}

  /* ── 工作台 ── */
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .proj{padding:16px;display:flex;flex-direction:column;gap:9px;transition:.15s;cursor:pointer}
  .proj:hover{border-color:#d5d1c7;box-shadow:0 6px 18px rgba(0,0,0,.045)}
  .proj h3{margin:0;font-size:14.5px;font-weight:620;display:flex;align-items:center;gap:8px}
  .proj .q{font-size:12px;color:var(--dim);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden;min-height:38px}
  .proj .foot{display:flex;align-items:center;gap:8px;margin-top:2px;font-size:11.5px;color:var(--faint)}
  .proj .foot .btn{margin-left:auto}
  .bar{height:4px;border-radius:3px;background:var(--soft);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--brand);border-radius:3px}
  .bar i.g{background:var(--green)}

  /* ── 需求页 ── */
  .askwrap{max-width:760px}
  .askwrap h1{font-size:26px;margin:8px 0 6px;font-weight:650;letter-spacing:.2px}
  .askwrap .sub{color:var(--dim);font-size:13.5px;margin:0 0 20px}
  textarea{width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);border-radius:10px;
    padding:13px 15px;font:14px/1.7 inherit;background:#fff;outline:none;color:var(--ink)}
  textarea:focus{border-color:#b9b5ab;box-shadow:0 0 0 3px #f0eee8}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 0}
  .chip{font-size:12px;border:1px dashed #ddd9cd;border-radius:20px;padding:3px 11px;color:var(--dim);background:#fff;cursor:pointer}
  .chip:hover{color:var(--ink);border-color:#c9c3b3;background:#fdfcfa}
  .askfoot{display:flex;align-items:center;gap:10px;margin-top:18px}
  .askfoot .faint{font-size:11.5px}
  .tips{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:12.5px;color:var(--dim);line-height:1.85}
  .tips b{color:var(--ink)}

  /* ── 选型页 ── */
  .planwrap{display:grid;grid-template-columns:minmax(0,1fr) 344px;gap:20px;align-items:start}
  .needbar{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;margin-bottom:14px}
  .needbar .q{font-size:13.5px;line-height:1.65;flex:1}
  .needbar .q em{font-style:normal;color:var(--faint);font-size:12px;display:block;margin-bottom:2px}
  .toolbar{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:12.5px;color:var(--dim)}
  .toolbar .k{display:flex;gap:14px;margin-right:auto}
  .toolbar .k span b{color:var(--ink)}

  .group{margin-bottom:18px}
  .gt{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:12.5px;font-weight:640}
  .gt .dot{width:7px;height:7px;border-radius:50%}
  .gt i{font-style:normal;font-weight:400;font-size:11.5px;color:var(--faint)}
  .mod{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:7px;
    display:grid;grid-template-columns:20px minmax(0,1fr);gap:9px;transition:.15s}
  .mod:hover{border-color:#d5d1c7}
  .mod.off{background:#faf9f6;opacity:.6}
  .mod input{margin:3px 0 0;width:15px;height:15px;accent-color:#3c3a35}
  .mod .h{display:flex;align-items:baseline;gap:7px}
  .mod .nm{font-weight:620;font-size:13.5px}
  .mod .cid{font:10.5px/1 ui-monospace,Menlo,monospace;color:#b3b0a7}
  .mod .lk{margin-left:auto;font-size:11.5px;color:var(--faint);border-bottom:1px dashed #d8d4c9;cursor:pointer;white-space:nowrap;flex:0 0 auto}
  .mod .lk:hover{color:var(--ink)}
  .mod .ab{font-size:12.5px;color:#4a4944;margin-top:1px}
  .mod .io{font-size:11.5px;color:var(--dim);margin-top:4px}
  .mod .io b{font-weight:500;color:#57554f}
  .pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  .pill{font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:1px 8px;color:#4a4944;background:#fff;cursor:pointer}
  .pill:hover{border-color:#c3bfb4}
  .pill.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .pill.on i{color:#c8c4ba}
  .pill i{font-style:normal;color:#a3a099;margin-left:4px;font-size:10px}
  .pill.more{color:var(--faint);border-style:dashed;cursor:default}

  aside.right{position:sticky;top:68px;display:flex;flex-direction:column;gap:11px}
  ol.seq{margin:0;padding-left:19px;font-size:12.5px}
  ol.seq li{margin:3px 0}
  ol.seq li small{color:#b3b0a7;font-size:10.5px;margin-left:5px;font-family:ui-monospace,Menlo,monospace}
  .gapbox{font-size:12px;color:#8a4a12;background:#fdf6ec;border:1px solid #f0e0c6;border-radius:8px;padding:8px 10px;margin-top:6px}
  .cta{display:flex;flex-direction:column;gap:7px}
  .cta .hint{font-size:11.5px;color:var(--faint);text-align:center}

  /* ── 确认页 ── */
  .conf{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
  th{font-size:11.5px;color:var(--dim);font-weight:600;background:#faf9f7;border-top:1px solid var(--line)}
  tr:last-child td{border-bottom:none}
  td.nm{font-weight:600}
  td .sub{color:var(--faint);font-size:11px;font-family:ui-monospace,Menlo,monospace}
  .stat{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
  .stat div{background:#fff;padding:12px 14px}
  .stat b{display:block;font-size:20px;font-weight:640;line-height:1.2}
  .stat span{font-size:11.5px;color:var(--dim)}
  .stat b.g{color:var(--green)} .stat b.a{color:var(--amber)} .stat b.r{color:var(--red)}

  /* ── 组装页 ── */
  .buildwrap{max-width:820px;margin:0 auto;padding:34px 28px}
  .ring{width:132px;height:132px;position:relative;margin:0 auto 6px}
  .ring svg{transform:rotate(-90deg)}
  .ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
  .ring .c b{font-size:24px;font-weight:650;letter-spacing:-.5px}
  .ring .c span{font-size:11px;color:var(--faint)}
  .stage{display:flex;justify-content:center;gap:0;margin:16px 0 22px}
  .stage .s{font-size:11.5px;color:var(--faint);padding:0 12px;position:relative;display:flex;align-items:center;gap:5px}
  .stage .s:after{content:"";position:absolute;right:-3px;width:6px;height:1px;background:var(--line)}
  .stage .s:last-child:after{display:none}
  .stage .s i{width:6px;height:6px;border-radius:50%;background:#dcd8cd}
  .stage .s.on{color:var(--ink);font-weight:600}
  .stage .s.on i{background:var(--brand)}
  .stage .s.done i{background:var(--green)}
  .log{background:#faf9f7;border:1px solid var(--line);border-radius:10px;padding:12px 14px;height:246px;
    overflow:auto;font:12px/1.95 ui-monospace,Menlo,monospace;color:#4a4944}
  .log div{white-space:pre-wrap}
  .log .t{color:#b3b0a7}
  .log .ok{color:var(--green)}
  .log .now{color:var(--ink);font-weight:600}
  .log .dim{color:var(--dim)}
  .buildbar{display:flex;justify-content:center;gap:8px;margin-top:16px}

  /* ── 完成页 ── */
  /* 注意：完成页容器不能叫 .done —— 阶段条里「已完成的步骤」也是 .s.done，
     两者一撞，max-width + margin:0 auto 会把阶段条上的项撑成居中块（真踩过） */
  .donewrap{max-width:760px;margin:0 auto;padding:44px 28px;text-align:center}
  .donewrap .tick{width:56px;height:56px;border-radius:50%;background:#eef6f1;border:1px solid #bcd8c8;
    display:grid;place-items:center;margin:0 auto 14px;color:var(--green);font-size:26px}
  .donewrap h1{margin:0;font-size:22px;font-weight:650}
  .donewrap p{margin:6px 0 0;color:var(--dim);font-size:13px}
  .tree{text-align:left;background:#faf9f7;border:1px solid var(--line);border-radius:10px;padding:13px 16px;
    margin:22px 0;font:12px/1.95 ui-monospace,Menlo,monospace;color:#4a4944;white-space:pre;overflow:auto}
  .tree .d{color:var(--brand);font-weight:600}
  .tree .m{color:var(--faint)}
  .donebtns{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}

  /* ── 试用 / 打包 ── */
  .trialbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .trialbox{display:block;width:100%;height:640px;border:1px solid var(--line);border-radius:12px;
    background:#f4f3ef;box-shadow:0 1px 0 #fff inset}
  .packlist{background:#faf9f7;border:1px solid var(--line);border-radius:10px;padding:4px 0;margin:14px 0;
    font:12px/1.9 ui-monospace,Menlo,monospace;overflow:auto}
  .packlist .row{display:flex;gap:10px;padding:5px 14px;border-bottom:1px solid var(--line2)}
  .packlist .row:last-child{border-bottom:0}
  .packlist .row b{font-weight:600;color:var(--ink);min-width:130px}
  .packlist .row span{color:var(--dim);font-family:inherit}
  @media(max-width:720px){.trialbox{height:540px}}

  /* ── 库 ── */
  .libbar{display:flex;gap:9px;align-items:center;margin-bottom:16px}
  input.search{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:13px inherit;outline:none;background:#fff}
  input.search:focus{border-color:#b9b5ab;box-shadow:0 0 0 3px #f0eee8}
  .libdom{margin-bottom:18px}
  .librow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .libitem{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 12px;cursor:pointer}
  .libitem:hover{border-color:#d5d1c7}
  .libitem b{font-size:13px;font-weight:600}
  .libitem .cid{font:10.5px/1 ui-monospace,Menlo,monospace;color:#b3b0a7;margin-left:6px}
  .libitem p{margin:2px 0 0;font-size:11.5px;color:var(--dim);line-height:1.55}

  /* ── 弹窗 / toast ── */
  .mask{position:fixed;inset:0;background:rgba(20,20,18,.28);display:grid;place-items:center;z-index:80;padding:24px}
  .modal{background:#fff;border-radius:13px;max-width:640px;width:100%;max-height:84vh;display:flex;flex-direction:column;
    box-shadow:0 24px 70px rgba(0,0,0,.18);overflow:hidden}
  .modal .mh{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .modal .mh b{font-size:14.5px;font-weight:640}
  .modal .mh .x{margin-left:auto;border:0;background:transparent;color:var(--faint);font-size:17px;line-height:1;padding:2px 5px;border-radius:5px}
  .modal .mh .x:hover{background:var(--soft);color:var(--ink)}
  .modal .mb{padding:16px 18px;overflow:auto}
  .modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#fcfbf9}
  .modal p{margin:8px 0;font-size:13px;line-height:1.75}
  .modal .kv{display:flex;gap:8px;font-size:12px;color:var(--dim);margin:3px 0}
  .modal .kv b{color:var(--ink);font-weight:500;min-width:52px;flex:0 0 auto}
  .pvrow{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin:7px 0}
  .pvrow.on{border-color:var(--brand);background:#fcfbf9}
  .pvrow .h{display:flex;align-items:center;gap:8px}
  .pvrow .h b{font-size:13px}
  .pvrow p{margin:4px 0 0;font-size:12px;color:var(--dim)}
  .pvrow ul{margin:5px 0 0;padding-left:16px;font-size:12px;color:var(--dim);line-height:1.7}
  #toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:#2b2a26;color:#fff;
    font-size:12.5px;padding:8px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:.22s;z-index:99}
  #toast.on{opacity:1;transform:translate(-50%,0)}

  .empty{color:var(--faint);font-size:12.5px}
  .mobar{display:none}
  @media(max-width:1080px){
    .mobar{display:flex;position:sticky;bottom:0;z-index:15;align-items:center;gap:10px;
      background:rgba(251,251,250,.95);backdrop-filter:blur(6px);border-top:1px solid var(--line);
      padding:9px 14px;margin:0 -14px}
  }
  .feed div{font-size:12.5px;color:#3a3934;padding:5px 0;border-bottom:1px dashed var(--line2)}
  .feed div:last-child{border-bottom:0}
  .feed .t{color:var(--faint);font-size:11.5px;margin-right:9px;font-family:ui-monospace,Menlo,monospace}
  .mini div{display:flex;align-items:center;font-size:12.5px;color:#3a3934;padding:4px 0}
  .mini div span{flex:1}
  .mini div i{font-style:normal;color:var(--faint);font-size:11.5px}
  @media(max-width:1080px){.page>div[style*="grid-template-columns:minmax(0,1fr) 320px"]{grid-template-columns:1fr!important}}
  @media(max-width:1080px){
    .planwrap,.conf{grid-template-columns:1fr}
    aside.right{position:static}
    .grid3{grid-template-columns:1fr}
    .librow{grid-template-columns:1fr}
  }
  @media(max-width:820px){
    .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
    aside{flex-direction:row;align-items:center;gap:6px;border-right:0;border-bottom:1px solid var(--line);
      padding:7px 12px;overflow-x:auto}
    .logo{padding:0 10px 0 0}
    .logo b{display:none}
    .logo span{display:none}
    /* 横排时 nav 不能被压缩：flex-shrink 会把每个入口挤到一个字宽，中文就竖排了 */
    .nav{flex-direction:row;gap:2px;flex:0 0 auto}
    .nav #navFlow{flex-direction:row;gap:2px;flex:0 0 auto}
    .nav a{white-space:nowrap;flex:0 0 auto}
    .nav .lbl{display:none}
    .sidefoot{display:none}
    .top{padding:0 14px;height:46px;gap:8px}
    .top .crumb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
    .top .right{flex:0 0 auto;white-space:nowrap;display:flex;gap:7px}
    .steps{display:none}
    .top .hubstep{display:none}
    .page{padding:18px 14px 60px}
    .pagehd{flex-wrap:wrap}
  }
  /* ── 个人中台：风格 / 模块 / 方案 ── */
  .hubstep{display:flex;align-items:center;gap:0;font-size:12px;color:var(--faint)}
  .hubstep .s{display:flex;align-items:center;gap:6px}

/* ────────── 需求解析（与 arch/match.py 同序） ────────── */
const norm = s => s.toLowerCase().replace(/[\s,，。；;、！!？?（）()【】\[\]「」“”"'—\-]+/g, "");
function hit(t, w){
  w = norm(w);
  let i = t.indexOf(w);
  while(i >= 0){
    const pre = t.slice(Math.max(0, i - 3), i);
    if(!D.neg.some(n => pre.includes(n))) return true;
    i = t.indexOf(w, i + 1);
  }
  return false;
}
/* 硬件格前置并按选型顺序排：用户最关心「这设备怎么做」，先给主控/传感/供电；
   而且从传感开始看，会先挑传感器，然后发现主控得反过来配。软件格按域顺序跟在后面。 */
const HW_ORDER = ["hw.mcu","hw.sense","hw.display","hw.power","hw.wireless",
                  "hw.firmware","hw.pcb","hw.enclosure","hw.gateway","hw.cert"];
function ord(ids){
  const rk = c => { const i = HW_ORDER.indexOf(c); return i < 0 ? 99 : i; };
  const hw = ids.filter(c => c.indexOf("hw.") === 0).sort((x, y) => rk(x) - rk(y));
  const rest = ids.filter(c => c.indexOf("hw.") !== 0)
    .sort((x, y) => D.domOrder.indexOf(byId[x].dom) - D.domOrder.indexOf(byId[y].dom));
  return hw.concat(rest);
}

function matchNeed(need){
  const t = norm(need), score = {}, why = {};
  const add = (cid, w, r) => { if(!byId[cid]) return; score[cid] = (score[cid] || 0) + w; (why[cid] = why[cid] || []).push(r); };
  for(const cid in D.trig){
    const [st, wk] = D.trig[cid];
    const ns = st.filter(w => hit(t, w));
    if(ns.length){ add(cid, 3 * Math.min(ns.length, 3), "命中「" + ns.slice(0, 3).join("、") + "」"); continue; }
    const nw = wk.filter(w => hit(t, w));
    if(nw.length) add(cid, 1, "沾到「" + nw.slice(0, 2).join("、") + "」");
  }
  const scen = [];
  for(const [label, words, mods] of D.scen){
    const ns = words.filter(w => hit(t, w));
    if(!ns.length) continue;
    scen.push(label);
    mods.forEach(c => add(c, 5, "场景「" + label + "」"));
  }
  const prefs = {};
  for(const k in D.cons){ const v = D.cons[k].filter(w => hit(t, w)); if(v.length) prefs[k] = v; }

  let must = [], opt = [];
  for(const cid in score) (score[cid] >= 3 ? must : opt).push(cid);
  const pulled = {}, q = [...must];
  while(q.length){
    const cid = q.shift();
    for(const dep of (D.req[cid] || [])){
      if(must.includes(dep) || !byId[dep]) continue;
      must.push(dep); pulled[dep] = cid; q.push(dep);
    }
  }
  const aiSel = must.some(c => byId[c] && !["app","ai.deliver","ai.model","hw"].includes(byId[c].dom));
  if(aiSel && !must.includes("ai.model.gateway") && byId["ai.model.gateway"]){
    must.push("ai.model.gateway"); pulled["ai.model.gateway"] = "AI 域兜底";
  }
  opt = opt.filter(c => !must.includes(c)).sort((x, y) => score[y] - score[x]);

  const core = [], rec = [];
  const giv = new Set(); must.forEach(c => (W[c] || [null, []])[1].forEach(x => giv.add(x)));
  if(giv.has("R") && !must.includes("app.data") && byId["app.data"]) rec.push("app.data");
  if((giv.has("T") || giv.has("R") || giv.has("F")) && !giv.has("X") && !must.includes("app.ui") && byId["app.ui"]) rec.push("app.ui");
  must.forEach(cid => {
    if(!pulled[cid]) return core.push(cid);
    (cid === "ai.model.gateway" || cid.indexOf("hw.") === 0 ? core : rec).push(cid);
  });
  const scene = opt.filter(c => !rec.includes(c)).slice(0, Math.max(0, 14 - core.length - rec.length));
  const uniq = a => [...new Set(a)];
  const gaps = [];
  D.gap.forEach(([words, name, how]) => { if(words.some(w => hit(t, w))) gaps.push({name, how}); });
  return { core: ord(uniq(core)), rec: ord(uniq(rec)), scene: ord(uniq(scene)), scen, score, why, gaps, prefs };
}

/* ────────── 连通检查 ────────── */
function check(picks){
  const given = {};
  picks.forEach(c => (W[c] || [null, []])[1].forEach(x => (given[x] = given[x] || []).push(c)));
  const breaks = [];
  picks.forEach(cid => {
    if(cid === "app.ui") return;
    (W[cid] || [[], []])[0].forEach(grp => {
      const ok = grp.some(x => D.ext.includes(x) || (given[x] || []).some(o => o !== cid));
      if(!ok){
        const fix = [];
        grp.forEach(x => (D.patch[x] || []).forEach(p => { if(!picks.includes(p) && byId[p]) fix.push(byId[p].name); }));
        breaks.push({who: byId[cid].name, cid, need: grp.map(x => TC[x]).join("或"), fix: fix.slice(0, 3)});
      }
    });
  });
  const done = new Set(), order = [], placed = new Set();
  let pool = [...picks];
  while(pool.length){
    let ready = pool.filter(cid => {
      // 手工钉的前后关系：网关接的是主控吐出来的数据
      const af = (D.after || {})[cid];
      if(af && picks.indexOf(af) >= 0 && !placed.has(af)) return false;
      return cid === "app.ui" || (W[cid] || [[], []])[0].every(grp => grp.some(x => D.ext.includes(x) || done.has(x)));
    });
    if(!ready.length){ order.push(...pool); break; }
    const used = cid => {
      const outs = (W[cid] || [null, []])[1].filter(x => !["T","S","E"].includes(x));
      return picks.filter(o => o !== cid && (W[o] || [[], []])[0].some(g => g.some(x => outs.includes(x)))).length;
    };
    ready.sort((x, y) => {
      const hx = x.indexOf("hw.") === 0 ? 0 : 1, hy = y.indexOf("hw.") === 0 ? 0 : 1;
      if (hx !== hy) return hx - hy;
      const a = (W[x] || [[], []])[0].length ? 1 : 0, b = (W[y] || [[], []])[0].length ? 1 : 0;
      if(a !== b) return a - b;
      const d = used(y) - used(x); if(d) return d;
      return D.domOrder.indexOf(byId[x].dom) - D.domOrder.indexOf(byId[y].dom);
    });
    order.push(...ready);
    ready.forEach(c => placed.add(c));
    ready.forEach(c => (W[c] || [null, []])[1].forEach(x => done.add(x)));
    pool = pool.filter(c => !ready.includes(c));
  }
  const dead = [];
  picks.forEach(cid => {
    if(cid.startsWith("ai.deliver") || cid === "app.ui") return;
    (W[cid] || [null, []])[1].forEach(x => {
      if(["X","Q","E","S"].includes(x)) return;
      if(!picks.some(o => o !== cid && (W[o] || [[], []])[0].some(g => g.includes(x)))) dead.push({who: byId[cid].name, type: TC[x]});
    });
  });
  const lines = Object.values(given).reduce((n, v) => n + v.length, 0);
  return {breaks, order, lines, dead};
}

    return `<div class="s ${cls}"><em>${i < steps ? "✓" : i + 1}</em>${n}</div>` + (i < 3 ? `<div class="bar"></div>` : "");
  }).join("") + `</div>`);
  /* 只要有活儿在手，每页顶栏都带一个「存草稿」——草稿不是某个页面专属功能 */
  const canDraft = CUR !== "home" && CUR !== "lib" && !!(S.need || (S.hub && S.hub.mods.length));
  const dft = canDraft ? `<button class="btn sm ghost" id="bDraft" title="把当前进度存成草稿，回头接着做">存草稿</button>` : "";
  $("#top").innerHTML = `<div class="crumb">${crumb}</div>${st}<div class="right">${dft}${right || ""}</div>`;
  const bd = $("#bDraft");
  if(bd) bd.onclick = () => draftBox(bd);
}

/* ────────── 草稿：把当前进度存下来，回头接着做 ────────── */
const ROUTE_NM = {"hub-style":"风格","hub-mods":"模块","hub-plans":"方案", confirm:"确认",
                  build:"组装", done:"交付", trial:"交付", pack:"交付", new:"需求", plan:"选型", home:"工作台"};
function ago(ts){
  const d = Date.now() - ts;
  if(d < 0 || d < 60000) return "刚刚";
  if(d < 3600000) return Math.floor(d / 60000) + " 分钟前";
  if(d < 86400000) return Math.floor(d / 3600000) + " 小时前";
  if(d < 86400000 * 30) return Math.floor(d / 86400000) + " 天前";
  return new Date(ts).toLocaleDateString("zh-CN", {month:"2-digit", day:"2-digit"});
}
function draftLabel(d){
  const n = (d.hub && d.hub.mods && d.hub.mods.length) || 0;
  return n ? `中台 · ${n} 模块 · ${d.picks ? d.picks.length : 0} 格` : `一句话需求 · ${(d.picks || []).length} 格`;
}
function draftDefName(){
  if(S.hub && S.hub.mods.length) return `个人中台 · ${hubStyleName()} · ${S.hub.mods.length} 模块`;
  return (S.need || "未命名装配").slice(0, 22);
}
function draftBox(btn){
  const isHub = !!(S.hub && S.hub.mods.length);
  const step = ROUTE_NM[CUR] || "—";
  const def = draftDefName();
  modal(`<div class="mh"><b>存草稿</b><button class="x" data-x="1">✕</button></div>
    <div class="mb">
      <div class="kv"><b>内容</b><span>${isHub
        ? `个人中台 · ${esc(hubStyleName())} · ${S.hub.mods.length} 个模块 · ${S.picks.length} 格`
        : esc((S.need || "").slice(0, 40) || "空")}</span></div>
      <div class="kv"><b>进度</b><span>停在「${step}」，恢复后从这里接着做</span></div>
      <div style="margin-top:14px">
        <div style="font-size:12px;color:var(--dim);margin-bottom:6px">给这份草稿起个名字</div>
        <input class="inp" id="dName" value="${esc(def)}" maxlength="40" placeholder="例如：我的工作台中台">
      </div>
      <p style="color:var(--faint);font-size:11.5px;line-height:1.7;margin-top:10px">
        草稿存在这台电脑的浏览器里，换设备、清缓存会丢。同名再存会覆盖旧的。</p>
    </div>`,
    `<button class="btn" data-x="1">取消</button><button class="btn primary" id="dSave">保存草稿</button>`);
  $("#modal").querySelectorAll("[data-x]").forEach(x => x.onclick = closeModal);
  const inp = $("#dName");
  inp.focus(); inp.select();
  inp.addEventListener("keydown", e => { if(e.key === "Enter") $("#dSave").click(); });
  $("#dSave").onclick = () => {
    const nm = (inp.value || "").trim() || def;
    const hit = draftSave(nm);
    closeModal();
    toast(hit ? "已更新草稿「" + nm + "」" : "已存草稿「" + nm + "」");
    if(btn){ btn.textContent = "已存 ✓"; setTimeout(() => { btn.textContent = "存草稿"; }, 1600); }
  };
}
function draftSave(nm){
  const snap = {
    id: "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
    nm,
    kind: (S.hub && S.hub.mods.length) ? "hub" : "need",
    at: Date.now(),
    route: "#/" + CUR,
    need: S.need,
    picks: [...S.picks],
    sels: JSON.parse(JSON.stringify(S.sels || {})),
    hub: S.hub ? JSON.parse(JSON.stringify(S.hub)) : null
  };
  const i = S.drafts.findIndex(d => d.nm === nm);
  if(i >= 0){ snap.id = S.drafts[i].id; S.drafts[i] = snap; }
  else S.drafts.unshift(snap);
  S.drafts.sort((a, b) => b.at - a.at);
  save();
  return i >= 0;
}
function draftOpen(id){
  const d = S.drafts.find(x => x.id === id);
  if(!d) return toast("草稿不见了，刷新看看");
  S.build = null;
  S.need = d.need || "";
  S.sels = JSON.parse(JSON.stringify(d.sels || {}));
  S.hub = d.hub ? JSON.parse(JSON.stringify(d.hub)) : null;
  S.picks = [...(d.picks || [])];
  const isHub = !!(S.hub && S.hub.mods.length);
  if(isHub){ S.cov = hubCov(); if(!S.picks.length) S.picks = hubCells(S.hub.mods); }
  else if(S.need){ S.cov = matchNeed(S.need); }
  save();
  /* 组装/交付那两步的状态留在内存里、存不进草稿，所以退回到「确认」重开一次 */
  let to = d.route || (isHub ? "#/hub-mods" : "#/plan");
  if(to === "#/build" || to === "#/done") to = "#/confirm";
  if(to === "#/trial" || to === "#/pack"){ if(!isHub) to = "#/confirm"; }
  toast(`已恢复「${d.nm}」`);
  go(to);
}
function draftDel(id){
  const d = S.drafts.find(x => x.id === id);
  if(!d) return;
  S.drafts = S.drafts.filter(x => x.id !== id);
  save(); route(); toast("已删除草稿");
}
/* 导出一份文件带走：换电脑、清缓存、或者从预览面板里搬出来时用 */
function draftExport(){
  if(!S.drafts.length) return toast("还没有草稿可导出");
  const blob = new Blob([JSON.stringify({v:1, at:Date.now(), drafts:S.drafts}, null, 2)],
                        {type:"application/json;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "墨山草稿.json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1200);
  toast("已导出 " + S.drafts.length + " 份草稿");
}
function draftImport(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if(!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      let o;
      try{ o = JSON.parse(String(fr.result)); }catch(e){ return toast("这个文件读不出 JSON"); }
      const arr = Array.isArray(o) ? o : (o && o.drafts);
      if(!Array.isArray(arr) || !arr.length) return toast("文件里没有草稿");
      let add = 0, upd = 0;
      arr.forEach(d => {
        if(!d || !d.nm) return;
        const rec = {
          id: d.id || ("d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5)),
          nm: d.nm, kind: d.kind || ((d.hub && d.hub.mods) ? "hub" : "need"),
          at: d.at || Date.now(), route: d.route || "#/plan",
          need: d.need || "", picks: d.picks || [], sels: d.sels || {}, hub: d.hub || null
        };
        const i = S.drafts.findIndex(x => x.nm === rec.nm);
        if(i >= 0){ rec.id = S.drafts[i].id; S.drafts[i] = rec; upd++; }
        else { S.drafts.unshift(rec); add++; }
      });
      S.drafts.sort((a, b) => b.at - a.at);
      save(); route();
      toast("导入 " + add + " 份" + (upd ? "，覆盖 " + upd + " 份同名" : ""));
    };
    fr.readAsText(f);
  };
  inp.click();
}

  return `<div class="hubstep" style="margin-left:14px">` + names.map((x, i) => {

           (i < names.length - 1 ? `<div class="b"></div>` : "");
  }).join("") + `</div>`;
}
function hubCov(){
  const pick = t => hubCells(S.hub.mods.filter(id => (hubMod(id) || {}).tier === t));
  return {core: pick("must"), rec: pick("rec"), scene: pick("opt"), gaps: [], hits: {}};
}
function hubStyleName(){ const s = STYLES.find(x => x.id === (S.hub || {}).sty); return s ? s.nm : "自定义"; }

    `<button class="btn sm ghost" id="bHome">返回工作台</button>`);
  const cur = S.hub ? S.hub.sty : null;
  $("#view").innerHTML = `<div class="page">
    <div class="pagehd"><div><h1>先定一个风格</h1>
      <p>三种都能继续加模块，区别只是第一版装多满。选完可以换，加模块不用重做布局。</p></div></div>
    <div class="styles">${STYLES.map(s => `
      <div class="sty ${cur === s.id ? "on" : ""}" data-sty="${s.id}">
        ${styleArt(s.id)}
        <div class="nm">${s.nm}<span class="n">${s.n}</span></div>
        <div class="d">${s.d}</div>
        <div class="keep">${s.keep}</div>
      </div>`).join("")}</div>
    <div class="card box" style="margin-top:14px;font-size:12.5px;color:var(--dim);line-height:1.9">
      <b style="color:var(--ink)">三种风格不是三套代码。</b>
      外壳、数据仓、界面这套地基完全相同，差别只在默认勾了哪几个模块——
      所以「先做极简、以后再补」不会返工，补模块就是多一个入口和一张卡。
    </div>
  </div>`;
  $("#bHome").onclick = () => go("#/home");
  document.querySelectorAll("[data-sty]").forEach(c => c.onclick = () => {
    const s = STYLES.find(x => x.id === c.dataset.sty);
    S.hub = {sty: s.id, mods: s.mods.slice(), plans: (S.hub && S.hub.plans) || {}};
    S.need = "个人中台 · " + s.nm;
    save(); go("#/hub-mods");
  });
}

/* 模块：必装 / 推荐 / 可选，前两类默认勾上，都能叉掉 */
function viewHubMods(){
  /* 中台的能力格永远由模块摊开决定：进这一页就重算，免得把上一次「一句话需求」的格串进来 */
  S.picks = hubCells(S.hub.mods); S.cov = null;
  /* 新勾上的模块先把推荐方案填回去，方案页/草稿/打包读到的都是同一份确定值 */
  S.hub.plans = S.hub.plans || {};
  S.hub.mods.forEach(id => {
    const m = hubMod(id);
    if(m && !S.hub.plans[id]) S.hub.plans[id] = (m.provs.find(p => p.lv === "rec") || m.provs[0]).id;
  });
  const mods = S.hub.mods;
  topbar(`工作台 <span>/</span> <b>个人中台</b>`, hubSteps(1),
    `<button class="btn sm ghost" id="bSty">换风格</button>
     <button class="btn sm ghost" id="bHome2">返回工作台</button>`);
  const cells = hubCells(mods);
  const warn = () => {
    const lost = HUB.filter(m => m.tier === "must" && !S.hub.mods.includes(m.id));
    return lost.length ? `<div class="warnbox">⚠ 你叉掉了必装：<b>${lost.map(m => esc(m.nm)).join("、")}</b>。
      界面或数据会缺一块——不会报错，但装出来是半成品。</div>` : "";
  };
  const body = ["must", "rec", "opt"].map(t => {
    const [tn, thint, color] = TIER[t];
    const list = HUB.filter(m => m.tier === t);
    return `<div class="group"><div class="gt"><span class="dot" style="background:${color}"></span>${tn}
      <i>${list.length} 个 · ${thint}</i></div>
      ${list.map(m => {
        const on = mods.includes(m.id);
        return `<div class="hm ${on ? "" : "off"}" data-mid="${m.id}">
          <div class="ico">${art(m.art, 26)}</div>
          <div>
            <div class="nm">${esc(m.nm)}<span class="tk">${tn}</span></div>
            <div class="sb">${esc(m.sub)}</div>
            <div class="cells">${m.cells.map(c => `<span>${c}</span>`).join("")}</div>
          </div>
          <div class="act">
            ${on ? `<button class="x" data-x="${m.id}" title="不要这个">✕</button>` : ""}
            <div class="tick">✓</div>
          </div>
        </div>`;
      }).join("")}</div>`;
  }).join("");

  $("#view").innerHTML = `<div class="page">
    <div class="pagehd"><div><h1>要哪几块？</h1>
      <p>当前风格：<b>${esc(hubStyleName())}</b>。必装是地基，推荐是日常用得上的，可选看你要不要。
      勾错的随时叉掉，下面会实时算出要装多少格。</p></div>
      <div class="right"><span class="badge mute" id="modCnt">已选 ${mods.length} 个模块</span></div></div>
    <div id="warnHost">${warn()}</div>
    <div class="hubmods">${body}</div>
    <div class="mobar">
      <span class="badge ${cells.length ? "ok" : "bad"}" id="mobCnt">${mods.length} 个模块 · ${cells.length} 格</span>
      <span class="faint" style="font-size:11.5px">下一步给每块挑实现方案</span>
      <button class="btn primary" id="bNextM" ${mods.length ? "" : "disabled"} style="margin-left:auto">下一步：选方案</button>
    </div>
    <div style="display:flex;gap:9px;justify-content:flex-end;margin-top:18px">
      <button class="btn" id="bBack">上一步：换风格</button>
      <button class="btn primary" id="bNext2" ${mods.length ? "" : "disabled"}>下一步：选方案</button>
    </div>
  </div>`;

  // 勾选只改这一张卡 + 几个计数，不整页重绘。重绘会把 #main 的滚动位置弹回顶部，看着就像刷新了一次
  const mkX = id => {
    const b = document.createElement("button");
    b.className = "x"; b.dataset.x = id; b.title = "不要这个"; b.textContent = "✕";
    b.onclick = e => { e.stopPropagation(); toggle(id); };
    return b;
  };
  const repaint = id => {
    const ms = S.hub.mods, cs = hubCells(ms);
    const card = document.querySelector(`#view [data-mid="${id}"]`);
    if(card){
      const on = ms.includes(id);
      card.classList.toggle("off", !on);
      const act = card.querySelector(".act");
      if(act){
        const x = act.querySelector(".x");
        if(on && !x) act.insertBefore(mkX(id), act.firstChild);
        if(!on && x) x.remove();
      }
      card.classList.remove("just"); void card.offsetWidth; card.classList.add("just");
      setTimeout(() => card.classList.remove("just"), 320);
    }
    const c1 = $("#modCnt"), c2 = $("#mobCnt"), wh = $("#warnHost");
    if(c1) c1.textContent = "已选 " + ms.length + " 个模块";
    if(c2){
      c2.className = "badge " + (cs.length ? "ok" : "bad");
      c2.textContent = ms.length + " 个模块 · " + cs.length + " 格";
    }
    if(wh) wh.innerHTML = warn();
    const n1 = $("#bNextM"), n2 = $("#bNext2");
    if(n1) n1.disabled = !ms.length;
    if(n2) n2.disabled = !ms.length;
  };
  const toggle = id => {
    const has = S.hub.mods.includes(id);
    S.hub.mods = has ? S.hub.mods.filter(x => x !== id) : [...S.hub.mods, id];
    // 勾回来时补上默认推荐方案，避免方案空着
    if(!has){ const m = hubMod(id); if(m && !S.hub.plans[id]) S.hub.plans[id] = (m.provs.find(p => p.lv === "rec") || m.provs[0]).id; }
    // 模块变了就整体重算格，别留着上一次取消勾选的残留
    S.picks = hubCells(S.hub.mods);
    S.cov = null;
    saveLater(); repaint(id);
  };
  document.querySelectorAll("#view [data-mid]").forEach(c => c.onclick = e => {
    if(e.target.closest("[data-x]")) return;
    toggle(c.dataset.mid);
  });
  document.querySelectorAll("#view [data-x]").forEach(b => b.onclick = e => { e.stopPropagation(); toggle(b.dataset.x); });
  $("#bSty").onclick = $("#bBack").onclick = () => go("#/hub-style");
  $("#bHome2").onclick = () => go("#/home");
  $("#bNextM").onclick = $("#bNext2").onclick = () => go("#/hub-plans");
}

/* 方案：每个模块 2–4 个实现，带推荐等级，默认选推荐 */
const LVTXT = {rec:"推荐", ok:"能用", warn:"慎选", build:"自研"};
const lvCls = lv => (lv === "rec" ? "ok" : (lv === "warn" ? "warn" : "mute"));

function viewHubPlans(){
  S.picks = hubCells(S.hub.mods); S.cov = null;
  const mods = S.hub.mods.map(hubMod).filter(Boolean);
  const cells = hubCells(S.hub.mods);
  topbar(`工作台 <span>/</span> <b>个人中台</b>`, hubSteps(2),
    `<button class="btn sm ghost" id="bMods">改模块</button>
     <button class="btn sm" id="bRec">全用推荐</button>`);
  const LV = LVTXT;
  const rows = mods.map(m => {
    const sel = hubPlan(m.id);
    return `<div class="pm">
      <div class="h">${art(m.art, 20)}<b>${esc(m.nm)}</b>
        <span class="cells">${m.cells.map(c => `<span>${c}</span>`).join(" ")}</span>
        <span class="badge ${sel.lv === "rec" ? "ok" : (sel.lv === "warn" ? "warn" : "mute")}" data-lv="${m.id}" style="margin-left:auto">${LV[sel.lv] || ""}</span>
      </div>
      <div class="body">${m.provs.map(p => `
        <div class="pv ${sel.id === p.id ? "on" : ""}" data-mid="${m.id}" data-pid="${p.id}">
          <div>
            <div class="n">${esc(p.n)}
              <span class="lv ${p.lv}">${LV[p.lv] || ""}</span>
              <span class="faint" style="font-size:11px;font-weight:400">${esc(p.k)}</span></div>
            <div class="nt">${esc(p.note)}</div>
          </div>
          <div class="rd"></div>
        </div>`).join("")}</div>
    </div>`;
  }).join("");

  $("#view").innerHTML = `<div class="page">
    <div class="pagehd"><div><h1>每块用什么做？</h1>
      <p>同一块功能有两三种做法，差别在包体、运维、数据在不在你手里。
      默认已经选了「推荐」，不想逐个看就点右上角「全用推荐」。</p></div>
      <div class="right"><span class="badge mute">${mods.length} 个模块 · ${cells.length} 格</span></div></div>
    <div class="plans">${rows}</div>
    <div class="mobar">
      <span class="badge ok">${mods.length} 模块 · ${cells.length} 格</span>
      <button class="btn primary" id="bNext3" style="margin-left:auto">下一步：连通检查</button>
    </div>
    <div style="display:flex;gap:9px;justify-content:flex-end;margin-top:18px">
      <button class="btn" id="bBack2">上一步：改模块</button>
      <button class="btn primary lg" id="bNext4">下一步：连通检查</button>
    </div>
  </div>`;

  // 选方案同样只动这一组：切换 .on 与右上角等级，不重绘（否则滚动位置也没了）
  const repaintPlan = mid => {
    const m = hubMod(mid); if(!m) return;
    const sel = hubPlan(mid);
    document.querySelectorAll(`#view .pv[data-mid="${mid}"]`).forEach(n =>
      n.classList.toggle("on", n.dataset.pid === sel.id));
    const b = document.querySelector(`#view [data-lv="${mid}"]`);
    if(b){ b.textContent = LVTXT[sel.lv] || ""; b.className = "badge " + lvCls(sel.lv); }
  };
  document.querySelectorAll("#view [data-pid]").forEach(n => n.onclick = () => {
    if(S.hub.plans[n.dataset.mid] === n.dataset.pid) return;
    S.hub.plans[n.dataset.mid] = n.dataset.pid;
    saveLater(); repaintPlan(n.dataset.mid);
  });
  const next = () => {
    // 进原有的连通检查：把模块摊成格，让基板去判能不能接上
    S.cov = hubCov();
    S.picks = hubCells(S.hub.mods);
    S.need = "个人中台 · " + hubStyleName() + " · " + S.hub.mods.length + " 个模块";
    save(); go("#/plan");
  };
  $("#bNext3").onclick = $("#bNext4").onclick = next;
  $("#bRec").onclick = () => {
    S.hub.plans = {};
    mods.forEach(m => { S.hub.plans[m.id] = (m.provs.find(p => p.lv === "rec") || m.provs[0]).id; });
    mods.forEach(m => repaintPlan(m.id));
    saveLater(); toast("已全部用推荐方案");
  };
  $("#bMods").onclick = $("#bBack2").onclick = () => go("#/hub-mods");
}

/* ────────── 视图：选型 ────────── */
function modHTML(cid, checked, tier, plain){
  const c = byId[cid];
  const on = checked;
  const sel = prov(cid);
  const pills = plain ? "" : (c.pv || []).slice(0, 3).map(p =>
    `<span class="pill ${sel && sel.id === p.id ? "on" : ""}" data-pv="${cid}|${esc(p.id)}">${esc(p.n)}<i>${esc(p.k)}</i></span>`).join("");
  const more = (!plain && (c.pv || []).length > 3) ? `<span class="pill more">+${c.pv.length - 3}</span>` : "";
  return `<div class="mod ${on ? "" : "off"}" data-cid="${cid}">
    <input type="checkbox" ${on ? "checked" : ""} data-chk="${cid}">
    <div>
      <div class="h"><span class="nm">${esc(c.name)}</span><span class="cid">${cid}</span>
        <span class="lk" data-detail="${cid}">详情</span></div>
      <div class="ab">${esc(c.abstract)}</div>
      <div class="io"><b>进</b> ${esc(c.ins)} &nbsp;→&nbsp; <b>出</b> ${esc(c.outs)}</div>
      <div class="pills">${pills}${more}</div>
    </div>
  </div>`;
}

function viewPlan(){
  const isHub = !!(S.hub && S.hub.mods.length);
  if(isHub){
    S.cov = hubCov();
    if(!S.picks.length) S.picks = hubCells(S.hub.mods);
  }else if(!S.cov){ S.cov = matchNeed(S.need); S.picks = [...S.cov.core, ...S.cov.rec]; }
  const cov = S.cov;
  const head = isHub ? `个人中台 · ${esc(hubStyleName())}` : esc(S.need.slice(0, 18)) + (S.need.length > 18 ? "…" : "");
  topbar(`工作台 <span>/</span> <b>${isHub ? "个人中台 · " + esc(hubStyleName()) : head}</b>`, isHub ? hubSteps(3) : 1,
    isHub
      ? `<button class="btn sm ghost" id="bEdit">改模块</button><button class="btn sm" id="bRe">换方案</button>`
      : `<button class="btn sm ghost" id="bEdit">改需求</button>
         <button class="btn sm" id="bRe">重新解析</button>`);
  const r = check(S.picks);
  const groups = isHub ? [
    ["必装模块的格", "来自必装模块，勾掉等于关掉那块功能", cov.core, "var(--green)"],
    ["推荐模块的格", "来自推荐模块，日常用得上的那几块", cov.rec, "var(--amber)"],
    ["可选模块的格", "来自可选模块", cov.scene, "var(--faint)"]
  ] : [
    ["必选", "去掉就做不成", cov.core, "var(--green)"],
    ["建议", "为了让线通自动带上的，不勾这条线会断", cov.rec, "var(--amber)"],
    ["看情况", "沾边，你要不要？默认不勾", cov.scene, "var(--faint)"]
  ];
  const body = groups.map(([t, hint, ids, color]) => {
    if(!ids.length) return "";
    return `<div class="group"><div class="gt"><span class="dot" style="background:${color}"></span>${t}
      <i>${ids.length} 格 · ${hint}</i></div>
      ${ids.map(cid => modHTML(cid, S.picks.includes(cid), t, isHub)).join("")}</div>`;
  }).join("");

  const empty = !cov.core.length && !cov.rec.length && !cov.scene.length;

  const kHTML = () => `<span><b>${cov.core.length}</b> 必选</span><span><b>${cov.rec.length}</b> 建议</span>
            <span><b>${cov.scene.length}</b> 看情况</span><span>已勾 <b>${S.picks.length}</b> 格</span>`;

  const asideHTML = r => {
    const offMust = cov.core.filter(c => !S.picks.includes(c));
    const breaksHTML = r.breaks.length
      ? r.breaks.map(b => `<div class="brk"><b>${esc(b.who)}</b> 需要「${esc(b.need)}」，没人产出
          ${b.fix.length ? `<div class="fix">补：<em>${b.fix.map(esc).join(" / ")}</em></div>` : ""}</div>`).join("")
      : `<div class="empty" style="color:var(--green)">✓ ${S.picks.length} 格、${r.lines} 条线都能接上</div>`;
    return `<div class="card box">
        <div class="bh">连通检查 <span class="badge ${r.breaks.length ? "bad" : "ok"}">${r.breaks.length ? r.breaks.length + " 处断点" : "全通"}</span></div>
        ${offMust.length ? `<div class="warnbox">⚠ 你取消了必选格：<b>${offMust.map(c => esc(byId[c].name)).join("、")}</b>，功能会缺一块，但不一定报错。</div>` : ""}
        ${breaksHTML}
        ${r.dead.length ? `<div class="warnbox">⚠ 有 ${[...new Set(r.dead.map(d => d.who))].length} 格做出来没去处（${esc(r.dead[0].who)} → ${esc(r.dead[0].type)}…），加一格界面或发布。</div>` : ""}
        <div class="cta" style="margin-top:12px">
          <button class="btn primary" id="bNext" ${(!S.picks.length || r.breaks.length) ? "disabled" : ""}>
            ${r.breaks.length ? "先修 " + r.breaks.length + " 处断点" : "下一步：确认清单"}</button>
          <div class="hint">${S.picks.length ? S.picks.length + " 格 · " + r.lines + " 条连线" : "还没有勾任何格"}</div>
        </div>
      </div>

      <div class="card box">
        <div class="bh">施工顺序 <span class="sp">按数据流</span></div>
        ${r.order.length ? `<ol class="seq">${r.order.map(c => `<li>${esc(byId[c].name)}<small>${c}</small></li>`).join("")}</ol>` : `<div class="empty">—</div>`}
      </div>

      ${cov.gaps.length ? `<div class="card box">
        <div class="bh">库外 <span class="sp">要自己找方案</span></div>
        ${cov.gaps.map(g => `<div class="gapbox"><b>${esc(g.name)}</b><br>${esc(g.how)}</div>`).join("")}
      </div>` : ""}`;
  };

  const mobHTML = r => `<span class="badge ${r.breaks.length ? "bad" : "ok"}">${r.breaks.length ? r.breaks.length + " 处断点" : "全通"}</span>
      <span class="faint" style="font-size:11.5px">${S.picks.length} 格 · ${r.lines} 条线</span>
      <button class="btn primary" id="bNext2" ${(!S.picks.length || r.breaks.length) ? "disabled" : ""}
        style="margin-left:auto">${r.breaks.length ? "先修断点" : "下一步"}</button>`;

  const bindNext = () => {
    const nx = $("#bNext"); if(nx) nx.onclick = () => go("#/confirm");
    const nx2 = $("#bNext2"); if(nx2) nx2.onclick = () => go("#/confirm");
  };

  $("#view").innerHTML = `<div class="page">
    <div class="needbar card">
      <div class="q"><em>需求</em>${isHub
        ? `<b>个人中台</b> · ${esc(hubStyleName())} · ${S.hub.mods.length} 个模块
           <span class="faint" style="font-size:11.5px">（已摊成 ${S.picks.length} 格，勾掉格子＝关掉对应功能）</span>`
        : esc(S.need)}</div>
      <button class="btn sm ghost" id="bEdit2">${isHub ? "改模块" : "编辑"}</button>
    </div>
    <div class="planwrap">
      <div>
        <div class="toolbar">
          <div class="k" id="planK">${kHTML()}</div>
          <button class="btn sm" id="bMin">只留必选</button>
          <button class="btn sm" id="bAll">全开</button>
        </div>
        ${empty ? `<div class="card box"><div class="bh">没有对应的能力格</div>
          <div class="empty">这句需求落在库的能力范围外。看右边「库外」，那里写了这类事通常怎么做；
          也可能是说法没被认出来，换个说法重试。</div></div>` : body}
      </div>

      <aside class="right" id="planAside">${asideHTML(r)}</aside>
    </div>
    <div class="mobar" id="planMob">${mobHTML(r)}</div>
  </div>`;

  // 勾一格只重画受影响的部分：左边卡片的勾选态、计数、右栏（断点/施工程序）、底栏。
  // 整页重绘会把 #main 的滚动位置弹回顶部，看着就像刷新了一次
  const redraw = () => {
    const r2 = check(S.picks);
    document.querySelectorAll("#view [data-cid]").forEach(n => {
      const on = S.picks.includes(n.dataset.cid);
      n.classList.toggle("off", !on);
      const cb = n.querySelector("[data-chk]");
      if(cb && cb.checked !== on) cb.checked = on;
    });
    document.querySelectorAll("#view [data-pv]").forEach(p => {
      const [cid, pid] = p.dataset.pv.split("|");
      const cur = prov(cid);
      p.classList.toggle("on", !!(cur && cur.id === pid));
    });
    const k = $("#planK"); if(k) k.innerHTML = kHTML();
    const as = $("#planAside"); if(as) as.innerHTML = asideHTML(r2);
    const mb = $("#planMob"); if(mb) mb.innerHTML = mobHTML(r2);
    bindNext();
    saveLater();
  };
  document.querySelectorAll("[data-chk]").forEach(cb => cb.onchange = () => {
    const cid = cb.dataset.chk;
    if(cb.checked){ if(!S.picks.includes(cid)) S.picks.push(cid); }
    else S.picks = S.picks.filter(x => x !== cid);
    redraw();
  });
  document.querySelectorAll("[data-pv]").forEach(p => p.onclick = () => {
    const [cid, pid] = p.dataset.pv.split("|");
    S.sels[cid] = pid; redraw();
  });
  document.querySelectorAll("[data-detail]").forEach(a => a.onclick = () => detail(a.dataset.detail));
  $("#bMin").onclick = () => { S.picks = [...cov.core]; redraw(); toast("只留必选：" + S.picks.length + " 格"); };
  $("#bAll").onclick = () => { S.picks = [...cov.core, ...cov.rec, ...cov.scene]; redraw(); toast("全开：" + S.picks.length + " 格"); };
  $("#bEdit").onclick = $("#bEdit2").onclick = () => go(isHub ? "#/hub-mods" : "#/new");

    S.cov = matchNeed(S.need); S.picks = [...S.cov.core, ...S.cov.rec]; redraw(); toast("已重新解析");
  };
  bindNext();
}

function mdText(){
  const r = check(S.picks);
  const isHub = !!(S.hub && S.hub.mods.length);
  const L = isHub ? ["# 个人中台 · " + hubStyleName(), "", "共 " + S.hub.mods.length + " 个模块 · " +
                    S.picks.length + " 格 · " + r.lines + " 条连线", "",
                    "| 模块 | 实现方案 | 等级 | 说明 |", "|---|---|---|---|"] : [];
  if(isHub){
    const LV = {rec:"推荐", ok:"能用", warn:"慎选", build:"自研"};
    S.hub.mods.forEach(id => {
      const m = hubMod(id), p = hubPlan(id);
      if(m && p) L.push(`| ${m.nm} | ${p.n} | ${LV[p.lv] || ""} | ${p.note} |`);
    });
    L.push("", "## 底层能力格", "");
  }else{
    L.push("# " + S.need, "", "共 " + S.picks.length + " 格 · " + r.lines + " 条连线", "");
  }
  L.push("| 施工序 | 模块 | 方案 | 类型 |", "|---|---|---|---|");
  r.order.filter(c => S.picks.includes(c)).forEach((cid, i) => {
    const c = byId[cid], p = prov(cid);
    L.push(`| ${i + 1} | ${c.name} | ${p ? p.n : "—"} | ${p ? (KIND[p.k] || p.k) : "—"} |`);
  });
  if(S.cov && S.cov.gaps && S.cov.gaps.length){ L.push("", "## 库外", ""); S.cov.gaps.forEach(g => L.push(`- **${g.name}**：${g.how}`)); }
  return L.join("\n");
}

function exportMd(){
  const isHub = !!(S.hub && S.hub.mods.length);
  const blob = new Blob([mdText()], {type: "text/markdown;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = isHub ? "个人中台清单.md" : "装配清单.md"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("已导出 " + a.download);
}

/* ────────── 视图：组装 ────────── */
function startBuild(){
  const r = check(S.picks);
  const isHub = !!(S.hub && S.hub.mods.length);
  S.build = {order: isHub ? S.hub.mods.slice() : r.order.filter(c => S.picks.includes(c)),
             hub: isHub, i: 0, pct: 4, paused: false,
             busy: false, logs: [], t0: Date.now(), done: false};
  const isHw = !isHub && S.picks.some(c => c.indexOf("hw.") === 0);
  S.build.isHw = isHw;
  S.build.logs.push({t: "0.0s", c: "dim",
    s: isHub ? "→ 开板：先立外壳与数据仓，空槽留给还没插的模块"
            : (isHw ? "→ 建工程目录：原理图 / 结构 / 固件 / BOM 四套文件"
                    : "→ 初始化工程骨架（package.json / src / .env.example）")});
  renderBuild();
  setTimeout(tick, 500);
  save();
}

/* 一次只推进一步；离开页面就停下（回来时由 viewBuild 重新点火） */
function tick(){
  const b = S.build;
  if(!b || b.done || b.paused || b.busy) return;
  if((location.hash || "").indexOf("#/build") !== 0) return;
  b.busy = true;

  if(b.i < b.order.length){
    // 中台这套：一步 = 往板子上插一块模块；其余走原来的逐格安装
    if(b.hub){
      const mid = b.order[b.i], m = hubMod(mid), pl = hubPlan(mid);
      const what = "插上 " + (m ? m.nm : mid) + (pl ? " · " + pl.n : "");
      b.logs.push({t: el(b.t0), s: "→ " + what, c: "now"});
      b.pct = Math.round(8 + (b.i / Math.max(1, b.order.length)) * 82);
      renderBuild();
      setTimeout(() => {
        b.logs[b.logs.length - 1] = {t: el(b.t0), c: "ok", s: "✓ " + what};
        b.i++;
        b.pct = Math.round(8 + (b.i / Math.max(1, b.order.length)) * 82);
        b.busy = false; renderBuild();
        setTimeout(tick, 200);
      }, 620);
      return;
    }
    const cid = b.order[b.i], c = byId[cid], p = prov(cid);
    const label = c.name + " · " + (p ? p.n : "默认方案");
    // 硬件的「一步」不是装依赖：是打样、焊接、烧录、联调。同一套推进逻辑换个动词。
    const HW_STEP = {
      "hw.pcb": "出 Gerber，发去打样", "hw.enclosure": "出 STL，打首件",
      "hw.power": "上电测电流", "hw.sense": "焊接传感器并标定",
      "hw.mcu": "烧最小系统，自检", "hw.firmware": "编译固件并烧录",
      "hw.display": "点亮屏，刷第一帧", "hw.wireless": "配网联调",
      "hw.gateway": "打通一条数据到服务端", "hw.cert": "整理认证资料与送检样机"
    };
    const what = HW_STEP[cid] || ("安装 " + c.name);
    b.logs.push({t: el(b.t0), s: "→ " + what, c: "now"});
    b.pct = Math.round(8 + (b.i / Math.max(1, b.order.length)) * 82);
    renderBuild();
    setTimeout(() => {
      b.logs[b.logs.length - 1] = {t: el(b.t0), c: "ok",
        s: "✓ " + what + (p ? "（" + p.n + "）" : "")};
      b.i++;
      b.pct = Math.round(8 + (b.i / Math.max(1, b.order.length)) * 82);
      b.busy = false; renderBuild();
      setTimeout(tick, 200);
    }, 560);
    return;
  }
  if(b.pct < 92){
    b.logs.push({t: el(b.t0), c: "dim",
      s: b.isHw ? "→ 接线上电：每块板逐一通电，核对每格进出" : "→ 接线检查：按基板核对每格的进出"});
    b.pct = 94; b.busy = false; renderBuild();
    setTimeout(tick, 620); return;
  }
  if(b.pct < 99){
    b.logs.push({t: el(b.t0), c: "dim",
      s: b.isHw ? "→ 整机自检：连续跑 24 小时，看读数漂移与掉电" : "→ 自检：类型检查 / 依赖锁版本"});
    b.pct = 99; b.busy = false; renderBuild();
    setTimeout(tick, 620); return;
  }
  b.done = true; b.pct = 100; b.busy = false;
  b.logs.push({t: el(b.t0), s: "✓ 组装完成，用时 " + el(b.t0), c: "ok"});
  renderBuild();
  setTimeout(() => go("#/done"), 900);
}

function el(t0){ return ((Date.now() - t0) / 1000).toFixed(1) + "s"; }

function viewBuild(){
  const b = S.build;
  if(!b){ location.hash = "#/plan"; return; }
  topbar(b.hub ? `工作台 <span>/</span> <b>个人中台</b>` : `工作台 <span>/</span> <b>组装中</b>`,
    b.hub ? hubSteps(4) : 3, `<span class="badge warn">模拟</span>`);
  $("#view").innerHTML = `<div class="buildwrap" id="bw"></div>`;
  renderBuild();
  if(S.build && !S.build.done && !S.build.paused) setTimeout(tick, 300);
}

/* 中台：主板 + 插槽。每插一块，模块从上方落下、卡进槽位、焊点亮一下 */
function pcbHTML(b){
  const chips = b.order.map((id, i) => {
    const m = hubMod(id);
    if(!m) return "";
    if(i < b.i) return `<div class="mchip ${i === b.i - 1 && !b.done ? "just" : ""}"><span class="nm">${esc(m.nm)}</span></div>`;
    return `<div class="slot">${esc(m.nm)}</div>`;
  }).join("");
  const ins = b.i, tot = b.order.length;
  return `<div class="pcb">
    <div class="hd"><i>◼</i> 个人中台 · 主板 <i style="margin-left:auto">${ins}/${tot} 已插上</i></div>
    <div class="grid">${chips}</div>
  </div>`;
}

function renderBuild(){
  const b = S.build; if(!b) return;
  const box = $("#bw"); if(!box) return;
  const stage = b.pct < 10 ? 0 : (b.pct < 92 ? 1 : (b.pct < 98 ? 2 : 3));
  const names = b.hub ? ["开板", "插模块", "通电", "自检"]
              : (b.isHw ? ["建目录", "打样与烧录", "接线上电", "整机自检"]
                        : ["脚手架", "逐格安装", "接线检查", "自检"]);
  const C = 2 * Math.PI * 54;
  box.innerHTML = `
    ${b.hub ? pcbHTML(b) : ""}
    <div class="ring" style="${b.hub ? "margin-top:14px" : ""}">
      <svg width="132" height="132" viewBox="0 0 132 132">
        <circle cx="66" cy="66" r="54" fill="none" stroke="#eeece6" stroke-width="9"/>
        <circle cx="66" cy="66" r="54" fill="none" stroke="#3c3a35" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - b.pct / 100)}" style="transition:stroke-dashoffset .45s"/>
      </svg>
      <div class="c"><b>${b.pct}%</b><span>${b.done ? "完成" : (b.paused ? "已暂停" : (b.hub ? "插模块" : "组装中"))}</span></div>
    </div>
    <div style="text-align:center;font-size:13px;color:var(--dim);margin-bottom:4px">
      ${b.done ? "全部就绪" : (b.paused ? "已暂停，点继续恢复"
        : (b.hub ? "正在插第 " + Math.min(b.i + 1, b.order.length) + " / " + b.order.length + " 个模块"
                 : "正在装第 " + Math.min(b.i + 1, b.order.length) + " / " + b.order.length + " 格"))}
    </div>
    <div class="stage">${names.map((n, i) => `<div class="s ${i === stage ? "on" : (i < stage ? "done" : "")}"><i></i>${n}</div>`).join("")}</div>
    <div class="log" id="log">${b.logs.map(l => `<div class="${l.c}"><span class="t">${l.t}</span>  ${esc(l.s)}</div>`).join("")}</div>
    <div class="buildbar">
      ${b.done
        ? `<button class="btn primary" id="bFin">查看结果</button>`
        : `<button class="btn" id="bPause">${b.paused ? "继续" : "暂停"}</button>
           <button class="btn danger" id="bStop">中止</button>`}
    </div>`;
  const log = $("#log"); if(log) log.scrollTop = log.scrollHeight;
  const pz = $("#bPause");
  if(pz) pz.onclick = () => {
    b.paused = !b.paused;
    if(!b.paused) tick();
    renderBuild();
  };
  const st = $("#bStop");
  if(st) st.onclick = () => {
    modal(`<div class="mh"><b>中止组装？</b><button class="x" data-x="1">✕</button></div>
      <div class="mb"><p style="margin:0">已装好的格会保留，下次可以接着装。这是原型，实际上不会留下任何文件。</p></div>`,
      `<button class="btn" data-x="1">继续装</button><button class="btn danger" id="bYes">确认中止</button>`);
    $("#modal").querySelectorAll("[data-x]").forEach(x => x.onclick = closeModal);
    $("#bYes").onclick = () => { S.build = null; closeModal(); go("#/home"); toast("已中止"); };
  };
  const fin = $("#bFin"); if(fin) fin.onclick = () => go("#/done");
}

function trialData(){
  const isHub = !!(S.hub && S.hub.mods.length);
  const r = check(S.picks);
  const mods = isHub ? S.hub.mods.map(hubMod).filter(Boolean) : [];
  return {
    name: isHub ? "个人中台 · " + hubStyleName() : (S.need || "装配结果"),
    style: isHub ? hubStyleName() : "自定义需求",
    need: S.need || "",
    at: (() => { const d = new Date(); const p = n => (n < 10 ? "0" : "") + n;
                 return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes()); })(),
    mods: mods.map(m => {
      const p = hubPlan(m.id);
      return {id:m.id, nm:m.nm, tier:m.tier, cells:m.cells,
              prov: p ? {n:p.n, k:p.k, lv:p.lv, note:p.note} : null};
    }),
    cells: S.picks.slice(),
    lines: r.lines,
    order: r.order.filter(c => S.picks.includes(c)).map(c => ({id:c, nm:(byId[c] || {}).name || c}))
  };
}

/* 试用页的运行时（toString 后会作为独立脚本写进文档，不能引用本页任何变量） */
function trialRuntime(D){
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const pad = n => (n < 10 ? "0" : "") + n;
  const ts = () => { const d = new Date(); return (d.getMonth()+1) + "-" + d.getDate() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); };
  const K = "moshan.trial.v1";
  const save = () => { try { localStorage.setItem(K, JSON.stringify(ST)); } catch(e){} };

  const seed = () => ({
    todo: [{t:"把这一版翻一遍，看看哪些模块其实用不上", done:false, at:ts()},
           {t:"叉掉不用的，回去重新装一次", done:false, at:ts()}],
    note: [{t:"中台的第一条笔记\n这段话只存在你自己的浏览器里。换台设备看不到——要跨设备，得装「多端同步」。", at:ts()}],
    clip: [{t:"https://news.ycombinator.com/item?id=39210000", k:"链接"},
           {t:'{"model":"gpt-5","tokens":842,"cost":0.0031}', k:"JSON"},
           {t:"/Users/me/Documents/发票 2026-11.pdf", k:"路径"}],
    plug: {pomo:true, git:false},
    syncOn: false, syncAt: "从未同步",
    launch: [{n:"VS Code", c:"#2f6feb"}, {n:"Chrome", c:"#e07b39"}, {n:"终端", c:"#26251f"}, {n:"备忘录", c:"#c9a227"}],
    tab: null
  });
  let ST = null;
  try { ST = JSON.parse(localStorage.getItem(K) || "null"); } catch(e){ ST = null; }
  if(!ST || !Array.isArray(ST.todo)) ST = seed();
  if(!ST.launch) ST.launch = seed().launch;
  if(!ST.plug) ST.plug = seed().plug;

  const NAV = [["todo","待办"],["note","速记"],["search","搜索"],["ai","AI 助手"],["clip","剪贴板"],
               ["launch","启动器"],["plugin","扩展"],["update","更新"],["sync","同步"],["data","数据"]];
  const have = id => D.mods.some(m => m.id === id);
  const tabs = NAV.filter(([id]) => have(id));
  if(!ST.tab || !tabs.some(([id]) => id === ST.tab)) ST.tab = tabs.length ? tabs[0][0] : "data";

  const toast = txt => {
    let t = $("#tip");
    if(!t){ t = document.createElement("div"); t.id = "tip";
      t.style.cssText = "position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:#26251f;color:#fff;" +
        "font-size:12px;padding:7px 14px;border-radius:8px;opacity:0;transition:.18s;pointer-events:none;z-index:9";
      document.body.appendChild(t); }
    t.textContent = txt; t.style.opacity = 1;
    clearTimeout(t._h); t._h = setTimeout(() => { t.style.opacity = 0; }, 1600);
  };

  const P = {};

  P.todo = el => {
    const left = ST.todo.filter(t => !t.done).length;
    el.innerHTML = `<div class="hd">待办<span class="c">${left} 条未完成 · 共 ${ST.todo.length} 条</span></div>
      <div class="card">
        <input class="inp" id="tdIn" placeholder="加一条，回车确认">
        <div id="tdList" style="margin-top:4px">${ST.todo.length ? ST.todo.map((t, i) => `<div class="row ${t.done ? "done" : ""}">
          <div class="ck" data-tg="${i}">${t.done ? "✓" : ""}</div>
          <div class="tx" data-tg="${i}">${esc(t.t)}</div>
          <div class="at">${esc(t.at)}</div>
          <button class="del" data-del="${i}">✕</button></div>`).join("") : `<div class="empty">还没有待办，上面加一条</div>`}</div>
        <div class="hint">模拟版只做勾选与增删。真实版本在这里接「自建表 + 滚动周期规则」——周期任务勾一次自动滚到下一轮，
          不会堆一屏逾期副本，提醒走后台线程。</div>
      </div>`;
    const inp = $("#tdIn");
    inp.onkeydown = e => {
      if(e.key !== "Enter") return;
      const v = inp.value.trim(); if(!v) return;
      ST.todo.unshift({t:v, done:false, at:ts()}); save(); paint();
      const n = $("#tdIn"); if(n) n.focus();
    };
    $$("[data-tg]", el).forEach(n => n.onclick = () => { const i = +n.dataset.tg; ST.todo[i].done = !ST.todo[i].done; save(); paint(); });
    $$("[data-del]", el).forEach(n => n.onclick = () => { ST.todo.splice(+n.dataset.del, 1); save(); paint(); });
  };

  P.note = el => {
    el.innerHTML = `<div class="hd">速记<span class="c">${ST.note.length} 条</span></div>
      <div class="card">
        <textarea class="inp" id="ntIn" placeholder="随手记一条。⌘/Ctrl + Enter 保存，第一行当标题"></textarea>
        <div style="display:flex;align-items:center;gap:10px;margin-top:8px">
          <button class="btn p" id="ntSave">保存</button>
          <span style="font-size:11px;color:#96938a">真实版本存成 Markdown 文件，任何编辑器都能打开</span></div>
      </div>
      <div class="card" style="margin-top:10px">${ST.note.length ? ST.note.map((n, i) => {
        const ls = String(n.t).split("\n");
        const rest = ls.slice(1).join(" ").trim();
        return `<div class="row" style="align-items:flex-start">
          <div class="tx"><b>${esc(ls[0] || "（空）")}</b>
            ${rest ? `<div style="color:#6b6960;font-size:12px;margin-top:2px">${esc(rest.length > 90 ? rest.slice(0, 90) + "…" : rest)}</div>` : ""}
            <div class="at" style="margin-top:3px">${esc(n.at)}</div></div>
          <button class="del" data-ndel="${i}">✕</button></div>`;
      }).join("") : `<div class="empty">还没有笔记</div>`}</div>`;
    const ta = $("#ntIn");
    const put = () => {
      const v = ta.value.trim(); if(!v) { toast("写点什么再存"); return; }
      ST.note.unshift({t:v, at:ts()}); save(); paint(); toast("已存进笔记");
    };
    $("#ntSave").onclick = put;
    ta.onkeydown = e => { if((e.metaKey || e.ctrlKey) && e.key === "Enter") put(); };
    $$("[data-ndel]", el).forEach(n => n.onclick = () => { ST.note.splice(+n.dataset.ndel, 1); save(); paint(); });
  };

  P.search = el => {
    el.innerHTML = `<div class="hd">全局搜索<span class="c">Ctrl + K</span></div>
      <div class="card"><input class="inp" id="sqIn" placeholder="搜待办、速记、剪贴板…">
        <div id="sqList" style="margin-top:6px"></div>
        <div class="hint">模拟版在内存里做包含匹配。真实版本走 <b>SQLite FTS5</b>，中英混排能直接搜，
          增量更新要自己写触发器。</div></div>`;
    const inp = $("#sqIn"), box = $("#sqList");
    const run = () => {
      const q = inp.value.trim().toLowerCase();
      if(!q){ box.innerHTML = `<div class="empty">输入关键词，三个来源一起搜</div>`; return; }
      const hits = [];
      ST.todo.forEach((t, i) => { if(String(t.t).toLowerCase().includes(q)) hits.push(["待办", t.t, "todo"]); });
      ST.note.forEach(n => { if(String(n.t).toLowerCase().includes(q)) hits.push(["速记", String(n.t).split("\n")[0], "note"]); });
      ST.clip.forEach(c => { if(String(c.t).toLowerCase().includes(q)) hits.push(["剪贴板", c.t, "clip"]); });
      box.innerHTML = hits.length ? hits.slice(0, 20).map(([k, t, tab]) => `<div class="row" data-jump="${tab}">
        <span class="badge">${k}</span><div class="tx">${esc(t.slice(0, 110))}</div><span class="at">跳过去 →</span></div>`).join("")
        : `<div class="empty">没搜到「${esc(inp.value)}」</div>`;
      $$("[data-jump]", box).forEach(n => n.onclick = () => { ST.tab = n.dataset.jump; save(); syncNav(); paint(); });
    };
    inp.oninput = run; run(); inp.focus();
  };

  P.ai = el => {
    const mod = D.mods.find(m => m.id === "ai") || {};
    el.innerHTML = `<div class="hd">AI 助手<span class="c">模拟回复 · 这一版没有联网</span></div>
      <div class="card" id="aiBox" style="display:flex;flex-direction:column;gap:8px;min-height:220px">
        <div class="msg bot">（模拟）我读得到这个中台里的数据。试试这几句：<br>
          · 帮我加一条待办：明天交电费<br>· 我现在有几条待办<br>· 总结一下</div>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <input class="inp" id="aiIn" placeholder="说点什么…"><button class="btn p" id="aiGo">发送</button>
      </div>
      <div class="hint">真实版本走 <b>${esc(mod.prov ? mod.prov.n : "自带 Key 直连")}</b>：请求从本机发出，Key 进系统钥匙串。
        你选它的理由是：${esc(mod.prov ? mod.prov.note : "—")}</div>`;
    const box = $("#aiBox"), inp = $("#aiIn");
    const push = (cls, html) => { const d = document.createElement("div"); d.className = "msg " + cls; d.innerHTML = html; box.appendChild(d); box.scrollTop = box.scrollHeight; };
    const reply = q => {
      const s = q.replace(/\s+/g, "");
      if(/待办|提醒|记一下|记个/.test(s)){
        const m = q.match(/[：:]\s*([\s\S]+)$/);
        if(m && m[1].trim()){
          const t = m[1].trim();
          ST.todo.unshift({t, done:false, at:ts()}); save();
          return "已经加进待办了：「" + esc(t) + "」。现在 " + ST.todo.filter(x => !x.done).length + " 条没做完。";
        }
        return "要记什么？照「帮我加一条待办：内容」这么说。";
      }
      if(/几条待办|多少待办|待办.*几/.test(s))
        return "未完成 " + ST.todo.filter(x => !x.done).length + " 条，已完成 " + ST.todo.filter(x => x.done).length + " 条。";
      if(/总结|概括|概览/.test(s)){
        const first = (ST.todo.find(x => !x.done) || {}).t || "（没有未完成的）";
        return "现在有 " + ST.todo.filter(x => !x.done).length + " 条未完成待办、" + ST.note.length +
               " 条速记、" + ST.clip.length + " 条剪贴板记录。最该先动的：「" + esc(first) + "」。";
      }
      return "（模拟回复）这一版没有真模型，我只能做本地那几件事：加待办、数数据、给个概览。";
    };
    const send = () => {
      const q = inp.value.trim(); if(!q) return;
      push("me", esc(q)); inp.value = "";
      setTimeout(() => { push("bot", reply(q)); }, 260);
    };
    $("#aiGo").onclick = send;
    inp.onkeydown = e => { if(e.key === "Enter") send(); };
    inp.focus();
  };

  P.clip = el => {
    el.innerHTML = `<div class="hd">剪贴板<span class="c">${ST.clip.length} 条</span></div>
      <div class="card">${ST.clip.length ? ST.clip.map((c, i) => `<div class="row">
        <span class="badge">${esc(c.k)}</span>
        <div class="tx mono" data-cp="${i}" title="点一下复制">${esc(c.t)}</div>
        <button class="del" data-cdel="${i}">✕</button></div>`).join("") : `<div class="empty">没有记录</div>`}
        <div class="hint">点条目复制。真实版本监听系统剪贴板：按内容哈希去重、图片落盘并生成缩略图，
          而且必须加密码类应用的排除列表。</div></div>`;
    $$("[data-cp]", el).forEach(n => n.onclick = () => {
      const t = ST.clip[+n.dataset.cp].t;
      navigator.clipboard && navigator.clipboard.writeText
        ? navigator.clipboard.writeText(t).then(() => toast("已复制"), () => toast("已复制（模拟）"))
        : toast("已复制（模拟）");
    });
    $$("[data-cdel]", el).forEach(n => n.onclick = () => { ST.clip.splice(+n.dataset.cdel, 1); save(); paint(); });
  };

  P.launch = el => {
    el.innerHTML = `<div class="hd">快捷启动器<span class="c">${ST.launch.length} 个</span></div>
      <div class="card"><div class="grid">${ST.launch.map((a, i) => `<div class="ap" data-ln="${i}">
          <div class="ic" style="background:${esc(a.c)}">${esc(a.n.slice(0, 2))}</div>
          <div class="nm">${esc(a.n)}</div></div>`).join("")}
        <div class="ap" id="lpAdd"><div class="ic" style="background:#efece4;color:#96938a">＋</div><div class="nm">添加</div></div>
      </div>
      <div class="hint">真实版本扫系统菜单批量导入、取原生 256px 图标；已经开着的应用要切到前台，而不是再开一个。</div></div>`;
    $$("[data-ln]", el).forEach(n => n.onclick = () => toast("模拟打开：" + ST.launch[+n.dataset.ln].n));
    $("#lpAdd").onclick = () => {
      const n = (prompt("要加什么？填个名字") || "").trim();
      if(!n) return;
      ST.launch.push({n, c:"#6b6960"}); save(); paint(); toast("已加进启动器");
    };
  };

  P.plugin = el => {
    const rows = [["pomo", "番茄钟", "25 分钟专注 + 5 分钟休息，到点弹系统通知"],
                  ["git", "Git 状态", "在侧栏显示当前仓库分支与改动行数"]];
    el.innerHTML = `<div class="hd">扩展<span class="c">${Object.values(ST.plug).filter(Boolean).length} 个已启用</span></div>
      <div class="card">${rows.map(([id, nm, d]) => `<div class="row">
        <div class="tx" style="cursor:default"><b>${nm}</b><div style="font-size:11.5px;color:#96938a">${d}</div></div>
        <div class="sw ${ST.plug[id] ? "on" : ""}" data-pg="${id}"></div></div>`).join("")}
        <div class="hint">真实版本每个扩展是 <b>manifest + iframe 沙箱</b>：崩了不牵连主程序，权限按 manifest 逐项授权。</div></div>`;
    $$("[data-pg]", el).forEach(n => n.onclick = () => {
      const id = n.dataset.pg; ST.plug[id] = !ST.plug[id]; save();
      n.classList.toggle("on", ST.plug[id]);
      const c = el.querySelector(".hd .c");
      if(c) c.textContent = Object.values(ST.plug).filter(Boolean).length + " 个已启用";
      toast((ST.plug[id] ? "已启用 " : "已停用 ") + (id === "pomo" ? "番茄钟" : "Git 状态"));
    });
  };

  P.update = el => {

/* ────────── 打包：zip（store 模式，不压缩，够用且不引外部库） ────────── */
const CRC_T = (() => {
  const t = new Uint32Array(256);
  for(let i = 0; i < 256; i++){
    let c = i;
    for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for(let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files){
  const enc = new TextEncoder();
  const parts = [], central = [];
  let off = 0;
  const dt = new Date();
  const dtime = ((dt.getHours() << 11) | (dt.getMinutes() << 5) | (dt.getSeconds() >> 1)) & 0xFFFF;
  const ddate = (((dt.getFullYear() - 1980) << 9) | ((dt.getMonth() + 1) << 5) | dt.getDate()) & 0xFFFF;
  files.forEach(f => {
    const name = enc.encode(f.name);
    const data = typeof f.data === "string" ? enc.encode(f.data) : f.data;
    const crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, 0, true); lh.setUint16(10, dtime, true); lh.setUint16(12, ddate, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dtime, true); ch.setUint16(14, ddate, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
    ch.setUint16(28, name.length, true); ch.setUint16(30, 0, true); ch.setUint16(32, 0, true);
    ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true); ch.setUint32(42, off, true);
    central.push(new Uint8Array(ch.buffer), name);
    off += 30 + name.length + data.length;
  });
  const csize = central.reduce((n, u) => n + u.length, 0);
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true);
  eocd.setUint16(8, files.length, true); eocd.setUint16(10, files.length, true);
  eocd.setUint32(12, csize, true); eocd.setUint32(16, off, true); eocd.setUint16(20, 0, true);
  const all = [...parts, ...central, new Uint8Array(eocd.buffer)];
  const total = all.reduce((n, u) => n + u.length, 0);
  const out = new Uint8Array(total);
  let p = 0;
  all.forEach(u => { out.set(u, p); p += u.length; });
  return out;
}

function packFiles(){
  const data = trialData();
  const manifest = {
    生成时间: data.at, 风格: data.style, 需求: data.need,
    模块数: data.mods.length, 能力格数: data.cells.length, 连线数: data.lines,
    模块: data.mods.map(m => ({ 名称: m.nm, 编号: m.id, 等级: TIER[m.tier] ? TIER[m.tier][0] : m.tier,
                                能力格: m.cells, 方案: m.prov ? m.prov.n : null,
                                方案类型: m.prov ? m.prov.k : null, 理由: m.prov ? m.prov.note : null })),
    施工顺序: data.order.map((o, i) => (i + 1) + ". " + o.nm + "（" + o.id + "）")
  };
  const readme = `# ${data.name}

装配于 ${data.at} · ${data.mods.length} 个模块 · ${data.cells.length} 格 · ${data.lines} 条连线

## 怎么用

双击 \`index.html\`，会打开一个**能点的模拟中台**：左侧是模块导航，待办能加能勾、速记能保存、
搜索能跨三处找、AI 对话框能真的给你加待办。数据存在你浏览器的 localStorage 里，不上传任何地方。

这是原型：界面与交互是真的，后端是假的。要变成真程序，按 \`模块清单.md\` 的施工顺序逐格落地。

## 装了什么

${data.mods.map(m => `- **${m.nm}**（${m.cells.join(" / ")}）→ ${m.prov ? m.prov.n : "未选"}${m.prov ? "　" + m.prov.note : ""}`).join("\n")}

## 施工顺序

${data.order.map((o, i) => `${i + 1}. ${o.nm}　\`${o.id}\``).join("\n")}

## 三个提醒

1. **先跑通一条链**：数据仓 → 待办 → 界面。这三格通了，后面的都是加法。
2. **方案是候选不是承诺**：标「自研」的格子要算 token 与返工成本，标「慎选」的多半有运维代价。
3. **别一次装全**：这块中台是从「必装」起，用两周再决定要不要加可选模块。
`;
  return {manifest, readme};
}

/* ────────── 视图：模块库 ────────── */
function viewLib(){
  topbar(`<b>模块库</b>`, null, `<span class="faint" style="font-size:12px">${D.comps.length} 格 · ${D.comps.reduce((n, c) => n + c.pv.length, 0)} 个方案</span>`);
  $("#view").innerHTML = `<div class="page">
    <div class="pagehd"><div><h1>模块库</h1><p>按域分组。点任一格看它要什么、给什么、有哪些方案。</p></div></div>
    <div class="libbar"><input class="search" id="q" placeholder="搜模块名、编号、方案名…"></div>
    <div id="liblist"></div>
  </div>`;
  const draw = kw => {
    const q = (kw || "").trim().toLowerCase();
    const hitc = c => !q || c.name.includes(q) || c.id.includes(q) || (c.pv || []).some(p => p.n.toLowerCase().includes(q));
    const list = D.comps.filter(hitc);
    $("#liblist").innerHTML = D.domOrder.filter(d => list.some(c => c.dom === d)).map(d => {
      const items = list.filter(c => c.dom === d);
      return `<div class="libdom"><div class="gt"><span class="dot" style="background:var(--faint)"></span>
        ${esc(D.doms[d] || d)}<i>${items.length} 格</i></div>
        <div class="librow">${items.map(c => `<div class="libitem" data-lib="${c.id}">
          <b>${esc(c.name)}</b><span class="cid">${c.id}</span>
          <p>${esc(c.abstract)}</p></div>`).join("")}</div></div>`;
    }).join("") || `<div class="empty">没搜到</div>`;
    document.querySelectorAll("[data-lib]").forEach(n => n.onclick = () => detail(n.dataset.lib));
  };
  draw("");
  $("#q").oninput = e => draw(e.target.value);
}

/* ────────── 启动 ────────── */
$("#btnHelp").onclick = e => {
  e.preventDefault();
  modal(`<div class="mh"><b>怎么用</b><button class="x" data-x="1">✕</button></div>
    <div class="mb">
      <p style="margin-top:0">两条路，走到同一个地方——都落在同一套能力格上，都会检查能不能接上。</p>
      <p><b>① 个人中台</b>　工作台第一张卡：定风格（极简 / 中等 / 齐全）→ 勾模块 → 给每块挑实现方案
        → 确认清单 → 像往主板上插模块一样装起来 → 试用 → 打包带走。</p>
      <p><b>② 一句话需求</b>　写一句大白话，说清「拿什么进来、变成什么出去」，系统反推要哪些能力格，
        再挑方案、看连通、开工。</p>
      <p><b>连通检查</b>　红色断点必须先修（要的类型没人产出），黄色死端是做出来没去处。</p>
      <p><b>草稿</b>　任意一步右上角点「存草稿」，起个名字；之后在工作台「草稿箱」里点「继续」，
        风格、模块、方案、勾选原样带回来。草稿箱还能导出成 JSON 文件带走、再导入回来。
        组装过程本身不存（它是过程不是结果），恢复后从「确认」重开一次。</p>
      <p class="faint" style="font-size:12px">快捷键：⌘/Ctrl + Enter 解析需求；Esc 关闭弹窗。</p>
    </div>`, `<button class="btn" data-x="1">知道了</button>`);
  $("#modal").querySelectorAll("[data-x]").forEach(x => x.onclick = closeModal);
};
$("#btnSetting").onclick = e => {
  e.preventDefault();
  modal(`<div class="mh"><b>设置</b><button class="x" data-x="1">✕</button></div>
    <div class="mb">
      <div class="kv"><b>当前需求</b><span>${esc(S.need || "（空）")}</span></div>
      <div class="kv"><b>当前模式</b><span>${S.hub && S.hub.mods.length
        ? "个人中台 · " + esc(hubStyleName()) + " · " + S.hub.mods.length + " 模块" : "一句话需求"}</span></div>
      <div class="kv"><b>已勾格数</b><span>${S.picks.length}</span></div>
      <div class="kv"><b>草稿</b><span>${S.drafts.length} 份</span></div>
      <div class="kv"><b>存储</b><span>${LSOK
        ? "浏览器 localStorage（键 " + KEY + "）"
        : "当前环境禁用了 localStorage，只记在内存里——要留着请导出草稿"}</span></div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn sm" id="sExp">导出全部草稿</button>
        <button class="btn sm" id="sImp">导入草稿</button>
      </div>
      <p class="faint" style="font-size:12px">接到真后端后，这里会有账号、项目仓库地址、默认模型供应商。</p>
    </div>`, `<button class="btn" data-x="1">关闭</button>`);
  $("#modal").querySelectorAll("[data-x]").forEach(x => x.onclick = closeModal);
  $("#sExp").onclick = () => { closeModal(); draftExport(); };
  $("#sImp").onclick = () => { closeModal(); draftImport(); };
};

load();
if(!location.hash) location.hash = "#/home";
route();
window.addEventListener("hashchange", route);
</script>
