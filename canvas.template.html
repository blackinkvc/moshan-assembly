<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>墨山 · 搭建画布</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --ink:#171a1f; --muted:#666e7a;
    --line:#dfe3e9; --line-2:#eef1f4; --accent:#0f766e; --accent-soft:#e6f4f1;
    --warn:#b45309; --warn-soft:#fdf3e3; --err:#b42318; --err-soft:#fdeceb;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.18);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#101216; --panel:#181b20; --ink:#e8eaed; --muted:#98a1ad;
      --line:#2a2f37; --line-2:#22262c; --accent:#2dd4bf; --accent-soft:#12312e;
      --warn:#f0b357; --warn-soft:#2e2413; --err:#f07b72; --err-soft:#33191a;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.7);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--panel);
    border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{font-weight:650;letter-spacing:.2px}
  .brand small{font-weight:400;color:var(--muted);margin-left:8px}
  .stats{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
  .stat{font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line);
    border-radius:999px;padding:3px 10px}
  .stat b{color:var(--ink);font-weight:600}
  .stat.bad{color:var(--err);background:var(--err-soft);border-color:transparent}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);border-radius:8px;padding:6px 12px;transition:.14s}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.08);color:#fff}
  main{flex:1;display:flex;min-height:0}
  .stage{flex:1;position:relative;overflow:auto;padding:0}
  #canvas{position:relative;height:100%;min-height:420px}
  svg#edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
  .card{position:absolute;width:208px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:11px 12px;box-shadow:var(--shadow);cursor:pointer;transition:.16s}
  .card:hover{border-color:var(--accent)}
  .card.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
  .card.custom{border-style:dashed}
  .card .lb{font-weight:650;font-size:13px}
  .card .lb .port{float:right;font:11px/1.6 var(--mono);color:var(--muted);font-weight:400}
  .card .need{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 7px}
  .card .need span{font:11px/1.5 var(--mono);background:var(--bg);border:1px solid var(--line-2);
    color:var(--muted);border-radius:5px;padding:1px 5px}
  .card .pick{font-size:12px;color:var(--accent);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .pick.empty{color:var(--err)}
  .card .pick.manual{color:var(--muted);font-weight:500}
  .card .mods{font:11px/1.5 var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .gap{margin-top:6px;font-size:11px;color:var(--warn);background:var(--warn-soft);
    border-radius:5px;padding:2px 6px;display:inline-block}
  aside{width:344px;flex:none;background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0}
  .insp{overflow:auto;padding:14px 16px 28px}
  .insp h3{margin:0 0 2px;font-size:14px}
  .insp h4{margin:16px 0 7px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .insp p.hint{margin:0 0 10px;color:var(--muted);font-size:12px}
  .cands{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .cand{border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer;transition:.14s}
  .cand:hover{border-color:var(--accent)}
  .cand.sel{border-color:var(--accent);background:var(--accent-soft)}
  .cand .r1{display:flex;align-items:baseline;gap:6px}
  .cand .r1 b{font-size:13px}
  .cand .r1 .sc{margin-left:auto;font:11px/1 var(--mono);color:var(--accent);font-variant-numeric:tabular-nums}
  .cand .r2{font-size:11px;color:var(--muted);margin-top:3px}
  .bar{height:3px;border-radius:2px;background:var(--line-2);margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
  .mods{list-style:none;margin:7px 0 0;padding:0;display:flex;flex-direction:column;gap:3px}
  .mods li{display:flex;gap:7px;align-items:flex-start;font-size:11.5px;color:var(--muted)}
  .mods input{margin:2px 0 0;accent-color:var(--accent)}
  .mods b{color:var(--ink);font-weight:500}
  .row{display:flex;gap:6px;align-items:center}
  .row select,.row input{flex:1;min-width:0;font:inherit;font-size:12px;padding:5px 7px;border-radius:7px;
    border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  .edge-item{display:flex;gap:8px;align-items:center;font-size:12px;padding:6px 8px;border:1px solid var(--line-2);
    border-radius:7px;margin-bottom:5px}
  .edge-item .x{margin-left:auto;color:var(--muted);cursor:pointer;border:0;background:none;padding:0 2px;font-size:14px}
  .edge-item .x:hover{color:var(--err)}
  .tag{font:10px/1.6 var(--mono);padding:0 5px;border-radius:4px;background:var(--bg);
    border:1px solid var(--line-2);color:var(--muted)}
  .empty{color:var(--muted);font-size:12.5px;line-height:1.9}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);
    background:var(--ink);color:var(--bg);font-size:12.5px;padding:8px 16px;border-radius:8px;
    opacity:0;pointer-events:none;transition:.22s;z-index:9}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:820px){aside{display:none}}
</style>
</head>
<body>
<header>
  <div class="brand">墨山搭建画布<small id="bpname"></small></div>
  <div class="stats" id="stats"></div>
  <button id="btn-add">＋ 加格子</button>
  <button id="btn-cmd">复制解析命令</button>
  <button class="primary" id="btn-export">导出蓝图</button>
</header>
<main>
  <section class="stage"><div id="canvas"><svg id="edges"></svg><div id="slots"></div></div></section>
  <aside><div class="insp" id="insp"></div></aside>
</main>
<div class="toast" id="toast"></div>

<script type="application/json" id="catalog"><!--CATALOG_JSON--></script>
<script type="application/json" id="blueprint"><!--BLUEPRINT_JSON--></script>
<script>
(function(){
  const CAT = JSON.parse(document.getElementById('catalog').textContent);
  const BP  = JSON.parse(document.getElementById('blueprint').textContent);
  const CAPS = Object.fromEntries(CAT.capabilities.map(c=>[c.id,c]));
  const ENTRIES = Object.fromEntries(CAT.entries.map(e=>[e.id,e]));
  const CARD_W = 208, GAP_X = 250, TOP = 64, CARD_H = 132;

  let active = null;

  // ---- 与 tools/blueprint.py 同构的匹配逻辑（Python 侧为准，此处用于即时预览） ----
  function modsOf(eid, pinned, need){
    const e = ENTRIES[eid]; if(!e) return [];
    let sel;
    if(pinned && pinned.length){
      // 显式勾选即为准：不再自动补 need，允许出现缺口
      sel = e.modules.filter(m=>pinned.includes(m.id));
    } else {
      sel = e.modules.filter(m=>m.default!==false);
      for(const m of e.modules) if(need.includes(m.capability) && !sel.includes(m)) sel.push(m);
    }
    // requires 闭包
    let ch=true;
    while(ch){ ch=false;
      for(const m of [...sel]) for(const cap of (m.requires||[])){
        if(sel.some(x=>x.capability===cap)) continue;
        const c = e.modules.find(x=>x.capability===cap && !sel.includes(x));
        if(c){ sel.push(c); ch=true; }
      }}
    return sel;
  }
  function cov(eid, need, pinned){
    const sel = modsOf(eid, pinned, need);
    const got = new Set(sel.map(m=>m.capability));
    return {sel, got, hit: need.filter(c=>got.has(c)), miss: need.filter(c=>!got.has(c))};
  }
  function scoreOf(eid, need, used, pinned){
    const e = ENTRIES[eid]; const c = cov(eid, need, pinned);
    if(!need.length) return {eid, s:0, sel:c.sel, hit:[], miss:[]};
    const cost = e.cost||{}; const ram = cost.ram_mb||200;
    const ports = c.sel.filter(m=>m.port).length;
    const reuse = used.has(eid)?12:0;
    const s = (c.hit.length/need.length)*100 - Math.min(ram,700)*0.06 - ports*1 + reuse;
    return {eid, s:+s.toFixed(1), sel:c.sel, hit:c.hit, miss:c.miss, ram, ports};
  }
  function rank(need, used, only){
    const ids = only?[only]:Object.keys(ENTRIES);
    return ids.filter(id=>ENTRIES[id]).map(id=>scoreOf(id,need,used))
      .filter(r=>r.hit.length>0 || only)
      .sort((a,b)=> b.s-a.s || a.ram-b.ram);
  }
  function chosen(slot, used){
    if(slot.custom) return {custom:true};
    if(slot.use && slot.use.entry) return scoreOf(slot.use.entry, slot.needs, used, slot.use.modules);
    const r = rank(slot.needs, used);
    return r[0] || null;
  }
  function ports(){
    const c = BP.constraints||{}; const pool = c.port_pool||[8790,8799];
    const reserved = new Set(c.reserved_ports||[]);
    const out=[]; for(let i=pool[0];i<=pool[1];i++) if(!reserved.has(i)) out.push(i);
    return out;
  }
  function assignment(){
    const free = ports(); const taken = new Set();
    const install = (BP.install_as||{}).port;
    if(install) taken.add(install);
    const map={};
    for(const s of BP.slots){
      if(s.port){ map[s.id]=s.port; taken.add(s.port); continue; }
      if(s.custom && s.ui && install){ map[s.id]=install; continue; }
      const p = free.find(x=>!taken.has(x));
      if(p){ map[s.id]=p; taken.add(p); }
    }
    return map;
  }

  // ---- 渲染 ----
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

  function draw(){
    const host = document.getElementById('slots');
    host.innerHTML='';
    const used=new Set(); const picks={};
    BP.slots.forEach(s=>{ const p=chosen(s,used); picks[s.id]=p; if(p&&p.eid) used.add(p.eid); });
    const pmap = assignment();

    BP.slots.forEach((s,i)=>{
      const p = picks[s.id];
      const el = document.createElement('div');
      el.className='card'+(s.id===active?' active':'')+(s.custom?' custom':'');
      el.style.left = (24 + i*GAP_X) + 'px';
      el.style.top = TOP + 'px';
      el.dataset.id = s.id;
      const miss = p && !p.custom ? p.miss : [];
      el.innerHTML =
        '<div class="lb">'+esc(s.label)+'<span class="port">'+(pmap[s.id]?':'+pmap[s.id]:'')+'</span></div>'+
        '<div class="need">'+s.needs.map(c=>'<span>'+esc(c)+'</span>').join('')+'</div>'+
        (s.custom
          ? '<div class="pick manual">手写胶水 · 约 30–80 行</div><div class="mods">'+esc((s.outputs||[]).join(' '))+'</div>'
          : (p
              ? '<div class="pick">'+esc(ENTRIES[p.eid].name)+'</div><div class="mods">'+esc(p.sel.map(m=>m.id).join('·'))+'</div>'
              : '<div class="pick empty">未匹配到软件</div>'))+
        (miss.length?'<div class="gap">缺 '+miss.length+' 条能力</div>':'');
      el.onclick=()=>{ active=s.id; draw(); };
      host.appendChild(el);
    });

    host.appendChild(Object.assign(document.createElement('div'),{
      className:'empty', style:'position:absolute;left:24px;top:'+(TOP+CARD_H+110)+'px;font-size:12px'
    }));
    host.lastChild.textContent = bpNote();

    drawEdges(pmap);
    drawStats(picks, pmap);
    drawInspector(picks, pmap);
  }

  function bpNote(){
    const gaps = [];
    BP.slots.forEach(s=>{
      const p = chosen(s,new Set());
      if(p && !p.custom && p.miss.length) gaps.push(s.label+' 缺 '+p.miss.join('、'));
    });
    if(gaps.length) return '⚠ '+gaps.join('；')+' —— 解析器不会硬凑，标 custom 或补能力词表';
    return '点格子改软件与模块；勾掉模块即「只取这个软件的一部分」。导出后用 CLI 生成清单。';
  }

  function drawEdges(pmap){
    const svg = document.getElementById('edges');
    const cv = document.getElementById('canvas');
    const W = Math.max(24 + BP.slots.length*GAP_X + 80, 860);
    const H = Math.max(TOP + CARD_H + 150, 420);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    // 不用 viewBox 缩放：像素坐标 1:1 映射，否则连线会和卡片错位
    svg.setAttribute('width', W); svg.setAttribute('height', H);
    svg.setAttribute('viewBox', '0 0 '+W+' '+H);
    const idx = Object.fromEntries(BP.slots.map((s,i)=>[s.id,i]));
    let out = '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">'+
      '<path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>';
    const accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    const muted=getComputedStyle(document.documentElement).getPropertyValue('--muted').trim();
    BP.edges.forEach(e=>{
      const a=idx[e.from], b=idx[e.to]; if(a==null||b==null) return;
      const x1=24+a*GAP_X+CARD_W, y1=TOP+CARD_H/2;
      const vol = e.carrier==='volume';
      let x2, y2, d;
      if(b>a+1){
        // 跨过中间卡片：走下方弧线，否则直线会被卡片盖住
        x2=24+b*GAP_X; y2=TOP+CARD_H/2;
        const yd=TOP+CARD_H+72;
        d='M'+x1+','+y1+' C'+(x1+56)+','+yd+' '+(x2-56)+','+yd+' '+x2+','+y2;
      } else if(b>=a){ x2=24+b*GAP_X; y2=TOP+CARD_H/2;
        const cx=(x1+x2)/2;
        d='M'+x1+','+y1+' C'+cx+','+y1+' '+cx+','+y2+' '+x2+','+y2;
      } else { // 反向：走下方绕行
        x2=24+b*GAP_X+CARD_W; y2=TOP+CARD_H/2;
        const yd=TOP+CARD_H+52;
        d='M'+x1+','+y1+' C'+(x1+40)+','+yd+' '+(x2-40)+','+yd+' '+x2+','+y2;
      }
      out+='<path d="'+d+'" fill="none" stroke="'+(vol?muted:accent)+'" stroke-width="'+(vol?1.4:1.6)+'" '+
        (vol?'stroke-dasharray="5 4" ':'')+'marker-end="url(#ah)" opacity="'+(vol?.75:.85)+'"/>';
      if(vol){
        const mx=(x1+x2)/2, my=(b>=a? y1-9 : TOP+CARD_H+44);
        out+='<text x="'+mx+'" y="'+my+'" font-size="10" fill="'+muted+'" text-anchor="middle" font-family="ui-monospace,monospace">共享卷</text>';
      }
    });
    svg.innerHTML=out;
  }

  function drawStats(picks,pmap){
    let ram=0, n=0, gaps=0;
    for(const s of BP.slots){
      const p=picks[s.id]; if(!p||p.custom) continue; n++;
      ram += (ENTRIES[p.eid].cost||{}).ram_mb||0;
      gaps += p.miss.length;
    }
    const usedPorts = Object.keys(pmap).length;
    document.getElementById('bpname').textContent = BP.name+' · '+BP.id;
    document.getElementById('stats').innerHTML =
      '<span class="stat"><b>'+n+'</b> 个软件</span>'+
      '<span class="stat"><b>'+BP.slots.filter(s=>s.custom).length+'</b> 处胶水</span>'+
      '<span class="stat"><b>'+usedPorts+'</b>/'+ports().length+' 端口</span>'+
      '<span class="stat"><b>'+ram+'</b> MB</span>'+
      (gaps?'<span class="stat bad">缺 <b>'+gaps+'</b> 条能力</span>':'<span class="stat">能力全覆盖</span>');
  }

  function drawInspector(picks,pmap){
    const box=document.getElementById('insp');
    const s = BP.slots.find(x=>x.id===active);
    if(!s){ box.innerHTML = overview(); bindOverview(); return; }
    const p = picks[s.id];
    const need = s.needs||[];
    const ranked = s.custom?[]:rank(need,new Set(BP.slots.filter(x=>x!==s).map(x=>chosen(x,new Set())).filter(x=>x&&x.eid).map(x=>x.eid)), s.use&&s.use.entry);
    let h='<h3>'+esc(s.label)+'</h3><p class="hint">'+esc(s.note||'（未写说明）')+'</p>';
    h+='<div class="row" style="margin-bottom:10px"><label style="font-size:12px;color:var(--muted)">手写胶水</label>'+
       '<input type="checkbox" id="chk-custom" '+(s.custom?'checked':'')+' style="flex:none"></div>';

    if(!s.custom){
      h+='<h4>候选软件（按能力覆盖打分）</h4><ul class="cands">';
      const list = ranked.slice(0,5);
      if(!list.length) h+='<li class="empty">词表里没有软件提供这些能力</li>';
      for(const r of list){
        const e=ENTRIES[r.eid];
        const sel = p && !p.custom && p.eid===r.eid;
        h+='<li class="cand'+(sel?' sel':'')+'" data-pick="'+r.eid+'">'+
           '<div class="r1"><b>'+esc(e.name)+'</b><span class="tag">'+esc(e.kind)+'</span>'+
           '<span class="sc">'+r.s.toFixed(1)+'</span></div>'+
           '<div class="r2">覆盖 '+r.hit.length+'/'+need.length+' · '+(e.cost&&e.cost.ram_mb||0)+'MB'+
           (r.miss.length?' · 缺 '+r.miss.length+' 条':'')+'</div>'+
           '<div class="bar"><i style="width:'+Math.max(4,Math.min(100,r.s))+'%"></i></div>'+
           (sel?modList(e,r.sel):'')+
           '</li>';
      }
      h+='</ul>';
      if(s.use&&s.use.entry) h+='<div style="margin-top:8px"><button id="btn-unpin">取消钉死，交回推荐</button></div>';
    } else {
      h+='<h4>这一格要你写</h4><p class="hint" style="line-height:1.8">解析器会生成 <code>'+esc(s.id)+'/main.py</code> 骨架、'+
         '端口 '+(pmap[s.id]||'—')+'、<code>/api/ping</code> 探活，以及下面这张注入表。逻辑本身（几十行）留给你。</p>';
    }

    h+='<h4>对外提供的能力</h4>';
    h+= s.custom
      ? '<div class="row"><input id="f-out" value="'+esc((s.outputs||[]).join(','))+'" placeholder="如 news.digest"></div>'
      : '<p class="hint">由所选模块决定：'+esc((p&&!p.custom)?p.sel.map(m=>m.capability).join('、'):'—')+'</p>';

    h+='<h4>连线</h4>';
    const ins = BP.edges.filter(e=>e.to===s.id), outs=BP.edges.filter(e=>e.from===s.id);
    if(!ins.length&&!outs.length) h+='<p class="hint">还没有连线</p>';
    for(const e of [...ins,...outs]){
      const dir = e.to===s.id? (e.from+' → '):(' → '+e.to);
      const other = e.to===s.id? BP.slots.find(x=>x.id===e.from) : BP.slots.find(x=>x.id===e.to);
      h+='<div class="edge-item"><span class="tag">'+(e.carrier==='volume'?'卷':'env')+'</span>'+
         esc((e.to===s.id?'← ':'→ ')+(other?other.label:''))+
         (e.carrier==='env'&&e.env?' <span class="tag">'+esc(e.env)+'</span>':'')+
         '<button class="x" data-del-edge="'+esc(e.from+'|'+e.to)+'">×</button></div>';
    }
    if(!s.custom){
      h+='<div class="row" style="margin-top:8px"><select id="f-edge-to"><option value="">连到…</option>'+
         BP.slots.filter(x=>x.id!==s.id).map(x=>'<option value="'+x.id+'">'+esc(x.label)+'</option>').join('')+
         '</select><select id="f-edge-carrier"><option value="env">env</option><option value="volume">共享卷</option></select>'+
         '<button id="btn-add-edge">加</button></div>';
      h+='<p class="hint" style="margin-top:6px">env：下游读这个地址；共享卷：两个容器挂同一目录（适合文件）</p>';
    }
    h+='<div style="margin-top:18px"><button id="btn-del">删除这一格</button></div>';
    box.innerHTML=h;

    // 绑定
    const cc=document.getElementById('chk-custom'); if(cc) cc.onchange=()=>{
      s.custom=cc.checked; if(s.custom){ s.outputs=s.needs.slice(); } draw();
    };
    box.querySelectorAll('[data-pick]').forEach(li=>li.onclick=ev=>{
      if(ev.target.tagName==='INPUT'||ev.target.tagName==='LABEL') return;
      const eid=li.dataset.pick;
      s.use={entry:eid, modules: modsOf(eid, null, s.needs).map(m=>m.id)};
      draw();
    });
    box.querySelectorAll('[data-mod]').forEach(cb=>cb.onchange=()=>{
      const cur = [...box.querySelectorAll('[data-mod]')].filter(x=>x.checked).map(x=>x.dataset.mod);
      const eid = (s.use && s.use.entry) || (p && !p.custom ? p.eid : null);
      if(!eid) return;
      s.use = {entry: eid, modules: cur.length?cur:null};
      draw();
    });
    const up=document.getElementById('btn-unpin'); if(up) up.onclick=()=>{ delete s.use; draw(); };
    const fo=document.getElementById('f-out'); if(fo) fo.onchange=()=>{ s.outputs=fo.value.split(',').map(x=>x.trim()).filter(Boolean); draw(); };
    const be=document.getElementById('btn-add-edge'); if(be) be.onclick=()=>{
      const to=document.getElementById('f-edge-to').value; if(!to) return toast('先选一个目标格子');
      const carrier=document.getElementById('f-edge-carrier').value;
      const e={from:s.id,to,carrier};
      if(carrier==='volume') e.path='/data';
      else e.env='SRC_'+s.id.toUpperCase().replace(/[^A-Z0-9]/g,'_');
      BP.edges.push(e); draw();
    };
    box.querySelectorAll('[data-del-edge]').forEach(b=>b.onclick=()=>{
      const [f,t]=b.dataset.delEdge.split('|');
      BP.edges = BP.edges.filter(e=>!(e.from===f&&e.to===t)); draw();
    });
    const del=document.getElementById('btn-del'); if(del) del.onclick=()=>{
      BP.slots=BP.slots.filter(x=>x.id!==s.id);
      BP.edges=BP.edges.filter(e=>e.from!==s.id&&e.to!==s.id);
      active=null; draw();
    };
  }

  function modList(e, sel){
    return '<ul class="mods">'+e.modules.map(m=>{
      const on = sel.includes(m);
      return '<li><input type="checkbox" data-mod="'+esc(m.id)+'" '+(on?'checked':'')+'>'+
        '<span><b>'+esc(m.label||m.id)+'</b> <span class="tag">'+esc(m.capability)+'</span>'+
        (m.cost&&m.cost.ram_mb?' · +'+m.cost.ram_mb+'MB':'')+
        (m.note?'<br>'+esc(m.note):'')+'</span></li>';
    }).join('')+'</ul>';
  }

  function overview(){
    const groups={};
    CAT.capabilities.forEach(c=>{ (groups[c.group||'其他'] ||= []).push(c); });
    let h='<h3>能力词表</h3><p class="hint">格子填的是这些能力，不是软件名。点一个加进画布。</p>';
    for(const g in groups){
      h+='<h4>'+esc(g)+'</h4><div style="display:flex;flex-wrap:wrap;gap:5px">'+
        groups[g].map(c=>'<button data-addcap="'+esc(c.id)+'" style="font-size:11.5px;padding:4px 8px">'+esc(c.label)+'</button>').join('')+'</div>';
    }
    h+='<h4>目录里的软件</h4><ul class="mods">'+CAT.entries.map(e=>
      '<li><b>'+esc(e.name)+'</b> <span class="tag">'+esc(e.kind==='existing'?'只登记':e.modules.map(m=>m.capability.split('.').pop()).join('/'))+'</span></li>').join('')+'</ul>';
    return h;
  }
  function bindOverview(){
    document.querySelectorAll('[data-addcap]').forEach(b=>b.onclick=()=>{
      const cap=b.dataset.addcap;
      const id='s'+(BP.slots.length+1)+'-'+cap.split('.').pop();
      BP.slots.push({id, label:CAPS[cap]?CAPS[cap].label:cap, needs:[cap]});
      active=id; draw();
    });
  }

  function toast(m){
    const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on');
    clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800);
  }

  document.getElementById('btn-export').onclick=()=>{
    const out=JSON.parse(JSON.stringify(BP));
    out.slots.forEach(s=>{ if(s.use&&!s.use.modules) delete s.use.modules; });
    const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='blueprint-'+BP.id+'.json'; a.click(); URL.revokeObjectURL(a.href);
    toast('已导出蓝图，接着跑解析命令');
  };
  document.getElementById('btn-cmd').onclick=async()=>{
    const cmd='python3 tools/blueprint.py blueprint-'+BP.id+'.json --catalog catalog/moshan-catalog.json --out examples/generated-'+BP.id+'.moshan.json --topology';
    try{ await navigator.clipboard.writeText(cmd); toast('命令已复制'); }
    catch(e){ toast(cmd); }
  };
  document.getElementById('btn-add').onclick=()=>{ active=null; draw(); };

  draw();
  window.addEventListener('resize', ()=>drawEdges(assignment()));
})();
</script>
</body>
</html>
