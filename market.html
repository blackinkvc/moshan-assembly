<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>墨山 · 插件仓库</title>
<style>
  /* ---------- 与画布页同一套令牌：两页是一套东西的两个面 ---------- */
  :root{
    --bg:#f4f5f7; --bg-2:#e9ebef; --panel:#ffffff;
    --ink:#15181d; --ink-2:#39404b; --muted:#697280;
    --line:#e1e5eb; --line-2:#eef1f5;
    --accent:#0f766e; --accent-soft:#e7f4f1; --accent-line:#b9e3dc;
    --warn:#a85a0a; --warn-soft:#fdf4e5; --err:#b42318; --err-soft:#fdeceb;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --r-lg:14px; --r-md:10px; --r-sm:7px;
    --s1:0 1px 2px rgba(16,24,40,.05);
    --s2:0 2px 4px rgba(16,24,40,.05),0 10px 24px -14px rgba(16,24,40,.28);
    --s3:0 16px 34px -16px rgba(16,24,40,.34),0 2px 6px rgba(16,24,40,.06);
    --shadow:var(--s2);
    --ease:cubic-bezier(.2,.7,.3,1);
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0f1115; --bg-2:#171a1f; --panel:#181b20;
    --ink:#e9ebee; --ink-2:#c3c9d2; --muted:#98a1ad;
    --line:#282d35; --line-2:#21252b;
    --accent:#2dd4bf; --accent-soft:#0f2e2b; --accent-line:#1d4a45;
    --warn:#f0b357; --warn-soft:#2e2413; --err:#f07b72; --err-soft:#33191a;
    --s1:0 1px 2px rgba(0,0,0,.5);
    --s2:0 2px 6px rgba(0,0,0,.45),0 12px 28px -16px rgba(0,0,0,.8);
    --s3:0 18px 38px -18px rgba(0,0,0,.9),0 2px 8px rgba(0,0,0,.5);
    --shadow:var(--s2);
  }}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:10px;padding:8px 16px;min-height:56px;
    background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;row-gap:7px;flex:none}
  .mark{width:22px;height:22px;border-radius:7px;flex:none;
    background:linear-gradient(150deg,var(--accent),#0b5f59);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
  @media (prefers-color-scheme:dark){.mark{background:linear-gradient(150deg,#2dd4bf,#0f766e)}}
  .brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:.2px;white-space:nowrap}
  .brand small{font-weight:400;color:var(--muted);font-size:12px;letter-spacing:0;margin:0}
  a.jump{font-size:12.5px;color:var(--accent);background:var(--accent-soft);border-radius:999px;
    padding:5px 12px;text-decoration:none;white-space:nowrap;transition:.14s var(--ease)}
  a.jump:hover{background:var(--accent-line)}
  .tabs{display:flex;gap:3px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:2px}
  .tabs button{border:0;background:transparent;padding:5px 11px;border-radius:7px;font-size:13px;color:var(--muted)}
  .tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.08);font-weight:600}
  .tabs button .cnt{font:10.5px/1 var(--mono);color:var(--muted);margin-left:5px;
    background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:2px 5px;vertical-align:1px}
  .tabs button.on .cnt{background:var(--accent);border-color:var(--accent);color:#fff}
  /* 目录列表的分区标题：51 条不分段就没法看 */
  .sec{display:flex;align-items:center;gap:7px;padding:11px 13px 5px;font:11px/1 var(--mono);
    color:var(--muted);letter-spacing:.04em;position:sticky;top:0;
    background:var(--panel);z-index:2;border-bottom:1px solid var(--line-2)}
  .sec:first-child{padding-top:5px}
  .sec b{color:var(--ink);font-weight:600;font-size:11px}
  .sec .ln{flex:1;height:1px;background:var(--line-2)}
  #q{flex:1;min-width:160px;max-width:340px;padding:7px 11px;border:1px solid var(--line);
    border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;outline:none}
  #q:focus{border-color:var(--accent)}
  .stats{display:flex;gap:6px;margin-left:auto}
  .stat{font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line);
    border-radius:999px;padding:3px 10px}
  .stat b{color:var(--ink);font-weight:600}
  main{flex:1;display:flex;min-height:0}
  .list{width:400px;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;
    border-right:1px solid var(--line)}
  .item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    cursor:pointer;transition:.14s}
  .item:hover{border-color:var(--accent)}
  .item.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .item .r1{display:flex;align-items:baseline;gap:7px}
  .item .nm{font-weight:640;font-size:13.5px}
  .item .ver{font:11px/1.6 var(--mono);color:var(--muted)}
  .item .sp{flex:1}
  .badge{font:11px/1.5 var(--mono);border-radius:5px;padding:1px 6px;border:1px solid var(--line);
    color:var(--muted);background:var(--bg)}
  .badge.single{color:#0f766e;background:#e6f4f1;border-color:transparent}
  .badge.stack{color:#6d28d9;background:#f1eaff;border-color:transparent}
  .badge.adapter{color:#b45309;background:#fdf3e3;border-color:transparent}
  @media (prefers-color-scheme:dark){
    .badge.single{color:#2dd4bf;background:#12312e}
    .badge.stack{color:#c4b5fd;background:#241d3d}
    .badge.adapter{color:#f0b357;background:#2e2413}
  }
  .item .sum{font-size:12.5px;color:var(--muted);margin-top:3px}
  .item .kw{font:11px/1.5 var(--mono);color:var(--muted);margin-top:5px;opacity:.85}
  /* 标签：与「能力」是两套维度。能力是给蓝图格子用的（media.download），标签是给人筛的（界面 / 前端 / 网络） */
  .tagbar{display:flex;align-items:center;gap:5px;padding:7px 16px;background:var(--panel);
    border-bottom:1px solid var(--line);overflow-x:auto;flex-wrap:wrap}
  .tagbar[hidden]{display:none}
  /* 品类：与标签正交的第二套分类。tag 回答「什么领域」（多个），品类回答「这是哪一种东西」（唯一） */
  .catbar{display:flex;align-items:center;gap:6px;padding:9px 16px;background:var(--bg);
    border-bottom:1px solid var(--line);overflow-x:auto;flex-wrap:wrap}
  .catbar[hidden]{display:none}
  .cchip{font:12px/1.6 inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);
    border-radius:8px;padding:3px 10px;cursor:pointer;white-space:nowrap;
    display:inline-flex;align-items:center;gap:6px}
  .cchip:hover{border-color:var(--accent);color:var(--accent)}
  .cchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .cchip .n{font:10.5px/1 var(--mono);opacity:.65}
  .cchip .lb{font-size:10.5px;color:var(--muted);margin-right:2px}
  .tchip{font:11.5px/1.5 inherit;border:1px solid var(--line);background:var(--bg);color:var(--muted);
    border-radius:999px;padding:2px 9px;cursor:pointer;white-space:nowrap;
    display:inline-flex;align-items:center;gap:5px}
  .tchip:hover{border-color:var(--accent);color:var(--accent)}
  .tchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .tchip .n{font:10.5px/1 var(--mono);opacity:.6}
  .tchip.on .n{opacity:.85}
  .tchip.grp{border:0;border-left:1px solid var(--line);border-radius:0;background:transparent;
    cursor:default;padding:2px 6px 2px 9px;margin-left:3px;opacity:.5;font-size:11px}
  .tchip.grp:hover{color:var(--muted)}
  .trow{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .tag{font:11px/1.5 inherit;border-radius:5px;padding:1px 6px;background:var(--accent-soft);
    color:var(--accent);white-space:nowrap}
  .detail{flex:1;overflow:auto;padding:16px 18px 90px}
  .empty{color:var(--muted);font-size:13px;padding:24px 4px}
  h1{font-size:17px;margin:0 0 2px}
  .sub{color:var(--muted);font-size:12.5px;margin-bottom:12px}
  h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
    margin:18px 0 8px;font-weight:600}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .kv{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px}
  .kv i{font-style:normal;color:var(--muted)}
  .comp{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
  .comp .hd{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--bg);
    border-bottom:1px solid var(--line-2)}
  .comp .cid{font-weight:620;font-size:13px}
  .comp .img{font:11px/1.6 var(--mono);color:var(--muted);margin-left:auto;text-align:right;
    max-width:58%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .comp .bd{padding:6px 12px 9px}
  label.mod{display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:12.5px;cursor:pointer}
  label.mod input{margin-top:2px;accent-color:var(--accent)}
  label.mod .cap{font:11px/1.6 var(--mono);color:var(--muted)}
  label.mod .art{margin-left:auto;font:11px/1.6 var(--mono);color:var(--muted);white-space:nowrap}
  label.mod.off .nm2{color:var(--muted)}
  .note{font-size:11.5px;color:var(--muted);padding:2px 0 0 24px}
  /* 能力卡：一张卡内部按阶段分段（① 入库 / ② 检索形态 / ③ 出库） */
  .gsec{display:flex;align-items:center;gap:7px;margin:12px 0 6px;font:11px/1 var(--mono);
    color:var(--muted);letter-spacing:.04em}
  .gsec b{font-size:11px;color:var(--ink);font-weight:600}
  .gsec .ln{flex:1;height:1px;background:var(--line-2)}
  .kmod{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:7px}
  .kmod .kh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .kmod .kt{font-weight:640;font-size:13px}
  .kmod .kc{font:11px/1.6 var(--mono);color:var(--accent);background:var(--accent-soft);
    border-radius:5px;padding:1px 6px}
  .kmod .kcn{font:11px/1.6 var(--mono);color:var(--muted)}
  .kmod .kn{font-size:11.5px;color:var(--muted);margin-top:3px}
  /* 二级拆解：竖线缩进，一眼看出是「这一环里的几件事」 */
  .parts{margin:7px 0 0 6px;padding-left:10px;border-left:2px solid var(--line-2);display:grid;gap:4px}
  .parts .pt{font-size:11.5px;line-height:1.6}
  .parts .pt i{font-style:normal;font-weight:600;color:var(--ink);margin-right:6px}
  .parts .pt span{color:var(--muted)}
  /* 关系网：共用块、网位置的小chip、二分图容器 */
  .netwrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;
    margin:10px 0 4px;overflow-x:auto}
  .netwrap svg{display:block}
  .nrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:3px 0}
  .nrow b{font-size:11px;color:var(--muted);font-weight:500;min-width:64px}
  .nchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;
    padding:2px 9px 2px 10px;font-size:12px;cursor:pointer;background:var(--bg)}
  .nchip:hover{border-color:var(--accent);color:var(--accent)}
  .nchip i{font-style:normal;font:10px/1.5 var(--mono);color:var(--muted)}
  .nrel{display:flex;gap:8px;align-items:baseline;padding:4px 0;font-size:12px;
    border-bottom:1px solid var(--line-2);cursor:pointer}
  .nrel:hover .nn{color:var(--accent)}
  .nrel .nn{font-weight:600;min-width:112px}
  .nrel .nr{font:10px/1.7 var(--mono);color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 5px}
  .nrel .nd{flex:1;color:var(--muted);font-size:11.5px;line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .item .sh{font:10px/1.6 var(--mono);color:var(--accent);background:var(--accent-soft);
    border-radius:4px;padding:1px 5px;white-space:nowrap}
  .who{display:flex;gap:8px;padding:4px 0;font-size:12px;border-bottom:1px solid var(--line-2);cursor:pointer}
  .who:hover .wn{color:var(--accent)}
  .who .wn{font-weight:600;min-width:110px}
  .who .wm{font:11px/1.7 var(--mono);color:var(--muted);min-width:88px}
  .who .wd{flex:1;color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .warnbox{background:var(--warn-soft);border:1px solid transparent;color:var(--warn);
    border-radius:8px;padding:8px 11px;font-size:12.5px;margin:10px 0}
  .okbox{background:var(--accent-soft);border-radius:8px;padding:8px 11px;font-size:12.5px;
    color:var(--accent);margin:10px 0}
  footer{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
    padding:9px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 -6px 20px -14px rgba(16,24,40,.4)}
  footer .sum{font-size:12.5px;color:var(--muted)}
  footer .sum b{color:var(--ink)}
  code.cmd{flex:1;font:11.5px/1.5 var(--mono);background:var(--bg);border:1px solid var(--line);
    border-radius:7px;padding:6px 9px;max-height:54px;overflow:auto;white-space:pre-wrap;
    word-break:break-all}
  button.primary{background:var(--accent);border:1px solid var(--accent);color:#fff;border-radius:8px;
    padding:6px 14px;font:inherit;cursor:pointer}
  button.primary:hover{filter:brightness(1.08)}
  button.ghost{background:var(--panel);border:1px solid var(--line);color:var(--ink);
    border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
  button.ghost:hover{border-color:var(--accent);color:var(--accent)}
  @media (max-width:820px){
    header{gap:8px;padding:10px 12px}
    #q{order:9;flex:1 1 100%;max-width:none;min-width:0}
    .tagbar,.catbar{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding:7px 12px}
    .tagbar::-webkit-scrollbar,.catbar::-webkit-scrollbar{height:4px}
    .tagbar::-webkit-scrollbar-thumb,.catbar::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
    .tchip,.cchip{flex:0 0 auto}
    .catbar .lb{display:none}
    main{flex-direction:column}
    .list{width:auto;max-height:44%;border-right:0;border-bottom:1px solid var(--line)}
    .detail{padding:14px 14px 96px}
    footer{gap:8px}
    footer .sum{display:none}
  }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="mark"></span>墨山插件仓库<small>点开 → 勾模块 → 装上</small></div>
  <a class="jump" href="canvas.html" title="还不知道要装什么？去画布摆格子">→ 搭建画布</a>
  <div class="tabs">
    <button data-tab="plugins">插件<span class="cnt"></span></button>
    <button data-tab="catalog" class="on">软件目录<span class="cnt"></span></button>
    <button data-tab="net">关系网<span class="cnt"></span></button>
  </div>
  <input id="q" placeholder="搜插件、软件、能力…（中文也行）">
  <div class="stats" id="stats"></div>
</header>
<div class="catbar" id="catbar" hidden></div>
<div class="tagbar" id="tagbar" hidden></div>
<main>
  <section class="list" id="list"></section>
  <aside class="detail" id="detail"><div class="empty">左边选一个。</div></aside>
</main>
<footer>
  <div class="sum" id="fsum">未选择</div>
  <code class="cmd" id="fcmd">—</code>
  <button class="ghost" id="copy">复制命令</button>
  <button class="primary" id="export">导出清单</button>
</footer>

放权重预览版，1M 上下文，Apache 2.0。国内厂商里少见的「纯 Apache 2.0 + 长上下文」组合——许可上没有任何需要法务确认的地方。预览版意味着接口和权重都可能再变，适合先摸清它的能力边界，不适合直接压生产。","modules":[{"id":"weights","label":"开放权重","capability":"ai.model","default":false,"artifact":{"kind":"none","note":"权重在官方渠道，本目录不代下"},"note":"权重在模型页放出，规格以官方模型卡为准；预览版建议先小规模试跑，注意版本漂移。Apache 2.0，可改可商用可再分发。"},{"id":"api","label":"托管 API","capability":"ai.inference","default":false,"artifact":{"kind":"none","note":"按 token 计费，无需下载"},"note":"腾讯云混元提供同源 API，国内延迟与合规都占优"}],"tags":["ai","model"]},{"id":"knowledge-base","name":"知识库","kind":"existing","category":"component","license":"概念卡 · 无代码","tier":"official","tags":["ai","search","data"],"notes":"几乎每个 AI 客户端里都有一张「知识库」卡，但底下根本不是一回事：有的是向量 RAG（切块→嵌入→相似度召回），有的只是全文关键词，有的干脆不建索引、把文件整篇塞进上下文。这张卡把「知识库」从各家界面里提出来单独登记——先分清是哪一种形态，再把内部环节逐段拆开，每一环都能单独换实现。看到某个 App 写「支持知识库」，对着这张卡就能问清三件事：走的是哪种形态、缺哪几个环节、那几环能不能换。","modules":[{"id":"parse","label":"解析入库","capability":"kb.ingest","group":"① 入库","default":false,"artifact":{"kind":"none","note":"概念卡，没有制品；具体实现在下面各环节里"},"note":"把 PDF / 网页 / Office 变成干净文本。这一环决定后面所有环节的天花板——解析歪了，嵌入再准也救不回来。","parts":[{"label":"PDF 解析","note":"docling（版面、表格、阅读顺序都保得住，MIT）；markitdown（只取文字，最轻）；unstructured（格式最全，依赖重）"},{"label":"扫描件","note":"先 tesseract / PaddleOCR 出文字再入库；纯图 PDF 不做 OCR 等于没入库，还会被当成「检索不到」"},{"label":"网页正文","note":"trafilatura 提正文；直接把整页 HTML 塞进去，导航栏和 cookie 提示会污染召回"},{"label":"表格与公式","note":"表格转 Markdown 表比纯文本好；公式留给 LaTeX，别指望 OCR 认对"}]},{"id":"chunk","label":"切块","capability":"kb.chunk","group":"① 入库","default":false,"artifact":{"kind":"none","note":"概念卡，没有制品；具体实现在下面各环节里"},"note":"切多大、切在哪，直接决定召回精度。切太大一段里混三个主题，切太小一句话缺主语。","parts":[{"label":"尺寸","note":"512 字 + 15% 重叠是稳妥起点；中文按字算，别照抄英文的 1000 token"},{"label":"按结构切","note":"优先按标题层级 / 段落切，再对超长段做二次切分——比定长硬切好一档"},{"label":"语义切块","note":"chonkie 之类的语义切块收益不稳定，先固定窗口跑通再考虑"},{"label":"带上下文","note":"每块前面拼上「文件名 · 章节标题」，小块才不会丢出处"}]},{"id":"rag","label":"向量 RAG","capability":"kb.rag","group":"② 检索形态（择一或叠加）","default":false,"artifact":{"kind":"none","note":"概念卡，没有制品；具体实现在下面各环节里"},"note":"最主流的形态：切块 → 嵌入成向量 → 按余弦相似度召回 top-k。好处是不要求字面命中，换种说法也能搜到；短板是型号、编号这类精确词经常搜不准。","parts":[{"label":"向量库","note":"sqlite-vec（单文件零服务，几万条够用）；Chroma（原型期最省事）；LanceDB（列存、可多模态）；pgvector（已有 Postgres 直接上）"},{"label":"召回数","note":"top-k 取 4~8；k 大了噪音压过信号，k 小了漏答"},{"label":"换模型","note":"换嵌入模型必须整库重算；维度不同不能混存——这是「用半年后想升级」时最大的坑"},{"label":"纯向量不够","note":"只做向量、不做关键词的库，搜「ERR_2041」这种串基本是废的"}]},{"id":"fulltext","label":"关键词检索","capability":"kb.fulltext","group":"② 检索形态（择一或叠加）","default":false,"artifact":{"kind":"none","note":"概念卡，没有制品；具体实现在下面各环节里"},"note":"倒排索引 + BM25，不嵌入、不花 token。精确词它比向量准得多；代价是同义词和转述搜不到。","parts":[{"label":"引擎","note":"SQLite FTS5（零部署，配 jieba/ICU 分词）；Meilisearch（开箱即用、中文友好）；Tantivy（Rust，嵌进程序里）"},{"label":"混合","note":"向量与 BM25 各取 20 条，用 RRF 融合——比调单一形态的分数稳得多"},{"label":"够用的场景","note":"库只有几千条、查询多是专有名词时，单靠这一层就能交付，不必上嵌入"}]},{"id":"graph","label":"图谱检索","capability":"kb.graph","group":"② 检索形态（择一或叠加）","default":false,"artifact":{"kind":"none","note":"概念卡，没有制品；具体实现在下面各环节里"},"note":"先把文档抽成「实体—关系」图，再沿边走多跳取子图。回答「A 和 B 什么关系」比向量强；代价是抽取成本高，错抽一条边会一路传下去。","parts":[{"label":"抽取","note":"让 LLM 按固定 schema 抽三元组，或直接用 GraphRAG 的社区摘要；schema 越松，抽出来的图越乱"},{"label":"存储","note":"Kùzu（嵌入式单文件）；Neo4j（生态最全，要起服务）；几千节点用 SQLite 邻接表也够"},{"label":"何时值得","note":"文档间关系密集（合同、论文、案情）才值得；零散笔记上图谱基本是负收益"}]},{"id":"direct","label":"直读文件","capability":"kb.file","group":"② 检索形态（择一或叠加）","default":false,"artifact":{"kind":"none","note":"概念卡，没有制品；具体实现在下面各环节里"},"note":"不建索引，提问时把整篇（或目录摘要）塞进上下文。实现成本最低，对「只问几份文档」反而效果最好——没有切块丢上下文的问题。","parts":[{"label":"适用","note":"文档总量塞得进上下文窗口；长上下文模型已经很常见，几十份文档完全可行"},{"label":"做法","note":"把文件名和路径列进提示，让模型自己决定读哪份——Claude Code 读代码库就是这么干的"},{"label":"代价","note":"每次提问都全量付 token，问十次付十次；库要频繁变就别用这招"}]},{"id":"agentic","label":"检索代理","capability":"kb.agentic","group":"② 检索形态（择一或叠加）","default":false,"artifact":{"kind":"none","note":"概念卡，没有制品；具体实现在下面各环节里"},"note":"把「搜」和「读」做成工具交给 Agent，让它自己改写查询、多轮翻找。比一次性召回准，代价是慢、贵、结果不可预测。","parts":[{"label":"做法","note":"暴露 search / grep / read 三个工具，循环交给模型；查询改写别写死规则"},{"label":"代表","note":"Cursor 的 @codebase、Claude Code 的文件式检索、deep research 类产品"},{"label":"取舍","note":"问题开放（「这个项目怎么鉴权」）用它；问题明确（「3.2 节写了什么」）直接向量召回更快更便宜"}]},{"id":"inject","label":"重排与注入","capability":"kb.inject","group":"③ 出库","default":false,"artifact":{"kind":"none","note":"概念卡，没有制品；具体实现在下面各环节里"},"note":"召回只是候选，进上下文前还要排序、去重、编号。这一步偷懒，模型会答得「像看过但记不清」。","parts":[{"label":"重排","note":"bge-reranker-v2-m3（本地、便宜）；Cohere Rerank（云、稳）；不做重排就按 RRF 分数排"},{"label":"注入格式","note":"每段前带文件名 + 编号 [1]，回答才引得出处；段与段空行隔开，别糊成一坨"},{"label":"位置","note":"最相关的片段放头尾——长上下文中间的内容最容易被忽略"},{"label":"压缩","note":"片段太长用 LLMLingua 压，或只留命中句前后 200 字"}]},{"id":"manage","label":"多库隔离与增量","capability":"kb.manage","group":"③ 出库","default":false,"artifact":{"kind":"none","note":"概念卡，没有制品；具体实现在下面各环节里"},"note":"多数 App 在这一环偷懒：加文件容易，改文件、删文件、多库隔离经常出错。判断一个知识库能不能长期用，看这里比看检索效果准。","parts":[{"label":"隔离","note":"一库一个 collection / 表前缀；全塞一个索引再靠元数据过滤，迟早串库"},{"label":"增量","note":"按文件 hash 或 mtime 判断要不要重算嵌入；全量重建几千页要几十分钟"},{"label":"删除同步","note":"源文件删了，切块和向量必须一起删；孤儿向量被召回后，模型会引用不存在的内容"},{"label":"可观测","note":"至少能列出「库里有什么、哪块来自哪个文件」；出问题才查得动"}]}]},{"id":"docling","name":"Docling","repo":"docling-project/docling","kind":"existing","category":"app","homepage":"https://docling-project.github.io/docling/","license":"MIT","tier":"official","notes":"知识库「① 入库」环节目前还原度最好的开源方案：PDF 的版面、表格、阅读顺序都保得住，输出结构化 JSON / Markdown，直接喂切块。IBM 开源，MIT。代价是首次运行要下模型、比 markitdown 慢，大批量转文档要排时间。","modules":[{"id":"parse","label":"文档解析","capability":"kb.ingest","default":false,"artifact":{"kind":"none","note":"pip 包 + 模型权重，只登记不预装"},"note":"PDF / DOCX / PPTX / 图片；表格转 Markdown 表；可选 OCR 与 VLM 后端","parts":[{"label":"版面还原","note":"双栏论文按阅读顺序输出，不会左右栏串行"},{"label":"表格","note":"识别表头与合并单元格，转 Markdown 表；复杂表仍会错，需抽查"},{"label":"OCR","note":"默认不跑 OCR；扫描件要显式开，或先过 PaddleOCR"}]},{"id":"chunk","label":"结构化切块","capability":"kb.chunk","default":false,"artifact":{"kind":"none","note":"同一包内的 HybridChunker"},"note":"HybridChunker 按标题层级切，并给每块补上章节路径——比定长切块少丢上下文","parts":[{"label":"章节路径","note":"每块自带「文档 > 第 2 章 > 2.3 节」，召回后能直接标出处"},{"label":"与嵌入配合","note":"直接吃 tokenizer 的 token 上限，避免切完再截断"}]}],"tags":["ai","office","data"]},{"id":"chroma","name":"Chroma","repo":"chroma-core/chroma","kind":"existing","category":"app","homepage":"https://www.trychroma.com","license":"Apache-2.0","tier":"community","notes":"知识库「② 向量 RAG」环节里最省事的一个：装完跑几行代码就能建集合、加文档、查相似，默认嵌入式（落本地目录），也能起服务端共享。原型期首选。注意它只是检索基础设施——不负责解析、切块、重排，「装了 Chroma」不等于「有了知识库」。","modules":[{"id":"vector-store","label":"向量集合","capability":"kb.rag","default":false,"artifact":{"kind":"none","note":"pip / npm 包，只登记不预装"},"note":"嵌入式或 client-server 两种起法；自带轻量嵌入函数，也可接外部 embedding","parts":[{"label":"距离","note":"默认 L2，文本检索一般改 cosine 更稳"},{"label":"持久化","note":"嵌入式默认写本地目录；不指定就是内存态，重启即丢"},{"label":"规模","note":"十万级以内舒服；再大换 LanceDB / pgvector / Qdrant"}]},{"id":"filter","label":"元数据过滤","capability":"kb.manage","default":false,"artifact":{"kind":"none","note":"同一制品内的能力"},"note":"where 条件按元数据过滤；多库隔离靠元数据字段比建多个集合更省","parts":[{"label":"用法","note":"metadata 里存 source / 库名 / 时间，查询时 where 限定"},{"label":"坑","note":"过滤 + 向量是后过滤，选择性差时召回会不足额"}]}],"tags":["ai","data","selfhost"]},{"id":"sqlite-vec","name":"sqlite-vec","repo":"asg017/sqlite-vec","kind":"existing","category":"app","homepage":"https://github.com/asg017/sqlite-vec","license":"Apache-2.0","tier":"community","notes":"把向量检索塞进一个 SQLite 扩展：无服务、无守护进程、一个 .db 文件带走。个人知识库几千到几十万条，它往往比 Chroma 更合适——因为笔记本来就该待在一个文件里，备份就是拷文件。还在 0.x，API 会变，别在关键路径上赌它。","modules":[{"id":"vec-index","label":"向量索引","capability":"kb.rag","default":false,"artifact":{"kind":"none","note":"SQLite 扩展 / 语言绑定，只登记"},"note":"vec0 虚拟表；支持 int8 / bit 量化，内存吃紧时用得上","parts":[{"label":"部署","note":"Python / Node / Rust 绑定都有；只是扩展，不改变 SQLite 原有用法"},{"label":"检索","note":"MATCH + k 取近邻；可与普通 SQL 条件写在同一条语句里"},{"label":"量化","note":"int8 能把体积压到 1/4，召回略降；bit 更狠，适合粗筛"}]}],"tags":["ai","data","native"]},{"id":"lancedb","name":"LanceDB","repo":"lancedb/lancedb","kind":"existing","category":"app","homepage":"https://lancedb.com","license":"Apache-2.0","tier":"community","notes":"嵌入式向量库，底层是 Lance 列存：不起服务、直接读写磁盘目录，顺带能存原始图片和文本做多模态检索。比 Chroma 重一点、比 pgvector 轻很多。十万条以上、要按条件过滤又要版本化时值得换它。","modules":[{"id":"vector-store","label":"向量表","capability":"kb.rag","default":false,"artifact":{"kind":"none","note":"pip / npm 包，只登记"},"note":"按表建向量索引，支持 IVF-PQ 量化；带版本，能回滚到旧快照","parts":[{"label":"格式","note":"Lance 列存，向量与原始数据同表，不用另找地方放图"},{"label":"索引","note":"暴力扫 / IVF-PQ，按数据量选；小库不需要建索引"},{"label":"版本","note":"每次写入产生新版本，删错能回滚——比多数向量库实在"}]}],"tags":["ai","data","native"],"built_on":["rust"]},{"id":"display-4k","name":"4K 显示器","kind":"existing","category":"hardware","license":"商品（自购）","tier":"official","tags":["ui","desktop"],"notes":"中台、编辑器、终端、服务面板要同时摆在眼前。27 英寸 4K 在 150% 缩放下等效 2560×1440 的工作区，能并排放三栏而不必来回切窗口——收在这里是因为「一眼能看几栏」直接决定这套体系好不好用，界面做得再紧凑，屏只有 1080p 也一样要滚动。挑的时候看三件事：USB-C 一线通（视频+数据+65W 以上供电，省一个坞站）、DP 1.4 或 HDMI 2.0 以上（要 4K60 而不是 4K30）、信号源记忆（接了 KVM 之后，切走再切回来要能自己认回来）。坑：低价 4K 只给 HDMI 1.4，跑 4K30，鼠标拖影一眼就能看出来；标称 10bit 的多半是 8bit+FRC。","modules":[{"id":"panel","label":"面板与信号","capability":"hw.display","default":false,"artifact":{"kind":"none","note":"硬件不进制品的下载集"},"note":"27\" 4K（163ppi）是文字清晰度的甜点，32\" 4K 字更大更松但更占桌面。IPS/VA 都行，不必为曲面和 HDR 加价——这套界面里没有 HDR 内容。"}]},{"id":"eink-panel","name":"墨水屏显示器","kind":"existing","category":"hardware","license":"商品（自购）","tier":"official","tags":["ops","ui"],"notes":"服务状态、日志尾巴、待办、Token 用量这些页面是「常驻」的，不需要发光：墨水屏只在刷新时耗电，静态画面零功耗、零蓝光，24 小时挂着也不刺眼。收在这里是因为它能把中台的一块面板变成墙上的一块屏，而不是再占一个浏览器窗口。挑的时候：13.3\"（便携，HDMI + USB 供电直连）还是 25.3\"（当桌面副屏）；刷新模式要分「高清」和「快刷」两档，快刷能滚动但字发虚；接口基本只有 HDMI，带 DP 的少。坑：残影是物理特性，做不了视频和动画；寿命按刷新次数算，别让它整屏轮播——固定区域每秒刷一次时间，等于在磨面板。","modules":[{"id":"panel","label":"常显面板","capability":"hw.eink","default":false,"artifact":{"kind":"none","note":"硬件不进制品的下载集"},"note":"它替代的是「一块永远开着的副屏」，不是主显示器：分辨率普遍只有 2K 级、响应以百毫秒计，看代码和拖窗口都不该指望它。"}]},{"id":"rk3588","name":"RK3588 板","kind":"existing","category":"hardware","license":"商品（自购）","tier":"official","tags":["selfhost","ops","native"],"notes":"8 核（4×Cortex-A76 + 4×Cortex-A55）加 6 TOPS NPU，整板功耗 5–15W：比同价位的 x86 小主机省一个数量级，比树莓派强一档，正好是「24 小时常驻、跑几个容器、偶尔推个小模型」的形状。收在这里是因为这套体系的底座就是低功耗常驻节点——qbittorrent、Jellyfin、新闻摘录这类服务并不需要 x86。挑的时候：内存版本（8G 起步，16G 才够跑 4B 级模型）、有没有 M.2 或 SATA（系统盘别用 eMMC）、双 2.5G 网口、Armbian/Ubuntu 的支持成熟度。坑：ARM64 镜像生态——不少容器没发 arm64 tag，得自己 build；NPU 要走 RKNN 工具链转换，不是装个 torch 就能用；必须主动散热，裸板跑编译十分钟就降频。","modules":[{"id":"soc","label":"整板算力","capability":"hw.node","default":false,"artifact":{"kind":"none","note":"硬件不进制品的下载集"},"note":"小主机的取舍在「够不够跑常驻」而不是「跑分多少」：8G 版能同时跑下载器和媒体库，16G 版才谈得上本地模型。"},{"id":"npu","label":"板上推理","capability":"hw.npu","default":false,"artifact":{"kind":"none","note":"硬件不进制品的下载集"},"note":"6 TOPS 只够 2B–4B 级量化模型，且必须转成 RKNN 格式；适合打标、分类这种「一直要跑、又不值得占 GPU」的活。"}]},{"id":"kvm-switch","name":"KVM 切换器","kind":"existing","category":"hardware","license":"商品（自购）","tier":"official","tags":["desktop","ops"],"notes":"一套键鼠加一块屏，在 mac、Linux 节点、盒子的控制台之间切：省桌面，也省一套外设的钱。收在这里是因为这套体系天然是多机的——开发机写代码、节点跑服务、盒子做媒体，来回插拔 HDMI 是最原始也最烦的一步。挑的时候：HDMI 2.0 以上（4K60）、USB 直通（键鼠和移动硬盘一起过）、EDID 模拟（切走后主机仍以为显示器还在，否则分辨率掉到 1080p、窗口全乱）、支持热键切换。坑：切换后系统重新识别显示器要 3–5 秒，窗口会重排；不做 EDID 模拟的型号，切回来分辨率必掉；USB 3.0 高速设备和 4K60 抢带宽，线一长就闪屏。","modules":[{"id":"switch","label":"切换与 EDID","capability":"hw.switch","default":false,"artifact":{"kind":"none","note":"硬件不进制品的下载集"},"note":"双机够用就买双口，四口多出的成本通常花在你不会接的机器上；EDID 模拟这一项有没有，比口数重要得多。"}]},{"id":"disk-jbod","name":"硬盘柜（DAS）","kind":"existing","category":"hardware","license":"商品（自购）","tier":"official","tags":["selfhost","data","ops"],"notes":"媒体库、备份、镜像仓库都要大盘，而小主机的系统盘通常只有几 GB——CasaOS 盒子的 eMMC 6.6G 就是活例子，数据必须落在独立盘柜上。收在这里是因为这套体系里「装得下」比「跑得快」更常成为瓶颈。挑的时候：单盘直通（每块盘独立可见，坏一块不拖全柜）还是硬件 RAID（一体但换控制器可能读不出）；USB 3.2 且支持 UASP、独立供电（别靠总线供电）、有休眠策略。坑：硬件 RAID 的元数据绑控制器，柜子坏了盘也读不出；供电不足会随机掉盘，长任务跑到一半最致命；盘上别用 exFAT 放 git 仓库，会冒出 non-monotonic index 这类怪问题。","modules":[{"id":"bay","label":"盘位与阵列","capability":"hw.storage","default":false,"artifact":{"kind":"none","note":"硬件不进制品的下载集"},"note":"两块盘做镜像就够大多数人用；要扩的时候「能单独拔出来读」比「阵列重组省空间」值钱。系统盘与数据盘物理分开，重装才不会连数据一起抹。"}]},{"id":"ragflow","name":"RAGFlow","repo":"infiniflow/ragflow","kind":"existing","category":"app","homepage":"https://ragflow.io","license":"Apache-2.0","tier":"community","tags":["ai","data","selfhost"],"notes":"知识库的「重工业版」：力气花在解析层（DeepDoc 做版面、表格、OCR），检索层给向量与关键词的混合召回，还带切片可视化——能亲眼看见一段 PDF 被切成了什么样，这比任何参数都醒目。代价是 2C 内存起步，装它等于上一个完整的 RAG 服务，不是桌面插件。要啃成百上千页 PDF 时，它比客户端内置的知识库实在得多。","modules":[{"id":"parse","label":"深度文档解析","capability":"kb.ingest","group":"① 入库","default":false,"artifact":{"kind":"none","note":"服务/桌面程序，只登记不下载"},"note":"二十来种格式，重点在 PDF：版面还原、表格转结构、扫描件 OCR 都在这一层，解析结果能看到每个切片的原文位置。","parts":[{"label":"DeepDoc","note":"版面分析 + 表格识别 + OCR 一体，PDF 双栏不乱序"},{"label":"切片预览","note":"每块能回溯到 PDF 上的原文框，切歪了一眼看得出来"},{"label":"代价","note":"解析很吃内存，几十页 PDF 跑几分钟是常态"}]},{"id":"vector","label":"向量召回","capability":"kb.rag","group":"② 检索形态（择一或叠加）","default":false,"artifact":{"kind":"none","note":"服务/桌面程序，只登记不下载"},"note":"文档切片嵌入后按语义召回；默认不重排，可在问答里勾选 rerank。","parts":[{"label":"嵌入","note":"可接外部 embedding 或本地模型；换模型要重建索引"},{"label":"开关","note":"召回有相似度阈值，调低了会把不相关段落一起送进上下文"}]},{"id":"keyword","label":"关键词召回","capability":"kb.fulltext","group":"② 检索形态（择一或叠加）","default":false,"artifact":{"kind":"none","note":"服务/桌面程序，只登记不下载"},"note":"同一批切片再建倒排，与向量结果一起融合——这就是它比「纯向量」稳的原因：型号和编号能搜到。","parts":[{"label":"融合","note":"两路各取若干条后按分数合并，权重可调"},{"label":"适用","note":"合同编号、法规条号、设备型号这类精确串"}]},{"id":"rerank","label":"重排","capability":"kb.inject","group":"③ 出库","default":false,"artifact":{"kind":"none","note":"服务/桌面程序，只登记不下载"},"note":"召回候选再按查询重排，把真正对的那段顶到前面。","parts":[{"label":"模型","note":"可挂 bge-reranker 类本地模型；不挂就按融合分排"}]},{"id":"manage","label":"知识库与租户","capability":"kb.manage","group":"③ 出库","default":false,"artifact":{"kind":"none","note":"服务/桌面程序，只登记不下载"},"note":"按知识库分空间，可配团队与权限；文档增删要走解析重跑，不是改一行记录。","parts":[{"label":"隔离","note":"一库一空间，跨库查询要显式指定"},{"label":"增量","note":"重新解析整份文档而非单块；改一页也要重跑该文件"},{"label":"可观测","note":"切片列表能直接看、能改——这点比多数产品实在"}]}]},{"id":"anythingllm","name":"AnythingLLM","repo":"Mintplex-Labs/anything-llm","kind":"existing","category":"app","homepage":"https://anythingllm.com","license":"MIT","tier":"community","tags":["ai","desktop","selfhost"],"notes":"桌面一键装好的「知识库全家桶」：文档拖进去就能问，工作区（workspace）之间互相隔离，向量库可换（内置 LanceDB，也能接 pgvector / Chroma / Qdrant）。它的价值不在算法新，而在把「嵌入—存储—检索—对话」这四段都接通了、还能换件。想验证一种知识库形态好不好用，拿它当对照组最省事。","modules":[{"id":"workspace","label":"工作区隔离","capability":"kb.manage","group":"① 库与隔离","default":false,"artifact":{"kind":"none","note":"服务/桌面程序，只登记不下载"},"note":"一个工作区 = 一个知识库：各自的文档、向量、系统提示互不串味，同一个客户端里可以有多套。","parts":[{"label":"隔离粒度","note":"按工作区隔离文档与向量；跨工作区不能混合检索"},{"label":"权限","note":"单机版只有本机用户；多人要上服务端模式"}]},{"id":"rag","label":"文档问答","capability":"kb.rag","group":"② 检索形态","default":false,"artifact":{"kind":"none","note":"服务/桌面程序，只登记不下载"},"note":"拖文档进去自动解析、切块、嵌入，提问时召回相关片段拼进上下文。","parts":[{"label":"向量库","note":"内置 LanceDB；可换 pgvector / Chroma / Qdrant——换库要重建"},{"label":"解析","note":"内置解析器够用；复杂 PDF 不如 Docling / RAGFlow"},{"label":"引用","note":"回答带来源片段，能点开看原文"}]},{"id":"agent","label":"Agent 与 MCP","capability":"ai.agent","group":"③ 工具位","default":false,"artifact":{"kind":"none","note":"服务/桌面程序，只登记不下载"},"note":"除了问答还能跑 Agent：接 MCP server、调工具、定时任务。","parts":[{"label":"MCP","note":"支持接 MCP server，等于把外部工具挂进知识库对话"},{"label":"取舍","note":"Agent 模式比纯 RAG 慢，问题明确时别开"}]}],"built_on":["nodejs","electron"],"speaks":["mcp"]}],"tags":[{"id":"ui","label":"界面","group":"领域","desc":"用户能看见、能点的那一层：布局、组件、交互"},{"id":"frontend","label":"前端","group":"领域","desc":"浏览器里跑的代码：DOM、状态、构建产物"},{"id":"backend","label":"后端","group":"领域","desc":"常驻服务：接口、任务队列、业务逻辑"},{"id":"dev","label":"开发","group":"领域","desc":"写代码时用的东西：编译、包管理、编辑器接入"},{"id":"network","label":"网络","group":"领域","desc":"出网、代理、协议转发、抓取外站"},{"id":"download","label":"下载","group":"领域","desc":"把远端的东西拿到本地：RSS、媒体、种子、镜像"},{"id":"media","label":"媒体","group":"领域","desc":"音视频与图片：播放、转码、刮削、图库"},{"id":"data","label":"数据","group":"领域","desc":"存与算：关系库、KV、对象存储、笔记正文"},{"id":"search","label":"检索","group":"领域","desc":"全文索引与查询，区别于「存」"},{"id":"ai","label":"AI","group":"领域","desc":"模型、Agent、推理链、算价"},{"id":"model","label":"模型","group":"领域","desc":"开放权重的大模型本体，与「跑它的运行时」区分开"},{"id":"security","label":"安全","group":"领域","desc":"凭证、加密、鉴权、隐私边界"},{"id":"ops","label":"运维","group":"领域","desc":"部署、监控、统计、日志这类跑了之后才需要的事"},{"id":"geo","label":"地理","group":"领域","desc":"地图、位置、地理数据"},{"id":"office","label":"办公","group":"领域","desc":"文档、表格、演示这类办公件"},{"id":"desktop","label":"桌面","group":"技术栈","desc":"装成独立应用跑在系统里，而不是开个网页"},{"id":"web","label":"Web","group":"技术栈","desc":"以浏览器为界面，带 HTTP 端口"},{"id":"cli","label":"命令行","group":"技术栈","desc":"一条命令跑完，无界面"},{"id":"protocol","label":"协议","group":"技术栈","desc":"规范本身，不是实现——只登记链接"},{"id":"native","label":"原生","group":"技术栈","desc":"编译成二进制，运行时不带解释器"},{"id":"selfhost","label":"可自建","group":"技术栈","desc":"能在自己的机器上跑起来，不依赖厂商云"},{"id":"skill","label":"技能","group":"技术栈","desc":"以技能包 / 插件形式交付，而不是独立进程"}],"categories":[{"id":"component","label":"能力卡","hint":"很多软件里同名的那张卡，单独拆开登记"},{"id":"model","label":"基础模型","hint":"开放权重或托管 API 的大模型"},{"id":"mcp","label":"MCP","hint":"Model Context Protocol 的规范与服务"},{"id":"skill","label":"技能","hint":"能被 Agent 直接调用的技能包"},{"id":"agent-plugin","label":"Agent 插件","hint":"装进中台、带组件与连线的插件"},{"id":"app","label":"软件","hint":"能装的应用、服务与系统工具"},{"id":"framework","label":"基座与协议","hint":"运行时、语言、Agent 互联规范"},{"id":"hardware","label":"硬件","hint":"要插电、要花钱的那部分：只登记它解决哪一段"}]}</script>
<script>
const REG = JSON.parse(document.getElementById('registry').textContent);
const MFS = JSON.parse(document.getElementById('manifests').textContent);
const CAT = JSON.parse(document.getElementById('catalog').textContent);
const ENTRIES = Object.fromEntries(CAT.entries.map(e=>[e.id,e]));
// 标签词表：条目只存 id，展示名与分组都从词表取，改词表一处即可全站生效
const TV = Object.fromEntries((CAT.tags||[]).map(t=>[t.id,t]));
// 品类词表：第二套分类，条目上只存 id
const CV = Object.fromEntries((CAT.categories||[]).map(c=>[c.id,c]));
// 能力词表：模块 panel 里只写 id，中文名从这里取（kb.rag → 向量 RAG）
const CAV = Object.fromEntries((CAT.capabilities||[]).map(c=>[c.id,c]));
const capCN = id => (CAV[id]||{}).label || id;

/* ---------- 共用关系（网）----------
   三种「共用」各说一件事：
   · 底座 built_on —— 我做在它里面（Electron 里跑着好几个 App）
   · 接口 speaks   —— 我按它的标准跟外面讲话（MCP 被多个客户端说）
   · 同格           —— 我们都供给同一条能力（十个模型都在 ai.model 这一格，互为替代）
   前两种是显式声明的边，第三种从模块自动推出来。 */
const REFS = {};      // entryId(被共用) -> [{id, rel}]  谁指向我
for(const e of CAT.entries){
  for(const b of (e.built_on||[])) (REFS[b] = REFS[b] || []).push({id:e.id, rel:'built-on'});
  for(const b of (e.speaks||[]))   (REFS[b] = REFS[b] || []).push({id:e.id, rel:'speaks'});
}

const NET_BLOCKS = (() => {
  const blocks = [];
  // 显式关系：被指向的条目成为「底座 / 接口」块
  for(const [id, refs] of Object.entries(REFS)){
    const base = ENTRIES[id];
    if(!base) continue;
    const kind = refs.every(r=>r.rel==='speaks') ? 'speaks' : 'built-on';
    blocks.push({key:'e:'+id, id, kind,
      name: base.name || id,
      type: kind==='speaks' ? '接口' : '底座',
      hint: (base.notes||'').slice(0,110),
      users: refs.map(r=>({id:r.id, name:(ENTRIES[r.id]||{}).name||r.id, rel:r.rel, note:((ENTRIES[r.id]||{}).built_on||[]).length ? '' : ''})),
      count: refs.length});
  }
  // 自动关系：同一条能力有多个供给者 → 它们是同一格的候选，天然要并排看
  const prov = {};
  for(const e of CAT.entries) for(const m of e.modules) (prov[m.capability] = prov[m.capability] || new Set()).add(e.id);
  for(const [cap, set] of Object.entries(prov)){
    if(set.size < 2) continue;
    const c = CAV[cap] || {};
    blocks.push({key:'c:'+cap, id:cap, kind:'slot',
      name: c.label || cap,
      type: '同格',
      hint: c.desc || '',
      users: [...set].map(id=>({id, name:(ENTRIES[id]||{}).name||id, rel:'slot'})),
      count: set.size});
  }
  // 底座/接口优先于同格：一个是「同一个人撑起一圈」，一个是「一排同款」，
  // 前者才是网。同类里按被共用次数排，次数相同按名字短——扫得快。
  blocks.sort((a,b)=>{
    const ka = a.kind==='slot'?1:0, kb = b.kind==='slot'?1:0;
    return ka - kb || b.count - a.count || a.name.length - b.name.length;
  });
  return blocks;
})();
const NET_BY_KEY = Object.fromEntries(NET_BLOCKS.map(b=>[b.key,b]));
const REL_CN = {'built-on':'基于', speaks:'说', slot:'同格'};

let tab = 'catalog';   // 目录是主体，插件才 4 个，别让人以为这里只有插件
let q = '';
let activeTag = null;   // 当前筛选的标签 id；null=全部
let activeCat = null;   // 当前筛选的品类 id；null=全部（与标签 AND，互不替代）
let selId = null;
let sel = {};        // { [manifestId]: { [compId]: [moduleId,...] } }  显式勾选，空对象=用默认

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mb = n => n==null?'':(n>=1024?(n/1024).toFixed(1)+' GB':(Math.round(n*10)/10)+' MB');

/* ---------- 模块选择：显式即准，绝不偷偷补回 ---------- */
function modsOf(mf, compId){
  const entry = ENTRIES[compId];
  if(!entry) return [];
  const explicit = (sel[mf.id]||{})[compId];
  let chosen = explicit
    ? entry.modules.filter(m=>explicit.includes(m.id))
    : entry.modules.filter(m=>m.default!==false);
  // requires 闭包：依赖的能力若本组件内有模块供给，必须一并打开（与 CLI 同规则）
  const got = new Set(chosen.map(m=>m.capability));
  for(const m of [...chosen]){
    for(const cap of (m.requires||[])){
      if(got.has(cap)) continue;
      const p = entry.modules.find(x=>x.capability===cap);
      if(p){ chosen.push(p); got.add(cap); }
    }
  }
  return [...new Set(chosen)];
}

/* ---------- 下载集 ---------- */
function downloadsOf(mf){
  const items = [];
  const seen = new Set();
  for(const c of (mf.components||[])){
    const entry = ENTRIES[c.id];
    if(!entry) continue;
    const mods = modsOf(mf, c.id);
    let base=null;
    for(const m of mods){
      const a = m.artifact || {kind:'none'};
      if(a.kind==='image') base = {ref:a.ref, size:a.size_mb};
      else if(a.kind==='asset') items.push({c:c.id, kind:'asset', ref:(a.repo||'')+' '+(a.match||''), size:a.size_mb});
      else if(a.kind==='package') items.push({c:c.id, kind:'package', ref:(a.name||'')+(a.extra?'['+a.extra+']':''), size:a.size_mb});
      else if(a.kind==='build') items.push({c:c.id, kind:'build', ref:a.context, size:a.size_mb});
    }
    let ref=null, size=null;
    const vmod = mods.map(m=>m.artifact||{}).find(a=>a.variant);
    if(vmod && base){
      // 变体镜像替换基础镜像，只算一份体积（与 CLI 同规则）
      const parts = base.ref.split(':');
      const tag = parts.pop();
      ref = parts.join(':')+':'+tag+'-'+vmod.variant;
      size = vmod.size_mb || base.size;
    } else if(base){ ref=base.ref; size=base.size; }
    if(ref && !seen.has(ref)){ seen.add(ref); items.push({c:c.id, kind:'image', ref, size}); }
  }
  return items;
}

function imageOf(mf, compId){
  const entry = ENTRIES[compId];
  if(!entry || entry.kind!=='container') return null;
  const mods = modsOf(mf, compId);
  const base = entry.modules.map(m=>m.artifact||{}).find(a=>a.kind==='image');
  if(!base) return null;
  const v = mods.map(m=>m.artifact||{}).find(a=>a.variant);
  if(!v) return base.ref;
  const [repo,tag] = base.ref.split(/:(?=[^:]*$)/);
  return repo+':'+tag+'-'+v.variant;
}

function useString(mf){
  const parts=[];
  for(const c of (mf.components||[])){
    if(!ENTRIES[c.id]) continue;
    const mods = modsOf(mf, c.id).map(m=>m.id);
    if(mods.length) parts.push(c.id+':'+mods.join(','));
  }
  return parts.join(';');
}

/* ---------- 渲染 ---------- */
function match(hay, needle){
  hay = hay.toLowerCase(); needle = needle.toLowerCase();
  if(hay.includes(needle)) return true;
  // 逐字兜底只对中文生效：让「媒体」能命中「影视媒体库」。
  // 英文不能这么干——"tailscale" 的 t/a/s/e 几乎每行都有，一兜底就全量命中。
  if (!/[\u4e00-\u9fa5]/.test(needle)) return false;
  return [...needle].every(ch=>hay.includes(ch));
}

const KIND_CN = {container:'容器', process:'进程', binary:'二进制', existing:'只登记'};
const kindCN = k => KIND_CN[k] || k;
const licenseKind = e => /专有/.test(e.license||'') ? 'closed' : (/未声明/.test(e.license||'') ? 'unclear' : 'open');
const isClosed = e => licenseKind(e) !== 'open';
// 列表副行只放得下一小段许可名：取括号前的部分，超长截断
const licShort = e => {
  const t = (e.license||'').split(/[（(]/)[0].trim();
  return t.length > 20 ? t.slice(0, 19) + '…' : (t || '许可未写');
};

function tagChip(id){
  const t = TV[id];
  if(!t) return '<span class="tag">'+esc(id)+'</span>';
  return '<span class="tag" title="'+esc(t.desc||'')+'">'+esc(t.label)+'</span>';
}
function tagRow(it, inline){
  const ts = (it && it.tags) || [];
  if(!ts.length) return '';
  return '<div class="trow"'+(inline?' style="margin:-4px 0 10px"':'')+'>'+ts.map(tagChip).join('')+'</div>';
}
function tagText(it){
  return ((it&&it.tags)||[]).map(t=>(TV[t]||{}).label||t).join(' ');
}

// 品类栏：只在目录页出现。插件页所有插件都是 agent-plugin，摆一行只有一项的筛选没意义
function renderCatbar(){
  const bar = $('#catbar');
  if(tab!=='catalog' || !(CAT.categories||[]).length){ bar.hidden = true; return; }
  bar.hidden = false;
  const base = CAT.entries.filter(e=>!q || matchEntry(e, q));
  const cnt = {};
  for(const e of base) cnt[e.category] = (cnt[e.category]||0)+1;
  let h = '<button class="cchip'+(activeCat?'':' on')+'" data-cat="">全部品类<span class="n">'+base.length+'</span></button>';
  for(const c of CAT.categories){
    const n = cnt[c.id]||0;
    if(!n) continue;                   // 空品类不上栏（搜索时某类可能整段消失）
    h += '<button class="cchip'+(activeCat===c.id?' on':'')+'" data-cat="'+esc(c.id)+
         '" title="'+esc(c.hint||'')+'">'+esc(c.label)+'<span class="n">'+n+'</span></button>';
  }
  // 命中的总数旁边给一句解释，说清这套分类和标签不是一回事
  h += '<span class="lb" style="margin-left:4px">品类 · 一种东西只能是一类</span>';
  bar.innerHTML = h;
  bar.querySelectorAll('[data-cat]').forEach(el=>{
    el.onclick = () => { activeCat = el.dataset.cat || null; renderAll(); };
  });
}

function renderTagbar(){
  const bar = $('#tagbar');
  if(tab==='net'){ bar.hidden = true; return; }   // 网里没有标签这个维度，别摆一排点了没反应的筛子
  const items = tab==='plugins' ? REG.plugins : CAT.entries;
  // 两个页签共用一套词表与筛选状态：切过去看「协议」下有哪些插件，是同一件事
  if(!items.some(it=>(it.tags||[]).length)){ bar.hidden = true; return; }
  bar.hidden = false;
  const cnt = {};
  for(const e of items) for(const t of (e.tags||[])) cnt[t] = (cnt[t]||0)+1;
  let h = '<button class="tchip'+(activeTag?'':' on')+'" data-tag="">全部标签<span class="n">'+items.length+'</span></button>';
  let grp = null;
  for(const t of (CAT.tags||[])){
    const n = cnt[t.id]||0;
    if(!n) continue;                        // 空标签不上栏，免得点了白屏
    if(t.group!==grp){ h += '<span class="tchip grp">'+esc(t.group)+'</span>'; grp = t.group; }
    h += '<button class="tchip'+(activeTag===t.id?' on':'')+'" data-tag="'+esc(t.id)+
         '" title="'+esc(t.desc||'')+'">'+esc(t.label)+'<span class="n">'+n+'</span></button>';
  }
  bar.innerHTML = h;
  bar.querySelectorAll('[data-tag]').forEach(el=>{
    el.onclick = () => { activeTag = el.dataset.tag || null; renderAll(); };
  });
}

function renderStats(){
  const caps = CAT.capabilities.length;
  const mods = CAT.entries.reduce((n,e)=>n+e.modules.length,0);
  $('#stats').innerHTML =
    '<div class="stat">商店 <b>'+REG.plugins.length+'</b></div>' +
    '<div class="stat">条目 <b>'+CAT.entries.length+'</b></div>' +
    '<div class="stat">模块 <b>'+mods+'</b></div>' +
    '<div class="stat">能力 <b>'+caps+'</b></div>';
}

// 品类取值：插件存在 catalog_category（它的 category 是给自己看的中文短分类），目录条目直接用 category
const catOf = x => x.catalog_category || x.category || 'agent-plugin';

// 搜索要能命中文案深处：模块的中文能力名（搜「向量」找到所有 RAG 条目）、阶段名、二级拆解的每一行
const moduleText = m => [capCN(m.capability), m.capability, m.label||'', m.group||'',
  ((m.artifact||{}).note||''), m.note||'',
  (m.parts||[]).map(p=>p.label+' '+(p.note||'')).join(' ')].join(' ');

function matchEntry(e, needle){
  return match([e.id, e.name, (e.repo||''), e.kind, e.category||'', e.tier||'', (e.license||''), tagText(e),
    e.modules.map(moduleText).join(' '),
    (e.notes||''), ((CV[e.category]||{}).label||'')].join(' '), needle);
}

function renderList(){
  const list = $('#list');
  if(tab==='net'){
    const rows = NET_BLOCKS.filter(b=>!q ||
      match([b.name, b.id, b.hint||'', b.users.map(u=>u.name).join(' ')].join(' '), q));
    if(rows.length && !rows.some(b=>b.key===selId)) selId = rows[0].key;
    const KB = {speaks:'接口', 'built-on':'底座', slot:'同格'};
    list.innerHTML = rows.length ? rows.map(b=>
      '<div class="item '+(selId===b.key?'on':'')+'" data-key="'+esc(b.key)+'">'+
        '<div class="r1"><span class="nm">'+esc(b.name)+'</span><span class="sp"></span>'+
        '<span class="badge">'+esc(KB[b.kind])+'</span></div>'+
        '<div class="sum">'+b.count+' 个条目共用'+(b.kind==='slot'?' · 择一，不是叠加':'')+'</div>'+
        (b.hint?'<div class="kw">'+esc(b.hint)+'</div>':'')+
      '</div>').join('') : '<div class="empty">没有匹配的共用块。</div>';
    list.querySelectorAll('.item').forEach(el=>el.onclick=()=>{ selId=el.dataset.key; renderAll(); });
    return;
  }
  if(tab==='plugins'){
    const rows = REG.plugins
      .filter(p=>!activeTag || (p.tags||[]).includes(activeTag))
      .filter(p=>!activeCat || catOf(p)===activeCat)
      .filter(p=>!q || match([p.id,p.name,p.summary,(p.keywords||[]).join(' '),(p.aliases||[]).join(' '),p.category||'',tagText(p)].join(' '), q));
    // 筛掉当前选中项时，右栏不能还挂着列表里看不到的东西
    if(rows.length && !rows.some(p=>p.id===selId)) selId = rows[0].id;
    list.innerHTML = rows.length ? rows.map(p=>
      '<div class="item '+(selId===p.id?'on':'')+'" data-id="'+p.id+'">'+
        '<div class="r1"><span class="nm">'+esc(p.name)+'</span>'+
        '<span class="ver">'+esc(p.version)+'</span><span class="sp"></span>'+
        '<span class="badge '+esc(p.kind)+'">'+esc(p.kind)+'</span></div>'+
        '<div class="sum">'+esc(p.summary||'')+'</div>'+
        tagRow(p)+
        ((p.keywords||[]).length?'<div class="kw">'+esc(p.keywords.join(' · '))+'</div>':'')+
      '</div>').join('') : '<div class="empty">'+(activeTag||activeCat?'当前筛选下没有插件，点「全部」看看。':'没有匹配的插件。')+'</div>';
  } else {
    const rows = CAT.entries
      .filter(e=>!activeTag || (e.tags||[]).includes(activeTag))
      .filter(e=>!activeCat || e.category===activeCat)
      .filter(e=>!q || matchEntry(e, q));
    // 分段顺序决定「第一条」是谁：按品类顺序 + 段内能装优先排一遍，默认选中取它
    const ordered = [];
    for(const c of (CAT.categories||[]))
      ordered.push(...rows.filter(x=>x.category===c.id)
        .sort((a,b)=>(a.kind==='existing'?1:0)-(b.kind==='existing'?1:0)));
    if(ordered.length && !ordered.some(e=>e.id===selId)) selId = ordered[0].id;
    const itemHTML = e=>{
      const def = e.modules.filter(m=>m.default!==false).reduce((n,m)=>n+((m.artifact||{}).size_mb||0),0);
      const isRef = e.kind==='existing';
      const isCard = e.category==='component';
      const isHw = e.category==='hardware';   // 硬件：只登记型号与取舍，采购不在这里发生
      const shapes = e.modules.filter(m=>/形态/.test(m.group||'')).length;
      const shared = (REFS[e.id]||[]).length;   // 有几个条目挂在它身上（共用同一套底座/接口）
      const sum = isCard
        ? e.modules.length+' 段环节 · '+(shapes?shapes+' 种形态 · ':'')+'只登记'
        : (isHw ? esc(e.modules.map(m=>m.label||m.id).join(' · '))
        : (isRef?esc(licShort(e))+' · 只登记，不下载':e.modules.length+' 个模块已拆解 · 默认下载 '+mb(def)));
      return '<div class="item '+(selId===e.id?'on':'')+'" data-id="'+esc(e.id)+'">'+
        '<div class="r1"><span class="nm">'+esc(e.name)+'</span><span class="sp"></span>'+
        (shared>1?'<span class="sh">共用 '+shared+'</span>':'')+
        '<span class="badge">'+esc(isCard?'能力卡':(isHw?'硬件':kindCN(e.kind)))+'</span></div>'+
        '<div class="sum">'+sum+'</div>'+
        tagRow(e)+
        (isRef?'':'<div class="kw">'+esc(e.modules.map(m=>m.capability).join(' · '))+'</div>')+
        '</div>';
    };
    // 按品类分段：段内能装的排前面，「它是什么」比「怎么拿到」更需要先回答
    let out = '';
    for(const c of (CAT.categories||[])){
      const grp = rows.filter(x=>x.category===c.id)
        .sort((a,b)=>(a.kind==='existing'?1:0)-(b.kind==='existing'?1:0));
      if(!grp.length) continue;
      out += '<div class="sec"><b>'+esc(c.label)+'</b><span>'+grp.length+'</span>'+
             '<span class="ln"></span><span style="text-transform:none;letter-spacing:0">'+esc(c.hint||'')+'</span></div>';
      out += grp.map(itemHTML).join('');
    }
    list.innerHTML = rows.length ? out : '<div class="empty">'+(activeTag||activeCat?'当前筛选下没有软件，点「全部」看看。':'没有匹配的软件。')+'</div>';
  }
  list.querySelectorAll('.item').forEach(el=>el.onclick=()=>{ selId=el.dataset.id; renderAll(); });
}

  if(!mf) return '<h1>'+esc(p.name)+'</h1><div class="warnbox">索引里有这个插件，但本机找不到它的清单文件（manifest: '+esc(p.manifest||'—')+'）。</div>';
  const items = downloadsOf(mf);
  const total = items.reduce((n,i)=>n+(i.size||0),0);
  const selCount = Object.values(sel[mf.id]||{}).reduce((n,a)=>n+a.length,0);

  let html = '<h1>'+esc(mf.name)+' <span class="ver" style="font-size:12px">'+esc(mf.version)+'</span></h1>'+

  html += '<h2>组件与模块（勾掉的不下载）</h2>';

    if(!entry){
      html += '<div class="comp"><div class="hd"><span class="cid">'+esc(c.id)+'</span>'+

        '<div class="bd"><div class="note" style="padding:0">目录里没有拆解，协议只生成骨架与探活，逻辑要你自己写。</div></div></div>';
      continue;
    }
    const chosen = modsOf(mf, c.id);
    const ids = chosen.map(m=>m.id);
    html += '<div class="comp"><div class="hd"><span class="cid">'+esc(entry.name)+'</span>'+
      '<span class="badge">'+esc(entry.kind)+'</span>'+
      '<span class="img">'+esc(imageOf(mf,c.id)||(c.runtime||{}).entry||entry.id)+'</span></div><div class="bd">';
    for(const m of entry.modules){
      const on = ids.includes(m.id);
      const a = m.artifact||{kind:'none'};
      const tag = a.kind==='none' ? (a.variant?('换 '+a.variant+' 变体'):'无需下载') : (a.kind+' · '+mb(a.size_mb));
      html += '<label class="mod '+(on?'':'off')+'">'+
        '<input type="checkbox" data-comp="'+esc(c.id)+'" data-mod="'+esc(m.id)+'" '+(on?'checked':'')+'>'+
        '<span><span class="nm2">'+esc(m.label||m.id)+'</span> '+
        '<span class="cap">'+esc(m.capability)+'</span>'+
        (m.note?'<div class="note">'+esc(m.note)+'</div>':'')+'</span>'+
        '<span class="art">'+esc(tag)+'</span></label>';
    }
    html += '</div></div>';
  }

  html += '<h2>要下载什么</h2>';
  if(!items.length) html += '<div class="okbox">无需下载：全部是同一制品内的开关。</div>';
  else {
    html += '<div class="comp"><div class="bd">';
    for(const i of items){
      html += '<div style="display:flex;gap:8px;font:12px/1.9 var(--mono);padding:2px 0">'+
        '<span style="color:var(--muted);min-width:78px">'+esc(i.c)+'</span>'+
        '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(i.ref)+'</span>'+
        '<span style="color:var(--muted)">'+mb(i.size)+'</span></div>';

    (mf.wires||[]).map(w=>'<div style="font-size:12px;padding:3px 0">'+

    '</div></div>';
  return html;
}

// 「重排与注入」和词表里的「重排注入」是一回事，别在同一行写两遍
const sameWord = (a, b) => a === b || a.replace(/[与和]/g, '') === b.replace(/[与和]/g, '');

// 共用关系的二分图：中间一个块，右边竖排所有共用它的条目，连线连过去。
// 没做成力导向——这张网的用途是「看清谁跟谁共用」，不是看形状，竖排最不容易糊。
function netSvg(block){
  const us = block.users;
  const rowH = 34, padTop = 16, W = 660;
  const H = Math.max(150, padTop*2 + us.length*rowH);
  const cx = 132, cy = H/2, r0 = 40;          // 中心块
  const nx = 400, nr = 9;                      // 右侧节点
  const stroke = block.kind==='speaks' ? 'var(--accent)' : (block.kind==='slot' ? 'var(--line)' : 'var(--accent)');
  let g = '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" style="height:auto">';
  us.forEach((u,i)=>{
    const y = padTop + rowH*i + rowH/2;
    // 连线先画，压在节点下面
    g += '<path d="M '+(cx+r0)+' '+cy+' C '+(cx+r0+70)+' '+cy+', '+(nx-70)+' '+y+', '+(nx-nr)+' '+y+
         '" fill="none" stroke="'+stroke+'" stroke-width="1.1" opacity="0.45"/>';
  });
  g += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r0+'" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.2"/>';
  // 圆里放不下长名字：4 字一行、最多两行，超出用省略号（完整名在标题上）
  const cs = [...block.name];
  const nm = cs.length <= 4 ? [block.name] : [cs.slice(0,4).join(''), cs.slice(4,7).join('') + (cs.length>7?'…':'')];
  g += '<text x="'+cx+'" y="'+(cy - (nm.length-1)*7 + 4)+'" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">'+
       nm.map((t,i)=>'<tspan x="'+cx+'" dy="'+(i?14:0)+'">'+esc(t)+'</tspan>').join('')+'</text>';
  us.forEach((u,i)=>{
    const y = padTop + rowH*i + rowH/2;
    g += '<circle cx="'+nx+'" cy="'+y+'" r="'+nr+'" fill="var(--panel)" stroke="var(--accent)" stroke-width="1.2"/>';
    g += '<text x="'+(nx+nr+8)+'" y="'+(y+4)+'" font-size="12" fill="var(--ink)">'+esc(u.name)+'</text>';
    if(block.kind!=='slot')
      g += '<text x="'+(W-14)+'" y="'+(y+4)+'" text-anchor="end" font-size="10.5" fill="var(--muted)">'+esc(REL_CN[u.rel]||u.rel)+'</text>';
  });
  g += '</svg>';
  return g;
}

// 条目详情里的「网位置」：上游（我基于谁）+ 下游（谁基于我）
function netPos(e){
  const up = [];
  for(const b of (e.built_on||[])) up.push('<span class="nchip" data-goto="'+esc(b)+'">'+esc((ENTRIES[b]||{}).name||b)+'<i>基于</i></span>');
  for(const b of (e.speaks||[])) up.push('<span class="nchip" data-goto="'+esc(b)+'">'+esc((ENTRIES[b]||{}).name||b)+'<i>说</i></span>');
  const down = (REFS[e.id]||[]).map(r=>{
    const nm = (ENTRIES[r.id]||{}).name || r.id;
    return '<span class="nchip" data-goto="'+esc(r.id)+'">'+esc(nm)+'<i>'+esc(REL_CN[r.rel]||r.rel)+'</i></span>';
  });
  if(!up.length && !down.length) return '';
  return '<h2>它在网里的位置</h2><div class="comp"><div class="bd">'+
    (up.length?'<div class="nrow"><b>站在谁肩上</b>'+up.join('')+'</div>':'')+
    (down.length?'<div class="nrow"><b>谁共用它</b>'+down.join('')+'</div>':'')+
    (down.length>1?'<div class="kn" style="padding:0">这 '+down.length+' 个条目共用同一套东西——改一处（换内核、换协议版本）会同时影响它们。</div>':'')+
    '</div></div>';
}

// 关系网页签的右栏
function renderNet(b){
  if(!b) return '<div class="empty">左边选一块。'+
    '这里按「共用」排：同一个底座、同一套接口、同一条能力位，被哪些东西同时占着。</div>';
  const isEntry = b.kind!=='slot';
  const typeCN = b.kind==='speaks' ? '接口 · 多个条目按它通话' : (b.kind==='slot' ? '同一条能力位 · 互为替代' : '技术底座 · 建立在它上面');
  let html = '<h1>'+esc(b.name)+'</h1>'+
    '<div class="sub">'+esc(typeCN)+' · '+b.count+' 个条目'+(isEntry?' · 点圆点或行跳到条目详情':'')+'</div>'+
    '<div class="netwrap">'+netSvg(b)+'</div>'+
    '<h2>谁共用它</h2><div class="comp"><div class="bd">'+
      b.users.map(u=>'<div class="nrel" data-goto="'+esc(u.id)+'">'+
        '<span class="nn">'+esc(u.name)+'</span>'+
        '<span class="nr">'+esc(REL_CN[u.rel]||u.rel)+'</span>'+
        '<span class="nd">'+esc(((ENTRIES[u.id]||{}).notes||'').slice(0,78))+'</span></div>').join('')+
    '</div></div>';
  if(b.kind!=='slot'){
    const base = ENTRIES[b.id] || {};
    html += '<h2>这一块本身</h2><div class="comp"><div class="bd"><div class="note" style="padding:0">'+
      esc(base.notes||'')+'</div></div></div>'+
      '<div style="margin:10px 0 0"><button class="ghost" data-goto="'+esc(b.id)+'">看它的拆解 →</button></div>';
  } else {
    const c = CAV[b.id] || {};
    html += '<h2>这一格是什么意思</h2><div class="comp"><div class="bd"><div class="note" style="padding:0">'+
      esc((c.desc||'') + '　能力 id：' + b.id + '。同格的意思是「择一即可」——它们互相替代，选哪个看规模与运维成本，不是叠加。')+
      '</div></div></div>';
  }
  return html;
}

// 一张卡内部：按阶段分组，模块带中文能力名与二级拆解（parts）
function moduleCards(e){
  let out = '', g = null;
  for(const m of e.modules){
    if(m.group && m.group!==g){ g = m.group;
      out += '<div class="gsec"><b>'+esc(g)+'</b><span class="ln"></span></div>'; }
    const a = m.artifact||{};
    out += '<div class="kmod">'+
      '<div class="kh"><span class="kt">'+esc(m.label||m.id)+'</span>'+
        (sameWord(capCN(m.capability), m.label||m.id)
          ? '' : '<span class="kc">'+esc(capCN(m.capability))+'</span>')+
        '<span class="kcn">'+esc(m.capability)+'</span>'+
        '<span style="flex:1"></span>'+
        '<span class="badge">'+esc(a.kind && a.kind!=='none' ? '需下载' : '不单独下载')+'</span>'+
      '</div>'+
      (m.note?'<div class="kn">'+esc(m.note)+'</div>':'')+
      ((m.parts||[]).length
        ? '<div class="parts">'+m.parts.map(p=>'<div class="pt"><i>'+esc(p.label)+'</i>'+
            (p.note?'<span>'+esc(p.note)+'</span>':'')+'</div>').join('')+'</div>'
        : '')+
      '</div>';
  }
  return out;
}

// 能力卡独有：反查目录里谁挂在这些环节上。卡片独立存在的意义就在这一段——
// 不是「某个 App 有知识库」，而是「这一环有谁在做、换得掉吗」。
function whoMakes(e){
  const order = [...new Set(e.modules.map(m=>m.capability))];
  let total = 0, body = '';
  for(const cap of order){
    const rows = [];
    for(const o of CAT.entries){
      if(o.id===e.id) continue;
      for(const m of o.modules) if(m.capability===cap) rows.push({o, m});
    }
    if(!rows.length) continue;
    total += rows.length;
    body += '<div class="gsec" style="margin:10px 0 4px"><b>'+esc(capCN(cap))+'</b><span class="ln"></span>'+
            '<span style="text-transform:none;letter-spacing:0">'+rows.length+' 处</span></div>';
    body += rows.map(r=>'<div class="who" data-goto="'+esc(r.o.id)+'" title="'+esc(r.o.name)+'">'+
        '<span class="wn">'+esc(r.o.name)+'</span>'+
        '<span class="wm">'+esc(r.m.label||r.m.id)+'</span>'+
        '<span class="wd">'+esc(r.m.note||(r.m.artifact||{}).note||'')+'</span>'+
      '</div>').join('');
  }
  if(!total) return '<h2>谁在做这件事</h2><div class="comp"><div class="bd"><div class="note" style="padding:0">'+
    '目录里还没有条目挂到这些环节上。把某个实现（比如一个向量库）录进来、在模块上声明对应能力，它就会出现在这里。</div></div></div>';
  return '<h2>谁在做这件事（'+total+' 处）</h2>'+
    '<div style="font-size:11.5px;color:var(--muted);margin:-4px 0 8px">下面这些条目的模块，挂在这张卡的某个环节上。点一行跳过去看它的拆解。</div>'+
    '<div class="comp"><div class="bd">'+body+'</div></div>';
}

function renderEntry(e){
  // 只登记条目（技术基座 / 协议 / 闭源软件 / 能力卡）：没有制品，不参与下载集，详情页换一套说法
  if(e.kind==='existing'){
    const isCard = e.category==='component';
    const isHw = e.category==='hardware';   // 硬件：只登记取舍与坑，采购不在这里发生
    const caps = e.modules.map(m=>m.capability).filter(Boolean);
    const links = [];
    if(e.repo) links.push('<a href="https://github.com/'+esc(e.repo)+'" target="_blank" rel="noopener">'+esc('github.com/'+e.repo)+'</a>');
    if(e.homepage && !/^https?:\/\/(www\.)?github\.com\//.test(e.homepage))
      links.push('<a href="'+esc(e.homepage)+'" target="_blank" rel="noopener">'+esc(e.homepage)+'</a>');
    const shape = isCard ? '能力卡 · 不下载'
      : (isHw ? '硬件 · 只登记'
      : ({closed:'闭源 · 只登记',unclear:'许可未明 · 只登记'}[licenseKind(e)] || '只登记'));
    const box = isCard
      ? '这是一张能力卡，没有代码可下载。它把各家 App 里同名的那张「'+esc(e.name)+'」拎出来单独立档：'
        +'先分清形态（同一个名字底下可能是向量 RAG、关键词、图谱，也可能根本不建索引），再把内部环节逐段拆开——'
        +'每一段的「可选实现」都是能单独换掉的一层。'
      : isHw
      ? '硬件不进下载集：这里只登记它在这套体系里补哪一段、挑的时候看什么、坑在哪。买哪一款自己定，'
        +'装好通电之后它才成为一台节点、一块面板或一个盘位——目录不报价、不带链接，因为型号与价格比软件变得快得多。'
      : ({closed:'闭源软件，只登记链接与介绍：不下载、不安装、不进下载集，也不替你装。要用按下面的地址自己取。',
          unclear:'上游没有声明许可，因此只登记链接与介绍：不下载、不安装。复用它的内容前请先确认授权。'}
         [licenseKind(e)] || '只登记链接与介绍：不下载、不安装、不进下载集。要用就按下面的地址自己装——'
          +'目录在这里的作用是「先知道有这个东西、它解决哪一段」，不是「点一下就装上」。');
    return '<h1>'+esc(e.name)+'</h1>'+
      '<div class="sub">'+esc(e.repo||'')+(e.repo?' · ':'')+esc(e.license||'')+' · '+(e.tier||'community')+'</div>'+
    tagRow(e, true)+
      '<div class="row">'+
        '<div class="kv"><i>形态</i> '+shape+'</div>'+
        (isHw ? '<div class="kv"><i>类型</i> 硬件（自购）</div>'
              : '<div class="kv"><i>环节</i> '+e.modules.length+' 段</div>')+
        '<div class="kv"><i>能力</i> '+esc(caps.length<=3 ? (caps.join(' · ')||'—') : caps.length+' 条')+'</div>'+
        '<div class="kv"><i>'+(isHw?'采购':'下载')+'</i> <b>'+(isHw?'自己买':'无')+'</b></div>'+
      '</div>'+
      '<div class="okbox">'+box+'</div>'+
      '<h2>为什么收在这里</h2><div class="comp"><div class="bd"><div class="note" style="padding:0">'+esc(e.notes||'')+'</div></div></div>'+
      (e.modules.length>1
        ? '<h2>拆解（'+e.modules.length+' 段能力）</h2>'+moduleCards(e)
        : (isHw && e.modules.length ? '<h2>挑的时候看什么</h2>'+moduleCards(e) : ''))+
      (isCard ? whoMakes(e) : '')+netPos(e)+
      '<h2>来源与链接</h2><div class="comp"><div class="bd"><div class="note" style="padding:0">'+
        (links.length ? links.join(' · ')
          : (isHw ? esc(e.name)+'：硬件没有上游仓库，也不登记商家链接——型号、批次与价格随市，按上面的要点自己比。'
                  : esc(e.name)+'：未找到可登记的上游地址'))+
      '</div></div></div>';
  }
  const def = e.modules.filter(m=>m.default!==false);
  const defSize = def.reduce((n,m)=>n+((m.artifact||{}).size_mb||0),0);
  // 变体模块是「替换镜像」而非「叠加」，全模块体积按替换算，避免虚高
  const vmod = e.modules.find(m=>(m.artifact||{}).variant);
  const rest = e.modules.filter(m=>m.default!==false && m!==vmod)
    .reduce((n,m)=>n+((m.artifact||{}).size_mb||0),0);
  const all = vmod ? Math.max(rest, (vmod.artifact||{}).size_mb||0) : defSize;
  let html = '<h1>'+esc(e.name)+'</h1>'+
    '<div class="sub">'+esc(e.repo||'')+' · '+esc(e.license||'')+' · '+(e.tier||'community')+'</div>'+
    tagRow(e, true)+
    '<div class="row">'+
      '<div class="kv"><i>形态</i> '+esc(kindCN(e.kind))+'</div>'+
      '<div class="kv"><i>默认下载</i> <b>'+mb(defSize)+'</b></div>'+
      '<div class="kv"><i>全模块</i> '+mb(all)+'</div>'+
      '<div class="kv"><i>内存</i> '+((e.cost||{}).ram_mb||'?')+' MB</div>'+
    '</div>'+
    '<div class="okbox">拆解已完成，制品未下载。勾到组合里才会算进下载集——这就是「需要的话再下载」。</div>'+
    '<h2>模块拆解</h2><div class="comp"><div class="bd">';
  for(const m of e.modules){
    const a = m.artifact||{kind:'none'};
    const tag = a.kind==='none' ? (a.variant?('换 '+a.variant+' 变体'):'同一制品') : (a.kind+' · '+mb(a.size_mb));
    html += '<div style="display:flex;gap:8px;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line-2)">'+
      '<span style="min-width:96px;font-weight:600">'+esc(m.label||m.id)+'</span>'+
      '<span class="cap" style="flex:1">'+esc(m.capability)+'</span>'+
      '<span class="art">'+esc(tag)+'</span>'+
      '<span class="badge">'+(m.default!==false?'默认':'可选')+'</span></div>'+
      (m.note?'<div class="note">'+esc(m.note)+'</div>':'');
  }
  html += '</div></div>';
  html += netPos(e);
  html += '<h2>怎么用它</h2><div class="comp"><div class="bd"><div class="note" style="padding:0">'+
    '把它放进蓝图格子，或在装某个插件时用 <code style="font-family:var(--mono)">--use "'+esc(e.id)+':'+esc(e.modules.filter(m=>m.default!==false).map(m=>m.id).join(','))+'"</code> 显式指定。'+
    '</div></div></div>';
  return html;
}

function currentUse(){
  if(tab!=='plugins' || !selId) return null;
  const mf = MFS[selId]; if(!mf) return null;
  return {mf, use: useString(mf)};
}

function renderFooter(){
  const cur = currentUse();
  const cmd = $('#fcmd');
  if(tab==='net'){
    const b = selId && NET_BY_KEY[selId];
    $('#fsum').innerHTML = '关系网 · <b>'+NET_BLOCKS.length+'</b> 个共用块'+
      (b ? ' · 选中「'+esc(b.name)+'」被 '+b.count+' 个条目共用' : ' · 选一块看谁跟谁共用');
    cmd.textContent = 'python3 tools/moshan.py net';
    return;
  }
  if(tab==='catalog'){
    const conds = [];
    if(activeCat) conds.push('品类「'+esc((CV[activeCat]||{}).label||activeCat)+'」');
    if(activeTag) conds.push('标签「'+esc((TV[activeTag]||{}).label||activeTag)+'」');
    const shown = CAT.entries.filter(e=>(!activeCat || catOf(e)===activeCat)
      && (!activeTag || (e.tags||[]).includes(activeTag))).length;
    $('#fsum').innerHTML = conds.length
      ? '软件目录 · '+conds.join(' + ')+' <b>'+shown+'</b> / '+CAT.entries.length+' 个条目'
      : '软件目录 · 共 '+CAT.entries.length+' 个条目 · '+(CAT.categories||[]).length+' 个品类 · '+(CAT.tags||[]).length+' 个标签';
    cmd.textContent = activeCat
      ? 'python3 tools/moshan.py catalog --category '+activeCat
      : 'python3 tools/moshan.py catalog';
    return;
  }
  if(activeTag && tab==='plugins'){
    const shown = REG.plugins.filter(p=>(p.tags||[]).includes(activeTag)).length;
    $('#fsum').innerHTML = '插件 · 标签「'+esc((TV[activeTag]||{}).label||activeTag)+'」 <b>'+shown+'</b> / '+REG.plugins.length+' 个';
    cmd.textContent = 'python3 tools/moshan.py registry "examples/*.moshan.json"';
    return;
  }
  if(!cur){
    $('#fsum').textContent = '未选择插件';
    cmd.textContent = 'python3 tools/moshan.py search <关键词>';
    return;
  }
  const items = downloadsOf(cur.mf);
  const total = items.reduce((n,i)=>n+(i.size||0),0);
  $('#fsum').innerHTML = '合计 <b>'+mb(total)+'</b> · '+items.length+' 个制品';
  cmd.textContent = 'python3 tools/moshan.py plan '+ (REG.plugins.find(p=>p.id===selId)||{}).manifest +' --use "'+cur.use+'"';
}

function renderAll(){
  renderStats(); renderCatbar(); renderTagbar(); renderList(); renderFooter();
  const d = $('#detail');
  if(tab==='plugins'){
    const p = REG.plugins.find(x=>x.id===selId);
    d.innerHTML = p ? renderPlugin(p) : '<div class="empty">选一个插件。左边列表点一下即可。</div>';
  } else if(tab==='net'){
    d.innerHTML = renderNet(selId ? NET_BY_KEY[selId] : null);
  } else {
    const e = ENTRIES[selId];
    d.innerHTML = e ? renderEntry(e) : '<div class="empty">这些是拆解好的开源软件。点开看它被拆成了哪些模块、各自要下多少。</div>';
  }
  d.querySelectorAll('[data-goto]').forEach(el=>{
    // 从能力卡反查跳到实现者：先清筛选，否则列表里可能根本没有这一条
    el.onclick = () => {
      const id = el.dataset.goto;
      if(!ENTRIES[id]) return;
      tab = 'catalog'; q = ''; activeTag = null; activeCat = null; selId = id;
      renderAll();
    };
  });
  d.querySelectorAll('input[type=checkbox][data-mod]').forEach(cb=>{
    cb.onchange = () => {
      const mf = MFS[selId]; if(!mf) return;
      const cid = cb.dataset.comp;
      sel[mf.id] = sel[mf.id] || {};
      if(!sel[mf.id][cid]) sel[mf.id][cid] = modsOf(mf, cid).map(m=>m.id);
      const arr = sel[mf.id][cid];
      if(cb.checked){ if(!arr.includes(cb.dataset.mod)) arr.push(cb.dataset.mod); }
      else sel[mf.id][cid] = arr.filter(x=>x!==cb.dataset.mod);
      renderAll();
    };
  });
}

// 页签上标数量：不然「只有 4 个插件」会被当成整个仓库的全部内容
document.querySelector('[data-tab="plugins"] .cnt').textContent = REG.plugins.length;
document.querySelector('[data-tab="catalog"] .cnt').textContent = CAT.entries.length;
document.querySelector('[data-tab="net"] .cnt').textContent = NET_BLOCKS.length;

document.querySelectorAll('.tabs button').forEach(b=>{
  b.onclick = () => {
    tab = b.dataset.tab;
    const pool = tab==='plugins' ? REG.plugins : CAT.entries;
    if(activeTag && !pool.some(x=>(x.tags||[]).includes(activeTag))) activeTag = null;
    if(activeCat && !pool.some(x=>catOf(x)===activeCat)) activeCat = null;
    // 不在这里指定选中项：目录页的分段顺序和数组顺序不一样，交给 renderList 取「渲染后的第一条」
    selId = null;
    document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on', x===b));
    renderAll();
  };
});
$('#q').oninput = e => { q = e.target.value.trim(); renderAll(); };
$('#copy').onclick = async () => {
  const t = $('#fcmd').textContent;
  try { await navigator.clipboard.writeText(t); $('#copy').textContent='已复制'; }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove(); $('#copy').textContent='已复制';
  }
  setTimeout(()=>{$('#copy').textContent='复制命令';},1200);
};
$('#export').onclick = () => {
  const cur = currentUse();
  if(!cur){ alert('先在插件列表里选一个。'); return; }
  const mf = JSON.parse(JSON.stringify(cur.mf));
  mf.extensions = mf.extensions || {};
  const ui = mf.extensions['cn.moshan.ui'] = mf.extensions['cn.moshan.ui'] || {};
  ui.selection = ui.selection || {};
  for(const c of (mf.components||[])){
    if(ENTRIES[c.id]) ui.selection[c.id] = modsOf(cur.mf, c.id).map(m=>m.id);
  }
  const blob = new Blob([JSON.stringify(mf,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = mf.id+'.moshan.json'; a.click();
  URL.revokeObjectURL(a.href);
};

renderAll();
</script>
</body>
</html>
