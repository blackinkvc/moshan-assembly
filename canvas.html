<script>
(function(){
  const CAT = JSON.parse(document.getElementById('catalog').textContent);
  let   BP  = JSON.parse(document.getElementById('blueprint').textContent);
  const CASES = JSON.parse(document.getElementById('cases').textContent);
  const CAPS = Object.fromEntries(CAT.capabilities.map(c=>[c.id,c]));
  const ENTRIES = Object.fromEntries(CAT.entries.map(e=>[e.id,e]));
  /* ---- 来源词表 ----
     本仓库的 catalog 目前只有品类（category），没有 origin；画布的「颜色 = 来源」
     不能因此全落成一种蓝。所以这里内置同一份词表作为兜底，目录里写了就用目录的。
     条目的来源按品类做**确定性**推断，不猜：模型 → 大模型，硬件 → 硬件驱动，其余算开源项目。 */
  const DEFAULT_ORIGINS = [
    {id:'oss',  label:'开源项目', color:'#2f6df6', color_dark:'#7aa2ff',
     note:'上游 GitHub 项目，用它的镜像或发布包。改不动就别改'},
    {id:'os',   label:'系统自带', color:'#64748b', color_dark:'#94a3b8',
     note:'操作系统自带（launchd / cron / SMB / 系统 API）。不用下载，但整套东西就绑在这个系统上了'},
    {id:'self', label:'自己写的', color:'#7c3aed', color_dark:'#c4b5fd',
     note:'自己写的代码：胶水、面板、脚本。出问题只能怪自己，也最容易改'},
    {id:'model',label:'大模型',   color:'#d97706', color_dark:'#fbbf24',
     note:'大模型：云端 API 或本地跑权重。能力最强，代价是钱、延迟和不确定性'},
    {id:'saas', label:'云服务',   color:'#db2777', color_dark:'#f472b6',
     note:'别人的云服务（GitHub API、微信、飞书）。要 key、会限流、可能收费，还随时改协议'},
    {id:'hw',   label:'硬件驱动', color:'#059669', color_dark:'#34d399',
     note:'硬件与驱动：显卡、盘位、打印机。软件写得再对，也得有这块铁'}
  ];
  const ORIGIN_LIST = (CAT.origins && CAT.origins.length) ? CAT.origins : DEFAULT_ORIGINS;
  const ORIGINS = Object.fromEntries(ORIGIN_LIST.map(o=>[o.id,o]));
  const originOfEntry = e => {
    if(!e) return 'oss';
    if(e.origin) return e.origin;
    return e.category==='model' ? 'model' : (e.category==='hardware' ? 'hw' : 'oss');
  };
  let OG = {};                       // slotId → 来源；每帧按「实际选中的条目」重算
  function computeOrigins(picks){
    OG = {};
    for(const s of BP.slots){
      if(s.origin){ OG[s.id] = s.origin; continue; }
      if(s.custom){ OG[s.id] = 'self'; continue; }
      const p = picks && picks[s.id];
      OG[s.id] = originOfEntry(p && !p.custom ? ENTRIES[p.eid] : null);
    }
  }

  /* ---- 尺寸令牌：卡片宽 / 列距 / 行距 / 留白，全部按 4 的倍数 ---- */
  const CARD_W = 204, COL_GAP = 48, LAYER_GAP = 84, ROW_GAP = 20, PAD = 28, MIN_H = 104, BOTTOM = 64;
  const MIN_COL_H = 14*MIN_H + 13*ROW_GAP;    // 一列的保底高度：14 格（宁可竖着滚，不横着滚）

  let active = null;
  const H = {};                                  // slotId → 实测高度
  let POS = {};                                  // 'bpId|slotId' → {x,y}，手动拖动的位置
  const LSK = 'moshan.canvas.pos.v2';
  try { POS = JSON.parse(localStorage.getItem(LSK)||'{}') || {}; } catch(e){ POS = {}; }
  const savePos = () => { try{ localStorage.setItem(LSK, JSON.stringify(POS)); }catch(e){} };
  const pkey = id => BP.id+'|'+id;

  /* ---- 内置区三态：'' 收起（那排胶囊）· 'list' 虚线框列表 · 'all' 摊成一面卡片墙 ----
     状态都是前端视图，不进蓝图：'all' 不落盘（刷新回到 'list'，摊开是临时看一眼） */
  let OPEN = {};
  const OSK = 'moshan.canvas.open.v1';
  try { OPEN = JSON.parse(localStorage.getItem(OSK)||'{}') || {}; } catch(e){ OPEN = {}; }
  const openState = id => { const v = OPEN[pkey(id)]; return v==='all' ? 'all' : (v ? 'list' : ''); };
  const saveOpen = () => { try{
    const o = {};                                   // 'all' 落盘时降成 'list'
    for(const k in OPEN) if(OPEN[k]) o[k] = OPEN[k]==='all' ? 'list' : OPEN[k];
    localStorage.setItem(OSK, JSON.stringify(o));
  }catch(e){} };
  function setOpen(id, mode, keepActive){            // 一张卡摊开时，别的卡退回列表
    if(mode==='all'){ for(const k in OPEN) if(OPEN[k]==='all') OPEN[k] = 'list'; POP = null; }
    if(mode) OPEN[pkey(id)] = mode; else delete OPEN[pkey(id)];
    saveOpen(); if(!keepActive) active = id; draw();
    if(mode && mode!=='all') scrollToSlot(id);        // 摊开时卡会变高，顺手滚进视野
  }
  function cycleOpen(id){
    const st = openState(id);
    setOpen(id, st==='' ? 'list' : (st==='list' ? 'all' : ''));
  }
  let dragHot = null;              // 拖拽时指针停在哪个内置区上
  let POP = null;                  // 正在弹出小卡片的内置面板 id

  /* ---- 子卡：parent 指向某个格子，表示「跑在它同一个进程里的一个面板」。
     不占端口、不进连线、不参与排布，只在父卡的卡面上列出来。 ---- */
  const isKid = s => !!s.parent;
  const tops  = () => BP.slots.filter(s=>!isKid(s));
  const kidsOf = id => BP.slots.filter(s=>s.parent===id);

  /* ---- 来源（这一格是谁做的）→ 颜色。色值写在目录的 origins 词表里，深色主题换一套 ---- */
  function originOfSlot(s){
    return OG[s.id] || s.origin || (s.custom ? 'self' : 'oss');
  }
  function originOfMod(eid, m){
    return m.origin || originOfEntry(ENTRIES[eid]);
  }
  (function paintOriginVars(){
    const light=ORIGIN_LIST.map(o=>'--o-'+o.id+':'+(o.color||'#888')).join(';');
    const dark =ORIGIN_LIST.map(o=>'--o-'+o.id+':'+(o.color_dark||o.color||'#888')).join(';');
    const st=document.createElement('style');
    st.textContent=':root{'+light+'}\n@media (prefers-color-scheme:dark){:root{'+dark+'}}';
    document.head.appendChild(st);
  })();

  /* ---- 与 blueprint.py 同构的匹配逻辑（Python 侧为准，此处用于即时预览） ---- */
  function modsOf(eid, pinned, need){
    const e = ENTRIES[eid]; if(!e) return [];
    let sel;
    if(pinned && pinned.length){
      // 显式勾选即为准：不再自动补 need，允许出现缺口
      sel = e.modules.filter(m=>pinned.includes(m.id));
    } else {
      sel = e.modules.filter(m=>m.default!==false);
      for(const m of e.modules) if(need.includes(m.capability) && !sel.includes(m)) sel.push(m);
    }
    let ch=true;
    while(ch){ ch=false;
      for(const m of [...sel]) for(const cap of (m.requires||[])){
        if(sel.some(x=>x.capability===cap)) continue;
        const c = e.modules.find(x=>x.capability===cap && !sel.includes(x));
        if(c){ sel.push(c); ch=true; }
      }}
    return sel;
  }
  function cov(eid, need, pinned){
    const sel = modsOf(eid, pinned, need);
    const got = new Set(sel.map(m=>m.capability));
    return {sel, got, hit: need.filter(c=>got.has(c)), miss: need.filter(c=>!got.has(c))};
  }
  function scoreOf(eid, need, used, pinned){
    const e = ENTRIES[eid]; const c = cov(eid, need, pinned);
    if(!need.length) return {eid, s:0, sel:c.sel, hit:[], miss:[]};
    const cost = e.cost||{}; const ram = cost.ram_mb||200;
    const ports = c.sel.filter(m=>m.port).length;
    const reuse = used.has(eid)?12:0;
    const s = (c.hit.length/need.length)*100 - Math.min(ram,700)*0.06 - ports*1 + reuse;
    return {eid, s:+s.toFixed(1), sel:c.sel, hit:c.hit, miss:c.miss, ram, ports};
  }
  function rank(need, used, only){
    const ids = only?[only]:Object.keys(ENTRIES);
    return ids.filter(id=>ENTRIES[id]).map(id=>scoreOf(id,need,used))
      .filter(r=>r.hit.length>0 || only)
      .sort((a,b)=> b.s-a.s || a.ram-b.ram);
  }
  function chosen(slot, used){
    if(slot.custom) return {custom:true};
    if(slot.use && slot.use.entry) return scoreOf(slot.use.entry, slot.needs, used, slot.use.modules);
    const r = rank(slot.needs, used);
    return r[0] || null;
  }
  function ports(){
    const c = BP.constraints||{}; const pool = c.port_pool||[8790,8799];
    const reserved = new Set(c.reserved_ports||[]);
    const out=[]; for(let i=pool[0];i<=pool[1];i++) if(!reserved.has(i)) out.push(i);
    return out;
  }
  function assignment(){
    const free = ports(); const taken = new Set();
    const install = (BP.install_as||{}).port;
    if(install) taken.add(install);
    const map={};
    for(const s of BP.slots){
      if(isKid(s)) continue;
      if(s.port){ map[s.id]=s.port; taken.add(s.port); continue; }
      // 只登记的条目（existing 且模块不带端口）不该显示一个假端口
      const eid0 = (s.use&&s.use.entry) || (chosen(s,new Set())||{}).eid;
      const e0 = ENTRIES[eid0];
      if(e0 && e0.kind==='existing' && !(e0.modules||[]).some(m=>m.port)) continue;
      if(s.custom && s.ui && install){ map[s.id]=install; continue; }
      const p = free.find(x=>!taken.has(x));
      if(p){ map[s.id]=p; taken.add(p); }
    }
    return map;
  }

  /* ================= 自动排布 =================
     1) 先按连线做分层（最长路径），环靠松弛兜底
     2) 同层按前驱重心排序，减少交叉
     3) 一列放不下就折成下一列（不再拉成一条长线）
     4) 各列竖向居中，列间留白比行间大，视觉上成组
  ============================================= */
  function layersOf(){
    const ids = tops().map(s=>s.id);
    const pred = new Map(ids.map(id=>[id,[]])), succ = new Map(ids.map(id=>[id,[]]));
    for(const e of (BP.edges||[])){
      if(e.from===e.to || !pred.has(e.to) || !succ.has(e.from)) continue;
      if(!pred.get(e.to).includes(e.from)) pred.get(e.to).push(e.from);
      if(!succ.get(e.from).includes(e.to)) succ.get(e.from).push(e.to);
    }
    const lv = new Map(ids.map(id=>[id,0]));
    const indeg = new Map(ids.map(id=>[id,pred.get(id).length]));
    const q = ids.filter(id=>indeg.get(id)===0), done = new Set(q);
    while(q.length){
      const id=q.shift();
      for(const s of succ.get(id)){
        lv.set(s, Math.max(lv.get(s), lv.get(id)+1));
        indeg.set(s, indeg.get(s)-1);
        if(indeg.get(s)===0 && !done.has(s)){ done.add(s); q.push(s); }
      }
    }
    for(let pass=0; pass<ids.length; pass++){        // 环：谁都不入度为 0，少量松弛收敛
      let ch=false;
      for(const id of ids){
        if(done.has(id)) continue;
        let m=0; for(const p of pred.get(id)) m=Math.max(m, lv.get(p)+1);
        if(m>lv.get(id)){ lv.set(id,m); ch=true; }
        if(m>0) done.add(id);
      }
      if(!ch) break;
    }
    const seq = new Map(ids.map((id,i)=>[id,i]));
    const groups = [];
    ids.forEach(id=>{ (groups[lv.get(id)] ||= []).push(id); });
    const out = groups.filter(Boolean);
    out.forEach((g, gi)=>{
      if(gi===0){ g.sort((a,b)=>seq.get(a)-seq.get(b)); return; }
      const prev = out[gi-1], at = new Map(prev.map((id,i)=>[id,i]));
      const bc = id => {
        const ps = pred.get(id).filter(p=>at.has(p));
        return ps.length ? ps.reduce((n,p)=>n+at.get(p),0)/ps.length : -1;
      };
      g.sort((a,b)=> (bc(a)-bc(b)) || seq.get(a)-seq.get(b));
    });
    return out;
  }

  function layout(){
    // 一层最多 14 格，超了才折列。折列会把最后一格甩到中间一列，还逼出横向滚动 ——
    // 竖着滚永远比横着滚好受，所以阈值按「极端情况」定，不按窗口高度定
    const availH = Math.max(MIN_COL_H, 14*MIN_H + 13*ROW_GAP);
    const hOf = id => (H[id] && H[id].h) || MIN_H;
    const colH = ids => ids.reduce((n,id,i)=> n + (i?ROW_GAP:0) + hOf(id), 0);
    const layerCols = layersOf().map(g=>{
      const out=[]; let cur=[], sum=0;
      for(const id of g){
        const h = hOf(id);
        if(cur.length && sum + ROW_GAP + h > availH){ out.push(cur); cur=[]; sum=0; }
        cur.push(id); sum += (cur.length>1?ROW_GAP:0) + h;
      }
      if(cur.length) out.push(cur);
      return out;
    });
    const layerH = layerCols.map(cols=>Math.max(0, ...cols.map(colH)));
    const maxH = Math.max(0, ...layerH);
    const pos={}; let x=PAD;
    layerCols.forEach(cols=>{
      cols.forEach((col, ci)=>{
        let y = PAD + (maxH - colH(col))/2;
        col.forEach((id,i)=>{
          if(i) y += ROW_GAP;
          pos[id] = {x, y};
          y += hOf(id);
        });
        // 同一层的子列挨近一点，换层才拉开距离（不是两者相加）
        x += CARD_W + (ci < cols.length-1 ? COL_GAP : LAYER_GAP);
      });
    });
    const w = Math.max(660, x - LAYER_GAP + PAD);
    const h = Math.max(340, PAD*2 + maxH + BOTTOM);
    return {pos, w, h};
  }

  /* ================= 渲染 ================= */
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

  /* 内置区的两种样子：收起是那排胶囊（原来就这样），展开是一块虚线框。
     虚线框本身是投放目标 —— 把外面的卡拖进来，就给它写上 parent。 */
  function bzoneHTML(s, kids){
    return '<div class="bzone'+(dragHot===s.id?' hot':'')+'" data-zone="'+esc(s.id)+'">'+
      '<div class="bh"><b>内置 '+kids.length+'</b><span>不占端口</span>'+
        (kids.length? '<button class="wbtn" data-open="'+esc(s.id)+'" title="把 '+kids.length+
          ' 张面板全摊成卡片">全部展开</button>' : '')+'</div>'+
      (kids.length
        ? kids.map(k=>{
            const need = k.needs||[];
            return '<div class="bi'+(k.id===active?' on':'')+'" data-bi="'+esc(k.id)+'" '+
              'title="'+esc(k.label+'：'+(need.join(' · ')||'没有声明能力'))+'">'+
              '<i class="dot" style="--o:var(--o-'+originOfSlot(k)+')"></i>'+
              '<span class="nm2">'+esc(k.label)+'</span>'+
              '<span class="cp">'+esc((need[0]||'—').split('.').pop())+'</span>'+
              '<button class="out" data-out="'+esc(k.id)+'" title="取出，变回独立卡片">↖</button></div>';
          }).join('')
        : '<div class="ph">把画布上的卡拖进这个框，它就并进来——不下载、不占端口，跑在同一个进程里。</div>')+
      '</div>';
  }

  function cardHTML(s, p, port){
    const miss = p && !p.custom ? p.miss : [];
    const kids = kidsOf(s.id);
    const st = kids.length ? openState(s.id) : '';    // 没有子卡就没有展开态
    // 右上角那个小标签：普通格子报端口；只登记的东西先报「只登记」，端口是别人的、顺带标出
    const e0 = (p && !p.custom) ? ENTRIES[p.eid] : null;
    const k0 = e0 ? e0.kind : null;
    const tag = k0==='existing' ? ('只登记'+(port?' :'+port:''))
      : (port ? (':'+port) : (k0==='builtin' ? '内置' : ''));
    const od = k0==='existing' || (k0==='builtin' && !port);
    // 开关三态循环：胶囊 → 列表（⌄）→ 卡片墙（⊞）→ 收起（⌃）。只给真带子卡的卡，省得挤标题
    const kb = kids.length
      ? '<button class="kbtn" data-open="'+esc(s.id)+'" title="'+
        (st===''  ? '展开内置区：列成清单' :
         st==='list'? '再展开：把 '+kids.length+' 张面板全摊成卡片' :
                      '收起内置区')+'">'+
        kids.length+({'':' ⌄','list':' ⌄⌄','all':' ⌃'})[st]+'</button>'
      : '';
    return '<div class="lb"><i class="dot"></i><span class="nm">'+esc(s.label)+'</span>'+
      (tag?'<span class="port'+(od?' od':'')+'">'+esc(tag)+'</span>':'')+ kb +'</div>'+
      '<div class="need">'+s.needs.map(c=>'<span>'+esc(c)+'</span>').join('')+'</div>'+
      (s.custom
        ? '<div class="pick manual">手写胶水 · 约 30–80 行</div><div class="mods">'+
          esc((s.outputs||[]).length? (s.outputs||[]).join(' · ') : '不对外提供能力')+'</div>'
        : (p
            ? '<div class="pick">'+esc(ENTRIES[p.eid].name)+'</div><div class="mods">'+
              p.sel.map(m=>'<i class="mdot" style="background:var(--o-'+originOfMod(p.eid,m)+')"></i>'+esc(m.id)).join(' ')+'</div>'
            : '<div class="pick empty">未匹配到软件</div>'))+
      (miss.length?'<div class="gap">缺 '+miss.length+' 条能力</div>':'')+
      (st==='all'
        ? '<div class="bzone" data-zone="'+esc(s.id)+'">'+
            '<div class="bh"><b>内置 '+kids.length+'</b><span>已摊开</span></div>'+
            '<div class="teaser">'+kids.length+' 张摊在画布上'+
              '<button data-wall-list="'+esc(s.id)+'">收成清单</button>'+
              '<button data-open="'+esc(s.id)+'">收起</button></div></div>'
        : st==='list'
          ? bzoneHTML(s, kids)
          : (kids.length
              ? '<div class="kids" title="这些卡跑在同一个进程里：不单独下载、不占端口、不进连线">'+
                kids.map(k=>'<span class="kid'+(k.id===active?' on':'')+'" data-kid="'+esc(k.id)+'" '+
                  'title="'+esc(k.label+'：'+(k.needs||[]).join(' · '))+'"><i></i>'+esc(k.label)+'</span>').join('')+'</div>'
              : ''));
  }

  function draw(){
    const host = document.getElementById('slots');
    host.innerHTML='';
    const used=new Set(); const picks={};
    BP.slots.forEach(s=>{ const p=chosen(s,used); picks[s.id]=p; if(p&&p.eid) used.add(p.eid); });
    computeOrigins(picks);
    const TOP = tops();
    const pmap = assignment();
    const els = {};
    // 选中一张子卡时，父卡也要亮起来，否则画布上找不到「现在在看谁」
    const actKid = BP.slots.find(x=>x.id===active);
    const actTop = actKid && actKid.parent ? actKid.parent : active;

    TOP.forEach(s=>{
      const og = originOfSlot(s);
      const el = document.createElement('div');
      el.className='card'+(s.id===actTop?' active':'')+(s.custom?' custom':'');
      el.style.setProperty('--o','var(--o-'+og+')');
      el.dataset.id = s.id;
      el.tabIndex = 0;
      el.setAttribute('role','button');
      el.setAttribute('aria-label', s.label + '（可拖动；回车选中）');
      el.title = '拖动可移动 · ' + ((ORIGINS[og]||{}).note || '');
      el.innerHTML = cardHTML(s, picks[s.id], pmap[s.id]);
      els[s.id]=el; host.appendChild(el);
    });

    // 先量高度（此时还没定位，宽度已定，offsetHeight 是真实行高）
    TOP.forEach(s=>{ H[s.id] = {w:CARD_W, h: els[s.id].offsetHeight || MIN_H}; });

    const lay = layout();
    TOP.forEach(s=>{
      const p = POS[pkey(s.id)] || lay.pos[s.id] || {x:PAD,y:PAD};
      els[s.id].style.left = Math.round(p.x)+'px';
      els[s.id].style.top  = Math.round(p.y)+'px';
    });

    sizeCanvas(lay);
    bindCards(els);
    renderEdges();
    drawStats(picks, pmap);
    drawLegend(picks);
    drawHint();
    drawInspector(picks, pmap);
    renderPop(els, picks);
    renderWall(picks);
  }

  function rects(){
    const out={};
    document.querySelectorAll('#slots .card').forEach(el=>{
      out[el.dataset.id] = {
        id: el.dataset.id,
        x: parseFloat(el.style.left)||0, y: parseFloat(el.style.top)||0,
        w: CARD_W, h: el.offsetHeight||MIN_H
      };
    });
    return out;
  }

  /* ---- 连线：按相对位置选出口，跳过中间列则从下方绕，回边走 U 形 ---- */
  function edgePath(a, b, all, opt){
    opt = opt || {};
    const dy = opt.dy || 0, i = opt.i || 0;
    const ay=a.y+a.h/2, by=b.y+b.h/2+dy;
    if(b.x >= a.x + a.w + 10){                      // 目标在右
      const between = all.filter(r=> r.id!==a.id && r.id!==b.id &&
        r.x >= a.x + a.w - 2 && r.x + r.w <= b.x + 2);
      if(!between.length){
        const k = Math.max(30, (b.x-(a.x+a.w))*0.45);
        return {d:'M'+(a.x+a.w)+','+ay+' C'+(a.x+a.w+k)+','+ay+' '+(b.x-k)+','+by+' '+b.x+','+by,
                maxY: Math.max(a.y+a.h, b.y+b.h),
                label:{x:(a.x+a.w+b.x)/2, y:(ay+by)/2-9}};
      }
      // 中间隔着别的列：先降到中间那张卡下面（不横穿），再从目标左侧的竖向通道里
      // 抬上来。11 条线全用斜线汇到一个点会糊成一束；走通道就是一把梳子。
      const band = Math.max(...between.map(r=>r.y+r.h), a.y+a.h) + 26 + (i % 5) * 8;
      const chan = b.x - 26 - (i % 6) * 5;
      const dir  = by >= band ? 1 : -1;
      const x0 = a.x + a.w;
      const d = 'M'+x0+','+ay+
                ' C'+(x0+34)+','+ay+' '+(x0+34)+','+band+' '+(x0+70)+','+band+
                ' L'+(chan-18)+','+band+
                ' Q'+chan+','+band+' '+chan+','+(band+dir*16)+
                ' L'+chan+','+(by-dir*16)+
                ' Q'+chan+','+by+' '+(chan+16)+','+by+
                ' L'+b.x+','+by;
      return {d, maxY:Math.max(band, by), label:{x:chan+30, y:band-7}};
    }
    if(b.x + b.w <= a.x - 10){                      // 回边：从底出，绕下方，进底边
      const band = Math.max(a.y+a.h, b.y+b.h) + 40;
      const sx=a.x+a.w/2, tx=b.x+b.w/2;
      return {d:'M'+sx+','+(a.y+a.h)+' C'+sx+','+band+' '+tx+','+band+' '+tx+','+(b.y+b.h), maxY:band,
              label:{x:(sx+tx)/2, y:band+13}};
    }
    if(b.y > a.y){                                  // 同列：上→下
      const k=Math.max(24,(b.y-(a.y+a.h))/2), sx=a.x+a.w/2, tx=b.x+b.w/2;
      return {d:'M'+sx+','+(a.y+a.h)+' C'+sx+','+(a.y+a.h+k)+' '+tx+','+(b.y-k)+' '+tx+','+b.y,
              maxY:b.y+b.h};
    }
    const k=Math.max(24,(a.y-(b.y+b.h))/2), sx=a.x+a.w/2, tx=b.x+b.w/2;
    return {d:'M'+sx+','+a.y+' C'+sx+','+(a.y-k)+' '+tx+','+(b.y+b.h+k)+' '+tx+','+(b.y+b.h),
            maxY:a.y+a.h};
  }

  function sizeCanvas(lay){
    const cv = document.getElementById('canvas');
    let w = lay.w, h = lay.h;
    document.querySelectorAll('#slots .card').forEach(el=>{
      w = Math.max(w, (parseFloat(el.style.left)||0) + CARD_W + PAD);
      h = Math.max(h, (parseFloat(el.style.top)||0) + (el.offsetHeight||MIN_H) + PAD + 24);
    });
    cv.style.width = w+'px'; cv.style.height = h+'px';
    const svg = document.getElementById('edges');
    svg.setAttribute('width', w); svg.setAttribute('height', h);
    svg.setAttribute('viewBox','0 0 '+w+' '+h);
  }

  function renderEdges(){
    const svg = document.getElementById('edges');
    const cv  = document.getElementById('canvas');
    const R = rects(), all = Object.values(R);
    const W = cv.clientWidth||parseFloat(cv.style.width)||720;
    let Hh = cv.clientHeight||parseFloat(cv.style.height)||420;

    const cs = getComputedStyle(document.documentElement);
    const accent = cs.getPropertyValue('--accent').trim() || '#0f766e';
    const muted  = cs.getPropertyValue('--muted').trim()  || '#697280';

    const paths = [];
    let needY = 0;
    (BP.edges||[]).forEach(e=>{
      const a=R[e.from], b=R[e.to]; if(!a||!b||e.from===e.to) return;
      // 同一个目标的多条线，落点沿它的左边散开：不然 11 支箭头全戳在同一个点上
      const toList = (BP.edges||[]).filter(x=>x.to===e.to && R[x.from] && x.from!==x.to)
        .sort((m,n2)=> (R[m.from].y+R[m.from].h/2) - (R[n2.from].y+R[n2.from].h/2));
      const k = toList.indexOf(e), n = toList.length;
      // 落点按上游的上下顺序排开：扇面不交叉，箭头也不会全戳在同一个点
      const dy = n>1 ? (k/(n-1)-0.5) * b.h * 0.8 : 0;
      const r = edgePath(a,b,all,{dy, i:k});
      needY = Math.max(needY, r.maxY);
      const vol = e.carrier==='volume';
      const al = (BP.slots.find(s=>s.id===e.from)||{}).label||e.from;
      const bl = (BP.slots.find(s=>s.id===e.to)||{}).label||e.to;
      const tip = al+' → '+bl+' · '+(vol?'共享卷 '+(e.path||''):'env '+(e.env||''));
      paths.push('<g class="eg"><title>'+esc(tip)+'</title>'+
        '<path class="hit" d="'+r.d+'"/>'+
        '<path class="line'+(vol?' vol':'')+'" d="'+r.d+'" marker-end="url(#'+(vol?'ahv':'ah')+')"/>'+
        (vol?'<text x="'+(a.x+a.w+9)+'" y="'+(a.y+a.h/2-8)+'" font-size="10" fill="'+muted+
              '" text-anchor="start" font-family="ui-monospace,monospace" paint-order="stroke" '+
              'stroke="var(--panel)" stroke-width="3" style="pointer-events:none">共享卷</text>':'')+
        '</g>');
    });

    if(needY + 24 > Hh){
      Hh = needY + 24;
      cv.style.height = Hh+'px'; svg.setAttribute('height', Hh); svg.setAttribute('viewBox','0 0 '+W+' '+Hh);
    }
    svg.innerHTML =
      '<defs>'+
        '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">'+
          '<path d="M0,0 L10,5 L0,10 z" fill="'+accent+'"/></marker>'+
        '<marker id="ahv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">'+
          '<path d="M0,0 L10,5 L0,10 z" fill="'+muted+'"/></marker>'+
      '</defs>' + paths.join('');
  }

  /* ---- 拖动：把卡片从「排布结果」里拿出来，位置存本地 ---- */
  let drag = null, raf = 0;
  const snap = v => Math.round(v/4)*4;

  function bindCards(els){
    Object.entries(els).forEach(([id, el])=>{
      const s = BP.slots.find(x=>x.id===id);

      // 内置区开关：胶囊 → 清单 → 卡片墙 → 收起。点按钮不算拖卡（pointerdown 里已跳过 button）
      el.querySelectorAll('[data-open]').forEach(b=>{
        b.onclick = ev=>{ ev.stopPropagation(); cycleOpen(id); };
      });
      el.querySelectorAll('[data-wall-list]').forEach(b=>{
        b.onclick = ev=>{ ev.stopPropagation(); setOpen(b.dataset.wallList, 'list'); };
      });
      el.querySelectorAll('[data-out]').forEach(b=>{
        b.onclick = ev=>{ ev.stopPropagation(); release(b.dataset.out); };
      });

      el.addEventListener('pointerdown', ev=>{
        if(ev.button!==0) return;
        // 点画布上的卡就地关掉小卡；点的是当前弹出那一项则留着交给下面 toggle
        const kidEl = ev.target.closest('.kid') || ev.target.closest('[data-bi]');
        const cid0  = kidEl && (kidEl.dataset.kid || kidEl.dataset.bi);
        const same  = !!cid0 && POP===cid0;
        if(POP && !same) POP = null;
        if(ev.target.closest('input,select,button,a')) return;
        // 胶囊（收起态）或虚线框里的一行（展开态）点开 = 弹出这张内置面板的小卡片
        if(kidEl){
          ev.preventDefault();
          POP = same ? null : cid0;
          active = cid0; draw(); return;
        }
        drag = {id, el, sx:ev.clientX, sy:ev.clientY,
                ox:parseFloat(el.style.left)||0, oy:parseFloat(el.style.top)||0, moved:false};
        el.setPointerCapture(ev.pointerId);
        el.classList.add('dragging');
        document.body.style.userSelect='none';
        ev.preventDefault();
        try{ el.focus({preventScroll:true}); }catch(e){ el.focus(); }
      });
      el.addEventListener('pointermove', ev=>{
        if(!drag || drag.el!==el) return;
        const dx = ev.clientX-drag.sx, dy = ev.clientY-drag.sy;
        if(!drag.moved && Math.abs(dx)+Math.abs(dy) < 3) return;
        drag.moved = true;
        el.style.left = Math.max(8, snap(drag.ox+dx))+'px';
        el.style.top  = Math.max(8, snap(drag.oy+dy))+'px';
        const hot = zoneAt(ev.clientX, ev.clientY, id);
        if(hot!==dragHot){ dragHot = hot; paintHot(); }
        if(!raf) raf = requestAnimationFrame(()=>{ raf=0; renderEdges(); });
      });
      el.addEventListener('pointerup', ev=>{
        if(!drag || drag.el!==el) return;
        const moved = drag.moved;
        const hot = moved ? zoneAt(ev.clientX, ev.clientY, id) : null;
        el.releasePointerCapture(ev.pointerId);
        el.classList.remove('dragging');
        document.body.style.userSelect='';
        drag = null;
        if(dragHot!==null || hot){ dragHot = null; paintHot(); }
        if(hot){ adopt(hot, id); return; }
        if(moved){
          POS[pkey(id)] = {x:parseFloat(el.style.left)||0, y:parseFloat(el.style.top)||0};
          savePos(); sizeCanvas({w:0,h:0}); renderEdges(); syncLayoutBtn();
        } else if(active!==id){
          active = id; draw();
        }
      });
      el.addEventListener('pointercancel', ()=>{
        if(drag && drag.el===el){
          el.classList.remove('dragging'); document.body.style.userSelect=''; drag=null;
          dragHot=null; paintHot();
        }
      });
      el.addEventListener('keydown', ev=>{
        const step = ev.shiftKey? 40 : 8;
        const moves = {ArrowLeft:[-step,0], ArrowRight:[step,0], ArrowUp:[0,-step], ArrowDown:[0,step]};
        if(moves[ev.key]){
          ev.preventDefault();
          const x = Math.max(8,(parseFloat(el.style.left)||0)+moves[ev.key][0]);
          const y = Math.max(8,(parseFloat(el.style.top)||0)+moves[ev.key][1]);
          el.style.left=x+'px'; el.style.top=y+'px';
          POS[pkey(id)] = {x,y}; savePos(); sizeCanvas({w:0,h:0}); renderEdges(); syncLayoutBtn();
          return;
        }
        if(ev.key==='Enter' || ev.key===' '){ ev.preventDefault(); active=id; draw(); }
      });
    });
  }

  /* ---- 拖进内置区：给它写上 parent，从此跑在宿主进程里 ---- */
  function zoneAt(x, y, selfId){
    const zones = document.querySelectorAll('.card .bzone[data-zone]');
    for(const z of zones){
      const pid = z.dataset.zone;
      if(pid===selfId) continue;
      const r = z.getBoundingClientRect();
      if(x>=r.left-8 && x<=r.right+8 && y>=r.top-8 && y<=r.bottom+8) return pid;
    }
    return null;
  }
  function paintHot(){
    document.querySelectorAll('.card .bzone[data-zone]').forEach(z=>{
      z.classList.toggle('hot', z.dataset.zone===dragHot);
    });
  }

  function adopt(pid, cid){
    const par = BP.slots.find(s=>s.id===pid), c = BP.slots.find(s=>s.id===cid);
    if(!par || !c || pid===cid || c.parent) return;
    if(kidsOf(cid).length){
      toast('「'+c.label+'」自己还带着 '+kidsOf(cid).length+' 张内置面板，不能再并进别处');
      return;
    }
    const cut = (BP.edges||[]).filter(e=>e.from===cid||e.to===cid).length;
    BP.edges = (BP.edges||[]).filter(e=>e.from!==cid && e.to!==cid);
    c.parent = pid;
    delete c.port;                      // 跑在宿主进程里，不该再占一个宿主端口
    delete POS[pkey(cid)]; savePos();    // 它不再有自己的位置
    delete OPEN[pkey(cid)]; saveOpen();
    active = cid; draw();
    toast('「'+c.label+'」已并进「'+par.label+'」——不下载、不占端口、不进连线'+
          (cut?'；原来那 '+cut+' 条连线已断开':''));
  }

  function release(cid){
    const c = BP.slots.find(s=>s.id===cid);
    if(!c || !c.parent) return;
    const par = BP.slots.find(s=>s.id===c.parent);
    delete c.parent;
    delete OPEN[pkey(cid)]; saveOpen();
    active = cid; draw();
    toast('「'+c.label+'」已取出，回到画布当独立卡片'+(par?'；不再是「'+par.label+'」的内置面板':''));
  }

  /* 一张内置面板的卡面。小卡（.pop）和卡片墙（.wcard）共用这一份：
     它跟别的软件卡是同一套写法——条目 + 模块 + 能力，只是随中台装上 */
  function kidCard(kid, par, picks, opt){
    opt = opt || {};
    const wall = opt.mode === 'wall';
    const p = picks[kid.id];
    const e = (p && !p.custom) ? ENTRIES[p.eid] : null;
    const need = kid.needs || [];
    const style = '--o:var(--o-'+originOfSlot(kid)+')' +
      (opt.pos ? ';left:'+opt.pos.x+'px;top:'+opt.pos.y+'px' : '');
    return '<div class="'+(wall?'wcard':'pop')+(kid.id===active?' on':'')+'"'+
      (opt.id?' id="'+opt.id+'"':'')+(wall?' data-wcard="'+esc(kid.id)+'"':'')+
      ' style="'+style+'">'+
      '<div class="hd"><i class="dot"></i><span>'+esc(kid.label)+'</span>'+
        '<span class="tag">内置</span>'+
        (wall?'':'<button class="x" data-kid-close aria-label="关闭">×</button>')+'</div>'+
      '<div class="sub">跑在「'+esc(par?par.label:'宿主')+'」那个进程里 · 不下载、不占端口、不进连线</div>'+
      (need.length? '<div class="caps">'+need.map(c=>'<span>'+esc(c)+'</span>').join('')+'</div>' : '')+
      '<div class="ml">'+(e
        ? esc(e.name)+' · '+e.modules.length+' 个模块<br>'+
          e.modules.map(m=>'<span class="mo"><i style="background:var(--o-'+originOfMod(e.id,m)+')"></i>'+
            esc(m.label||m.id)+'</span>').join('')
        : esc(kid.custom? '手写胶水 · 不对外提供能力' : '未匹配到软件'))+'</div>'+
      '<div class="acts"><button data-kid-more>在右栏看详情</button>'+
        '<button data-kid-out>取出</button></div></div>';
  }

  /* 点内置面板 → 在父卡旁边弹一张小卡。看的是同一份数据，只是不用离开画布 */
  function renderPop(els, picks){
    const old = document.getElementById('pop'); if(old) old.remove();
    const kid = POP && BP.slots.find(s=>s.id===POP);
    if(!kid || !kid.parent){ POP = null; return; }
    const pel = els[kid.parent]; if(!pel){ POP = null; return; }
    const par = BP.slots.find(s=>s.id===kid.parent);
    const px = parseFloat(pel.style.left)||0, py = parseFloat(pel.style.top)||0;
    const cv = document.getElementById('canvas');
    const cvW = parseFloat(cv.style.width)||900;
    const W = 214, gap = 16;
    let x = px + CARD_W + gap;                       // 优先放父卡右边
    if(x + W > cvW - 8) x = Math.max(8, px - W - gap);   // 右边放不下就翻到左边
    const y = Math.max(8, py + 20);

    document.getElementById('slots').insertAdjacentHTML('beforeend',
      kidCard(kid, par, picks, {id:'pop', pos:{x:Math.round(x), y:Math.round(y)}}));

    const el = document.getElementById('pop');
    el.querySelector('[data-kid-close]').onclick = ()=>{ POP=null; draw(); };
    el.querySelector('[data-kid-more]').onclick  = ()=>{ POP=null; active=kid.id; draw(); };
    el.querySelector('[data-kid-out]').onclick   = ()=>{ POP=null; release(kid.id); };
  }

  /* 「全部展开」：把这张卡里的内置面板统统摊成卡片墙（p1 → 一堆 p2）。
     浮层不参与排布、不进导出——它只是把同一份数据换个尺度看，布局算法一行没动 */
  function renderWall(picks){
    const old = document.getElementById('wallwrap'); if(old) old.remove();
    const owner = BP.slots.find(s => openState(s.id)==='all' && kidsOf(s.id).length);
    if(!owner) return;
    const kids = kidsOf(owner.id);
    const wrap = document.createElement('div');
    wrap.className = 'wallwrap'; wrap.id = 'wallwrap';
    wrap.innerHTML =
      '<div class="wall" role="dialog" aria-label="'+esc(owner.label+' 的内置面板')+'" '+
        'style="--o:var(--o-'+originOfSlot(owner)+')">'+
        '<div class="whd"><i class="dot"></i><b>'+esc(owner.label)+'</b>'+
          '<span class="tag">内置 '+kids.length+'</span>'+
          '<span class="wacts">'+
            '<button data-wall-list>收成清单</button>'+
            '<button class="x" data-wall-close aria-label="关闭">×</button></span>'+
          '<span class="wsub">全是插件，跟别的格子同一套写法：条目 + 模块 + 能力。只差别一处 —— '+
            '随中台装上，所以不下载、不占端口、不进连线。</span></div>'+
        '<div class="wgrid">'+kids.map(k=>kidCard(k, owner, picks, {mode:'wall'})).join('')+'</div>'+
      '</div>';
    document.getElementById('stage').appendChild(wrap);

    // 退回清单但别抢选中：从某张卡点「看详情」过来时，右栏该停在那一张上
    const back = (keep)=> setOpen(owner.id, 'list', !!keep);
    wrap.addEventListener('pointerdown', ev=>{ if(ev.target === wrap) back(); });
    wrap.querySelector('[data-wall-close]').onclick = back;
    wrap.querySelector('[data-wall-list]').onclick  = back;
    wrap.querySelectorAll('.wcard').forEach(c=>{
      const cid = c.dataset.wcard;
      c.querySelector('[data-kid-more]').onclick = ev=>{ ev.stopPropagation(); POP=null; active=cid; back(true); };
      c.querySelector('[data-kid-out]').onclick  = ev=>{ ev.stopPropagation(); release(cid); };
      c.onclick = ev=>{
        if(ev.target.closest('button')) return;
        POP = null; active = cid; draw();
      };
    });
  }

  // 点别处 / Esc 关掉小卡。卡片自己的 pointerdown 会先处理（清 POP 或 preventDefault），
  // 这里看到 defaultPrevented 就跳过——否则刚弹出的卡片会被同一个事件立刻关掉
  document.addEventListener('pointerdown', ev=>{
    if(!POP || ev.defaultPrevented) return;
    if(ev.target.closest('#pop')) return;
    POP = null; draw();
  });
  document.addEventListener('keydown', ev=>{
    if(ev.key!=='Escape') return;
    if(POP){ POP = null; draw(); return; }
    const owner = BP.slots.find(s=>openState(s.id)==='all');
    if(owner) setOpen(owner.id, 'list');            // 卡片墙也吃 Esc：退回清单
  });

  function syncLayoutBtn(){
    const btn = document.getElementById('btn-layout');
    const n = BP.slots.filter(s=>POS[pkey(s.id)]).length;
    btn.textContent = n? '自动排布 ('+n+')' : '自动排布';
    btn.title = n? n+' 格是手动位置，点这里全部回到自动' : '按连线重新排布';
  }

  function drawLegend(picks){
    const used=new Set();
    BP.slots.forEach(s=>{
      used.add(originOfSlot(s));
      const p=picks[s.id];
      if(p && !p.custom) p.sel.forEach(m=>used.add(originOfMod(p.eid,m)));
    });
    document.getElementById('legend').innerHTML = '<span class="cap">来源</span>' +
      ORIGIN_LIST.map(o=>
        '<span class="'+(used.has(o.id)?'':'off')+'" title="'+esc(o.note||o.label)+'">'+
        '<i style="background:var(--o-'+o.id+')"></i>'+esc(o.label)+'</span>').join('');
  }

  function gapList(){
    const gaps = [];
    BP.slots.forEach(s=>{
      const p = chosen(s,new Set());
      if(p && !p.custom && p.miss.length) gaps.push(s.label+' 缺 '+p.miss.join('、'));
    });
    return gaps;
  }

  function drawHint(){
    const el = document.getElementById('hint');
    const gaps = gapList();
    const nKids = BP.slots.filter(isKid).length;
    el.className = 'hintbar' + (gaps.length?' warn':'');
    el.textContent = gaps.length
      ? '⚠ '+gaps.join('；')+' —— 解析器不会硬凑，标 custom 或补能力词表'
      : (nKids? '拖动移动 · 「7 ⌄」列清单 · 「7 ⊞」把内置面板全摊成卡 · 卡拖进虚线框就并入'
              : '拖动移动 · 方向键微调 · 自动排布复位');
  }

  function drawStats(picks,pmap){
    // 内置面板不单独算「软件」：它们跑在父格进程里，没有下载、没有端口、也不计内存
    let ram=0, n=0, gaps=0, self=0;
    for(const s of tops()){
      const p=picks[s.id]; if(!p) continue;
      if(p.custom){ self++; continue; }
      n++;
      ram += (ENTRIES[p.eid].cost||{}).ram_mb||0;
      gaps += p.miss.length;
    }
    const usedPorts = Object.keys(pmap).length;
    const nKids = BP.slots.filter(isKid).length;
    const nm = document.getElementById('bpname');
    nm.textContent = BP.goal || BP.name; nm.title = BP.name + ' · ' + BP.id;
    document.getElementById('stats').innerHTML =
      '<span class="stat"><b>'+n+'</b> 个软件</span>'+
      (nKids?'<span class="stat" title="随中台装上：不下载、不占端口、不进连线"><b>'+nKids+'</b> 内置</span>':'')+
      '<span class="stat"><b>'+self+'</b> 处自写</span>'+
      '<span class="stat" title="端口池 '+ports().length+' 个；其余是本图钉死的现网端口"><b>'+usedPorts+'</b> 个端口</span>'+
      '<span class="stat"><b>'+ram+'</b> MB</span>'+
      (gaps?'<span class="stat bad">缺 <b>'+gaps+'</b> 条能力</span>':'<span class="stat">能力全覆盖</span>');
  }

  function drawInspector(picks,pmap){
    const box=document.getElementById('insp');
    const s = BP.slots.find(x=>x.id===active);
    if(!s){ box.innerHTML = overview(); bindOverview(); return; }
    if(isKid(s)){ box.innerHTML = kidPanel(s, picks[s.id]); bindKid(s); return; }
    const p = picks[s.id];
    const need = s.needs||[];
    const ranked = s.custom?[]:rank(need,new Set(BP.slots.filter(x=>x!==s).map(x=>chosen(x,new Set())).filter(x=>x&&x.eid).map(x=>x.eid)), s.use&&s.use.entry);
    const og = originOfSlot(s);
    const manual = !!POS[pkey(s.id)];

    let h='<h3><i class="dot" style="background:var(--o-'+og+')"></i>'+esc(s.label)+'</h3>'+
          '<p class="hint">'+esc(s.note||'（未写说明）')+'</p>';
    h+='<div class="field"><label>来源</label><select id="f-origin">'+
       ORIGIN_LIST.map(o=>'<option value="'+o.id+'"'+(og===o.id?' selected':'')+'>'+esc(o.label)+'</option>').join('')+
       '</select><span style="margin-left:auto;font:11px var(--mono)">'+(pmap[s.id]?':'+pmap[s.id]:'')+'</span></div>';
    h+='<div class="field"><label for="chk-custom">手写胶水</label>'+
       '<input type="checkbox" id="chk-custom" '+(s.custom?'checked':'')+' style="flex:none;margin-left:auto">'+
       (manual?'<button id="btn-reset-pos" style="margin-left:8px;padding:3px 9px;font-size:11px" '+
         'title="这一格现在用的是你拖过的位置">位置复位</button>':'')+
       '</div>';

    if(!s.custom){
      h+='<h4>候选软件（按能力覆盖打分）</h4><ul class="cands">';
      const list = ranked.slice(0,5);
      if(!list.length) h+='<li class="empty">词表里没有软件提供这些能力</li>';
      for(const r of list){
        const e=ENTRIES[r.eid];
        const sel = p && !p.custom && p.eid===r.eid;
        h+='<li class="cand'+(sel?' sel':'')+'" data-pick="'+r.eid+'" tabindex="0">'+
           '<div class="r1"><b><i class="dot" style="background:var(--o-'+(e.origin||'oss')+')"></i>'+esc(e.name)+'</b>'+
           '<span class="tag">'+esc(e.kind)+'</span>'+
           '<span class="sc">'+r.s.toFixed(1)+'</span></div>'+
           '<div class="r2">覆盖 '+r.hit.length+'/'+need.length+' · '+(e.cost&&e.cost.ram_mb||0)+'MB'+
           (r.miss.length?' · 缺 '+r.miss.length+' 条':'')+'</div>'+
           '<div class="bar"><i style="width:'+Math.max(4,Math.min(100,r.s))+'%"></i></div>'+
           (sel?modList(e,r.sel):'')+
           '</li>';
      }
      h+='</ul>';
      if(s.use&&s.use.entry) h+='<div style="margin-top:9px"><button id="btn-unpin">取消钉死，交回推荐</button></div>';
    } else {
      h+='<h4>这一格要你写</h4><p class="hint">解析器会生成 <code>'+esc(s.id)+'/main.py</code> 骨架、'+
         '端口 '+(pmap[s.id]||'—')+'、<code>/api/ping</code> 探活，以及下面这张注入表。逻辑本身（几十行）留给你。</p>';
    }

    h+='<h4>对外提供的能力</h4>';
    h+= s.custom
      ? '<div class="row"><input id="f-out" value="'+esc((s.outputs||[]).join(','))+'" placeholder="如 news.digest"></div>'
      : '<p class="hint">由所选模块决定：'+esc((p&&!p.custom)?p.sel.map(m=>m.capability).join('、'):'—')+'</p>';

    h+='<h4>连线</h4>';
    const ins = BP.edges.filter(e=>e.to===s.id), outs=BP.edges.filter(e=>e.from===s.id);
    if(!ins.length&&!outs.length) h+='<p class="hint">还没有连线</p>';
    for(const e of [...ins,...outs]){
      const other = e.to===s.id? BP.slots.find(x=>x.id===e.from) : BP.slots.find(x=>x.id===e.to);
      h+='<div class="edge-item"><span class="tag">'+(e.carrier==='volume'?'卷':'env')+'</span>'+
         esc((e.to===s.id?'← ':'→ ')+(other?other.label:''))+
         (e.carrier==='env'&&e.env?' <span class="tag">'+esc(e.env)+'</span>':'')+
         '<button class="x" data-del-edge="'+esc(e.from+'|'+e.to)+'" aria-label="断开">×</button></div>';
    }
    if(!s.custom){
      h+='<div class="row" style="margin-top:9px"><select id="f-edge-to"><option value="">连到…</option>'+
         BP.slots.filter(x=>x.id!==s.id).map(x=>'<option value="'+x.id+'">'+esc(x.label)+'</option>').join('')+
         '</select><select id="f-edge-carrier"><option value="env">env</option><option value="volume">共享卷</option></select>'+
         '<button id="btn-add-edge">加</button></div>';
      h+='<p class="hint" style="margin-top:7px">env：下游读这个地址；共享卷：两个容器挂同一目录（适合文件）</p>';
    }
    h+='<div style="margin-top:20px"><button id="btn-del">删除这一格</button></div>';
    box.innerHTML=h;

    const fo2=document.getElementById('f-origin'); if(fo2) fo2.onchange=()=>{ s.origin=fo2.value; draw(); };
    const cc=document.getElementById('chk-custom'); if(cc) cc.onchange=()=>{
      s.custom=cc.checked; if(s.custom){ s.outputs=s.needs.slice(); } draw();
    };
    const rp=document.getElementById('btn-reset-pos'); if(rp) rp.onclick=()=>{
      delete POS[pkey(s.id)]; savePos(); draw();
    };
    box.querySelectorAll('[data-pick]').forEach(li=>{
      const pick=()=>{
        const eid=li.dataset.pick;
        s.use={entry:eid, modules: modsOf(eid, null, s.needs).map(m=>m.id)};
        draw();
      };
      li.onclick=ev=>{ if(ev.target.tagName==='INPUT'||ev.target.tagName==='LABEL') return; pick(); };
      li.onkeydown=ev=>{ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); pick(); } };
    });
    box.querySelectorAll('[data-mod]').forEach(cb=>cb.onchange=()=>{
      const cur = [...box.querySelectorAll('[data-mod]')].filter(x=>x.checked).map(x=>x.dataset.mod);
      const eid = (s.use && s.use.entry) || (p && !p.custom ? p.eid : null);
      if(!eid) return;
      s.use = {entry: eid, modules: cur.length?cur:null};
      draw();
    });
    const up=document.getElementById('btn-unpin'); if(up) up.onclick=()=>{ delete s.use; draw(); };
    const fo=document.getElementById('f-out'); if(fo) fo.onchange=()=>{ s.outputs=fo.value.split(',').map(x=>x.trim()).filter(Boolean); draw(); };
    const be=document.getElementById('btn-add-edge'); if(be) be.onclick=()=>{
      const to=document.getElementById('f-edge-to').value; if(!to) return toast('先选一个目标格子');
      const carrier=document.getElementById('f-edge-carrier').value;
      const e={from:s.id,to,carrier};
      if(carrier==='volume') e.path='/data';
      else e.env='SRC_'+s.id.toUpperCase().replace(/[^A-Z0-9]/g,'_');
      BP.edges.push(e); draw();
    };
    box.querySelectorAll('[data-del-edge]').forEach(b=>b.onclick=()=>{
      const [f,t]=b.dataset.delEdge.split('|');
      BP.edges = BP.edges.filter(e=>!(e.from===f&&e.to===t)); draw();
    });
    const del=document.getElementById('btn-del'); if(del) del.onclick=()=>{
      BP.slots=BP.slots.filter(x=>x.id!==s.id);
      BP.edges=BP.edges.filter(e=>e.from!==s.id&&e.to!==s.id);
      delete POS[pkey(s.id)]; savePos();
      active=null; draw();
    };
  }

  /* 内置面板：同一套条目 + 模块 + 能力，只是默认装上。这一屏就是把这句差别讲透 */
  function kidPanel(s, p){
    const e = (p && !p.custom) ? ENTRIES[p.eid] : null;
    const par = BP.slots.find(x=>x.id===s.parent);
    const og = originOfSlot(s);
    const host = esc(par?par.label:'宿主');
    const native = !!(e && e.kind==='builtin');   // 目录里本来就是内置插件（不是从画布并进来的）
    let h='<h3><i class="dot" style="background:var(--o-'+og+')"></i>'+esc(s.label)+
          ' <span class="tag">内置</span></h3>'+
          '<p class="hint">'+esc(s.note||'（未写说明）')+'</p>'+
          '<div class="bnote">'+
          (native
            ? '跟别的格子是<strong>同一套写法</strong>：条目 <code>'+esc(e.id)+'</code> '+
              '+ 模块 + 能力，同样能被解析、能勾模块。区别只有一处 —— 它随「'+host+'」装上：'+
              '<strong>不下载、不占端口、不进连线</strong>，因为它跑在「'+host+'」那个进程里。'
            : '它本来是一张<strong>独立卡片</strong>，被你拖进了「'+host+'」的内置区。'+
              '从那以后它<strong>不下载、不占端口、不进连线</strong>——跑在「'+host+'」那个进程里，'+
              '原来挂在上面的连线已经断开。还原就把下面「取出」点一下。')+
          '</div>';
    if(e){
      h+='<h4>分解 · '+e.modules.length+' 个模块</h4><div class="km-list">'+
        e.modules.map(m=>'<div class="km"><i class="mdot" style="background:var(--o-'+originOfMod(e.id,m)+')"></i>'+
          '<b>'+esc(m.label||m.id)+'</b><span class="tag">'+esc(m.capability)+'</span>'+
          '<span class="tag">'+(native?'随中台':'随宿主')+'</span></div>'+
          (m.note?'<div class="kmn">'+esc(m.note)+'</div>':'')).join('')+'</div>';
      if(native) h+='<p class="hint" style="margin-top:8px">这些模块在目录里同样是一条条列着的，'+
         '只不过制品是 <code>none</code>：不产生下载项，勾不勾都在这儿。</p>';
    }
    h+='<h4>提供的能力</h4><p class="hint">'+esc((s.needs||[]).join('、')||'—')+'</p>';
    h+='<h4>连线</h4><p class="hint">子卡不是独立服务，不能出现在连线两端；'+
       '它要的数据从「'+host+'」那里拿。</p>';
    h+='<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">'+
       (par?'<button id="btn-to-parent">← 回到 '+host+'</button>':'')+
       '<button id="btn-out-kid">取出，变回独立卡片</button></div>';
    return h;
  }
  function bindKid(s){
    const b=document.getElementById('btn-to-parent');
    if(b) b.onclick=()=>{ active=s.parent; draw(); scrollToSlot(s.parent); };
    const o=document.getElementById('btn-out-kid');
    if(o) o.onclick=()=>release(s.id);
  }

  function modList(e, sel){
    return '<ul class="mods">'+e.modules.map(m=>{
      const on = sel.includes(m);
      return '<li><input type="checkbox" data-mod="'+esc(m.id)+'" '+(on?'checked':'')+'>'+
        '<span><i class="mdot" style="background:var(--o-'+originOfMod(e.id,m)+')"></i>'+
        '<b>'+esc(m.label||m.id)+'</b> <span class="tag">'+esc(m.capability)+'</span>'+
        (m.cost&&m.cost.ram_mb?' · +'+m.cost.ram_mb+'MB':'')+
        (m.note?'<br>'+esc(m.note):'')+'</span></li>';
    }).join('')+'</ul>';
  }

  function overview(){
    const groups={};
    CAT.capabilities.forEach(c=>{ (groups[c.group||'其他'] ||= []).push(c); });
    let h='<h3>能力词表</h3><p class="hint">格子填的是这些能力，不是软件名。点一个加进画布。</p>';
    for(const g in groups){
      h+='<h4>'+esc(g)+'</h4><div style="display:flex;flex-wrap:wrap;gap:5px">'+
        groups[g].map(c=>'<button data-addcap="'+esc(c.id)+'" style="font-size:11.5px;padding:4px 8px">'+esc(c.label)+'</button>').join('')+'</div>';
    }
    h+='<h4>目录里的软件</h4><ul class="mods">'+CAT.entries.map(e=>
      '<li><i class="mdot" style="background:var(--o-'+(e.origin||'oss')+')"></i><b>'+esc(e.name)+'</b> '+
      (e.kind==='builtin'?'<span class="tag">内置</span>':(e.kind==='existing'?'<span class="tag">只登记</span>':''))+
      ' <span class="tag">'+esc(e.modules.map(m=>m.capability.split('.').pop()).join('/'))+'</span></li>').join('')+'</ul>';
    return h;
  }
  function scrollToSlot(id){
    const el = document.querySelector('.card[data-id="'+id+'"]');
    if(el) el.scrollIntoView({block:'nearest', inline:'nearest', behavior:'smooth'});
  }
  function bindOverview(){
    document.querySelectorAll('[data-addcap]').forEach(b=>b.onclick=()=>{
      const cap=b.dataset.addcap;
      const id='s'+(BP.slots.length+1)+'-'+cap.split('.').pop();
      BP.slots.push({id, label:CAPS[cap]?CAPS[cap].label:cap, needs:[cap]});
      active=id; draw(); scrollToSlot(id);
    });
  }

  function toast(m){
    const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on');
    clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800);
  }

  document.getElementById('btn-export').onclick=()=>{
    const out=JSON.parse(JSON.stringify(BP));
    out.slots.forEach(s=>{ if(s.use&&!s.use.modules) delete s.use.modules; });
    const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='blueprint-'+BP.id+'.json'; a.click(); URL.revokeObjectURL(a.href);
    toast('已导出蓝图，接着跑解析命令');
  };
  document.getElementById('btn-cmd').onclick=async()=>{
    const cmd='moshan-plug blueprint blueprint-'+BP.id+'.json --out examples/generated-'+BP.id+'.moshan.json --topology';
    try{ await navigator.clipboard.writeText(cmd); toast('命令已复制'); }
    catch(e){ toast(cmd); }
  };
  document.getElementById('btn-add').onclick=()=>{ active=null; draw(); };
  document.getElementById('btn-layout').onclick=()=>{
    const n = BP.slots.filter(s=>POS[pkey(s.id)]).length;
    BP.slots.forEach(s=>{ delete POS[pkey(s.id)]; });
    savePos(); draw(); syncLayoutBtn();
    toast(n? '已回到自动排布（撤销了 '+n+' 格手动位置）' : '已按连线重新排布');
  };

  // 案例切换：CASES 里就是蓝图对象本身，改过的格子留在内存里，切回去还在
  const selCase = document.getElementById('case');
  CASES.forEach((bp,i)=>{
    const o=document.createElement('option');
    o.value=String(i); o.textContent=bp.name+' · '+bp.id;
    if(bp.id===BP.id) o.selected=true;
    selCase.appendChild(o);
  });
  selCase.onchange=()=>{
    BP = CASES[+selCase.value]; active=null; POP=null;
    for(const k in OPEN) if(OPEN[k]==='all') OPEN[k]='list';   // 摊开是临时视图，换案例就收
    saveOpen(); draw(); syncLayoutBtn();
    const sc=document.querySelector('.scroller'); sc.scrollTo({top:0,left:0,behavior:'smooth'});
  };

  let rt=0;
  window.addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(()=>{ draw(); }, 120); });

  draw();
  syncLayoutBtn();
})();
</script>
</body>
</html>
