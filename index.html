:"约 150 万","outline":["容器化：一个 Dockerfile，环境变量注入密钥","反代用 Caddy，自动证书","加鉴权中间件（token 或 basic auth）与限流","部署脚本一键化，别手敲命令"]}]},{"id":"ai.deliver.ops","name":"可观测","kind":"module","dom":"ai.deliver","abstract":"日志、用量、错误、成本","note":"AI 应用的特点是「同样的输入不同输出」，所以传统日志不够，要记下每次调用的输入摘要、模型、token、耗时、结果质量。没有这层，优化成本和质量都是瞎猜——实测里积分失控的根因几乎都能在这里找到。","ins":"外部动作","outs":"结构化记录","pv":[{"id":"langfuse","n":"Langfuse","k":"oss","lic":"MIT(需核)","repo":"langfuse/langfuse","note":"专为 LLM 应用做的追踪，能看到完整链路","effort":"","tokens":"","outline":[]},{"id":"otel","n":"OpenTelemetry","k":"oss","lic":"Apache-2.0","repo":"open-telemetry/opentelemetry-python","note":"通用标准，接 Grafana 生态","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"先做记账，追踪框架后面再上","effort":"3 天","tokens":"约 200 万","outline":["每次调用记一行：task / model / in_tokens / out_tokens / 耗时 / 状态","按 task 聚合出成本表，这是优化的入口","记录输入摘要与输出摘要，便于抽样评估质量","设阈值告警：单任务超预算、失败率突增"]}]},{"id":"ai.agent.search","name":"联网检索","kind":"module","dom":"ai.agent","abstract":"把外部实时信息拉进来，突破训练截止","note":"判断要不要它：答案需要「今天」的信息就必须有。做法分两类——自带索引的搜索引擎 API（贵但准），或自己抓（省但脏）。坑：抓回来的网页不截断直接塞上下文，一次就爆；还有去重，同一篇稿子被多家转载会重复占位。给模型看之前一定要先摘成 3–5 条要点。","ins":"文本","outs":"文本","pv":[{"id":"searxng","n":"SearXNG","k":"oss","lic":"AGPL-3.0","repo":"searxng/searxng","note":"自建元搜索，不依赖商业 API，结果要自己清洗","effort":"","tokens":"","outline":[]},{"id":"tavily","n":"Tavily / Brave Search API","k":"commercial","lic":"","repo":"","note":"专为 LLM 优化，返回已摘好的片段","effort":"","tokens":"","outline":[]},{"id":"metaso","n":"秘塔搜索","k":"commercial","lic":"","repo":"","note":"中文语境好，有 API","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"检索质量八成靠查询改写，不是靠换搜索源","effort":"3 天","tokens":"约 200 万","outline":["查询改写：把口语问题变成 2–3 个检索式","抓取后正文提取（readability 算法），丢导航与广告","按域名去重 + 按内容相似度去重","每条摘成 80 字要点并保留 URL，供引用"]}]},{"id":"ai.media.doc","name":"文档生成","kind":"module","dom":"ai.media","abstract":"生成 PPT、Word、表格这类结构化文件","note":"和「生成一段文字」的差别：要套模板、要排版、要素材位置正确。技术路线是「先出结构化大纲，再套模板渲染」，不要让模型直接吐 HTML/XML——格式必崩。坑：中文字体在服务端渲染经常缺字，必须预装字体；表格里的数字要能回溯来源，否则没法用。","ins":"文本+结构化记录","outs":"产物文件","pv":[{"id":"python-pptx","n":"python-pptx / docxtpl","k":"oss","lic":"MIT","repo":"scanny/python-pptx","note":"模板占位符替换，最稳，样式由模板控制","effort":"","tokens":"","outline":[]},{"id":"marp","n":"Marp","k":"oss","lic":"MIT","repo":"marp-team/marp","note":"Markdown 转幻灯片，写起来快，样式受限","effort":"","tokens":"","outline":[]},{"id":"gamma","n":"Gamma API","k":"commercial","lic":"","repo":"","note":"排版好看，但可控性差、按次收费","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"大纲与渲染必须分开，混在一起必然返工","effort":"4 天","tokens":"约 300 万","outline":["第一步只出大纲 JSON：章节、每页标题、要点、需要的图","渲染层用 python-pptx 按模板填，不生成 XML","图片走占位框，尺寸按版式算好再插","导出后回读校验页数与字号，渲染崩了能发现"]}]},{"id":"ai.text.copy","name":"营销文案","kind":"module","dom":"ai.text","abstract":"卖点 + 平台调性 → 可直接发布的种草/测评/电商文案","note":"关键不在「写得好看」，在「符合平台规则」：小红书要口语和分段，亚马逊要关键词密度，公众号要结构。通常做法是「表单模板 + 平台片段 + 少量爆款样例」，样例比提示词有效得多。坑：同一套提示词喂所有平台，出来全是一个味，用户一眼看出是批量货。不需要它的场合：只要一篇通用介绍。","ins":"文本","outs":"文本 + 产物文件","pv":[{"id":"prompt-template","n":"表单模板 + 平台片段","k":"pattern","lic":"","repo":"","note":"填表式输入，平台调性写成片段库，最省且可控；样例质量决定上限","effort":"","tokens":"","outline":[]},{"id":"jasper","n":"Jasper / Copy.ai","k":"commercial","lic":"","repo":"","note":"模板与工作流成熟，按坐席收费","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"难的是平台调性库，不是生成","effort":"3 天","tokens":"约 250 万","outline":["表单 schema 化：品牌、人群、卖点、平台、禁用词","每个平台一个片段库 + 2 条爆款样例，拼进系统提示","批量生成后做相似度去重（>0.9 的重写）","接禁用词与合规检查，否则文案会被平台限流"]}]},{"id":"ai.text.long","name":"长文与论文","kind":"module","dom":"ai.text","abstract":"大纲 → 分章 → 引用，一次生成整篇必然跑偏","note":"正确姿势是「先出大纲，人确认后再逐章写」，每章带上文摘要保持连贯。论文类还要处理引用：模型编造参考文献是常态，必须回外部检索核。坑：不分章直接要 8000 字，前后会自相矛盾，中途也没法纠正方向。不需要它的场合：800 字以内的短文，直接对话更快。","ins":"文本 或 文本片段","outs":"文本 + 产物文件","pv":[{"id":"langchain-long","n":"LangChain 长文链","k":"oss","lic":"MIT","repo":"langchain-ai/langchain","note":"map-reduce / refine 现成，省得自己拼上下文","effort":"","tokens":"","outline":[]},{"id":"notion-ai","n":"Notion AI / 秘塔写作猫","k":"commercial","lic":"","repo":"","note":"改稿体验好，长文结构偏弱","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"分章 + 引用核对是全部工作量，生成本身不难","effort":"4 天","tokens":"约 300 万","outline":["大纲 JSON：章节、每章要点、需要的数据","逐章生成，上下文只带大纲 + 上一章末尾 500 字","引用走检索：每处引用必须有 URL，没检索到就标注「待补」","全文一致性检查：术语表与人物/事实表比对"]}]},{"id":"ai.text.fiction","name":"小说与剧本","kind":"module","dom":"ai.text","abstract":"人设、世界观、章节、分镜——长篇最怕前后不一致","note":"技术难点不是生成，是「记住」：角色关系、已发生事件、埋下的伏笔。做法是维护结构化设定表（人物卡 / 时间线 / 世界书），每次生成前把相关条目检索出来注入上下文。短篇可以不管；超过三万字不建设定表，必然崩人设。剧本还要多一层分镜：一场戏拆成镜号、景别、台词。","ins":"文本","outs":"文本 + 产物文件","pv":[{"id":"lorebook","n":"设定表 + 检索注入","k":"pattern","lic":"","repo":"","note":"人物卡与时间线存 JSON，按出场角色召回，零依赖","effort":"","tokens":"","outline":[]},{"id":"sillytavern","n":"SillyTavern","k":"oss","lic":"AGPL-3.0","repo":"SillyTavern/SillyTavern","note":"角色卡与世界书已是事实标准，可直接借数据结构","effort":"","tokens":"","outline":[]},{"id":"novelai","n":"NovelAI / 彩云小梦","k":"commercial","lic":"","repo":"","note":"续写顺手，长篇一致性仍要自己管","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"崩人设是这类产品唯一的死因，别指望靠提示词解决","effort":"5 天","tokens":"约 400 万","outline":["设定表三张：人物卡、时间线、世界规则","写前检索：本章出场角色 + 相关地点 + 未回收伏笔","写完回写：新增事实追加进设定表，标记伏笔状态","一致性检查：让另一个模型只挑前后矛盾"]}]},{"id":"ai.text.rewrite","name":"改写与降重","kind":"module","dom":"ai.text","abstract":"换句式、换词、调语气——包括「降 AIGC 率」","note":"降 AI 率本质是打乱机器文本的统计特征，常用手法是同义替换 + 句序调整 + 插入口语。代价是可读性下降，过度处理会变成病句；检测方也在升级，所以这是持续对抗，不能承诺「必过」。真正需要的是「改写但不改意思」，这要求逐段处理并锁定术语。不需要它的场合：一句话不顺，直接让模型改。","ins":"文本","outs":"文本","pv":[{"id":"rewrite-prompt","n":"分段改写 + 术语保护","k":"pattern","lic":"","repo":"","note":"逐段处理、术语表锁定、温度调低，最稳且可解释","effort":"","tokens":"","outline":[]},{"id":"quillbot","n":"QuillBot / 茅茅虫","k":"commercial","lic":"","repo":"","note":"现成产品，批量与查重一体","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"降 AI 率是副产物，主产品价值是「可对照的改写」","effort":"3 天","tokens":"约 200 万","outline":["先切段（按标点与语义），段间不互相看，避免整篇同质","每段给三个改写强度，用户可选；强档允许拆句合句","术语表与专有名词用占位符抽出，改写后回填","输出 diff 视图，让用户看见改了什么——不然不敢用"]}]},{"id":"ai.text.translate","name":"翻译","kind":"module","dom":"ai.text","abstract":"术语一致、双语对照、长文档分块","note":"LLM 直译质量已够用，真正的问题是三件：术语表（同一份文档里 API 不能一会叫接口一会叫 API）、分块后的指代（代词跨块就丢）、格式保留（Markdown 与字幕时间轴不能被打乱）。做产品必须支持上传术语表。不需要它的场合：单个短句，直接问模型。","ins":"文本","outs":"文本","pv":[{"id":"llm-glossary","n":"LLM + 术语表","k":"pattern","lic":"","repo":"","note":"分块翻译 + 术语强制替换 + 上下文摘要向前传","effort":"","tokens":"","outline":[]},{"id":"libretranslate","n":"LibreTranslate","k":"oss","lic":"AGPL-3.0","repo":"LibreTranslate/LibreTranslate","note":"可自部署，离线场景必须；质量弱于商用模型","effort":"","tokens":"","outline":[]},{"id":"deepl","n":"DeepL API","k":"commercial","lic":"","repo":"","note":"欧语最准，中文一般","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"难点全在格式与术语，翻译本身已经被模型解决了","effort":"4 天","tokens":"约 300 万","outline":["按段落切块，保留原始顺序号","每块带上「上一块译文末尾 200 字」作为上下文","术语命中先替换成占位符，译完回填","字幕/表格走专用路径：只译文本字段，时间轴与列结构不动"]}]},{"id":"ai.text.summary","name":"摘要与抽取","kind":"module","dom":"ai.text","abstract":"长文压缩成要点，或抽成结构化字段","note":"两条路：抽取式（挑原句，不会编但生硬）与生成式（通顺但会编）。合同、财报这类不容错的场景要抽取式并保留原文位置；读论文、听播客用生成式。坑：一次塞十万字进去，模型只看开头和结尾——必须分段摘要再归并，且保留段号以便回溯。","ins":"文本+文本片段","outs":"文本 + 结构化记录","pv":[{"id":"map-reduce","n":"分段摘要 + 归并","k":"pattern","lic":"","repo":"","note":"map 出每段要点，reduce 合并去重；带段号可回溯","effort":"","tokens":"","outline":[]},{"id":"langchain-sum","n":"LangChain summarize chain","k":"oss","lic":"MIT","repo":"langchain-ai/langchain","note":"现成链，适合先跑通再改","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"冲突处理是这类产品被信任的关键","effort":"2 天","tokens":"约 150 万","outline":["按标题或固定长度切段，每段带 index","map：每段出 3 条要点 + 关键数字，保留 index","reduce：合并同义要点，冲突的标出来而不是二选一","输出每条要点回链到段 index，界面可跳原文"]}]},{"id":"ai.office.sheet","name":"表格与数据","kind":"module","dom":"ai.office","abstract":"自然语言建表、写公式、出图","note":"卖点不是「生成表格」，是「把脏数据变成能看的东西」。链路：解析上传的 xlsx/csv → 推断列类型 → 生成公式或透视 → 出图。坑：模型写 Excel 公式经常用错区域引用，必须实际算一遍再返回；还要防注入（CSV 里以 = 开头的单元格会被 Excel 当公式执行）。不需要它的场合：数据小到能直接看一眼。","ins":"文本+结构化记录","outs":"结构化记录 + 产物文件","pv":[{"id":"univer","n":"Univer / Luckysheet","k":"oss","lic":"Apache-2.0","repo":"dream-num/univer","note":"网页表格内核，公式引擎现成，别自己写","effort":"","tokens":"","outline":[]},{"id":"excel-copilot","n":"Excel Copilot / XCell","k":"commercial","lic":"","repo":"","note":"与 Office 深度绑定，导出最省心","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"别让模型算数，让它出计划——算错一次用户就不信了","effort":"6 天","tokens":"约 400 万","outline":["读表：只取表头 + 前 200 行做类型推断，别整表塞模型","生成计划而非代码：先出「选哪些列、怎么算」的步骤","按步骤调表格引擎 API 执行，公式由引擎算，模型不碰数值","结果回显并保留撤销；导入时过滤以 = + - @ 开头的单元格"]}]},{"id":"ai.office.meeting","name":"会议记录","kind":"module","dom":"ai.office","abstract":"录音 → 转写 → 分段纪要 → 待办","note":"链路固定：转写（ASR）→ 说话人分离 → 按议题切段 → 每段出摘要与决议 → 抽待办（谁、做什么、何时）。坑：多人抢话时分离错乱，纪要会张冠李戴；专有名词识别差，必须支持上传热词表。真正的价值在待办抽取，逐字稿只是副产品——只给逐字稿的产品没人用第二次。","ins":"原始文件","outs":"文本 + 结构化记录","pv":[{"id":"whisper-pyannote","n":"Whisper + pyannote","k":"oss","lic":"MIT","repo":"openai/whisper","note":"转写与说话人分离都能自建，中文用 FunASR 更准","effort":"","tokens":"","outline":[]},{"id":"feishu-minutes","n":"飞书妙记 / 讯飞会议","k":"commercial","lic":"","repo":"","note":"开箱可用，热词与协作成熟","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"待办抽取的质量决定复购，纪要只是及格线","effort":"5 天","tokens":"约 350 万","outline":["转写带词级时间戳，保留说话人标签","按语义切段：换人 + 长停顿 + 话题词变化","每段抽「结论 / 分歧 / 待办」，待办必须能落到人","输出回链到时间点，点一下跳到录音对应位置"]}]},{"id":"ai.office.mindmap","name":"导图与大纲","kind":"module","dom":"ai.office","abstract":"文字 ↔ 树结构，双向可编辑","note":"难点不在生成树，在「双向」：用户改节点要能回写成文本，文本改了要重排树。做法是只存一棵 JSON 树，文本视图由树渲染，避免两份数据打架。输出要考虑 XMind / Markdown 兼容，否则用户拿不走。不需要它的场合：一次性梳理思路，用大纲列表就够。","ins":"文本","outs":"文本 + 产物文件","pv":[{"id":"markmap","n":"markmap / mind-elixir","k":"oss","lic":"MIT","repo":"markmap/markmap","note":"Markdown 与脑图互转，前端直接跑","effort":"","tokens":"","outline":[]},{"id":"xmind-ai","n":"XMind AI / AmyMind","k":"commercial","lic":"","repo":"","note":"导出格式最全","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"视图与数据分离是唯一要点，做反了就是无尽 bug","effort":"3 天","tokens":"约 250 万","outline":["单一数据源：{id, text, children[]}，其余都是视图","生成时限制层级 3–4 层、每层 ≤7 个，否则没法看","编辑走命令式操作（加/删/移），便于撤销重做","导出 Markdown / OPML / xmind，别自造格式"]}]},{"id":"ai.office.resume","name":"简历与求职","kind":"module","dom":"ai.office","abstract":"结构化履历 + 岗位对齐 + 版式导出","note":"真正的需求是「按 JD 改」：把岗位描述抽成关键词与硬性条件，再逐条对照履历做匹配度，指出缺什么。铁律：只做重写与排序，不许新增事实——让模型编经历会毁掉求职者。导出要兼容 ATS（纯文本可解析），花哨排版反而减分。不需要它的场合：投一个熟人内推的岗位，人工改两句更快。","ins":"文本+结构化记录","outs":"产物文件","pv":[{"id":"jd-match","n":"JD 关键词对齐","k":"pattern","lic":"","repo":"","note":"抽 JD 要求 → 逐条映射履历 → 出匹配度与缺口，不编造","effort":"","tokens":"","outline":[]},{"id":"resume-tpl","n":"LaTeX / docx 模板","k":"pattern","lic":"","repo":"","note":"模板渲染，版式稳定且 ATS 友好","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"缺什么比写什么更有用，别把它做成美化工具","effort":"3 天","tokens":"约 200 万","outline":["履历结构化：时间、公司、角色、动作、量化结果","JD 抽硬条件（年限/技能/证书）与软要求","逐条映射，输出「命中 / 部分命中 / 缺失」三态","只允许改写措辞与调整顺序，新增事实需用户确认"]}]},{"id":"ai.office.note","name":"笔记与个人知识","kind":"module","dom":"ai.office","abstract":"随手记 → 自动整理 → 可被问","note":"和 kb 的分界：kb 是灌进来的文档，这一层是自己写的东西，需要双链、标签、每日回顾这些组织手段。AI 的介入点有三处：自动摘要、自动打标与互链、对全库提问。坑：自动打标一旦不准，用户就不再信任标签体系，宁可让他手动确认——准确率不到八成时，建议比自动更合适。","ins":"文本","outs":"结构化记录 + 文本","pv":[{"id":"siyuan","n":"思源笔记 / Obsidian","k":"oss","lic":"AGPL-3.0","repo":"siyuan-note/siyuan","note":"本地优先、双链与块引用成熟，可直接嵌","effort":"","tokens":"","outline":[]},{"id":"notion-ai","n":"Notion AI","k":"commercial","lic":"","repo":"","note":"协作强，数据在云上","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"笔记产品的胜负在输入体验，AI 只能加速整理","effort":"5 天","tokens":"约 300 万","outline":["正文存 Markdown，元数据（标签/链接）单独存","写入时异步跑摘要与关键词，不阻塞输入","互链建议用向量相似度召回，只给 3 条候选","检索走全文 + 向量混合，中文要配分词"]}]},{"id":"ai.office.ocr","name":"文档识别","kind":"module","dom":"ai.office","abstract":"扫描件、公式、表格、手写——把图变成结构化文本","note":"三档难度：印刷体（成熟）、表格（要还原行列合并）、公式与手写（仍在进步）。关键决定是「要不要保留版面坐标」：只出纯文本，后面没法做对照高亮；保留坐标才能点原文定位。坑：低质量扫描先做去噪与纠偏，否则识别率暴跌。","ins":"原始文件","outs":"文本 + 结构化记录","pv":[{"id":"paddleocr","n":"PaddleOCR","k":"oss","lic":"Apache-2.0","repo":"PaddlePaddle/PaddleOCR","note":"中文与表格最实用，可离线","effort":"","tokens":"","outline":[]},{"id":"docling-ocr","n":"Docling","k":"oss","lic":"MIT","repo":"docling-project/docling","note":"版面还原好，能出 Markdown 与坐标","effort":"","tokens":"","outline":[]},{"id":"mathpix","n":"Mathpix","k":"commercial","lic":"","repo":"","note":"公式识别最强，按页收费","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"不保留坐标就没有产品价值，只是又一个复制粘贴","effort":"6 天","tokens":"约 400 万","outline":["预处理：灰度、二值化、透视矫正、去噪","版面分析先切块（段落/表格/图），别整页硬识别","表格单独走单元格检测 + 行列还原","输出带 bbox，前端用坐标做「点文字高亮原图」"]}]},{"id":"ai.design.layout","name":"版式与海报","kind":"module","dom":"ai.design","abstract":"模板 + 素材位 + 自适应排版","note":"核心是「约束」：文字长度不定、图片比例不定，排版要自适应而不是靠模型想象坐标。做法是模板里定义弹性容器，AI 只负责选模板与填内容。坑：让模型直接输出绝对坐标，换个字号就全糊在一起。不需要它的场合：发朋友圈的一张图，用现成模板改字即可。","ins":"文本 或 产物文件+文本","outs":"产物文件","pv":[{"id":"penpot","n":"Penpot","k":"oss","lic":"MPL-2.0","repo":"penpot/penpot","note":"开源设计工具，模板与组件体系可直接用","effort":"","tokens":"","outline":[]},{"id":"canva","n":"Canva / 稿定","k":"commercial","lic":"","repo":"","note":"模板海量，商用授权清楚","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"让模型碰坐标的设计工具，最终都死在换行上","effort":"7 天","tokens":"约 500 万","outline":["模板 DSL：绝对定位 + 弹性容器两种节点","AI 只输出「选哪个模板 + 每格填什么」，不输出坐标","渲染后按文本实际高度回流，超出则缩字号或换模板","导出 PNG / PDF，字体预置，缺字要显式报错"]}]},{"id":"ai.design.brand","name":"品牌与标识","kind":"module","dom":"ai.design","abstract":"Logo、配色、字体、VI 规范","note":"生成 Logo 只是第一步，真正的交付是「一套能落地的规范」：主色/辅色/禁用组合、最小尺寸、深浅底版本。技术上要出矢量（SVG）而不是位图，否则放大会糊。坑：生成结果常撞已有商标，商用前必须查重，产品里要明确提示——这既是法律风险也是口碑风险。","ins":"文本","outs":"产物文件","pv":[{"id":"svg-mark","n":"SVG 生成 + 字体轮廓","k":"pattern","lic":"","repo":"","note":"模型出构图描述，SVG 模板渲染，可无损缩放","effort":"","tokens":"","outline":[]},{"id":"looka","n":"Looka / Logoai","k":"commercial","lic":"","repo":"","note":"打包输出 VI 与商用授权","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"交付规范比交付图形值钱，这是和出图工具的分界","effort":"5 天","tokens":"约 400 万","outline":["先定三件事：气质关键词、行业禁忌、名字长度","生成构图描述（几何/字母/图形），不直接出图","用 SVG 基本图形拼装，字体转轮廓，输出可编辑矢量","自动衍生：横版/竖版/单色/深底，附最小尺寸与留白规范"]}]},{"id":"ai.agent.multi","name":"多智能体协同","kind":"module","dom":"ai.agent","abstract":"角色分工、消息传递、汇总收敛","note":"大多数「多智能体」只是把一件事拆给几个角色轮流说，收益远小于宣传。真有用的场景是「互相审」：一个写、一个挑错、一个裁决，比单模型自检有效。坑：轮数不设上限会无限互夸，必须给终止条件与预算；消息全量广播会让上下文爆炸，要按角色裁剪。不需要它的场合：任务能一次做完。","ins":"文本","outs":"文本","pv":[{"id":"autogen","n":"AutoGen / CrewAI","k":"oss","lic":"MIT","repo":"microsoft/autogen","note":"现成编排框架，先跑通再谈优化","effort":"","tokens":"","outline":[]},{"id":"role-loop","n":"角色轮转 + 裁决","k":"pattern","lic":"","repo":"","note":"三角色 + 最大轮数 + token 预算，最省且可控","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"多智能体的价值在审，不在分工","effort":"5 天","tokens":"约 350 万","outline":["角色 = 系统提示 + 可见消息范围，不是新模型","消息按角色裁剪：审稿人只看稿，不看过程","终止条件三选一：轮数上限 / 预算上限 / 裁决通过","全过程落盘可回放，否则出问题无法定位"]}]},{"id":"ai.agent.browser","name":"浏览器自动化","kind":"module","dom":"ai.agent","abstract":"打开网页、点、填、读——让 Agent 操作真实浏览器","note":"两条路线：选择器驱动（稳但每个站要写适配）与视觉驱动（通用但慢且贵）。生产上通常混合：先走 DOM，找不到再截图给多模态模型判断。坑：登录态与验证码是绕不过的墙，产品要留人工接管；页面一改脚本就废，必须能自愈或至少能告警。","ins":"文本","outs":"原始文件 + 文本","pv":[{"id":"playwright","n":"Playwright","k":"oss","lic":"Apache-2.0","repo":"microsoft/playwright","note":"最稳的底层，可录制回放，调试友好","effort":"","tokens":"","outline":[]},{"id":"browser-use","n":"browser-use","k":"oss","lic":"MIT","repo":"browser-use/browser-use","note":"LLM 驱动，省适配；慢且贵，适合长尾站点","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"最贵的不是识别，是页面改版后的运维","effort":"8 天","tokens":"约 600 万","outline":["先抽 DOM 结构给模型看（精简后），不给截图","动作空间限定：click / type / scroll / extract","每步执行后校验页面是否变化，无变化则重试或换选择器","登录态用持久化 profile，遇验证码暂停等人工"]}]},{"id":"ai.agent.computer","name":"桌面操作","kind":"module","dom":"ai.agent","abstract":"看屏幕、动鼠标键盘——操作没有 API 的软件","note":"比浏览器自动化更脆：分辨率、缩放、弹窗都会影响识别。做法是「截图 → 定位元素 → 执行 → 再截图校验」，每步都能回退。坑：误点会造成真实损失（删文件、转账），必须设高危操作确认与沙箱；速度也慢，不适合高频任务。不需要它的场合：目标软件有 API 或命令行。","ins":"文本","outs":"外部动作 + 原始文件","pv":[{"id":"pyautogui","n":"pyautogui + 截图","k":"oss","lic":"BSD-3-Clause","repo":"asweigart/pyautogui","note":"最原始但够用，校验逻辑要自己写","effort":"","tokens":"","outline":[]},{"id":"open-interpreter","n":"Open Interpreter","k":"oss","lic":"AGPL-3.0","repo":"OpenInterpreter/open-interpreter","note":"自然语言驱动本机，方便与风险同源","effort":"","tokens":"","outline":[]},{"id":"yingdao","n":"影刀 RPA","k":"commercial","lic":"","repo":"","note":"企业级，流程录制与异常处理成熟","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"这类产品的成本不在模型，在异常处理与责任边界","effort":"10 天","tokens":"约 800 万","outline":["截图 → 用视觉模型输出可点区域（带坐标与文字）","动作前二次确认：高危操作（删除/支付/发送）必须人工点","每步执行后截图比对，失败回退到上一步","全程录屏留证，出事能复盘"]}]},{"id":"ai.agent.support","name":"客服与坐席","kind":"module","dom":"ai.agent","abstract":"多渠道接入、知识回答、转人工","note":"技术上不难，难在「不知道就得转」：答错的成本远高于不答。必须做三件事：置信度阈值、知识缺口回收（把没答上的问题聚成工单）、人工接管时的上下文传递。坑：一上来就全自动，客户被绕三圈会投诉；先做「草稿建议」让坐席确认，效果好得多。","ins":"文本片段 或 文本","outs":"文本","pv":[{"id":"chatwoot","n":"Chatwoot + RAG","k":"oss","lic":"MIT","repo":"chatwoot/chatwoot","note":"开源客服台，接知识库与多渠道","effort":"","tokens":"","outline":[]},{"id":"zendesk-ai","n":"Zendesk AI / 网易七鱼","k":"commercial","lic":"","repo":"","note":"坐席体系成熟，按坐席收费","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"「不会就说不会」是唯一能上线的策略","effort":"7 天","tokens":"约 500 万","outline":["先算检索置信度，低于阈值直接转人工，不硬答","答必带出处，坐席可一键引用或改写","没答上的问题落库聚类，每周出知识缺口清单","接管时把历史与用户画像一并递给坐席"]}]},{"id":"ai.agent.research","name":"深度研究","kind":"module","dom":"ai.agent","abstract":"多轮检索 → 交叉验证 → 带引用的报告","note":"和普通问答的差别是「先规划再搜」：拆子问题、每个子问题独立检索、按来源可信度加权、最后组织成报告。坑：不去重会反复引用同一篇稿子的多个转载；不做时间过滤会把旧闻当新闻。引用的每条都要能点回原文，否则没人信。不需要它的场合：一个问题一两段能答完。","ins":"文本片段 或 文本","outs":"文本","pv":[{"id":"open-deep-research","n":"open_deep_research","k":"oss","lic":"MIT","repo":"langchain-ai/open_deep_research","note":"开源实现，含计划-检索-写作三段","effort":"","tokens":"","outline":[]},{"id":"deep-research-api","n":"OpenAI / Gemini Deep Research","k":"commercial","lic":"","repo":"","note":"开箱效果好，按次收费且过程不可控","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"可信度全靠「单一来源」敢不敢标出来","effort":"8 天","tokens":"约 600 万","outline":["拆子问题：3–6 个可独立检索的问句","每问独立检索，按域名去重 + 按时间过滤","交叉验证：同一结论需 ≥2 个独立来源，否则标「单一来源」","写作阶段只允许用检索到的片段，引用编号回链"]}]},{"id":"ai.model.finetune","name":"微调训练","kind":"module","dom":"ai.model","abstract":"LoRA / SFT：让小模型在特定任务上超过大模型","note":"先问「提示词够不够」——八成需求靠 few-shot 就解决了，微调是最后一招。真要做，LoRA 是默认选择（单卡可跑、多套适配器可热切）。坑：数据质量决定一切，500 条干净样本胜过 5 万条脏数据；必须留评测集，否则不知道是变好还是过拟合。","ins":"结构化记录","outs":"外部动作","pv":[{"id":"llamafactory","n":"LLaMA-Factory","k":"oss","lic":"Apache-2.0","repo":"hiyouga/LLaMA-Factory","note":"一条命令跑 LoRA，覆盖主流开源模型","effort":"","tokens":"","outline":[]},{"id":"openai-ft","n":"OpenAI 微调 API","k":"commercial","lic":"","repo":"","note":"不用管显卡，按 token 计费","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"没有评测集就不要微调，那是在赌","effort":"6 天","tokens":"约 400 万","outline":["样本清洗：去重、去模板化、统一格式（JSONL）","切分训练/验证/测试，测试集全程不参与调参","LoRA 超参从小开始（r=8），先跑 1 epoch 看曲线","上线前做 A/B：微调模型 vs 提示词方案，同题同评"]}]},{"id":"ai.model.host","name":"模型托管","kind":"module","dom":"ai.model","abstract":"把模型变成稳定的 HTTP 服务：并发、限流、计费","note":"和 ai.model.local 的分界：那边是「在我机器上跑起来」，这边是「对外提供不崩的服务」。要处理并发批处理、显存不足时排队、多模型热切换、按 key 计费。坑：单卡跑多个模型会互相挤显存，必须做模型驱逐策略，否则第一个请求就把服务打崩。","ins":"（不需要输入）","outs":"文本","pv":[{"id":"vllm-host","n":"vLLM","k":"oss","lic":"Apache-2.0","repo":"vllm-project/vllm","note":"吞吐最高，OpenAI 兼容接口，生产首选","effort":"","tokens":"","outline":[]},{"id":"ollama-host","n":"Ollama","k":"oss","lic":"MIT","repo":"ollama/ollama","note":"部署最省事，并发弱，适合个人与小团队","effort":"","tokens":"","outline":[]},{"id":"openrouter","n":"OpenRouter / 阿里云百炼","k":"commercial","lic":"","repo":"","note":"不用运维，按量付费","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"别自研推理引擎，包一层调度就够","effort":"5 天","tokens":"约 300 万","outline":["统一入口：/v1/chat/completions，多后端按名字路由","排队与超时：按显存预留做准入，满了返回 429 而非排队","流式转发要处理中断，客户端断开要立刻释放显存","按 key 记账 token，日结；无记账就没法定价"]}]},{"id":"ai.media.edit","name":"图像编辑","kind":"module","dom":"ai.media","abstract":"抠图、消除、修复、扩图、超分","note":"这类需求的共同点是「局部改、其余不动」，所以技术上走 inpainting / matting 而不是整图重绘。抠图看边缘发丝，消除看接缝，超分看文字是否糊。坑：一键处理链式叠加会让画质雪崩，每步都要保留原图可回退。不需要它的场合：整张换风格，那归 ai.media.image。","ins":"原始文件","outs":"产物文件","pv":[{"id":"iopaint","n":"IOPaint","k":"oss","lic":"Apache-2.0","repo":"Sanster/IOPaint","note":"消除与修复一体，可本地跑","effort":"","tokens":"","outline":[]},{"id":"comfy-edit","n":"ComfyUI 工作流","k":"oss","lic":"GPL-3.0","repo":"comfyanonymous/ComfyUI","note":"复杂编辑用节点拼，灵活但门槛高","effort":"","tokens":"","outline":[]},{"id":"ps-genfill","n":"Photoshop 生成式填充","k":"commercial","lic":"","repo":"","note":"接缝最自然，按订阅","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"编辑类产品七成体验在蒙版，不在模型","effort":"6 天","tokens":"约 450 万","outline":["蒙版交互先行：画笔/自动分割/文字定位","编辑只处理蒙版区域，边缘做羽化融合","每步存历史，支持回到任意一步（无损）","导出前做一次整体观感检查，避免拼接痕"]}]},{"id":"ai.media.portrait","name":"人像与写真","kind":"module","dom":"ai.media","abstract":"换脸、写真、证件照、修复老照片","note":"技术上靠「身份保持」：把参考脸编码进生成过程。产品上必须处理两件事：肖像权提示（未经同意换脸是侵权）、以及「像不像」的预期管理——太像会恐怖谷，不像则没用。证件照还要满足尺寸与背景规范，这是能落地的差异点。","ins":"原始文件","outs":"产物文件","pv":[{"id":"instantid","n":"InstantID / PuLID","k":"oss","lic":"Apache-2.0","repo":"instantX-research/InstantID","note":"单图保身份，效果稳，可本地跑","effort":"","tokens":"","outline":[]},{"id":"remini","n":"Remini / 美图","k":"commercial","lic":"","repo":"","note":"修复与增强效果最好，闭源","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"合规提示不是免责声明，是产品的一部分","effort":"7 天","tokens":"约 500 万","outline":["人脸检测 + 对齐，取身份 embedding","生成时按身份向量约束，风格另走 LoRA","修老照片先做划痕/噪点修复，再做人脸增强","证件照按规范裁切换底，输出多尺寸"]}]},{"id":"ai.media.avatar","name":"数字人","kind":"module","dom":"ai.media","abstract":"一张照片 + 一段音频 → 会说话的视频","note":"三条路线：唇形同步（便宜、只动嘴）、半身驱动（要视频素材）、全生成（贵）。选型看用途：口播课程用唇形同步就够，品牌代言才需要全生成。坑：中文口型对齐比英文难；长音频要分段渲染再拼接，否则口型越到后面越漂。","ins":"原始文件 或 文本","outs":"产物文件","pv":[{"id":"sadtalker","n":"SadTalker","k":"oss","lic":"Apache-2.0","repo":"OpenTalker/SadTalker","note":"照片驱动，开源可跑，质量中等","effort":"","tokens":"","outline":[]},{"id":"heygen","n":"HeyGen / 硅基智能","k":"commercial","lic":"","repo":"","note":"商用质量，按分钟计费","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"分段渲染是必须的，整段渲染必漂","effort":"10 天","tokens":"约 700 万","outline":["音频先切句，逐句渲染再拼，抵消累积漂移","口型以音素为单位对齐，中文需拼音-音素映射表","头部姿态做随机微动，否则像遗像","合成后统一色彩与锐度，避免拼接处跳变"]}]},{"id":"ai.media.clip","name":"视频剪辑","kind":"module","dom":"ai.media","abstract":"自动切片、去静音、加字幕、配乐对轴","note":"短视频的核心需求是「从长素材里挑高光」：靠语音转写 + 画面变化 + 音量峰值出候选，再让模型按主题排序。坑：最容易毁在字幕时间轴上——ASR 时间戳有偏差，必须做对齐校正，否则字幕越到后面越飘。不需要它的场合：只是裁头去尾，用剪映手拖更快。","ins":"原始文件","outs":"产物文件","pv":[{"id":"ffmpeg","n":"FFmpeg + auto-editor","k":"oss","lic":"LGPL-2.1","repo":"FFmpeg/FFmpeg","note":"切、拼、压全包，静音检测现成","effort":"","tokens":"","outline":[]},{"id":"jianying","n":"剪映 / Descript","k":"commercial","lic":"","repo":"","note":"字幕与模板成熟，编辑体验好","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"字幕对不齐是用户流失的第一原因","effort":"8 天","tokens":"约 550 万","outline":["转写拿词级时间戳，作为所有切点的基准","候选片段：静音切除 + 语义完整句 + 情绪峰值","字幕用词级时间戳做行级重排，逐行校正偏移","渲染走 FFmpeg 滤镜链，别用逐帧合成（太慢）"]}]},{"id":"ai.media.transcribe","name":"语音转写","kind":"module","dom":"ai.media","abstract":"音频 → 带时间戳与说话人的文字","note":"中文场景优先 FunASR 或 Whisper 微调版。真正影响可用性的是三件事：时间戳精度（决定字幕能不能用）、标点与断句（决定可读性）、热词表（人名、型号）。坑：背景音乐与人声重叠时识别率骤降，先做分离再转写。","ins":"原始文件","outs":"文本","pv":[{"id":"whisper","n":"Whisper","k":"oss","lic":"MIT","repo":"openai/whisper","note":"多语种，时间戳准；中文用 large-v3","effort":"","tokens":"","outline":[]},{"id":"funasr","n":"FunASR","k":"oss","lic":"MIT","repo":"modelscope/FunASR","note":"中文标点与热词更好，可离线","effort":"","tokens":"","outline":[]},{"id":"xfyun-asr","n":"讯飞听见","k":"commercial","lic":"","repo":"","note":"中文行业词识别强","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"时间戳不准，后面所有功能都白做","effort":"5 天","tokens":"约 350 万","outline":["先做 VAD 切句，长音频按静音切块并行识别","热词表注入：解码时给偏置，比事后纠错有效","标点用独立模型补，不要指望 ASR 自带","输出 SRT 前做一次时间轴单调性校验"]}]},{"id":"ai.media.clone","name":"声音克隆","kind":"module","dom":"ai.media","abstract":"几秒样本复刻音色，再让它说任何话","note":"门槛已经很低（GPT-SoVITS 几分钟出效果），所以产品风险主要在合规：必须做声纹授权确认与生成内容标识。技术上的取舍是「像」与「稳」：少样本更像但会破音，多样本更稳但要几分钟素材。不需要它的场合：只要一个好听的声音，用现成音色库。","ins":"原始文件","outs":"外部动作","pv":[{"id":"gpt-sovits","n":"GPT-SoVITS","k":"oss","lic":"MIT","repo":"RVC-Boss/GPT-SoVITS","note":"少样本效果好，社区活跃","effort":"","tokens":"","outline":[]},{"id":"cosyvoice","n":"CosyVoice","k":"oss","lic":"Apache-2.0","repo":"FunAudioLLM/CosyVoice","note":"中文自然度高，支持指令控制","effort":"","tokens":"","outline":[]},{"id":"elevenlabs","n":"ElevenLabs","k":"commercial","lic":"","repo":"","note":"多语种最自然，按字符计费","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"合规比技术难，别把声纹授权做成勾选框","effort":"8 天","tokens":"约 600 万","outline":["参考音频做降噪与切片，取 3–10 秒干净片段","训练/推理分离：先出音色 embedding，再合成","长文本按句切，保持韵律连贯（带上一句末尾）","输出加不可听水印，用于追溯生成内容"]}]},{"id":"ai.media.clean","name":"音频修复","kind":"module","dom":"ai.media","abstract":"降噪、去混响、分离人声与伴奏","note":"三类问题三套算法：稳态噪声（风扇、电流）用谱减法，混响用去卷积，人声/伴奏分离用源分离模型。产品上常见错误是「一键增强」把齿音也放大，听感更差——应该给强度档位并允许 A/B 对比。不需要它的场合：录音本来就干净。","ins":"原始文件","outs":"产物文件","pv":[{"id":"demucs","n":"Demucs","k":"oss","lic":"MIT","repo":"facebookresearch/demucs","note":"人声分离效果好，可离线","effort":"","tokens":"","outline":[]},{"id":"adobe-enhance","n":"Adobe Podcast Enhance","k":"commercial","lic":"","repo":"","note":"一键惊艳，但不可细调","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"过度降噪比不降噪更难听","effort":"5 天","tokens":"约 300 万","outline":["先判类型：稳态噪声 / 混响 / 重叠人声，走不同分支","分离用预训练源分离模型，别自己训","处理前后做波形与频谱对比，让用户听得见差别","给强度档位，默认中档，避免过度处理"]}]},{"id":"ai.media.3d","name":"三维生成","kind":"module","dom":"ai.media","abstract":"文字/图片 → 网格模型，可直接进引擎","note":"现在的输出多是不带骨骼的静态网格，贴图靠烘焙。落地要检查两件事：拓扑是否可编辑（三角面乱到没法改）、是否带 UV。坑：生成速度与质量强相关，几十秒出的模型只能当草模；商用还要看训练数据授权。不需要它的场合：只需要一个示意模型，去素材站下更快。","ins":"文本+原始文件","outs":"产物文件","pv":[{"id":"triposr","n":"TripoSR","k":"oss","lic":"MIT","repo":"VAST-AI-Research/TripoSR","note":"单图出网格，几秒，适合草模","effort":"","tokens":"","outline":[]},{"id":"tripo","n":"Tripo / Meshy","k":"commercial","lic":"","repo":"","note":"质量高，有 API，按次收费","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"重拓扑决定模型能不能进生产管线","effort":"12 天","tokens":"约 900 万","outline":["图像先做前景分割，背景会污染重建","走隐式场重建再提网格（marching cubes）","减面 + 重拓扑，否则三角面没法编辑","自动 UV 展开 + 烘焙贴图，导出 glb"]}]},{"id":"ai.prompt.lib","name":"提示词库","kind":"module","dom":"ai.prompt","abstract":"模板、变量、版本、复用","note":"最小可用形态是「YAML 文件 + 变量占位 + git 版本」，比任何平台都可靠。上平台的价值在多环境、灰度回滚、以及非工程师也能改。坑：提示词存数据库却没做版本，改坏了无法回退，线上效果会莫名漂移——这类事故排查起来极慢，因为代码没变。","ins":"文本","outs":"文本","pv":[{"id":"yaml-git","n":"YAML + git","k":"pattern","lic":"","repo":"","note":"零依赖，可 review 可回滚，小团队最省","effort":"","tokens":"","outline":[]},{"id":"langfuse","n":"Langfuse","k":"oss","lic":"MIT","repo":"langfuse/langfuse","note":"提示词版本 + 调用追踪一体","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"核心是版本，不是编辑界面","effort":"3 天","tokens":"约 200 万","outline":["一条提示词一个文件，frontmatter 存变量与模型参数","渲染器：变量缺失直接抛错，别用空串兜底","版本 = git commit，生产引用 tag 而非分支","每次调用记录 prompt 版本号，出问题能追到具体版本"]}]},{"id":"ai.prompt.optimize","name":"提示词优化","kind":"module","dom":"ai.prompt","abstract":"让模型改写提示词，并用评测集验证是否真的更好","note":"只改不测等于玄学。正确链路：准备 20–50 条带期望输出的样例 → 自动改写候选 → 逐条跑分 → 只保留提升的版本。坑：优化目标写成「更详细」会把提示词膨胀到几千字，成本上升而效果不变；必须同时约束长度。不需要它的场合：只写一条提示词，手工试几版更快。","ins":"文本","outs":"文本","pv":[{"id":"dspy","n":"DSPy","k":"oss","lic":"MIT","repo":"stanfordnlp/dspy","note":"把提示词当参数自动搜，前提是有评测集","effort":"","tokens":"","outline":[]},{"id":"optimize-loop","n":"改写 + 跑分 + 保留最优","k":"pattern","lic":"","repo":"","note":"不引框架，一个脚本就能跑","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"没有评测集的「优化」只是换了个说法","effort":"4 天","tokens":"约 250 万","outline":["评测集先行：输入 + 期望输出 + 评分方式（规则或 LLM 评）","每次只改一处（结构/示例/措辞），便于归因","同集跑分，保留提升且长度增幅 <20% 的版本","记录失败案例，作为下一轮改写的输入"]}]},{"id":"ai.detect.aigc","name":"AIGC 检测与降 AI","kind":"module","dom":"ai.detect","abstract":"判断机器文本，或把机器文本改得像人写","note":"检测靠统计特征（困惑度、句长方差、词频分布），所以改写确实能降分，但这是对抗而非真伪判断——同一段话换个模型重写，分数就变。产品上不能承诺「必过」，也不该把检测结果当学术不端证据。真正可持续的用法是「辅助自查」：给出可疑段落，让人判断。","ins":"文本","outs":"结构化记录 + 文本","pv":[{"id":"binoculars","n":"Binoculars","k":"oss","lic":"MIT","repo":"ahans30/Binoculars","note":"开源检测，需本地模型，可复现","effort":"","tokens":"","outline":[]},{"id":"gptzero","n":"GPTZero / 睿信","k":"commercial","lic":"","repo":"","note":"商用 API，各机构采信度不一","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"把「不确定」说清楚，比给一个 98% 更专业","effort":"5 天","tokens":"约 300 万","outline":["按段落打分而不是整篇，整篇分数没有指导意义","特征：困惑度、句长分布、连接词密度、重复 n-gram","给「可疑段落」并解释依据，不直接下结论","降 AI 走独立链路：改写 + 人工确认，明确告知不可保证"]}]},{"id":"ai.search.engine","name":"搜索聚合","kind":"module","dom":"ai.search","abstract":"元搜索、垂直检索、结果去重与排序","note":"三种做法：聚合别人的结果（快但受制于人）、自建索引（准但要养爬虫）、调商用 API（省事但贵）。产品上真正的差异在排序与去重：同一篇稿被十家转载，不合并等于只有一条结果。坑：中文不做分词与同义词，召回率会很难看。不需要它的场合：站内几百条内容，数据库 LIKE 就够。","ins":"文本","outs":"文本","pv":[{"id":"searxng","n":"SearXNG","k":"oss","lic":"AGPL-3.0","repo":"searxng/searxng","note":"元搜索，不依赖商业 API，结果要自己清洗","effort":"","tokens":"","outline":[]},{"id":"meilisearch","n":"Meilisearch","k":"oss","lic":"MIT","repo":"meilisearch/meilisearch","note":"自建索引，中文需配分词器","effort":"","tokens":"","outline":[]},{"id":"exa","n":"Exa / AlphaSense","k":"commercial","lic":"","repo":"","note":"语义检索质量高，按次计费","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"去重与排序决定体感，抓取只是体力活","effort":"7 天","tokens":"约 500 万","outline":["抓取 → 正文提取 → 去重（SimHash）→ 建倒排","查询侧：分词 + 同义词扩展 + 拼写纠正","排序融合：BM25 + 向量 + 站点权重（RRF 合并）","聚合页做「同事件归并」，别让十条转载占满首屏"]}]},{"id":"ai.chat.persona","name":"角色与陪伴","kind":"module","dom":"ai.chat","abstract":"人设、语气、长期关系记忆","note":"和普通对话的差别是「不能出戏」：要稳定口吻、有边界（不越界、不崩人设）、跨会话记得关系进展。技术上靠系统提示 + 人设卡 + 记忆检索三件套。坑：过度顺从会让角色变成应声虫，必须写「拒绝与分歧」的规则，否则聊三天就腻。不需要它的场合：工具型对话，别加人设。","ins":"会话+文本","outs":"文本","pv":[{"id":"sillytavern-persona","n":"SillyTavern 角色卡","k":"oss","lic":"AGPL-3.0","repo":"SillyTavern/SillyTavern","note":"人设卡格式已成事实标准，可直接兼容","effort":"","tokens":"","outline":[]},{"id":"replika","n":"Replika / 星野","k":"commercial","lic":"","repo":"","note":"产品化最成熟，含情感设计","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"人设能不能立住，取决于它敢不敢说不","effort":"5 天","tokens":"约 350 万","outline":["人设卡结构化：身份、语气、禁忌、关系阶段","记忆分三层：事实、事件、情绪，分别检索","每轮取最相关的 3–5 条记忆，别全塞","写「拒绝与分歧」规则，避免变成应声虫"]}]},{"id":"app.data","name":"数据存储","kind":"module","dom":"app","abstract":"业务数据的家：一条记录怎么存、怎么查、怎么保证不丢","note":"选型只看三件事：几个人用、要不要实时同步、数据多大。一个人一台机器、几万条以内 → SQLite 单文件，零运维、备份就是拷文件；多人同时写 → Postgres，别犹豫；要手机和电脑同步又不想写后端 → Supabase。坑一：拿 Excel/CSV 当库，两个人同时改就丢数据。坑二：为了「以后要扩展」上分布式库，结果三个月没人维护。不需要它的场合：纯计算、纯生成、不留历史。","ins":"结构化记录+文本","outs":"结构化记录","pv":[{"id":"sqlite","n":"SQLite","k":"oss","lic":"Public Domain","repo":"sqlite/sqlite","note":"单文件、零服务，单机应用的首选；备份就是复制那一个文件","effort":"","tokens":"","outline":[]},{"id":"postgres","n":"PostgreSQL","k":"oss","lic":"PostgreSQL","repo":"postgres/postgres","note":"多人同时写、要做统计与约束时的默认答案","effort":"","tokens":"","outline":[]},{"id":"supabase","n":"Supabase","k":"oss","lic":"Apache-2.0","repo":"supabase/supabase","note":"Postgres + 认证 + 存储 + 实时，省掉整个后端；托管版免费额度够小团队","effort":"","tokens":"","outline":[]},{"id":"mysql","n":"MySQL / MariaDB","k":"oss","lic":"GPL-2.0","repo":"MariaDB/server","note":"已有运维习惯或要接老系统时才选，新项目没有理由优先","effort":"","tokens":"","outline":[]},{"id":"drizzle","n":"Drizzle / Prisma（ORM）","k":"pattern","lic":"Apache-2.0","repo":"drizzle-team/drizzle-orm","note":"不是数据库，是「表结构即代码」的做法：迁移有版本、字段有类型，比手写 SQL 少一半事故","effort":"","tokens":"","outline":[]},{"id":"app-data-write","n":"AI 自己写一套存储","k":"build","lic":"","repo":"","note":"自己写 KV 或文件格式，最后都会在并发与查询上翻车","effort":"不建议","tokens":"—","outline":["存储层不要自研，直接用 SQLite/Postgres","自研的部分只做：实体建模、索引设计、迁移脚本"]}]},{"id":"app.auth","name":"账号与权限","kind":"module","dom":"app","abstract":"谁能进来、能看到谁的：登录、会话、角色、数据隔离","note":"触发条件很明确：需求里出现「同事」「团队」「各自登录」「权限」就必须有这一格。做法上不要自己写密码哈希与会话管理——现成方案已经把所有坑踩过（限流、验证码、找回密码、第三方登录、token 过期与刷新）。真正要自己设计的是「谁能看到哪些行」，这是业务问题，不是技术问题：最简单可靠的是每条记录带 owner_id，查询永远带这个条件，别指望前端藏按钮。","ins":"（不需要输入）","outs":"会话","pv":[{"id":"supabase-auth","n":"Supabase Auth","k":"oss","lic":"Apache-2.0","repo":"supabase/auth","note":"和 app.data 同一套，行级权限（RLS）直接写进数据库","effort":"","tokens":"","outline":[]},{"id":"authjs","n":"Auth.js (NextAuth)","k":"oss","lic":"ISC","repo":"nextauthjs/next-auth","note":"Next.js 项目最省事，微信/邮箱/SSO 都有现成 provider","effort":"","tokens":"","outline":[]},{"id":"keycloak","n":"Keycloak","k":"oss","lic":"Apache-2.0","repo":"keycloak/keycloak","note":"企业内网、要接 LDAP/AD 时的标准答案，重但全","effort":"","tokens":"","outline":[]},{"id":"casdoor","n":"Casdoor","k":"oss","lic":"Apache-2.0","repo":"casdoor/casdoor","note":"带管理界面的轻量选择，中文文档友好","effort":"","tokens":"","outline":[]},{"id":"app-auth-write","n":"AI 自己写鉴权","k":"build","lic":"","repo":"","note":"能写，但不该写：漏一个限流或一个越权判断就是事故","effort":"2 天","tokens":"约 60 万","outline":["会话用现成库签发，不要自己设计 token 格式","密码只存 argon2/bcrypt 哈希；登录接口必须限流","权限判断写在查询条件里（owner_id），不要写在前端"]}]},{"id":"app.ui","name":"界面呈现","kind":"module","dom":"app","abstract":"用户实际看到的那一层：网页、手机、小程序、还是一个本地窗口","note":"这是最容易被低估的一格，通常占整个项目一半以上工程量。判断标准很简单：只有自己用 → Gradio/Streamlit 半天出活；要给同事用 → 正经前端，要处理登录态、空状态、错误提示、移动端适配；要进微信 → 小程序是独立的开发与审核流程，不是「把网页包一层」。坑：先按桌面宽度做，最后发现用户 80% 在手机上打开。","ins":"（自己就是入口）","outs":"界面","pv":[{"id":"nextjs","n":"Next.js + shadcn/ui","k":"oss","lic":"MIT","repo":"vercel/next.js","note":"网页端的默认组合：路由、服务端渲染、组件库一次到位","effort":"","tokens":"","outline":[]},{"id":"streamlit","n":"Gradio / Streamlit","k":"oss","lic":"Apache-2.0","repo":"streamlit/streamlit","note":"内部工具与原型的最快路径，一天能出可用界面，别拿它做对外产品","effort":"","tokens":"","outline":[]},{"id":"uniapp","n":"uni-app","k":"oss","lic":"Apache-2.0","repo":"dcloudio/uni-app","note":"一套代码出小程序 + H5 + App，国内生态最顺","effort":"","tokens":"","outline":[]},{"id":"taro","n":"Taro","k":"oss","lic":"MIT","repo":"NervJS/taro","note":"React 技术栈做小程序时选它，团队已会 React 就别换 uni-app","effort":"","tokens":"","outline":[]},{"id":"app-ui-write","n":"AI 自己写前端","k":"build","lic":"","repo":"","note":"能写，但「能看」和「能用」差在空态、加载态、错误态这三处","effort":"按页算","tokens":"约 8 万/页","outline":["先定组件库与设计 token（间距、字号、色），否则每页都不一样","状态管理只在跨页共享时才引，局部状态用组件内 state","移动端优先：先按 375px 画，再放大"]}]},{"id":"app.file","name":"文件与对象存储","kind":"module","dom":"app","abstract":"图片、附件、导入的原始文件放哪、怎么取","note":"分界线很清楚：只有自己用、几十个文件 → 本地目录 + 静态服务足够；一旦要多人共享、要外链、要被 CDN 加速、文件上到 GB 级 → 必须对象存储。坑：把图片存进数据库（备份变巨大、查询变慢）；把用户上传的原文件直接放到代码仓库旁边的目录里（部署一次全丢）。","ins":"原始文件+产物文件","outs":"产物文件","pv":[{"id":"minio","n":"MinIO","k":"oss","lic":"AGPL-3.0","repo":"minio/minio","note":"自建 S3 兼容存储，内网部署首选","effort":"","tokens":"","outline":[]},{"id":"s3","n":"S3 / 阿里云 OSS","k":"commercial","lic":"","repo":"https://aws.amazon.com/s3/","note":"不想运维就买，按量付费；出口流量费要算进成本","effort":"","tokens":"","outline":[]},{"id":"supabase-storage","n":"Supabase Storage","k":"oss","lic":"Apache-2.0","repo":"supabase/storage","note":"已经用 Supabase 就顺手，权限直接复用 RLS","effort":"","tokens":"","outline":[]},{"id":"app-file-write","n":"AI 自己写文件服务","k":"build","lic":"","repo":"","note":"上传服务本身不难，难的是鉴权与防盗链，别自己发明签名算法","effort":"1 天","tokens":"约 25 万","outline":["本地目录 + 哈希命名 + 静态路由，够用到几百 GB","必须做：类型白名单、大小上限、路径穿越防护"]}]},{"id":"app.edge","name":"硬件与设备接入","kind":"module","dom":"app","abstract":"扫码枪、小票机、称重秤、串口设备：让软件碰得到现实世界","note":"这类需求的坑在于「看着像软件问题，其实是权限问题」：扫码枪大多伪装成键盘，插上就能用；但浏览器拿不到串口和 USB，所以要么做桌面端（Electron/Tauri），要么在本地跑一个小代理转成 HTTP。判断：需求里出现「扫码枪」「打小票」「称重」「读卡」就必须先问清楚——是浏览器还是桌面端。","ins":"（不需要输入）","outs":"结构化记录 + 文本","pv":[{"id":"keyboard-wedge","n":"键盘模拟直读","k":"pattern","lic":"—","repo":"","note":"扫码枪默认就是键盘输入 + 回车；用一个隐藏输入框接即可，零依赖，先试这个","effort":"","tokens":"","outline":[]},{"id":"webhid","n":"WebHID / WebSerial","k":"pattern","lic":"—","repo":"","note":"Chrome 系可用，需要用户手动授权一次；能覆盖大部分 USB/串口设备","effort":"","tokens":"","outline":[]},{"id":"tauri","n":"Tauri / Electron 本地代理","k":"oss","lic":"MIT","repo":"tauri-apps/tauri","note":"浏览器拿不到的设备权限，交给本地壳去拿，再转成本地 HTTP 给页面用","effort":"","tokens":"","outline":[]},{"id":"app-edge-write","n":"AI 自己写设备对接","k":"build","lic":"","repo":"","note":"协议文档是唯一门槛，代码本身不难","effort":"3 天","tokens":"约 90 万","outline":["先确认设备协议（HID / 串口 / 厂商 SDK），拿不到协议就别接","统一抽象成「设备事件 → 标准 JSON」，业务层不感知厂商差异"]}]},{"id":"hw.mcu","name":"主控与模组","kind":"module","dom":"hw","abstract":"算力、内存、无线、外设全在这一颗里：选它就定了功耗、成本和认证难度","note":"小硬件的主控就是全部。选型三问，按顺序问：① 要不要 WiFi——要就 ESP32 系（C3/S3），不要就 nRF52/BK 系，后者待机电流低一个数量级；② 要不要过认证——用「带天线的模组」而不是裸芯片，模组厂商的 SRRC/FCC 认证可以复用，裸芯片要自己做射频调试和认证，这一项能差两个月；③ 量产成本——ESP32-C3 模组约 8 元，nRF52840 约 20 元，差的是 BOM 不是单价。坑：ESP32 经典款的 ADC2 和 WiFi 冲突，用 ADC 读模拟传感器时会拿到脏数据；要读模拟量就用 C3/S3 或外挂 ADC。不需要它的场合：只有「接一台现成设备」的需求，那走 app.edge。","ins":"电源 或 板卡工程 或 测量读数 或 固件","outs":"结构化记录 + 事件","pv":[{"id":"devkit-first","n":"先用开发板，不画板","k":"pattern","lic":"—","repo":"","note":"买一块 ESP32-C3-DevKitM-1（约 20 元），飞线接传感器和屏，把功能跑通再画板。这一步能挡掉 80% 的返工，小白最该做的第一件事","effort":"","tokens":"","outline":[]},{"id":"esp32c3","n":"ESP32-C3 模组","k":"commercial","lic":"—","repo":"","note":"RISC-V 单核 160MHz、WiFi+BLE5、深睡约 5µA，约 8 元；温湿度计这类需求的最优解","effort":"","tokens":"","outline":[]},{"id":"esp32s3","n":"ESP32-S3 模组","k":"commercial","lic":"—","repo":"","note":"要跑屏（LVGL）、要摄像头、要更大内存时才选；功耗比 C3 高，价格约 15 元","effort":"","tokens":"","outline":[]},{"id":"nrf52840","n":"nRF52840 模组","k":"commercial","lic":"—","repo":"","note":"只做 BLE、要极致省电（待机 <2µA）时选，约 20 元；没有 WiFi","effort":"","tokens":"","outline":[]},{"id":"stm32l0","n":"STM32L0 / L4","k":"commercial","lic":"—","repo":"","note":"工业客户指定 ST、或有现成 ST 代码栈时才选；生态重，不适合小批量","effort":"","tokens":"","outline":[]},{"id":"hw-mcu-write","n":"AI 帮你做选型与最小系统","k":"build","lic":"","repo":"","note":"选型和抄参考设计 AI 很擅长；但它不知道你的供应链价格和认证要求，这两项要人来定","effort":"0.5 天","tokens":"约 15 万","outline":["把需求翻译成 IO 清单：几个传感器、要不要屏、要不要电池","按「无线 + 功耗 + 单价」三列做对比表，给出两颗候选","照模组官方 reference design 抄最小系统（电源、复位、下载口、天线净空）","射频部分不要自己改：改天线 = 重新认证"]}]},{"id":"hw.sense","name":"传感与采集","kind":"module","dom":"hw","abstract":"温湿度这类物理量怎么变成数字：选芯片、定采样率、做补偿","note":"室内温湿度有三个坑，全是结构问题不是电路问题：① 传感器贴主板或电池，自身发热让读数偏高 2–3 ℃——要把传感器放到壳体通风处，或开隔热槽；② 便宜方案（DHT22）湿度年漂 2–5 %RH，且单总线时序怕中断，接了 WiFi 就容易读失败；③ 结露环境（厨房、浴室）要选抗凝露型号，或加周期性加热。精度目标：室内用途 ±0.3 ℃ / ±2 %RH 就够，SHT40 与 AHT20 差 3 倍价钱但都达标，别为参数多花钱。不需要它的场合：只显示时间/天气（数据从网上拿）。","ins":"（不需要输入）","outs":"测量读数","pv":[{"id":"sht40","n":"SHT40","k":"commercial","lic":"—","repo":"","note":"±0.2℃ / ±1.8%RH，出厂校准，I2C，约 8 元；室内温湿度计的默认答案","effort":"","tokens":"","outline":[]},{"id":"aht20","n":"AHT20","k":"commercial","lic":"—","repo":"","note":"±0.3℃ / ±2%RH，约 3 元，国产好买；精度够用，长期漂移略大","effort":"","tokens":"","outline":[]},{"id":"bme280","n":"BME280","k":"commercial","lic":"—","repo":"","note":"温湿压三合一，约 10 元；要做气压/海拔才需要","effort":"","tokens":"","outline":[]},{"id":"dht22","n":"DHT22 / AM2302","k":"commercial","lic":"—","repo":"","note":"约 5 元，单总线；只在极低成本且不在乎长期漂移时选，WiFi 同时工作易读失败","effort":"","tokens":"","outline":[]},{"id":"sense-module","n":"买现成分线板模块","k":"pattern","lic":"—","repo":"","note":"传感器芯片是 DFN 小封装，手工焊不了。买带排针的分线板（约 12 元），先飞线验证","effort":"","tokens":"","outline":[]},{"id":"hw-sense-write","n":"AI 帮你做采样与补偿","k":"build","lic":"","repo":"","note":"读手册写驱动是 AI 的强项；但「装在哪里」决定读数准不准，这是结构问题","effort":"1 天","tokens":"约 25 万","outline":["按芯片手册写采样时序（转换时间、CRC 校验、失败重试）","做滑动中值滤波：单次读数会被气流干扰，取 5 次中位数","按手册给的系数做温度补偿与单位换算","校准不要自己发明：用出厂系数，整机只做「与参考温度计比对」的偏差登记"]}]},{"id":"hw.display","name":"显示与交互","kind":"module","dom":"hw","abstract":"墨水屏和它的刷新策略：多久刷一次、怎么不出残影、低温怎么办","note":"墨水屏省电的本质是「刷完就断电，画面自己留着」，所以它天生适合温湿度计这种「几分钟变一次」的东西。四个坑：① 局刷快（0.3s）但有残影，每 10–20 次局刷要全刷一次清底；② 低温刷新变慢、对比度变差，0 ℃ 以下要加长刷新时间甚至预热；③ 三色（黑白红）只能全刷、要 15–20 秒、且不能局刷——想标红报警就先算功耗；④ 刷屏瞬间电流 20–40 mA，是整机功耗的大头：5 分钟一刷比 1 分钟一刷续航差 5 倍。不需要它的场合：数据只在手机上看。","ins":"结构化记录 或 固件 或 电源","outs":"界面","pv":[{"id":"gxepd2","n":"GxEPD2","k":"oss","lic":"GPL-3.0","repo":"ZinggJM/GxEPD2","note":"Arduino 生态里最全的墨水屏驱动，覆盖微雪/合宙大部分型号，含局刷与部分刷新窗口","effort":"","tokens":"","outline":[]},{"id":"epdiy","n":"epdiy","k":"oss","lic":"MIT","repo":"vroland/epdiy","note":"ESP32 专用，刷新快、支持灰度；偏向大屏与阅读器场景，小屏用不上它的复杂度","effort":"","tokens":"","outline":[]},{"id":"epd-module","n":"买带转接板的屏模块","k":"pattern","lic":"—","repo":"","note":"裸屏是 FPC 排线，插不进面包板。买「屏 + 转接板 + 排线」的套件（2.9 寸约 60 元）","effort":"","tokens":"","outline":[]},{"id":"lvgl","n":"LVGL","k":"oss","lic":"MIT","repo":"lvgl/lvgl","note":"通用 GUI 库，能做复杂界面；但墨水屏刷新慢，用它等于用拖拉机跑赛道，除非同时有 LCD 版本","effort":"","tokens":"","outline":[]},{"id":"hw-display-write","n":"AI 帮你写刷新策略","k":"build","lic":"","repo":"","note":"驱动照开源库抄就行，自研的只是「什么时候刷」这一层策略","effort":"1.5 天","tokens":"约 35 万","outline":["定义刷新策略表：整点全刷、变化超阈值局刷、其余不刷","局刷计数到 N 次强制全刷一次，消除残影累积","按温度查表调整刷新时长（低温加长）","屏不进深睡会漏电：刷完立刻拉低电源或进屏自己的 sleep"]}]},{"id":"hw.power","name":"供电与续航","kind":"module","dom":"hw","abstract":"电池、充电、稳压与低功耗：决定用户多久换一次电","note":"墨水屏温湿度计是「低功耗设计」的入门课，也是最容易翻车的一格。实测口径：ESP32-C3 每 5 分钟唤醒采样 + 局刷 + 上报，平均电流约 18–25 µA，2000 mAh 电池约 4 年；但下面任何一条都能让它变成三个月：① LDO 静态电流没看（选 1 µA 级的，别用 5 mA 的 1117）；② I2C 上拉电阻一直供电；③ 传感器没进 sleep；④ 唤醒后忘了关 WiFi 射频。电池选择：两节 AA（3V 直供，免升压）最省事、最好换；锂电 + LDO 体积小但要考虑充电与运输限制；CR2477 纽扣电池适合超薄但要算清峰值电流（刷屏瞬间可能拉不动）。不需要它的场合：USB 常供电的桌面款。","ins":"板卡工程","outs":"电源","pv":[{"id":"aa-direct","n":"两节 AA 直供","k":"pattern","lic":"—","repo":"","note":"3V 直接喂，不用升压也不用充电电路；换电池是用户已经会的动作。首选","effort":"","tokens":"","outline":[]},{"id":"li-ion-ldo","n":"锂电 + 低静态 LDO","k":"pattern","lic":"—","repo":"","note":"TP4056 充电 + MCP1700（1.6µA 静态）稳压；注意锂电运输要 UN38.3","effort":"","tokens":"","outline":[]},{"id":"deep-sleep","n":"深睡 + 定时唤醒","k":"pattern","lic":"—","repo":"","note":"不是器件是做法：能睡就睡，醒来干活不超过 2 秒；实测这条能把平均电流压到 20µA 级","effort":"","tokens":"","outline":[]},{"id":"esp-idf-pm","n":"ESP-IDF 电源管理","k":"oss","lic":"Apache-2.0","repo":"espressif/esp-idf","note":"自动 Light-sleep + 动态调频，配合外设电源域开关；比自己手写 sleep 稳","effort":"","tokens":"","outline":[]},{"id":"hw-power-write","n":"AI 帮你算续航与查漏电","k":"build","lic":"","repo":"","note":"算账 AI 很准；但「漏电在哪」必须上电流表实测，猜不出来","effort":"0.5 天","tokens":"约 12 万","outline":["列出每个器件的「工作电流 × 占空比 + 待机电流」，加总得平均电流","按电池容量算续航，留 30% 余量给自放电与低温","逐项排查漏电：LDO 静态、上拉、屏待机、传感器未 sleep、调试口常开","峰值电流核对：刷屏瞬间 40mA，纽扣电池内阻会拉垮电压导致复位"]}]},{"id":"hw.wireless","name":"无线与协议","kind":"module","dom":"hw","abstract":"蓝牙、WiFi、Matter、MQTT：设备怎么被手机和家庭中枢发现","note":"「蓝牙和 WiFi 都要」是最常见的要求，也是成本分水岭：ESP32-C3 一颗芯片同时支持 BLE 与 WiFi，所以这个需求不需要两颗芯片。协议按「接进哪个生态」选，反过来选一定后悔：接米家/涂鸦 → 走厂商云（快，但数据在别人手里、断网失联）；接 Home Assistant → MQTT 或 ESPHome 原生 API（最自由）；要跨生态（苹果/谷歌/亚马逊都认）→ Matter，但它对内存要求高，C3 勉强、S3 才舒服。坑：BLE 广播间隔从 100ms 调到 1s，平均电流能差 3 倍；WiFi 别做「每秒上报」，路由器都受不了。","ins":"结构化记录 或 固件 或 电源","outs":"事件","pv":[{"id":"esp-wifi","n":"ESP-IDF WiFi + BLE","k":"oss","lic":"Apache-2.0","repo":"espressif/esp-idf","note":"同一颗芯片跑双模，配网用 BLE、日常用 WiFi 上报，是最常见的组合","effort":"","tokens":"","outline":[]},{"id":"nimble","n":"NimBLE","k":"oss","lic":"Apache-2.0","repo":"espressif/esp-nimble","note":"ESP32 上的轻量 BLE 协议栈，占内存比 Bluedroid 少一半；只做 BLE 时选它","effort":"","tokens":"","outline":[]},{"id":"matter-sdk","n":"Matter (connectedhomeip)","k":"oss","lic":"Apache-2.0","repo":"project-chip/connectedhomeip","note":"跨生态的唯一解；代价是固件体积与内存，C3 要裁剪，S3 更稳","effort":"","tokens":"","outline":[]},{"id":"mqtt","n":"MQTT 上报","k":"pattern","lic":"—","repo":"","note":"最省事的自建路线：设备发 JSON 到一个 topic，服务端订阅即可；断线要能本地缓存","effort":"","tokens":"","outline":[]},{"id":"hw-wireless-write","n":"AI 帮你写配网与上报","k":"build","lic":"","repo":"","note":"配网与上报的代码 AI 写得很熟；难点在「断网、弱网、路由器换密码」这些异常路径","effort":"2 天","tokens":"约 50 万","outline":["BLE 配网：广播一个临时服务，手机写入 WiFi SSID/密码，超时自动退出","WiFi 断线重连要退避（1s→2s→4s…），别死循环重连把电耗光","上报协议用最简 JSON，字段带设备 id、时间戳、电量","断网时把读数存本地环形缓冲，恢复后补传（至少留 24 小时）"]}]},{"id":"hw.firmware","name":"固件与 OTA","kind":"module","dom":"hw","abstract":"采样、休眠、刷屏、上报、OTA：设备真正在跑的那段逻辑","note":"固件的核心不是「读传感器」，而是「怎么在 20µA 的预算里安排唤醒—采样—刷屏—上报」，以及「装到墙上之后还能不能改」。OTA 必须做：设备装上去之后，你不会想为了改一个阈值把它拆下来插 USB。OTA 三个坑：分区表没留 OTA 区（编译就失败）、升级过程断电变砖（要 A/B 双分区 + 回滚）、固件版本与服务器接口不匹配（上报字段改了但设备还是老固件，服务端要能兼容）。框架选择：ESP-IDF 正统、能力全；Arduino/PlatformIO 上手快；ESPHome 只写 YAML 就能出固件，适合「不打算写代码」的人，但定制逻辑受限于它的组件模型。","ins":"板卡工程 或 电源 或 测量读数","outs":"固件","pv":[{"id":"esp-idf","n":"ESP-IDF","k":"oss","lic":"Apache-2.0","repo":"espressif/esp-idf","note":"官方框架，OTA、电源管理、配网都有现成组件；学习曲线陡但天花板高","effort":"","tokens":"","outline":[]},{"id":"esphome","n":"ESPHome","k":"oss","lic":"GPL-3.0","repo":"esphome/esphome","note":"写 YAML 出固件，自带 OTA、HA 直连、OTA 回滚；不想写 C 的人最优解","effort":"","tokens":"","outline":[]},{"id":"platformio","n":"PlatformIO (Arduino)","k":"oss","lic":"Apache-2.0","repo":"platformio/platformio-core","note":"Arduino 生态 + 工程化管理；库多、上手快，OTA 要自己接","effort":"","tokens":"","outline":[]},{"id":"zephyr","n":"Zephyr RTOS","k":"oss","lic":"Apache-2.0","repo":"zephyrproject-rtos/zephyr","note":"多平台、工业级；小批量做消费硬件属于过度设计，除非团队本来就用它","effort":"","tokens":"","outline":[]},{"id":"hw-firmware-write","n":"AI 帮你写主循环与 OTA","k":"build","lic":"","repo":"","note":"写代码不难；难的是断电、弱网、传感器 I2C 卡死这些异常分支，AI 会漏，要人补","effort":"3 天","tokens":"约 80 万","outline":["主循环写成状态机：唤醒 → 读传感 → 判是否要刷 → 上报 → 睡到下一个整点","所有阻塞操作加超时，任一外设挂了也要能睡下去（否则一晚掉光电）","OTA 用双分区 + 校验 + 失败回滚，升级时先上报「开始升级」","留一个串口调试口和一条「恢复出厂」的物理条件（长按/上电三次）"]}]},{"id":"hw.pcb","name":"电路与打样","kind":"module","dom":"hw","abstract":"原理图、PCB 布线、打样与贴片：把方案变成一块能焊的板子","note":"温湿度计这类板子很小（2×3 cm），难点不在画图，在四件事：① 天线净空——模组天线下方和周围不能铺铜、不能放电池，否则信号掉 10dB；② 电源噪声——WiFi 发射瞬间的电流尖峰会让 ADC 读数跳，模拟部分要单独走线和滤波；③ 传感器热隔离——传感器周围开槽、远离 LDO 和充电芯片；④ 装配方向——丝印、连接器朝向、电池仓开口，画错了壳就装不进去。打样：嘉立创 5 片 4 层约 50 元、48 小时；贴片（SMT）首单有优惠，比自己手焊稳。第一版务必留测试点（TP）和飞线焊盘，改板时能救急。","ins":"（不需要输入）","outs":"板卡工程","pv":[{"id":"kicad","n":"KiCad","k":"oss","lic":"GPL-3.0","repo":"KiCad/kicad-source-mirror","note":"免费、跨平台、库全；缺点是没有「供应链联动」，BOM 要自己核","effort":"","tokens":"","outline":[]},{"id":"lceda","n":"嘉立创 EDA","k":"commercial","lic":"免费","repo":"","note":"在线、器件库直连立创商城、一键下单打样+贴片；国内小批量最省事，格式不通用","effort":"","tokens":"","outline":[]},{"id":"jlcpcb","n":"嘉立创打样 + SMT","k":"commercial","lic":"—","repo":"","note":"5 片 4 层约 50 元 48 小时；贴片按点数算，首单常免；比自己手焊良率高","effort":"","tokens":"","outline":[]},{"id":"ref-design","n":"照模组参考设计抄","k":"pattern","lic":"—","repo":"","note":"最小系统（电源、复位、下载口、晶振）不要自己发明，照官方 reference design 画，能少一半错","effort":"","tokens":"","outline":[]},{"id":"hw-pcb-write","n":"AI 帮你出第一版原理图","k":"build","lic":"","repo":"","note":"连线和 BOM 能出；布局布线与 EMC 是经验活，第一版建议找人过一眼","effort":"2 天","tokens":"约 45 万","outline":["按模组 reference design 连最小系统，逐脚核对（EN、BOOT、TX/RX）","传感器与屏按各自 datasheet 的典型应用电路接，注意上拉与去耦","画完自查清单：天线净空、电源去耦、ESD、测试点、丝印方向","射频与电源布局必须人工复核——AI 画得出连线，看不出「这条线太细会烧」"]}]},{"id":"hw.enclosure","name":"结构与外壳","kind":"module","dom":"hw","abstract":"壳子、通风、装配：决定读数准不准、能不能批量做","note":"外壳对温湿度计不是外观问题，是测量问题：① 传感器必须和主板、电池热隔离，否则读数偏高 2–3 ℃；② 要有通风孔，但不能让灰尘、油烟、结露直接打到传感器上（用迷宫式或百叶式开孔）；③ 墨水屏视窗要留公差，FPC 不能被压折；④ 电池仓要能徒手换，别设计成要拆整机。工艺门槛：FDM 打印适合 1–20 台（单价 20–60 元），超过 50 台就该考虑注塑（模具 1–3 万，单价降到几块）。坑：螺丝柱用自攻螺丝配 2.8mm 孔，别设计成 M2 机牙（打印件攻不出牙）；卡扣第一次设计一定断，留 0.2mm 间隙。","ins":"板卡工程","outs":"板卡工程","pv":[{"id":"freecad","n":"FreeCAD","k":"oss","lic":"LGPL-2.1","repo":"FreeCAD/FreeCAD","note":"免费参数化建模，改尺寸方便；界面难用，但够做壳","effort":"","tokens":"","outline":[]},{"id":"fusion360","n":"Fusion 360","k":"commercial","lic":"个人版免费","repo":"","note":"建模顺、能出工程图；个人版有功能限制，商用要付费","effort":"","tokens":"","outline":[]},{"id":"openscad","n":"OpenSCAD","k":"oss","lic":"GPL-2.0","repo":"openscad/openscad","note":"用代码写模型，参数化最强；适合「尺寸要反复调」的小壳，不适合曲面造型","effort":"","tokens":"","outline":[]},{"id":"jlc3dp","n":"嘉立创 3D 打印 / 注塑","k":"commercial","lic":"—","repo":"","note":"打印按克计价、次日发货；小批量注塑也能报模具价，省去找厂","effort":"","tokens":"","outline":[]},{"id":"hw-encl-write","n":"AI 帮你出第一版壳","k":"build","lic":"","repo":"","note":"能出可打印的模型；公差与手感（卡扣力度、拔模角）要打了才知道","effort":"1.5 天","tokens":"约 30 万","outline":["按板卡 3D 模型（STEP）反推内腔尺寸，留 0.3mm 装配间隙","传感器位置开独立腔体 + 迷宫通风孔，远离发热器件","屏视窗留 0.3mm 公差，四周加支撑筋防止压屏","出 STL 打样，第一版必然要改，别一次做 50 个"]}]},{"id":"hw.gateway","name":"数据落地","kind":"module","dom":"hw","abstract":"设备数据怎么进软件：本地网关、MQTT、还是厂商云","note":"这一格是软硬交界，选错了后面全返工。三条路，按「数据归谁」选：① 设备直连 MQTT（Mosquitto/EMQX），自己的软件订阅——最自由，需要一台常开的机器或服务器；② 走 Home Assistant / ESPHome，用现成看板与自动化——最省事，但自定义能力受限于 HA；③ 走厂商云（涂鸦/米家/TP-Link）——最快，但数据在别人手里、断网即失联、接口随时可能变。「局域网能用、断网也能看」这个要求会直接淘汰第 ③ 条，先问清楚再选。不管走哪条，设备侧都要：唯一 id、时间戳（用上报时间而不是设备时钟，设备时钟一定会漂）、电量字段。","ins":"测量读数 或 结构化记录","outs":"结构化记录","pv":[{"id":"mosquitto","n":"Mosquitto (MQTT)","k":"oss","lic":"EPL-2.0","repo":"eclipse/mosquitto","note":"一个 broker 几十 KB，树莓派/NAS 上就能跑；设备发 topic，软件订阅，最直接","effort":"","tokens":"","outline":[]},{"id":"home-assistant","n":"Home Assistant","k":"oss","lic":"Apache-2.0","repo":"home-assistant/core","note":"自带看板、自动化、历史曲线、手机 App；不想写后端的人的最优解","effort":"","tokens":"","outline":[]},{"id":"esp32-http","n":"设备直接 POST 到自己的接口","k":"pattern","lic":"—","repo":"","note":"零中间件：设备 HTTP POST JSON 到你已有的服务；缺点是没有订阅机制，要自己处理重试","effort":"","tokens":"","outline":[]},{"id":"emqx","n":"EMQX","k":"oss","lic":"BSL-1.1","repo":"emqx/emqx","note":"万台级设备、要规则引擎和桥接时才需要；家用属于杀鸡用牛刀","effort":"","tokens":"","outline":[]},{"id":"tuya-cloud","n":"涂鸦 / 米家云","k":"commercial","lic":"—","repo":"","note":"接入最快、自带 App 与语音助手；数据在厂商侧，断网失联，接口受制于人","effort":"","tokens":"","outline":[]},{"id":"hw-gateway-write","n":"AI 帮你写接入服务","k":"build","lic":"","repo":"","note":"接入服务代码 AI 写得很顺；真正的工作量在「离线判定、时区、补传去重」这些边界","effort":"2 天","tokens":"约 40 万","outline":["定设备消息格式（id、ts、temp、humi、batt），版本号写进字段","服务端起一个订阅或 HTTP 入口，落库前做去重（同 id 同 ts 丢弃）","补一条「设备离线」判定：超过 3 个上报周期没数据就标记离线并告警","时间以服务端接收时间为准，设备时钟只做参考"]}]},{"id":"hw.cert","name":"认证与量产","kind":"module","dom":"hw","abstract":"SRRC/CE/FCC、电池运输、批量烧录与出厂标定：能不能合法卖","note":"自己用完全不用管这一格；一旦要卖，它就是「能不能上架」的硬门槛。国内带无线的产品要 SRRC 型号核准（约 5000–15000 元、4–6 周），出海要 CE-RED（欧）或 FCC-ID（美）；含锂电池还要 UN38.3 运输报告，快递才会收。省钱的办法只有一个：用「已经认证过的无线模组」，模组厂商的 SRRC/FCC 可以复用（要一份授权书），整机只补做 EMC 与安规，费用能砍掉一大半。量产三件事：① 批量烧录（esptool 多口并行，8 口一次约 2 分钟）；② 设备唯一 id 与出厂记录（id 写进 efuse 或独立分区，别用随机数，重烧会重复）；③ 出厂抽检（读数与参考温度计比对，逐台校准会贵到不可行，用传感器出厂系数即可）。","ins":"板卡工程 或 固件","outs":"（无产出）","pv":[{"id":"certified-module","n":"复用已认证模组","k":"pattern","lic":"—","repo":"","note":"选带 SRRC/FCC 认证的模组（乐鑫/安信可大多有），向厂商索取授权书；整机只补 EMC","effort":"","tokens":"","outline":[]},{"id":"esptool","n":"esptool 批量烧录","k":"oss","lic":"GPL-2.0","repo":"espressif/esptool","note":"命令行烧录 + 多口并行脚本；产线夹具一次烧 8 片，比一台一台插快 10 倍","effort":"","tokens":"","outline":[]},{"id":"test-lab","n":"第三方认证代理","k":"commercial","lic":"—","repo":"","note":"SRRC/CE/FCC 一般都由代理跑流程；报价差异大，先问「模组已认证能否减免」","effort":"","tokens":"","outline":[]},{"id":"hw-cert-write","n":"AI 帮你整理认证清单与出厂流程","k":"build","lic":"","repo":"","note":"整理清单和流程 AI 很擅长；费用与周期必须问代理，别信估算","effort":"0.5 天","tokens":"约 10 万","outline":["按「无线制式 + 电池类型 + 销售地区」列认证矩阵，标出可复用项","列出需要提交的资料：电路图、BOM、天线规格、说明书、样机数量","写出厂检验规程：烧录 → 写 id → 抽检读数 → 贴标 → 包装","把「型号核准证编号」印在包装上，这是合规要求"]}]},{"id":"hw.sense.calib","name":"校准与补偿","kind":"part","dom":"hw","abstract":"把原始读数修成可信读数：补偿、滤波、偏差登记","note":"三层：芯片内部已做出厂校准（温湿度都是数字量，不用自己做线性化）；整机层要做的是「安装位置带来的偏差」——同一个传感器装在不同壳里读数差 1–2 ℃，办法是出厂时与参考温度计比对一次，把偏差写进设备配置，而不是改固件。不要做「用户可调校准」，那等于把责任推给用户。","ins":"测量读数","outs":"测量读数","pv":[{"id":"offset-config","n":"出厂偏差登记","k":"pattern","lic":"—","repo":"","note":"每台写一个 offset 值到配置分区，服务端读数时减掉；比逐台改固件省事","effort":"","tokens":"","outline":[]},{"id":"median-filter","n":"中值 + 滑动平均","k":"pattern","lic":"—","repo":"","note":"气流与自热会造成单点跳变，取 5 点中值再去掉首尾平均，足够稳","effort":"","tokens":"","outline":[]}]},{"id":"hw.display.refresh","name":"刷新策略","kind":"part","dom":"hw","abstract":"什么时候刷、全刷还是局刷、低温怎么调","note":"策略比驱动重要：温度没变就不刷（墨水屏不刷也保持画面），变化超过阈值才局刷，每 15 次局刷强制全刷清残影，整点全刷一次对齐时间显示。把「刷屏次数」当成核心成本指标——它直接决定续航。","ins":"结构化记录","outs":"界面","pv":[{"id":"dirty-check","n":"变化检测再刷","k":"pattern","lic":"—","repo":"","note":"与上次显示值比对，温湿度都没变就不刷；这一条能把日均刷新次数从 288 降到 20 以内","effort":"","tokens":"","outline":[]},{"id":"full-refresh-n","n":"每 N 次局刷做一次全刷","k":"pattern","lic":"—","repo":"","note":"N 取 10–20；不做的后果是白底逐渐发灰，用户会以为屏坏了","effort":"","tokens":"","outline":[]}]},{"id":"hw.power.deep","name":"低功耗策略","kind":"part","dom":"hw","abstract":"睡眠电流从 mA 压到 µA：关什么、什么时候关","note":"顺序是固定的：先量出「什么都不做」时的电流，再逐个关外设、看电流掉多少。典型顺序：关 WiFi 射频 → 屏进 sleep → 传感器进 sleep → 关 LDO 给传感的支路 → 主控深睡。每一步都要实测，datasheet 上的典型值经常差 2–3 倍。","ins":"电源","outs":"电源","pv":[{"id":"kill-rail","n":"外设独立供电轨","k":"pattern","lic":"—","repo":"","note":"传感器与屏各走一个 MOS 开关，睡前一刀切电；比让它们自己 sleep 更彻底","effort":"","tokens":"","outline":[]},{"id":"measure-first","n":"先测再改","k":"pattern","lic":"—","repo":"","note":"用 µA 档万用表或电流表串在电池上，改一处测一次；不看数就调参等于摸黑","effort":"","tokens":"","outline":[]}]},{"id":"app.window","name":"桌面外壳与托盘","kind":"module","dom":"app","abstract":"把界面变成能双击打开、能常驻托盘的窗口：托盘、全局快捷键、开机自启、单实例都在这","note":"这一步决定了后面所有系统能力的写法。三种壳的差别不在界面，在「你能不能碰到系统」：网页什么都碰不到（读不了本地文件、开不了别的程序、没有托盘）；Electron 什么都能碰，代价是一个 150MB 的 Chromium；Tauri 用系统自带 WebView，包体 10MB 级，但每个系统能力都要写一小段 Rust 命令（x-hub 就是这么干的，328 个命令）。坑一：先做成网页、以后再套壳——套壳那天会发现所有系统调用都要重写一遍，约等于重做。坑二：忘了单实例。用户双击两次就有两个进程同时写同一个数据库，第一条笔记就冲突。不需要它的场合：这东西只在浏览器里用、不需要常驻，那就别做壳，做成 PWA 更省。","ins":"（不需要输入）","outs":"界面","pv":[{"id":"tauri2","n":"Tauri 2","k":"oss","lic":"MIT / Apache-2.0","repo":"tauri-apps/tauri","note":"系统 WebView 渲染，安装包 8–12MB。x-hub 就是这套：328 个命令、10 个窗口入口。要托盘/快捷键/开机自启，加官方插件即可；系统能力自己写 Rust 命令","effort":"","tokens":"","outline":[]},{"id":"electron","n":"Electron","k":"oss","lic":"MIT","repo":"electron/electron","note":"自带 Chromium，包体 150MB 起。优点是什么都能碰、出问题搜得到答案；缺点是内存与体积，一个常驻托盘应用会吃掉 200MB+","effort":"","tokens":"","outline":[]},{"id":"pwa","n":"纯 Web / PWA","k":"pattern","lic":"—","repo":"","note":"零安装、跨平台、能推送。但没有托盘、没有全局快捷键、不能启动别的程序、碰不到托盘图标——「个人中台」这个形态基本用不了它","effort":"","tokens":"","outline":[]},{"id":"app-window-write","n":"AI 帮你搭壳","k":"build","lic":"","repo":"","note":"","effort":"1 天","tokens":"约 20 万","outline":["窗口与自制标题栏","托盘常驻与关闭即隐藏","全局快捷键 + 单实例 + 开机自启"]}]},{"id":"app.todo","name":"待办与提醒","kind":"module","dom":"app","abstract":"一条待办该有的东西：优先级、截止时间、子任务、置顶、周期重复、到点提醒","note":"看着简单，坏在周期规则上。正确写法是「勾一次，滚动到下一轮」——每天 8 点吃药，今天勾了就生成明天的，同一时刻只有一条活的；错误写法是「按天预生成」，一周后列表里躺着 7 条逾期，用户再也不想打开。提醒必须放在后台线程/系统定时器里：WebView 最小化后 setInterval 会被节流到 1 分钟甚至冻结，到点不响的理由九成是这个（x-hub 把倒计时和提醒都放在 Rust 里 1s 轮询）。坑：截止时间用本地时区存毫秒时间戳，别存字符串——夏令时和跨时区一改就全错。","ins":"（不需要输入）","outs":"结构化记录","pv":[{"id":"todo-self","n":"自建表 + 自研周期规则","k":"pattern","lic":"—","repo":"","note":"SQLite 一张表 + parent_id 两层子任务，最可控。周期规则自己写（约 300 行），要覆盖每天/每周/每月/工作日，并保证「不堆积逾期副本」","effort":"","tokens":"","outline":[]},{"id":"caldav","n":"CalDAV（Radicale / Nextcloud）","k":"oss","lic":"GPL-3.0","repo":"Kozea/Radicale","note":"手机自带日历直接能订阅，省掉自己做移动端。代价是要吃透 iCalendar 的 RRULE，而且「提醒」由系统日历负责，你控制不了样式","effort":"","tokens":"","outline":[]},{"id":"cal-ui","n":"现成日历组件（FullCalendar / schedule-x）","k":"oss","lic":"MIT","repo":"fullcalendar/fullcalendar","note":"月/周视图半天就能出，拖拽改期也是现成的。但它只管「显示」，周期规则和数据存储仍然要自己写","effort":"","tokens":"","outline":[]},{"id":"app-todo-write","n":"AI 帮你写待办与提醒","k":"build","lic":"","repo":"","note":"","effort":"1 天","tokens":"约 25 万","outline":["表结构与子任务级联","周期规则（滚动而非预生成）","后台提醒线程与防重复触发"]}]},{"id":"app.clip","name":"剪贴板历史","kind":"module","dom":"app","abstract":"把 Ctrl+C 过的东西留下来：文本、图片、文件路径，能搜、能贴回去","note":"难点不在存，在采样与内存。文本可以直接轮询剪贴板；图片要判类型、落盘缩略图，否则几十张截图就把内存撑爆（x-hub 的做法：图片按内容哈希落盘，同内容自动去重，删记录时联动删文件）。坑一：Windows 上截图工具往剪贴板写的是 DIB 位图，直接存成 .png 会得到一张全透明图（alpha 通道没初始化），要按 32bpp 单独处理。坑二：把密码管理器的复制内容也记下来。要有「排除列表」，日期和频率都要可配。不做也行的场合：用户只用系统自带剪贴板，这块可以直接砍掉。","ins":"（不需要输入）","outs":"结构化记录","pv":[{"id":"clip-self","n":"系统剪贴板监听（自研）","k":"pattern","lic":"—","repo":"","note":"Tauri 用 clipboard-manager 插件读，配一个 500ms 轮询或事件；内容哈希去重，图片落盘缩略图，保留条数与天数可配","effort":"","tokens":"","outline":[]},{"id":"clip-3rd","n":"直接推荐第三方（Maccy / CopyQ / Ditto）","k":"pattern","lic":"—","repo":"","note":"不自己写，安装说明里让用户装一个。省两周开发，代价是体验割裂、不能和你的搜索/待办打通","effort":"","tokens":"","outline":[]},{"id":"app-clip-write","n":"AI 帮你写剪贴板历史","k":"build","lic":"","repo":"","note":"","effort":"0.5 天","tokens":"约 12 万","outline":["监听与去重","图片落盘与清理","浮层 UI 与粘贴回写"]}]},{"id":"app.launch","name":"快捷启动器","kind":"module","dom":"app","abstract":"把常用的应用、网页、文件钉成一组，点一下就开，已经开着的就切到前台","note":"最容易低估的是「已运行则前置」：不处理的话用户点三次就开出三个窗口。Windows 要枚举窗口并还原最小化（含收进托盘的），macOS 要 NSRunningApplication.activate，两边都不是一句 shell 能解决的。其次是指标图标：.lnk 要解引用到目标 exe 再取图标，取不到就退化成首字母色块——用户对这个很敏感，「图标空白」等于「这软件没做好」。坑：拖拽导入只处理了 exe，忘了 .lnk / .desktop / .app，Mac 用户第一个就骂。","ins":"结构化记录","outs":"外部动作","pv":[{"id":"launch-scan","n":"扫系统菜单批量导入（自研）","k":"pattern","lic":"—","repo":"","note":"Windows 扫开始菜单 .lnk、macOS 扫 /Applications 与 /System/Applications，一次导入几十个；图标用原生接口取 256px（不要截屏缩放，会糊）","effort":"","tokens":"","outline":[]},{"id":"launch-open","n":"系统命令启动（open / start / xdg-open）","k":"pattern","lic":"—","repo":"","note":"最简单的一版：只做「打开文件/网址」。能覆盖 80% 需求，但做不到「已运行则前置」和「指定浏览器打开」","effort":"","tokens":"","outline":[]},{"id":"launch-3rd","n":"交给第三方（Raycast / Alfred / ueli）","k":"pattern","lic":"—","repo":"","note":"不自己写启动器，改成「导出配置文件」给这些工具用。适合你自己的中台不想做入口的情况","effort":"","tokens":"","outline":[]},{"id":"app-launch-write","n":"AI 帮你写启动器","k":"build","lic":"","repo":"","note":"","effort":"1 天","tokens":"约 18 万","outline":["扫描与图标提取","启动/前置/提权三条路径","拖拽导入与右键菜单"]}]},{"id":"app.plugin","name":"扩展系统","kind":"module","dom":"app","abstract":"让别人（或者三个月后的你）能往这个中台里加功能，而不用改主程序","note":"关键不是「加载代码」，是「声明与拦截」：manifest 里写清要哪些权限、依赖哪些宿主能力、依赖哪些别的扩展，扫描时就能直接标出「缺能力/缺依赖/已禁用」并把入口置灰，而不是等用户点进去白屏（x-hub 的 manifest 就是这么设计的，四种形态 module/view/window/drawer）。坑一：权限用字符串拼、没有注册表。加一个能力要改三处 match，最后没人敢动。正确做法是一张 CAPABILITIES 静态表，新增能力 = 加一行 + 写 handler。坑二：一开始不留 manifest，等要加插件时发现所有模块都是硬编码的，等于重构。不需要它的场合：只有你自己用、功能已经够了——那就别做，扩展系统本身就是一个大坑。","ins":"界面","outs":"界面","pv":[{"id":"plug-iframe","n":"manifest + iframe 沙箱","k":"pattern","lic":"—","repo":"","note":"扩展是一个目录：manifest.json + 入口 html，宿主注入 window.xhub 桥 API。JS 崩了不影响主程序，权限按 manifest 逐项授权（x-hub 走的就是这条）","effort":"","tokens":"","outline":[]},{"id":"plug-node","n":"Node 子进程（VS Code 式）","k":"pattern","lic":"—","repo":"","note":"能力最强（能读写文件、起服务），但要自己管进程、崩溃重启、版本隔离。适合「扩展要干重活」的场景，不适合小工具","effort":"","tokens":"","outline":[]},{"id":"plug-config","n":"只做配置型扩展（Obsidian / Logseq 式）","k":"pattern","lic":"—","repo":"","note":"扩展只是「一段 JSON + 一个脚本片段」，不给完整 UI。上手最快，但做不了复杂面板","effort":"","tokens":"","outline":[]},{"id":"app-plugin-write","n":"AI 帮你写扩展系统","k":"build","lic":"","repo":"","note":"","effort":"3 天","tokens":"约 60 万","outline":["manifest 解析与状态求值","桥 API 注册表与权限拦截","四种形态的加载与卸载"]}]},{"id":"app.update","name":"自动更新","kind":"module","dom":"app","abstract":"新版本能自己检查、下载、替换、重启；坏版本能退回","note":"自研更新的全部难点在「信任」和「回滚」：清单必须验签（Ed25519 分离签名），包必须校验 sha256，替换必须能在失败时退回旧版，否则一次坏发布就能让所有用户打不开。顺序也要留后路：先下载到临时目录 → 校验 → 改名两步替换（不能覆盖运行中的二进制）→ 失败重试。坑：只做「跳转到 Releases 让用户手动下」看着省事，但用户永远停在旧版本，你后面修的每个 bug 都只在一半人那里生效。坑：不做 minimumUpgradable 下限，跨太多版本升级会踩到旧数据迁移。","ins":"界面","outs":"事件","pv":[{"id":"upd-tauri","n":"Tauri 官方 updater 插件","k":"oss","lic":"MIT/Apache-2.0","repo":"tauri-apps/plugins-workspace","note":"清单、签名、下载、重启都是现成的，接上就能用。缺点是格式固定、渠道（标准版/便携版）要自己再包一层","effort":"","tokens":"","outline":[]},{"id":"upd-self","n":"自研清单 + Ed25519 验签","k":"pattern","lic":"—","repo":"","note":"x-hub 的做法：update.json 带分离签名，内嵌公钥验签通过才信任，再比 semver + minimumUpgradable 跳级保护，下载完 sha256 校验，重启时解包并两步 rename 自替换，失败自动回滚","effort":"","tokens":"","outline":[]},{"id":"upd-none","n":"不做自动更新","k":"pattern","lic":"—","repo":"","note":"只在「关于」里放一个 Releases 链接。0 成本，但版本碎片会一直跟着你","effort":"","tokens":"","outline":[]},{"id":"app-update-write","n":"AI 帮你写更新链路","k":"build","lic":"","repo":"","note":"","effort":"2 天","tokens":"约 35 万","outline":["清单格式与验签","下载进度与断点","自替换与失败回滚"]}]},{"id":"app.sync","name":"多端同步","kind":"module","dom":"app","abstract":"桌面和手机看到同一份数据；服务器只存密文，不存明文","note":"先决定「加密发生在哪」：端到端加密（口令派生密钥，数据在本机加密后才上传）和「服务器帮你加密」是两件事，前者服务器被看也不泄露，后者只是换个地方裸奔。再决定合并策略：按「最新修改时间」合并 + 删除走墓碑，是最省事且不会丢数据的一档；想做冲突合并（同一段两边改）成本会翻好几倍。坑：加密参数必须两端逐字节一致，否则解不开（x-hub 用 scrypt+chacha20poly1305，并留了一份跨语言测试向量给小程序对拍）。不需要它的场合：只有一台设备——别做同步，做了就是给自己找数据冲突。","ins":"结构化记录 或 界面","outs":"结构化记录","pv":[{"id":"sync-self","n":"自建服务端 + 端到端加密","k":"pattern","lic":"—","repo":"","note":"最贵也最干净：本机加密 → 上传密文 → 手机扫码配对同一口令。要自己做配对、增量、墓碑删除。适合「数据一定不能给第三方」的场景","effort":"","tokens":"","outline":[]},{"id":"sync-webdav","n":"WebDAV（坚果云 / Nextcloud / 群晖）","k":"oss","lic":"AGPL-3.0","repo":"nextcloud/server","note":"不用自己运维，一个地址 + 账号就能同步。代价是没有服务端逻辑：冲突只能靠文件时间戳，删除要靠墓碑文件","effort":"","tokens":"","outline":[]},{"id":"sync-git","n":"Git 仓库（含 LFS）","k":"oss","lic":"GPL-2.0","repo":"git/git","note":"天然带版本历史，误删能找回。缺点是每次同步都要 commit，大文件（图片/录音）要用 LFS，手机端基本没法用","effort":"","tokens":"","outline":[]},{"id":"app-sync-write","n":"AI 帮你写同步","k":"build","lic":"","repo":"","note":"","effort":"3 天","tokens":"约 50 万","outline":["密钥派生与加解密","增量与墓碑删除","配对流程与冲突合并"]}]},{"id":"biz.catalog","name":"商品与 SKU","kind":"module","dom":"biz","abstract":"一个商品拆成可售卖的最小单位：规格、图片、价格、上下架","note":"看起来是「存个商品表」，实际难点在规格：一件 T 恤有颜色 × 尺码 = 6 个 SKU，每个 SKU 有自己的价格、库存、条码、图片。用「商品表 + 规格文本」的写法，第一个月就会遇到「红色 L 没货但页面显示有货」。正确做法是商品（SPU）与规格（SKU）两张表，库存、价格、条码全挂在 SKU 上，商品只负责展示。坑：SKU 编码一旦发出去（印在包装上、同步到平台）就不能改，所以编码规则要在建表那天定死。","ins":"（不需要输入）","outs":"结构化记录","pv":[{"id":"saleor-catalog","n":"Saleor 的商品模型","k":"oss","lic":"BSD-3-Clause","repo":"saleor/saleor","note":"SPU/SKU 两层、属性与变体、多渠道价格都做好了，可以直接照它的表结构抄。代价是它整套很重（Django + GraphQL），一般只用它的数据模型","effort":"","tokens":"","outline":[]},{"id":"medusa-product","n":"Medusa 的 product 模块","k":"oss","lic":"MIT","repo":"medusajs/medusa","note":"Node 生态里最接近「开箱即用的商品域」，变体、选项、价格表都齐。适合跨境电商：多币种价格是内建的","effort":"","tokens":"","outline":[]},{"id":"cat-self","n":"自建 SPU/SKU 两表","k":"pattern","lic":"—","repo":"","note":"商品表 + 规格表，库存与价格挂规格。约 3 张表能跑起来，好处是完全贴合自己的业务，坏处是导出到平台时要自己写映射","effort":"","tokens":"","outline":[]},{"id":"biz-catalog-write","n":"AI 帮你写商品模型","k":"build","lic":"","repo":"","note":"","effort":"1 天","tokens":"约 20 万","outline":["SPU/SKU 两表与规格笛卡尔积","多币种价格与促销价","上下架与批量导入"]}]},{"id":"biz.stock","name":"库存与批次","kind":"module","dom":"biz","abstract":"每个 SKU 在每个仓有多少、哪些批次、哪些被订单占住了","note":"库存只有一个铁律：**扣减必须是原子的**。「先 select 出来判断够不够，再 update 减掉」在并发下必然超卖——两个人同时看到剩 1 件，都判断够，都扣，变成 -1。正确写法是 `UPDATE stock SET qty = qty - 1 WHERE sku = ? AND qty >= 1`，看影响行数是否为 1；或者用 Redis 预扣 + 异步落库。第二件事是「可用库存 ≠ 物理库存」：下单未付款要占住（预占），取消要释放，超时未付要自动释放。坑：只做物理库存，大促那天会把同一个货卖给三个人。","ins":"结构化记录","outs":"结构化记录","pv":[{"id":"stock-self","n":"条件更新扣减（自研）","k":"pattern","lic":"—","repo":"","note":"一条带 WHERE qty >= n 的 UPDATE，返回影响行数判断成败；再加一张占用表（订单号 + SKU + 数量 + 过期时间），定时释放超时占用。单库单表下这是最省事且正确的做法","effort":"","tokens":"","outline":[]},{"id":"redis-stock","n":"Redis 预扣 + 异步落库","k":"oss","lic":"BSD-3-Clause","repo":"redis/redis","note":"库存放 Redis，用 Lua 脚本保证「判断 + 扣减」原子；下单先扣 Redis，成功再异步写库。能扛高并发，代价是要处理 Redis 与库不一致的补偿","effort":"","tokens":"","outline":[]},{"id":"inv-wms","n":"直接上开源 WMS（如 ERPNext / Odoo 库存模块）","k":"oss","lic":"GPL-3.0","repo":"frappe/erpnext","note":"批次、库位、盘点、调拨全都有，适合真仓。代价是要接受它整套 ERP 的数据模型与操作习惯，二次开发成本不低","effort":"","tokens":"","outline":[]},{"id":"biz-stock-write","n":"AI 帮你写库存","k":"build","lic":"","repo":"","note":"","effort":"1.5 天","tokens":"约 30 万","outline":["条件更新扣减与影响行数判断","预占/释放/超时回收","库存流水与盘点差异"]}]},{"id":"biz.order","name":"订单与履约","kind":"module","dom":"biz","abstract":"一笔订单从下单到签收的全过程：状态机、拆包、退款、售后","note":"订单不是一张表，是一台状态机。必须先把状态和允许的迁移写死：待付款 → 已付款 → 已发货 → 已签收 → 已完成，旁支是取消、退款中、已退款。没有状态机就会长出一堆 `if status == 3 && refund == 1`，最后没人敢改。第二件事是「订单行」与「包裹」分离：一笔订单可以拆成多个包裹、部分发货，把物流单号存在订单上，第一个拆包就错了。坑：状态变更不写流水（谁在什么时候改的），出了纠纷无法举证。","ins":"结构化记录","outs":"结构化记录","pv":[{"id":"order-medusa","n":"Medusa 订单模块","k":"oss","lic":"MIT","repo":"medusajs/medusa","note":"订单、履约、退货、换货的状态机都实现了，可以直接用或照着抄。Node 生态、跨境电商场景（多币种、多区域）是它的主场","effort":"","tokens":"","outline":[]},{"id":"order-saleor","n":"Saleor 订单与履约","k":"oss","lic":"BSD-3-Clause","repo":"saleor/saleor","note":"GraphQL 风格，订单事件（order event）记录得很细，适合需要审计的场景。代价是 Python + GraphQL 的接入成本","effort":"","tokens":"","outline":[]},{"id":"order-self","n":"自研状态机 + 状态流水","k":"pattern","lic":"—","repo":"","note":"一张订单主表 + 一张订单行 + 一张状态流水。迁移表写成一个常量对象，每次变更前校验「这个迁移允许吗」，并落一条流水。约 500 行能写扎实","effort":"","tokens":"","outline":[]},{"id":"biz-order-write","n":"AI 帮你写订单","k":"build","lic":"","repo":"","note":"","effort":"2 天","tokens":"约 40 万","outline":["状态机与允许迁移表","订单行/包裹拆分与部分发货","退款与售后工单"]}]},{"id":"biz.pay","name":"支付与对账","kind":"module","dom":"biz","abstract":"收钱：下单、拉起支付、回调验签、幂等、退款、每日对账","note":"支付只有两个真问题：**幂等**和**验签**。幂等：同一个订单号重复回调必须只入账一次，做法是用「商户订单号 + 渠道流水号」建唯一索引，插入冲突就当已处理。没有它，渠道重试三次你就多发三次货。验签：回调必须用渠道公钥验签、必须校验金额与订单号一致，否则任何人都能伪造「已支付」。第三件事是对账：每天拉渠道账单，与本地流水逐笔比，差一分也要有地方看——不做对账，钱少了你永远不知道为什么。坑：把「支付成功」当成「订单完成」，中间还有发货与售后；退款要走原路而不是转账。","ins":"结构化记录","outs":"结构化记录 + 事件","pv":[{"id":"pay-alipay","n":"支付宝开放平台 SDK","k":"commercial","lic":"闭源（免费接入）","repo":"alipay/alipay-sdk-python","note":"国内首选：扫码/APP/电脑网站支付都全，沙箱好用。要注意的是必须自己做幂等表与对账，SDK 不管这两件事","effort":"","tokens":"","outline":[]},{"id":"pay-stripe","n":"Stripe","k":"commercial","lic":"闭源（按笔收费）","repo":"stripe/stripe-node","note":"跨境首选：订阅、分期、多币种、税务都现成，文档是行业标杆。代价是费率与提现周期，以及国内访问稳定性","effort":"","tokens":"","outline":[]},{"id":"pay-self","n":"自建支付网关层（多渠道路由）","k":"pattern","lic":"—","repo":"","note":"只写一层薄适配：每个渠道实现 create/query/refund/verify 四个方法，上层只认统一接口。换渠道不动业务代码，这是唯一值得自研的部分","effort":"","tokens":"","outline":[]},{"id":"biz-pay-write","n":"AI 帮你写支付","k":"build","lic":"","repo":"","note":"","effort":"2 天","tokens":"约 35 万","outline":["幂等表与唯一索引","回调验签与金额校验","退款原路与对账脚本"]}]},{"id":"biz.ship","name":"物流与面单","kind":"module","dom":"biz","abstract":"生成面单、选承运商、跟踪轨迹、异常件处理","note":"最容易低估的是「面单」：不同快递公司的电子面单接口、模板尺寸、打印指令都不同，还有一票多件、子母件、到付、保价这些分支。做法上不要自己拼每一家的报文，找一层聚合（快递鸟 / 菜鸟 / ShippingEasy）会省很多。第二件事是轨迹：物流轨迹是异步推送的，要落成事件表而不是覆盖订单上的一个字段，否则用户问「为什么三天没动」你答不出来。坑：面单打印尺寸不对，热敏纸打出来条码扫不出，仓库直接停摆。","ins":"结构化记录","outs":"产物文件 + 结构化记录","pv":[{"id":"ship-aggregator","n":"聚合服务（快递鸟 / 菜鸟开放平台）","k":"commercial","lic":"闭源（按单收费）","repo":"","note":"一次接入几十家快递，面单模板与打印指令都帮你转好了。适合单量不大、不想逐家对接的团队","effort":"","tokens":"","outline":[]},{"id":"ship-easypost","n":"EasyPost / Shippo（跨境）","k":"commercial","lic":"闭源（按单收费）","repo":"EasyPost/easypost-node","note":"跨境场景更合适：多承运商比价、国际面单、关税预估。国内发货用不上，它没有国内快递","effort":"","tokens":"","outline":[]},{"id":"ship-self","n":"自研面单适配层","k":"pattern","lic":"—","repo":"","note":"只对接 1–2 家主力快递，每家写一个 provider（取号、打面单、查轨迹）。单量稳定、仓库固定时最划算，也最可控","effort":"","tokens":"","outline":[]},{"id":"biz-ship-write","n":"AI 帮你写物流","k":"build","lic":"","repo":"","note":"","effort":"1.5 天","tokens":"约 25 万","outline":["面单取号与打印模板","轨迹事件表与订阅","异常件与退回流程"]}]},{"id":"biz.member","name":"会员与积分","kind":"module","dom":"biz","abstract":"谁买过、买了几次、什么等级、有多少积分、能不能用优惠券","note":"看起来是「加个 user 表」，其实是「同一笔钱怎么算三次」：订单金额影响积分，积分能抵现，等级又按累计消费算。三者循环引用，不先定口径就会互相打架。正确做法：所有变动记流水（获得/消耗/过期），余额是流水的聚合结果，等级与权益是「按累计值查规则表」而不是存字段。坑：积分用浮点存，累加后出现 0.30000000000000004，用户截图来投诉。用整数分。","ins":"结构化记录","outs":"结构化记录","pv":[{"id":"mem-self","n":"自建会员 + 积分流水","k":"pattern","lic":"—","repo":"","note":"会员表、积分流水表、等级规则表三张。余额 = SUM(流水)，不存字段；金额一律用整数分。约 300 行，最贴合自己的玩法","effort":"","tokens":"","outline":[]},{"id":"mem-loyalty","n":"Odoo / ERPNext 的会员与忠诚度模块","k":"oss","lic":"GPL-3.0","repo":"odoo/odoo","note":"等级、积分、优惠券规则都能配，适合已经有 ERP 的团队。代价是要接受它的规则表达方式，定制不如自研灵活","effort":"","tokens":"","outline":[]},{"id":"biz-member-write","n":"AI 帮你写会员","k":"build","lic":"","repo":"","note":"","effort":"1 天","tokens":"约 18 万","outline":["会员/流水/规则三表","积分获得与抵扣口径","等级计算与权益校验"]}]},{"id":"game.loop","name":"主循环与帧调度","kind":"module","dom":"game","abstract":"固定步长推进逻辑、渲染与逻辑分离、切后台不停摆","note":"放置类游戏最容易踩的坑是「用 setInterval 驱逻辑」：浏览器切到后台会把定时器节流到 1 分钟，回来一看时间线错乱；手机上更是直接冻结。正确 me.econ","name":"数值与经济","kind":"module","dom":"game","abstract":"产出、消耗、通胀：让玩家一直有目标，又不至于一天通关","note":"数值不是「调数字」，是「定节奏」：第一小时给多少、第一天解锁什么、第七天卡在哪。最实用的做法是先画一条目标曲线（累计产出 vs 时间），再倒推每级建筑的产出与成本，让「升下一级所需时间」保持在 2 分钟的 1.6 倍幂次上——这是放置类的经验公式。坑一：只做产出不做消耗，三天后资源爆仓，玩家失去目标。坑二：用浮点存大数，1e15 之后精度丢失，玩家发现自己有 1e15 和 1e15+1 一样。用大数库或分段单位。","ins":"结构化记录","outs":"结构化记录","pv":[{"id":"econ-sheet","n":"先做成一张表（Excel/Sheets）","k":"pattern","lic":"—","repo":"","note":"把等级、成本、产出、时间全列在一张表里，用公式算「多久能升下一级」，调好了再灌进代码。这是最被低估的做法，比在代码里试快十倍","effort":"","tokens":"","outline":[]},{"id":"econ-break","n":"Break_infinity.js / decimal.js","k":"oss","lic":"MIT","repo":"Patashu/break_infinity.js","note":"放置类专用大数库，支持 1e9e15 级别、带格式化（1.23e15 / aa / ab）。数值会破亿的挂机游戏基本必装","effort":"","tokens":"","outline":[]},{"id":"econ-balance","n":"Machinations（可视化数值建模）","k":"commercial","lic":"闭源（有免费档）","repo":"","note":"把资源流画成图，直接模拟几百小时的产出曲线。适合认真做长线数值的团队，个人项目用表格就够","effort":"","tokens":"","outline":[]},{"id":"game-econ-write","n":"AI 帮你算数值","k":"build","lic":"","repo":"","note":"","effort":"1 天","tokens":"约 12 万","outline":["目标曲线与等级成本反推","产出/消耗平衡表","大数与离线收益校验"]}]},{"id":"game.shop","name":"商店与内购","kind":"module","dom":"game","abstract":"卖什么、怎么定价、首充/礼包/月卡怎么配、掉单怎么办","note":"游戏内购和普通电商最大的差别是「渠道抽成 + 服务端校验」：客户端收到「支付成功」不能信，必须拿收据去服务端向渠道校验，校验过了才发货。第二件事是「首充/礼包只能买一次」的幂等：用「用户 + 商品 + 周期」唯一索引，重复请求直接返回已发货。坑：把商品配置写死在客户端，改价格要发版；正确做法是服务端下发商品表。","ins":"结构化记录 或 界面","outs":"外部动作","pv":[{"id":"shop-iap","n":"App Store / Google Play 内购","k":"commercial","lic":"闭源（抽成 15–30%）","repo":"","note":"上架应用商店就绕不开，服务端校验用 App Store Server API / Google Play Developer API。抽成高但流量是现成的","effort":"","tokens":"","outline":[]},{"id":"shop-stripe","n":"Stripe / Paddle（网页内购）","k":"commercial","lic":"闭源（按笔收费）","repo":"stripe/stripe-node","note":"网页版游戏或独立客户端用这个，费率低、支持订阅与一次性买断。Paddle 还能代缴各国税，跨境省事","effort":"","tokens":"","outline":[]},{"id":"shop-self","n":"自研商品表 + 发货流水","k":"pattern","lic":"—","repo":"","note":"商品配置由服务端下发，发货走「用户+商品+周期」唯一索引防重。渠道只是支付通道，业务逻辑自己控","effort":"","tokens":"","ou
