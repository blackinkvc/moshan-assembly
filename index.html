geo-gcoord","n":"coordtransform / gcoord（坐标系转换）","k":"oss","lic":"MIT","repo":"huji/gcoord","note":"WGS84/GCJ-02/BD-09 互转的标准实现，含中国境内判断。所有坐标进出系统都从这里过一遍，别自己写魔数","effort":"","tokens":"","outline":[]},{"id":"map-geo-write","n":"AI 帮你写定位","k":"build","lic":"","repo":"","note":"","effort":"0.5 天","tokens":"约 8 万","outline":["三档精度降级策略","坐标系统一入口","漂移过滤与停留判定"]}]},{"id":"map.trace","name":"轨迹与围栏","kind":"module","dom":"map","abstract":"记录走过的点、抽稀、算里程、进出区域告警","note":"轨迹的难点在「点太多」：1Hz 采一天是 86400 个点，直接画会卡、直接存会爆。标准做法是抽稀（Douglas-Peucker 或按距离阈值）+ 分段（停留点合并成一段）。围栏判定不要用「点在多边形内」暴力算每个点，而是先按网格索引筛候选区域。坑：只存经纬度不存精度与时间，事后无法判断这个点可不可信；坑二：围栏进出用「每 5 秒查一次」而不是「跨越边界的瞬间」，高速移动时会漏报——要么加密采样，要么用线段与多边形求交。","ins":"测量读数","outs":"结构化记录","pv":[{"id":"trace-self","n":"自研抽稀 + 网格索引","k":"pattern","lic":"—","repo":"","note":"点表（lat/lng/精度/时间）+ 段表（起止点、里程）。抽稀用 DP 算法（约 40 行），围栏用网格预筛。可控且够快","effort":"","tokens":"","outline":[]},{"id":"trace-postgis","n":"PostGIS 空间查询","k":"oss","lic":"GPL-2.0","repo":"postgis/postgis","note":"ST_Contains、ST_DWithin、ST_Length 都是现成的，围栏与里程一句 SQL。代价是要上 PostgreSQL，单机小项目偏重","effort":"","tokens":"","outline":[]},{"id":"map-trace-write","n":"AI 帮你写轨迹","k":"build","lic":"","repo":"","note":"","effort":"1 天","tokens":"约 15 万","outline":["点序列与抽稀","停留/移动分段","围栏进出判定与告警"]}]},{"id":"ops.deploy","name":"部署与发布","kind":"module","dom":"ops","abstract":"把新版本弄到线上：构建、上传、切流量、能回滚","note":"自建部署的最小可用形态是「一个脚本 + 一个目录 + 一个软链」：构建产物传到 releases/<时间戳>/，验证通过后把 current 软链指过去，回滚就是把软链指回去。这比引入 K8s 现实得多，也比「直接覆盖线上文件」安全得多——覆盖式发布一旦失败，你手上连旧版本都没有。坑：数据库迁移和代码发布绑在一起。正确做法是先发兼容两版的迁移，再发代码，最后清理旧字段。","ins":"产物文件+界面","outs":"外部动作","pv":[{"id":"deploy-script","n":"软链发布脚本（自研）","k":"pattern","lic":"—","repo":"","note":"releases/ + current 软链 + 保留最近 5 版。约 60 行 shell，能回滚、能看历史，是小项目性价比最高的方案","effort":"","tokens":"","outline":[]},{"id":"deploy-docker","n":"Docker Compose + Watchtower","k":"oss","lic":"Apache-2.0","repo":"containrrr/watchtower","note":"镜像化之后发布就是「推镜像 + 自动拉取重启」，环境一致性最好。代价是要维护镜像与卷，磁盘占用也要管","effort":"","tokens":"","outline":[]},{"id":"deploy-coolify","n":"Coolify / Dokploy（自建 PaaS）","k":"oss","lic":"Apache-2.0","repo":"coollabsio/coolify","note":"带界面：连 Git、自动构建、证书、日志、回滚都有。适合不想写 CI 又想有仪式感的场景，1C1G 也能跑","effort":"","tokens":"","outline":[]},{"id":"ops-deploy-write","n":"AI 帮你写发布流程","k":"build","lic":"","repo":"","note":"","effort":"1 天","tokens":"约 12 万","outline":["软链发布与回滚","构建缓存与产物校验","迁移与代码发布顺序"]}]},{"id":"ops.monitor","name":"监控与日志","kind":"module","dom":"ops","abstract":"它现在活着吗、慢在哪、昨天那个报错还在不在","note":"最小的可用监控只有三样：**存活**（能不能打开）、**关键业务指标**（今天下了几单）、**错误日志聚合**（同一个错误算一条，带次数）。不需要一上来就上 Prometheus + Grafana，那是给「有 SLO 要守」的团队用的。但「错误日志按指纹聚合」必须有：否则同一个报错刷 3000 行，你根本看不到里面那一条真正的原因。坑：日志里打用户密码、token、完整手机号。要么脱敏，要么别打。","ins":"事件+外部动作","outs":"结构化记录","pv":[{"id":"mon-uptime","n":"Uptime Kuma（存活与证书）","k":"oss","lic":"MIT","repo":"louislam/uptime-kuma","note":"五分钟能装好，HTTP/TCP/Ping 监控、证书到期、告警到微信/Telegram 都有。适合「我只想知道它挂没挂」","effort":"","tokens":"","outline":[]},{"id":"mon-glitchtip","n":"GlitchTip / Sentry（错误聚合）","k":"oss","lic":"MIT","repo":"getsentry/sentry","note":"错误按指纹合并、带堆栈与版本、能看「这个版本新出现的错」。自建 GlitchTip 比 Sentry 轻，小机器跑得动","effort":"","tokens":"","outline":[]},{"id":"mon-grafana","n":"Prometheus + Grafana","k":"oss","lic":"Apache-2.0","repo":"grafana/grafana","note":"要看趋势与分位数（P95 延迟、QPS）才需要。代价是采集、存储、看板三件套都要维护，单机项目通常过度","effort":"","tokens":"","outline":[]},{"id":"ops-monitor-write","n":"AI 帮你写监控","k":"build","lic":"","repo":"","note":"","effort":"1 天","tokens":"约 15 万","outline":["探针与存活检查","业务指标打点","错误指纹聚合与脱敏"]}]},{"id":"ops.alert","name":"告警与值班","kind":"module","dom":"ops","abstract":"出事的时候叫对人、别叫太多次、别在没事的时候叫","note":"告警的全部难点是「信噪比」。第一版常见错误是把所有 error 都推送到手机，结果一周后你关掉通知，真正出事时反而没人看。做法：分级（P0 立刻叫、P1 白天看、P2 进日报）+ 聚合（同一类 5 分钟内只发一次）+ 抑制（数据库挂了就别再发十条「接口 500」）。坑：告警没有「恢复通知」，你永远不知道它好了没有；坑二：告警内容里没有「怎么处理」，半夜收到只能干瞪眼。","ins":"结构化记录","outs":"事件","pv":[{"id":"alert-webhook","n":"Webhook 直推（企业微信/飞书/Telegram）","k":"pattern","lic":"—","repo":"","note":"一个 POST 就能推到群里，零成本。配「同类 5 分钟合并」与「恢复通知」就够用，大多数个人项目不需要更复杂的","effort":"","tokens":"","outline":[]},{"id":"alert-alertmanager","n":"Alertmanager","k":"oss","lic":"Apache-2.0","repo":"prometheus/alertmanager","note":"分组、抑制、静默、升级策略都实现了，是「告警路由」的工业标准。前提是你已经有 Prometheus 指标","effort":"","tokens":"","outline":[]},{"id":"ops-alert-write","n":"AI 帮你写告警","k":"build","lic":"","repo":"","note":"","effort":"0.5 天","tokens":"约 8 万","outline":["分级与合并窗口","恢复通知","抑制规则与值班表"]}]},{"id":"app.board","name":"看板与甘特","kind":"module","dom":"app","abstract":"把一堆条目按「状态列」或「时间轴」摆开，能拖着改","note":"看板和甘特是同一份数据的两个视图：看板看「现在卡在哪」，甘特看「什么时候做完」。底层必须是同一条记录（状态 + 起止时间），否则两个视图会各存一份、互相对不上。难点在拖拽的落点计算与乐观更新：拖过去先本地改、失败再回滚，否则每次拖动都等一个网络往返，手感立刻变差。坑：甘特图的任务依赖（A 完成才能开始 B）没有单独存，只画了条连线，改期时全乱。","ins":"结构化记录","outs":"界面","pv":[{"id":"board-dnd","n":"dnd-kit + 自研列","k":"oss","lic":"MIT","repo":"clauderic/dnd-kit","note":"拖拽手感与无障碍都做得好，列与卡片自己渲染，最容易贴合自己的数据。甘特部分另找时间轴库或自己画","effort":"","tokens":"","outline":[]},{"id":"board-frappe","n":"Frappe Gantt","k":"oss","lic":"MIT","repo":"frappe/Gantt","note":"轻量甘特图（约 30KB），任务条、依赖箭头、拖拽改期都有。适合「只要一条时间轴」的场景","effort":"","tokens":"","outline":[]},{"id":"board-fullcal","n":"FullCalendar 时间轴视图","k":"oss","lic":"MIT","repo":"fullcalendar/fullcalendar","note":"日程与甘特共用一套事件模型，resourceTimeline 能当排期用。代价是它的模型是「日历」不是「任务」，状态列要自己补","effort":"","tokens":"","outline":[]},{"id":"app-board-write","n":"AI 帮你写看板","k":"build","lic":"","repo":"","note":"","effort":"1.5 天","tokens":"约 25 万","outline":["同一份记录两个视图","拖拽落点与乐观更新","依赖与关键路径"]}]},{"id":"app.strata","name":"知识地层","kind":"module","dom":"app","abstract":"按时间把笔记、事件、决策一层层叠起来，能看到「那时候我在想什么」","note":"「知识地层」不是文件夹，是「按时间切片 + 按主题打标签」的双索引：纵轴是时间（今天/本周/这个项目），横轴是主题（人/事/想法）。它的价值在「回看」：三个月后你能翻到「当时为什么选了这个方案」，这比任何搜索都值钱。实现上别把它做成另一个笔记应用——它应该是「已有笔记的一个视图」，靠时间戳与标签聚合，而不是让用户再写一遍。坑：地层只按创建时间排，改过的旧笔记不会浮上来，你会以为它没更新。","ins":"结构化记录+文本片段","outs":"文本片段","pv":[{"id":"strata-self","n":"自建时间轴索引（自研）","k":"pattern","lic":"—","repo":"","note":"一张事件表（时间、类型、标题、关联 id）作为索引，点开回原记录。写入时顺手打标签，读的时候按「时间桶 + 标签」聚合","effort":"","tokens":"","outline":[]},{"id":"strata-logseq","n":"Logseq / Roam 的日记模型","k":"oss","lic":"AGPL-3.0","repo":"logseq/logseq","note":"「每天一页 + 双向链接 + 查询」就是地层的最小实现，可以直接用，也可以照它的思路抄：日记页是时间轴，block 引用是主题轴","effort":"","tokens":"","outline":[]},{"id":"app-strata-write","n":"AI 帮你写地层视图","k":"build","lic":"","repo":"","note":"","effort":"1 天","tokens":"约 15 万","outline":["事件索引表与时间桶","标签聚合与回链","改动时间排序与归档"]}]},{"id":"app.cal","name":"日历视图","kind":"module","dom":"app","abstract":"月/周/日三种粒度看时间占用，能把条目拖到另一天","note":"日历的坑全在「重复事件」与「时区」：一个「每周一 9 点」的会议，在月视图里要展开成 4–5 个虚拟实例，改其中一次只改那一次（例外规则）。时区：全天事件不能存成 UTC 时间戳，否则跨时区会变成前一天。做法上优先用 RRULE 标准（iCalendar），别自己发明重复规则——手机日历、CalDAV、Google Calendar 都认它，自己发明的规则导不出去。","ins":"结构化记录","outs":"界面","pv":[{"id":"cal-fullcalendar","n":"FullCalendar","k":"oss","lic":"MIT","repo":"fullcalendar/fullcalendar","note":"月/周/日/列表视图齐全，拖拽改期、RRULE 展开、时区处理都有。React/Vue 都有封装，是这类需求的事实标准","effort":"","tokens":"","outline":[]},{"id":"cal-schedule-x","n":"Schedule-X","k":"oss","lic":"MIT","repo":"schedule-x/schedule-x","note":"比 FullCalendar 轻，默认样式更现代，支持暗色与国际化。复杂资源排期不如 FullCalendar","effort":"","tokens":"","outline":[]},{"id":"cal-rrule","n":"rrule.js + 自绘","k":"oss","lic":"MIT","repo":"jakubroztocil/rrule","note":"只借它的重复规则展开，界面自己画。适合「日历只是页面里一小块」、不想引入整套日历组件的场景","effort":"","tokens":"","outline":[]},{"id":"app-cal-write","n":"AI 帮你写日历","k":"build","lic":"","repo":"","note":"","effort":"1.5 天","tokens":"约 22 万","outline":["月/周/日三视图","RRULE 展开与例外","时区与全天事件"]}]},{"id":"app.remind","name":"提醒调度","kind":"module","dom":"app","abstract":"到点要响：系统通知、错过补发、别响太多次","note":"提醒最容易失败的地方是「应用没在跑」：Web 的 setInterval 在后台会被节流，手机锁屏后直接冻结。可靠的做法是交给系统：本地通知（Local Notification）、系统闹钟、或者服务端推送。第二件事是「错过补发」：电脑合盖两小时，醒来后该不该补响？产品上要定：重要提醒补一次并标「已延迟」，普通提醒直接跳过。坑：同一件事重复响三次（前端定时器 + 后端推送 + 系统日历），用户会关掉通知权限。","ins":"结构化记录","outs":"事件","pv":[{"id":"remind-native","n":"系统本地通知（Tauri / Capacitor 插件）","k":"pattern","lic":"—","repo":"","note":"注册到系统，应用不在前台也能响，是桌面与手机最可靠的一档。要处理权限申请被拒的降级（改成应用内横幅）","effort":"","tokens":"","outline":[]},{"id":"remind-webpush","n":"Web Push（Service Worker）","k":"oss","lic":"MIT","repo":"web-push-libs/web-push","note":"纯 Web 也能后台推送，手机上体验接近原生。iOS 要 16.4+ 且必须「添加到主屏幕」，这一点必须在引导里说清","effort":"","tokens":"","outline":[]},{"id":"remind-cron","n":"服务端定时 + 推送","k":"pattern","lic":"—","repo":"","note":"服务端每分钟扫一次「该提醒的」，推给客户端。适合多端同步的场景，代价是要有服务端并且要考虑时区","effort":"","tokens":"","outline":[]},{"id":"app-remind-write","n":"AI 帮你写提醒","k":"build","lic":"","repo":"","note":"","effort":"1 天","tokens":"约 15 万","outline":["系统通知注册与权限降级","错过补发策略","去重与免打扰时段"]}]},{"id":"app.theme","name":"主题与设计令牌","kind":"module","dom":"app","abstract":"一套颜色、字号、间距、圆角的变量，换肤就是换一份变量","note":"「主题」不是几个 CSS 变量，是「设计令牌」（design tokens）：颜色分语义（背景/表面/文字/主色/危险）、字号分角色（标题/正文/辅助）、间距按 4 的倍数。组件只引用语义名，不引用具体色值——这样暗色模式、品牌换色、高对比度都是一份新令牌。坑一：直接写 #3c3a35，三个月后要改品牌色，得全局搜替换。坑二：暗色模式只是把背景调黑，文字对比度不够，看着累。正确做法是暗色单独一套令牌，不是自动反转。","ins":"（不需要输入）","outs":"界面","pv":[{"id":"theme-tokens","n":"CSS 变量 + 语义令牌（自研）","k":"pattern","lic":"—","repo":"","note":"一份 tokens.css：--bg/--surface/--ink/--dim/--line/--brand/--danger，暗色用 [data-theme=dark] 覆盖同一批变量。零依赖、最好维护","effort":"","tokens":"","outline":[]},{"id":"theme-tailwind","n":"Tailwind + CSS 变量主题","k":"oss","lic":"MIT","repo":"tailwindlabs/tailwindcss","note":"工具类负责布局与间距，颜色全走 CSS 变量，换肤不用重新构建。适合组件多、要快速堆页面的项目","effort":"","tokens":"","outline":[]},{"id":"theme-radix","n":"Radix Colors / Open Props","k":"oss","lic":"MIT","repo":"radix-ui/colors","note":"现成的语义色阶（每个色 12 级，暗色单独一套），对比度经过计算。省掉「自己配一套好看又够对比的颜色」这件事","effort":"","tokens":"","outline":[]},{"id":"app-theme-write","n":"AI 帮你配主题","k":"build","lic":"","repo":"","note":"","effort":"0.5 天","tokens":"约 6 万","outline":["语义令牌表","亮/暗两套色阶与对比度","密度与圆角档位"]}]},{"id":"app.bus","name":"事件总线","kind":"module","dom":"app","abstract":"模块之间不直接调用，而是发一条事件，谁关心谁接","note":"当模块超过五六个，「A 改完通知 B、B 改完通知 C」会变成一张网：加一个模块要改三个已有模块。事件总线把它变成星形——每个模块只发事件、只听事件，谁都不认识谁。代价是「看不见的耦合」：事件名改了没人报错，只是那个功能悄悄不工作了。所以事件名必须有一份常量表，且要在开发时校验「有没有人监听」。坑：事件里塞整个对象引用，订阅方改了它，发布方数据被改坏。事件必须是不可变的副本。","ins":"（不需要输入）","outs":"事件","pv":[{"id":"bus-emitter","n":"mitt / EventEmitter3（进程内）","k":"oss","lic":"MIT","repo":"developit/mitt","note":"200 字节的发布订阅，够用且快。约定：事件名集中在 events.ts 里，payload 用类型标注，只传纯数据","effort":"","tokens":"","outline":[]},{"id":"bus-typed","n":"类型化事件总线（自研 + TS 映射）","k":"pattern","lic":"—","repo":"","note":"一张 EventMap 类型把「事件名 → payload」写死，发错名字编译不过。约 50 行，是中型项目最值的一层","effort":"","tokens":"","outline":[]},{"id":"bus-nats","n":"NATS / Redis Pub-Sub（跨进程）","k":"oss","lic":"Apache-2.0","repo":"nats-io/nats-server","note":"模块跑在不同进程/机器上时才需要。单机应用用它属于过度设计，但设备与后台服务分离时（如热点管理）确实需要","effort":"","tokens":"","outline":[]},{"id":"app-bus-write","n":"AI 帮你写总线","k":"build","lic":"","repo":"","note":"","effort":"0.5 天","tokens":"约 6 万","outline":["事件常量表与类型映射","同步/异步派发","调试面板：谁发了什么"]}]},{"id":"app.job","name":"后台任务","kind":"module","dom":"app","abstract":"耗时的活别卡界面：排队、重试、进度、可取消","note":"凡是「超过 300 毫秒」的活都不该在点击的同步路径里：导入一万条、批量转图、生成报表、上传大文件。做法是「丢进队列 → 立刻返回任务 id → 前端轮询或订阅进度」。第二件事是重试：网络类失败要指数退避重试，业务类失败（参数错）重试一万次也没用，必须区分「可重试」与「不可重试」。坑：任务状态只在内存里，进程一重启全部丢失，用户看到的进度条永远停在 60%。","ins":"事件","outs":"外部动作","pv":[{"id":"job-bree","n":"bree / piscina（Node 进程内）","k":"oss","lic":"MIT","repo":"breejs/bree","note":"进程内队列 + worker 线程，不引入外部依赖。适合桌面应用：任务状态存本地库，重启后能续","effort":"","tokens":"","outline":[]},{"id":"job-bullmq","n":"BullMQ + Redis","k":"oss","lic":"MIT","repo":"taskforcesh/bullmq","note":"重试、延迟、并发、优先级、看板全都有，是 Node 后台任务的事实标准。代价是多一个 Redis","effort":"","tokens":"","outline":[]},{"id":"job-db","n":"数据库任务表 + 轮询","k":"pattern","lic":"—","repo":"","note":"一张 jobs 表（状态、尝试次数、下次执行时间），一个 worker 循环取任务。零外部依赖、可持久化、可查历史，是单机最稳的做法","effort":"","tokens":"","outline":[]},{"id":"app-job-write","n":"AI 帮你写任务队列","k":"build","lic":"","repo":"","note":"","effort":"1 天","tokens":"约 14 万","outline":["任务表与状态机","重试退避与去重","进度上报与取消"]}]},{"id":"app.ipc","name":"进程通信","kind":"module","dom":"app","abstract":"界面和后台是两套运行时：怎么调、传什么、崩了怎么办","note":"桌面应用几乎是必然的双进程：UI 在 WebView，能力在 Rust/Node。两者之间的每一次调用都是一个「接口」，要定三件事：参数怎么校验、错误怎么回传、超时怎么办。最常见的错误是「把整个 Node 能力暴露给前端」（`window.require`），等于把你的文件系统交给任何一个 XSS。正确做法是白名单命令：每个能力注册成一个命令名，前端只能调名单里的，参数在边界处校验。","ins":"界面","outs":"外部动作","pv":[{"id":"ipc-tauri","n":"Tauri command（invoke）","k":"oss","lic":"MIT","repo":"tauri-apps/tauri","note":"Rust 侧 #[tauri::command] 注册，前端 invoke 调用，返回值自动序列化。权限用 capabilities 白名单，比裸暴露安全得多","effort":"","tokens":"","outline":[]},{"id":"ipc-electron","n":"Electron IPC + contextBridge","k":"oss","lic":"MIT","repo":"electron/electron","note":"contextBridge 只暴露指定方法，preload 里做校验。千万不要开 nodeIntegration","effort":"","tokens":"","outline":[]},{"id":"ipc-http","n":"本地 HTTP 服务（127.0.0.1）","k":"pattern","lic":"—","repo":"","note":"后台起一个只监听本机的端口，前端当普通 API 调。好处是能跨语言、能调试（curl 就能测），坏处是要处理端口占用与鉴权","effort":"","tokens":"","outline":[]},{"id":"app-ipc-write","n":"AI 帮你写 IPC 层","k":"build","lic":"","repo":"","note":"","effort":"1 天","tokens":"约 15 万","outline":["命令白名单与参数校验","错误码与超时","进度回传与大文件分块"]}]},{"id":"app.schema","name":"数据契约","kind":"module","dom":"app","abstract":"一份类型定义，前后端、存储、校验都用它，改一处全跟着改","note":"没有契约的项目会同时存在三份「用户」定义：数据库表、后端类型、前端类型，然后它们慢慢不一致，最后出现「前端以为 avatar 是 string，后端返回 null」这种崩溃。做法：一份 schema（Zod / TypeBox / Protobuf），从它生成类型、生成校验、生成文档。第二件事是「版本」：契约要能加字段而不能删字段，删要分两步（先标废弃、两版后再删）。坑：把校验写在业务里（每个接口自己 if 一遍），改规则要改十几处。","ins":"结构化记录+界面","outs":"结构化记录","pv":[{"id":"schema-zod","n":"Zod","k":"oss","lic":"MIT","repo":"colinhacks/zod","note":"TS 生态最常用：定义一次，推导类型 + 运行时校验 + 错误信息。前后端共享同一个 schema 文件，是最省事的契约方案","effort":"","tokens":"","outline":[]},{"id":"schema-typebox","n":"TypeBox / JSON Schema","k":"oss","lic":"MIT","repo":"sinclairzx81/typebox","note":"产出标准 JSON Schema，能直接给 Fastify/Swagger 用，也能拿去做表单生成。跨语言比 Zod 方便","effort":"","tokens":"","outline":[]},{"id":"schema-openapi","n":"OpenAPI + 代码生成","k":"oss","lic":"Apache-2.0","repo":"OpenAPITools/openapi-generator","note":"先写 spec 再生成客户端与服务端骨架。适合有多端（Web/App/第三方）要接同一个 API 的场景","effort":"","tokens":"","outline":[]},{"id":"app-schema-write","n":"AI 帮你定契约","k":"build","lic":"","repo":"","note":"","effort":"0.5 天","tokens":"约 8 万","outline":["核心实体 schema","类型/校验/文档三处生成","字段废弃与兼容策略"]}]},{"id":"app.backup","name":"备份与迁移","kind":"module","dom":"app","abstract":"数据能整份带走、能回到昨天、换机器不用重来","note":"备份的第一原则是「恢复要演练过」。没演练过的备份等于没有备份——真出事那天才发现压缩包里少了附件目录。最小可用形态：一个按钮导出 zip（数据库 + 附件 + 一个 manifest 说明版本），一个导入入口能校验版本并迁移。第二件事是自动备份：每天一次、保留 7 份、存到另一个盘或网盘。坑：只备份数据库不备份附件，恢复后图片全是裂的。","ins":"结构化记录","outs":"产物文件","pv":[{"id":"backup-zip","n":"整包 zip（库 + 附件 + manifest）","k":"pattern","lic":"—","repo":"","note":"一个导出按钮 + 一个导入入口，manifest 里写 schema 版本与文件清单。导入时先校验版本、再迁移、最后替换。约 200 行，够用十年","effort":"","tokens":"","outline":[]},{"id":"backup-sqlite","n":"SQLite 在线备份 API","k":"oss","lic":"Public Domain","repo":"sqlite/sqlite","note":"VACUUM INTO 或 backup API 能在不锁库的情况下拿到一致快照。比「复制 .db 文件」安全得多（后者可能拷到写了一半的页）","effort":"","tokens":"","outline":[]},{"id":"backup-restic","n":"restic / borg（增量加密备份）","k":"oss","lic":"BSD-2-Clause","repo":"restic/restic","note":"增量、去重、加密、能存到 S3/网盘，适合数据量大或要长期留存的场景。个人项目要花点时间学它的命令","effort":"","tokens":"","outline":[]},{"id":"app-backup-write","n":"AI 帮你写备份","k":"build","lic":"","repo":"","note":"","effort":"1 天","tokens":"约 12 万","outline":["整包导出与导入校验","SQLite 一致快照","定时备份与保留策略"]}]},{"id":"app.automation","name":"自动化触发","kind":"module","dom":"app","abstract":"「当…就…」：事件来了自动做一串事，不用你点","note":"自动化不是流程编排（那是给人画的图），是「规则表」：触发条件 + 过滤 + 动作。关键设计是「幂等与防抖」：同一条记录改三次触发三次，用户会收到三条一模一样的通知。做法是给每次触发算一个指纹（规则 id + 记录 id + 变更摘要），短时间去重。第二件事是「失败可见」：自动化挂了不能静默，要有一次执行记录。坑：允许动作里再触发规则，形成无限循环（A 改 B，B 改 A）。要有深度上限。","ins":"事件 或 文本","outs":"外部动作","pv":[{"id":"auto-rules","n":"规则表 + 事件监听（自研）","k":"pattern","lic":"—","repo":"","note":"rules 表（when/if/then）+ 事件订阅 + 执行器。带执行日志与深度上限（默认 3 层）。约 300 行，可控性最好","effort":"","tokens":"","outline":[]},{"id":"auto-n8n","n":"n8n / Activepieces（自建）","k":"oss","lic":"Sustainable Use","repo":"n8n-io/n8n","note":"几百个现成连接器（邮件、表格、IM），拖拽就能连。适合「要和外部系统打通」，代价是它自己也是一套要维护的服务","effort":"","tokens":"","outline":[]},{"id":"auto-cron","n":"Cron / 系统定时任务","k":"pattern","lic":"—","repo":"","note":"只做「定时跑一段脚本」时最简单。缺点是没有事件驱动、没有执行历史、失败只能看日志","effort":"","tokens":"","outline":[]},{"id":"app-automation-write","n":"AI 帮你写自动化","k":"build","lic":"","repo":"","note":"","effort":"1.5 天","tokens":"约 20 万","outline":["规则表与条件求值","事件订阅与防抖指纹","执行日志与循环上限"]}]},{"id":"app.share","name":"分享与协作","kind":"module","dom":"app","abstract":"把一条东西发给别人看：只读链接、权限、批注、实时同步","note":"分享的第一件事是「权限边界」：只读链接不能因为猜到 id 就能改，所以要有独立的 share token（不可枚举），而不是复用记录 id。第二件事是「实时协作」：两个人同时改一段文字，要么上 CRDT（Yjs），要么用「最后写入者赢 + 冲突提示」，中间态（自己写一套 diff 合并）几乎必然出 bug。坑：分享链接永久有效，用户忘了撤销；要有过期时间与一键失效。","ins":"结构化记录 或 界面","outs":"界面","pv":[{"id":"share-token","n":"独立分享 token + 只读视图","k":"pattern","lic":"—","repo":"","note":"share 表（token、记录 id、权限、过期时间），用随机 token 而不是 id。最省事也最安全，先做这一档就够","effort":"","tokens":"","outline":[]},{"id":"share-yjs","n":"Yjs + y-websocket（实时协作）","k":"oss","lic":"MIT","repo":"yjs/yjs","note":"CRDT 方案，多人同时编辑不冲突，离线也能合并。接入成本中等，是「真协作」与「假协作」的分界线","effort":"","tokens":"","outline":[]},{"id":"share-comment","n":"批注层（划词评论）","k":"pattern","lic":"—","repo":"","note":"不做实时编辑，只做「在内容上留批注」，实现简单很多，适合评审/校对场景。锚点用「引用文本 + 前后文」而不是字符偏移","effort":"","tokens":"","outline":[]},{"id":"app-share-write","n":"AI 帮你写分享","k":"build","lic":"","repo":"","note":"","effort":"1 天","tokens":"约 15 万","outline":["分享 token 与权限","只读视图与批注","过期与撤销"]}]},{"id":"hw.scan","name":"扫码与识别","kind":"module","dom":"hw","abstract":"扫条码/二维码，或者从一张图里认出编号","note":"扫码在仓库场景几乎是刚需（收货、拣货、盘点）。三条路差别很大：摄像头 + 解码库（灵活、要处理对焦与光照）、专用扫码枪（USB HID，即插即用、本质是一个键盘输入）、手机摄像头 + 原生 API（最省事，但要求设备是手机）。坑一：扫码枪是键盘设备，焦点不在输入框里就扫不进去——要么全局监听按键，要么强制聚焦。坑二：一维码（Code128/EAN）和二维码（QR/DataMatrix）用的解码库不同，别只装一个。","ins":"（不需要输入）","outs":"文本","pv":[{"id":"scan-zxing","n":"ZXing / zxing-wasm","k":"oss","lic":"Apache-2.0","repo":"zxing/zxing","note":"一维码与二维码通吃，wasm 版能在浏览器里跑，不用装原生依赖。弱光与倾斜时识别率一般，要配补光与对焦提示","effort":"","tokens":"","outline":[]},{"id":"scan-hid","n":"USB 扫码枪（HID 键盘）","k":"pattern","lic":"—","repo":"","note":"即插即用、成功率最高、成本一百多块。软件侧只要处理「键盘事件 + 回车结尾」，仓库场景几乎都选这条","effort":"","tokens":"","outline":[]},{"id":"scan-native","n":"手机原生扫码（Capacitor/BarcodeDetector）","k":"oss","lic":"MIT","repo":"mgcrea/barcode-detector","note":"浏览器原生 BarcodeDetector 或 Capacitor 插件，性能和功耗都最好。缺点是只能跑在手机上，桌面端没有","effort":"","tokens":"","outline":[]},{"id":"hw-scan-write","n":"AI 帮你接扫码","k":"build","lic":"","repo":"","note":"","effort":"0.5 天","tokens":"约 8 万","outline":["摄像头取流与解码","HID 键盘全局监听","去重与连续扫描"]}]},{"id":"hw.ble","name":"蓝牙连接","kind":"module","dom":"hw","abstract":"连一个蓝牙设备：发现、配对、订阅特征值、断线重连","note":"蓝牙的坑集中在「不同平台限制完全不同」：Web Bluetooth 只有 Chrome/Edge 支持、必须用户手势触发、不能后台扫描；iOS 上 Web 完全不行，必须原生。第二件事是「重连」：设备走远断线后，要能自动重连并恢复到之前订阅的特征值，而不是让用户重新点一遍配对。坑：把 UUID 写死在一个地方，换一款设备就要改代码——要做成设备配置表。","ins":"（不需要输入）","outs":"测量读数","pv":[{"id":"ble-web","n":"Web Bluetooth API","k":"pattern","lic":"—","repo":"","note":"Chrome/Edge 可用，代码最少。限制：必须 HTTPS、必须点击触发、iOS Safari 不支持、拿不到后台数据","effort":"","tokens":"","outline":[]},{"id":"ble-noble","n":"noble / @abandonware/noble（Node）","k":"oss","lic":"MIT","repo":"abandonware/noble","note":"桌面端后台常驻扫描与连接，能力最全。代价是原生依赖编译（macOS 要 xcode、Windows 要 win SDK）","effort":"","tokens":"","outline":[]},{"id":"ble-tauri","n":"Tauri/Capacitor 蓝牙插件","k":"oss","lic":"MIT","repo":"thecoducer/tauri-plugin-blec","note":"跨桌面与手机，统一 API。插件质量参差，复杂场景（多连接、MTU 调优）可能要改插件源码","effort":"","tokens":"","outline":[]},{"id":"hw-ble-write","n":"AI 帮你写蓝牙","k":"build","lic":"","repo":"","note":"","effort":"1.5 天","tokens":"约 20 万","outline":["扫描/配对/订阅","断线自动重连","设备配置表与 UUID 管理"]}]},{"id":"hw.provision","name":"配网与绑定","kind":"module","dom":"hw","abstract":"把 WiFi 密码交给设备、让它连上、把设备绑到账号","note":"配网是「第一次使用」的那一步，失败率直接等于退货率。三条主流路线：SoftAP（设备开热点、手机连上去填 WiFi）、BLE 配网（通过蓝牙传）、二维码/声波（把信息编码成图或声音）。SoftAP 最通用但有「连上设备热点后手机就没有网」的体验问题（要提示、要自动切回）；BLE 配网体验最好，但要求设备有蓝牙。坑：配网成功后没有「设备已上线」的确认，用户不知道成没成，就一直重试。","ins":"界面","outs":"事件","pv":[{"id":"prov-softap","n":"SoftAP 热点配网","k":"pattern","lic":"—","repo":"","note":"设备开热点 → 手机连上 → 提交 WiFi 凭据 → 设备连路由。最通用、不依赖蓝牙；要处理好「连上设备就没网」的提示与自动切回","effort":"","tokens":"","outline":[]},{"id":"prov-ble","n":"BLE 配网","k":"pattern","lic":"—","repo":"","note":"通过蓝牙特征值下发 WiFi 凭据，体验最顺（不用切 WiFi）。要求设备带 BLE，且手机端要有蓝牙权限","effort":"","tokens":"","outline":[]},{"id":"prov-esptouch","n":"EspTouch / 微信 AirKiss","k":"oss","lic":"MIT","repo":"EspressifApp/EsptouchForAndroid","note":"用声音/广播把凭据发给设备，设备不用开热点。ESP 系列芯片生态最成熟，其他芯片要自己实现协议","effort":"","tokens":"","outline":[]},{"id":"hw-provision-write","n":"AI 帮你写配网","k":"build","lic":"","repo":"","note":"","effort":"1.5 天","tokens":"约 18 万","outline":["三条配网路径","凭据加密与超时","上线确认与失败引导"]}]},{"id":"ai.model.fit","name":"模型选型与预算","kind":"module","dom":"ai.model","abstract":"给定内存/显存，算出能跑哪个参数的哪个量化，以及大概多少 token/s","note":"这一格存在的唯一理由：**参数量不是选型依据，预算是**。一个 7B 模型 Q4 量化约 4.7GB 权重，跑起来还要 KV cache（上下文 4k 时另占 0.5–1.5GB）和运行时开销（0.3–0.8GB）。所以「8G 内存能跑 7B」这句话是错的——要留 2G 给系统与你的程序，实际可用的只有 6G，7B-Q4 刚好卡在边界上，一开长上下文就 OOM。正确做法是先算三笔账：权重 + KV cache + 运行时，再看剩下的余量；余量不足就降一档量化（Q4→Q3）或降一档参数（7B→3B）。坑：拿「模型文件大小」当「内存占用」——真实占用通常是文件大小的 1.3–1.6 倍；只看显存不看内存——显存不够会自动 offload 到内存，速度掉一个量级而不是报错，用户以为「就是慢」。","ins":"（不需要输入）","outs":"结构化记录 + 界面","pv":[{"id":"fit-self","n":"一张预算表（自研）","k":"pattern","lic":"—","repo":"","note":"把「参数 × 量化 → 权重 GB」和「上下文 → KV cache GB」两张小表写进配置，选型就是查表 + 比较余量。约 80 行代码，比接任何库都直接。表要按实际机型标定过一次，别抄别人的博客数字","effort":"","tokens":"","outline":[]},{"id":"ollama-show","n":"ollama show / ps 读实际占用","k":"oss","lic":"MIT","repo":"ollama/ollama","note":"跑起来以后 `ollama ps` 会给出真实的内存占用与是否 offload 到 CPU。用它校准自己的估算表，比自己猜准得多","effort":"","tokens":"","outline":[]},{"id":"llamacpp-gguf","n":"按 gguf 元数据算","k":"oss","lic":"MIT","repo":"ggerganov/llama.cpp","note":"gguf 头里就有参数量、量化类型、张量形状，能精确算出权重体积；再按 n_ctx 估 KV cache（层数 × 头数 × 维度 × 2 字节 × 上下文）","effort":"","tokens":"","outline":[]},{"id":"ai-fit-write","n":"AI 帮你写选型器","k":"build","lic":"","repo":"","note":"","effort":"1 天","tokens":"约 15 万","outline":["三笔账：权重 / KV cache / 运行时","预算 → 档位表（模型 + 量化 + 预估 tps）","超预算时的降级建议（先降量化，再降参数）"]}]},{"id":"ai.model.pull","name":"权重拉取与校验","kind":"module","dom":"ai.model","abstract":"把几 GB 的权重完整、可断点、可校验地弄到本地，失败能续上","note":"下载一个 4.7GB 的文件，中间断一次的概率不是「万一」而是「大概率」——家用宽带、公司代理、镜像限速，都会让长连接断在半路。所以它不是「fetch 一下就完事」，要三件事一起做：**分块 + 断点续传、sha256 校验、失败可重试**。第二件事是目录约定：Ollama 用 `~/.ollama/models/blobs`（内容寻址），llama.cpp 用裸 gguf 文件，LM Studio 又一套。目录一旦定下来，用户下次换工具就得重下 5GB——所以要在第一次就选对。坑：只写「下载完成」不写校验，用户拿到半个文件，加载时报一个看不懂的错。","ins":"结构化记录","outs":"原始文件","pv":[{"id":"ollama-pull","n":"ollama pull","k":"oss","lic":"MIT","repo":"ollama/ollama","note":"自带分块、断点续传、内容寻址与校验，一条命令搞定；代价是权重进它自己的 blobs 目录，别的工具读不到（只能走 API）","effort":"","tokens":"","outline":[]},{"id":"hf-cli","n":"hf / huggingface-cli download","k":"oss","lic":"Apache-2.0","repo":"huggingface/huggingface_hub","note":"支持 resume、多线程、镜像（HF_ENDPOINT）；拿到的是裸 gguf/safetensors，任何推理器都能用。国内要配镜像，否则很慢","effort":"","tokens":"","outline":[]},{"id":"pull-self","n":"自己写分块下载 + sha256（自研）","k":"pattern","lic":"—","repo":"","note":"HTTP Range 分块、每块记 offset、完成后整体 sha256 对比清单。约 200 行，换来完全可控的进度条与镜像切换；适合要嵌进自己安装器里的情况","effort":"","tokens":"","outline":[]},{"id":"ai-pull-write","n":"AI 帮你写拉取器","k":"build","lic":"","repo":"","note":"","effort":"1 天","tokens":"约 18 万","outline":["Range 分块与断点续传","sha256 校验与坏块重下","镜像回退与限速提示"]}]},{"id":"app.pkg","name":"安装包与签名","kind":"module","dom":"app","abstract":"把产物打成用户能双击安装的东西：dmg / exe / AppImage / apk，并解决「系统不信任你」","note":"这一格的难点不在打包命令，在**信任链**。macOS 上没签名的 dmg 打开会说「已损坏，移到废纸篓」——不是文件坏了，是 Gatekeeper 的隔离属性；Windows 上没签名的 exe 会弹 SmartScreen「Windows 已保护你的电脑」；Android 装 apk 要用户手点「允许未知来源」。三条路可选：① 买证书签名（Apple 开发者 99 美元/年 + 公证，Windows 代码签名证书约 2000 元/年）；② 不签名，写清绕过方法（右键打开 / 更多信息 → 仍要运行 / `xattr -dr com.apple.quarantine`）；③ **发源码或单文件**——用户自己 `git clone && npm i && npm run dev`，产物是他本机编译的，没有 quarantine 属性、没经过别人的签名，所以不会被拦。第三种的代价是要装工具链，但它是唯一「零成本 + 零信任问题」的路子，适合自用与小圈子。坑：以为「本地能跑就能发」——同一份代码在别人机器上缺运行时、缺动态库、缺权限，报的错还不一样。","ins":"界面+外部动作","outs":"产物文件 + 外部动作","pv":[{"id":"pkg-tauri","n":"Tauri bundler","k":"oss","lic":"MIT","repo":"tauri-apps/tauri","note":"一条命令出 dmg/msi/AppImage/apk；签名与公证要自己配环境变量。包体最小（10MB 级），mac 上要 `--target universal-apple-darwin` 才同时支持 Intel 与 Apple Silicon","effort":"","tokens":"","outline":[]},{"id":"pkg-electron","n":"electron-builder","k":"oss","lic":"MIT","repo":"electron-userland/electron-builder","note":"dmg/exe/AppImage/deb 全支持，自动更新与签名钩子齐全；代价是包体 100MB 起，且 macOS 公证要额外配 notarize","effort":"","tokens":"","outline":[]},{"id":"pkg-single","n":"单文件 / 源码分发（不签名路线）","k":"pattern","lic":"—","repo":"","note":"一个 index.html 双击即开，或给一个 zip 让人自己 `npm i && npm run dev`。完全绕开签名与公证：文件没有 quarantine 标记，也没人可以「不信任」一段源码。适合自用、内网、小圈子；不适合要用户「双击就装好」的场合","effort":"","tokens":"","outline":[]},{"id":"pkg-sign","n":"签名 + 公证（买证书路线）","k":"commercial","lic":"商业","repo":"","note":"Apple Developer 99 美元/年（Developer ID + notarytool），Windows 代码签名证书约 2000 元/年。签完 Gatekeeper 与 SmartScreen 都不再拦，是唯一「发给陌生人不被吓到」的做法","effort":"","tokens":"","outline":[]},{"id":"app-pkg-write","n":"AI 帮你写打包脚本","k":"build","lic":"","repo":"","note":"","effort":"1 天","tokens":"约 20 万","outline":["三平台构建矩阵与产物命名","签名/公证的环境变量与失败回退","安装说明与升级通道"]}]},{"id":"eng.lib","name":"器件与 IP 库","kind":"module","dom":"eng","abstract":"把要用的电阻电容、连接器、芯片管脚定义整理成工具能读的库：符号、封装、参数三件对齐","note":"这一格看着最没技术含量，实际是 PCB 返工的第一大来源：**符号对了、封装错了**。SOT-23 有 SOT-23-3 和 SOT-23-5 两种引脚数，同一个料号不同厂家的引脚定义可能相反；连接器的「正视图」和「俯视图」差一个镜像，画反了板子回来只能飞线。所以库不是「下载一堆文件」，是三条硬规矩：① 一料一号，符号名带厂家料号；② 封装必须来自数据手册的推荐焊盘图，不抄别人的库；③ 新料入库必须打印 1:1 纸样比对实物。IP 那一面同理：Verilog 行为模型要跟寄存器手册对一遍，别信供应商的 demo。","ins":"文本+原始文件","outs":"结构化记录","pv":[{"id":"kicad-lib","n":"KiCad 官方库 + 自建库（v9）","k":"oss","lic":"CC-BY-SA-4.0","repo":"KiCad/kicad-symbols","note":"官方库覆盖常用件，符号与封装成对给出；自建库放项目目录里一起进 git，别放全局库——换机器就丢。立创 EDA 的库可以导出成 KiCad 格式复用","effort":"","tokens":"","outline":[]},{"id":"sameda","n":"SnapEDA / Ultra Librarian","k":"commercial","lic":"—","repo":"","note":"按料号下符号+封装+3D 模型，省时间；但**必须按数据手册核一遍引脚**，这两家的库历史上出过镜像错误，直接用的代价是废一版板","effort":"","tokens":"","outline":[]},{"id":"ip-xact","n":"IP-XACT / LEF + Liberty","k":"pattern","lic":"—","repo":"","note":"芯片侧的标准交付格式：LEF 给物理尺寸与引脚位置、Liberty 给时序、Verilog 给行为。三份对不齐是 SoC 集成最常见的坑","effort":"","tokens":"","outline":[]},{"id":"eng-lib-write","n":"AI 帮你把手册读成库","k":"build","lic":"","repo":"","note":"","effort":"1 天","tokens":"约 20 万","outline":["从 PDF 手册抽引脚表（型号/引脚号/名称/类型/复用功能）","生成 KiCad 符号与封装脚本（.kicad_sym / footprint）","按封装库校验：引脚数、间距、焊盘尺寸与手册推荐值对账"]}]},{"id":"eng.sch","name":"原理图与网表","kind":"module","dom":"eng","abstract":"把「谁连谁」写成一份机器能读的网表：这是后面布线、检查、出 BOM 的唯一真源","note":"原理图有两个身份：给人看的图、给工具读的网表。**工具只认网表**——所以判断一张原理图对不对，不看画得漂不漂亮，看它能不能导出一份无悬浮网络的网表。这一格定下来就难改的三件事：网络命名规范（VCC/GND 分几种、模拟数字地怎么分）、层次化还是平铺（超过两页就必须层次化，否则改一处要翻五页）、以及电源树怎么画（后面算电流、选 LDO、查压降全靠它）。坑：用「网络标签」当连线。标签拼错一个字母（VDD_3V3 vs VDD3V3）就是两个网络，ERC 能查出来，但很多人不看 ERC 就导 PCB。","ins":"结构化记录+文本","outs":"板卡工程","pv":[{"id":"kicad-sch","n":"KiCad 原理图（层次化）","k":"oss","lic":"GPL-3.0","repo":"KiCad/kicad-source-mirror","note":"免费、跨平台、网表与 PCB 联动，脚本接口齐全（python 可批量改）；企业里做高速板不如 Altium，做控制板完全够","effort":"","tokens":"","outline":[]},{"id":"altium","n":"Altium Designer","k":"commercial","lic":"—","repo":"","note":"高速板与团队协作的老大难标准；价格与授权管理是真门槛，小团队用 KiCad + 严格规范往往更省事","effort":"","tokens":"","outline":[]},{"id":"skidl","n":"SKiDL（用 Python 写网表）","k":"oss","lic":"MIT","repo":"devbisme/skidl","note":"把「连 20 个一样的 LED」写成循环，改一处全部生效；适合阵列、总线、多路复用的板子，纯图形界面画这类会画到崩","effort":"","tokens":"","outline":[]},{"id":"eng-sch-write","n":"AI 帮你出第一版原理图","k":"build","lic":"","repo":"","note":"","effort":"2 天","tokens":"约 35 万","outline":["按功能框图分页 + 电源树 + 网络命名规范表","生成 KiCad 工程骨架（.kicad_sch / .kicad_pro）与器件实例","ERC 清零：未连接引脚、单端网络、电源冲突逐条修"]}]},{"id":"eng.pcb","name":"布局与布线","kind":"module","dom":"eng","abstract":"把网表变成能生产的板：层叠、阻抗、走线、过孔、丝印、拼板","note":"布局决定成败：同一份网表，布局差 20mm 就可能过不了 EMC。顺序是死的：**先定结构和接口位置（连接器、按键、屏、天线）→ 再放主芯片与去耦 → 再布线**。反过来先布线，最后发现连接器位置跟外壳对不上，整版重来。三件必须先算的账：层叠（两层还是四层，四层能省掉一半 EMC 问题，成本差约 30%）、阻抗（USB/以太网/HDMI 要控 90/100Ω 差分，靠叠层和线宽算，不靠感觉）、载流（1oz 铜 1mm 宽约过 2A，电机和灯条这类大电流要单独算，别用信号线思维）。坑：自动布线一把梭。自动布线器只会按规则连起来，不管回流路径和串扰；低速板可以，超过 50MHz 或有开关电源的板子必须手动布关键网络。","ins":"板卡工程","outs":"板卡工程","pv":[{"id":"kicad-pcb","n":"KiCad PCB + 推挤布线","k":"oss","lic":"GPL-3.0","repo":"KiCad/kicad-source-mirror","note":"交互式布线手感够用、差分对与等长绕线都有；配合 Saturn PCB Toolkit 算阻抗与载流。四层板建议叠层：信号/地/电源/信号","effort":"","tokens":"","outline":[]},{"id":"altium-pcb","n":"Altium / PADS","k":"commercial","lic":"—","repo":"","note":"高速与多层板（6 层以上）的约束管理更成熟；一次打样失败的成本往往就超过软件钱，但小批量控制板不值得","effort":"","tokens":"","outline":[]},{"id":"freerouting","n":"Freerouting（自动布线）","k":"oss","lic":"Apache-2.0","repo":"freerouting/freerouting","note":"从 Specctra DSN 导入自动布；只适合低速、少层的板子，布完必须人工检查回流路径与电源走向，别直接出图","effort":"","tokens":"","outline":[]},{"id":"eng-pcb-write","n":"AI 帮你做布局评审","k":"build","lic":"","repo":"","note":"","effort":"1.5 天","tokens":"约 26 万","outline":["按网表算模块聚簇：哪些器件必须挨着（去耦、晶振、差分对）","生成布局建议图（分区、禁布区、接口朝向）与检查清单","出图前自动核对：丝印是否压焊盘、过孔是否落在焊盘上、板框是否闭合"]}]},{"id":"eng.drc","name":"设计规则检查（DRC / ERC / LVS）","kind":"module","dom":"eng","abstract":"出图前最后一道闸：间距、线宽、焊盘环宽、丝印压焊盘，以及版图和网表对不对得上","note":"这一格存在的理由只有一个：**它是唯一能在打样前拦住废板的环节**。板厂的 DFM 只判断「工艺能不能做出来」，不判断「你的电路对不对」；电气错误（两个网络短在一起、电源和地接反）只能靠自己的 ERC/DRC。规则要分两层：厂家能力（最小线宽/间距/孔径，看板厂工艺表填，别用默认值）和自己的设计规则（电源线宽、差分间距、晶振包地）。芯片侧同理，只是名字换了：DRC 查版图几何、LVS 查版图与网表是否一致、ERC 查电气规则——三道全绿才能流片。坑：把 DRC 报错一条条「忽略」。忽略的每一条都要在评审记录里写下理由，否则下一版没人知道那条为什么能过。","ins":"板卡工程","outs":"结构化记录 + 界面","pv":[{"id":"kicad-drc","n":"KiCad DRC / ERC","k":"oss","lic":"GPL-3.0","repo":"KiCad/kicad-source-mirror","note":"内置，规则可在板级设置里改；命令行 `kicad-cli pcb drc` 能进 CI，每次提交自动跑，别等到出图那天才点","effort":"","tokens":"","outline":[]},{"id":"klayout","n":"KLayout DRC/LVS（芯片版图）","k":"oss","lic":"GPL-3.0","repo":"KLayout/klayout","note":"开源版图工具，用 Ruby/Python 写 DRC 规则；配合开源 PDK（SkyWater 130 / GF180）能在本地跑完整 DRC+LVS，不必买 Calibre","effort":"","tokens":"","outline":[]},{"id":"magic-netgen","n":"Magic + Netgen（LVS）","k":"oss","lic":"GPL-2.0","repo":"RTimothyEdwards/magic","note":"从版图提网表再和原理图比对，是开源流程里最成熟的一套；判据很硬：不一致就是不一致，没有「差不多」","effort":"","tokens":"","outline":[]},{"id":"eng-drc-write","n":"AI 帮你写检查规则","k":"build","lic":"","repo":"","note":"","effort":"1 天","tokens":"约 18 万","outline":["按板厂工艺表生成 DRC 规则文件（线宽/间距/孔径/环宽）","把报错按「必须改 / 可豁免」分类，并生成豁免理由模板","接进 CI：每次提交跑一遍，把新增错误贴到提交评论"]}]},{"id":"eng.bom","name":"BOM 与物料","kind":"module","dom":"eng","abstract":"从网表生成采购清单：料号、数量、封装、替代料、单价与库存","note":"BOM 是设计与采购之间的合同。它最容易错的地方不是漏料，是**「同名不同料」**：10k 电阻有 1% 和 5%、0402 和 0603、厚膜和薄膜，价格差三倍，性能差一个量级。所以 BOM 必须带三列才能采购：厂家料号（不是自己起的编号）、封装、以及至少一个可替代料号（缺货时不用改设计）。还要算一件容易被忽略的事：**最小起订量与损耗**。一片板用 3 个 0.1uF，打 10 片要 30 个，但 0402 电容按盘卖（4000 个/盘），实际支出不是 30 倍单价。","ins":"结构化记录","outs":"结构化记录 + 产物文件","pv":[{"id":"kicad-bom","n":"KiCad BOM 导出 + 自建字段","k":"oss","lic":"GPL-3.0","repo":"KiCad/kicad-source-mirror","note":"在符号属性里加 MPN/替代料/单价三个字段，导出时一起带出来；字段放在符号里，改料号只改一处，BOM 与原理图永远同步","effort":"","tokens":"","outline":[]},{"id":"ibom","n":"InteractiveHtmlBom","k":"oss","lic":"MIT","repo":"openscopeproject/InteractiveHtmlBom","note":"生成可点击的装配图：点一行 BOM 高亮板上位置，手焊和返修时省大量找料时间","effort":"","tokens":"","outline":[]},{"id":"lcsc-api","n":"立创商城 / Octopart API","k":"commercial","lic":"—","repo":"","note":"按料号查库存与价格、自动找替代料；国内项目接立创，海外接 Octopart（Nexar）。注意接口有频率限制，批量查询要加缓存","effort":"","tokens":"","outline":[]},{"id":"eng-bom-write","n":"AI 帮你核 BOM","k":"build","lic":"","repo":"","note":"","effort":"0.5 天","tokens":"约 12 万","outline":["网表 → BOM 行（合并同料、算损耗与起订量）","逐行核对：封装与器件表一致、耐压与容差满足电路要求","缺货替代建议：同参数、同封装、可直替的料号"]}]},{"id":"eng.fab","name":"出图与生产交付","kind":"module","dom":"eng","abstract":"把工程变成板厂/晶圆厂能直接吃的东西：Gerber、钻孔、钢网、装配图、拼板，或 GDS","note":"出图是「一次做错全废」的最后一步，也是最容易漏项的一步。板厂要的是一套文件，不是一张图：**铜层 + 阻焊 + 丝印 + 钻孔 + 板框（每层一个文件）**，加上说明层叠与表面处理的工艺单；SMT 还要钢网文件和坐标文件（pick & place）；拼板要 V-cut 或邮票孔。少一个钻孔文件，板厂会打电话来问，工期就往后推三天。芯片侧对应的是 GDSII + 层映射表 + 测试结构，交给晶圆厂跑 tapeout——这一步的检查叫 sign-off，签了就开始烧钱，没有回头路。坑：文件名随便起。板厂靠文件名识别层（.GTL 顶层、.GBL 底层、.DRL 钻孔），改名成 1.gbr/2.gbr 会被当成同一层。","ins":"板卡工程 或 结构化记录","outs":"产物文件 + 外部动作","pv":[{"id":"kicad-cli","n":"kicad-cli 导出（可脚本化）","k":"oss","lic":"GPL-3.0","repo":"KiCad/kicad-source-mirror","note":"`kicad-cli pcb export gerbers/drill/pos` 一条命令出一套文件，适合放进 CI：版本号进文件名，每次发版自动打一个压缩包","effort":"","tokens":"","outline":[]},{"id":"jlc-dfm","n":"嘉立创 DFM / PCBWay 预检","k":"commercial","lic":"—","repo":"","note":"上传后自动查最小孔径、环宽、间距是否超工艺能力；免费且比人工看准。下单前必跑一次，能挡掉「板厂做不出来」这类退单","effort":"","tokens":"","outline":[]},{"id":"gds-stream","n":"GDSII + 层映射（芯片）","k":"pattern","lic":"—","repo":"","note":"版图导出成 GDSII，附一份层号→工艺层对照表；层映射错一层，整片报废。导出后必须用 KLayout 回读一遍对数","effort":"","tokens":"","outline":[]},{"id":"eng-fab-write","n":"AI 帮你出交付包","k":"build","lic":"","repo":"","note":"","effort":"1 天","tokens":"约 16 万","outline":["按板厂要求生成文件命名与目录结构（层名/版本/日期）","出包前 checklist：层数齐、钻孔齐、板框闭合、工艺单字段全","生成下单说明（层叠/表面处理/阻抗要求/交期）"]}]},{"id":"eng.rtl","name":"RTL 设计与规范检查","kind":"module","dom":"eng","abstract":"用 Verilog/SystemVerilog 写电路，并用 lint 把它约束成「能综合、可读、可复用」的样子","note":"RTL 与软件最大的差别：**你写的是电路，不是指令流**。一个 for 循环在软件里是循环，在 RTL 里会被展开成 N 份硬件；随手写个 `a * b` 在综合后可能变成一个几十级的乘法器，时序直接崩。所以这一格真正的产出不是代码，是**编码规范 + lint 门禁**：阻塞/非阻塞赋值不能混用、每个 always 块只驱动一个信号、跨时钟域必须走同步器（两级触发器）、位宽要显式声明不许隐式截断。坑：仿真过了就以为对了。仿真只覆盖你想到的情况；lint 与 CDC 检查覆盖的是你没想到的——这两道在流片前必须全绿。","ins":"文本+原始文件","outs":"原始文件 + 结构化记录","pv":[{"id":"verible","n":"Verible lint / formatter","k":"oss","lic":"Apache-2.0","repo":"chipsalliance/verible","note":"Google 开源的 SV 工具链，规则集可配、能当 CI 门禁；格式统一以后，code review 才看得见真正的逻辑改动","effort":"","tokens":"","outline":[]},{"id":"verilator-lint","n":"Verilator --lint-only","k":"oss","lic":"LGPL-3.0","repo":"verilator/verilator","note":"最严格的免费 lint，位宽不匹配、未驱动信号、组合环全能报出来；报错多但几乎每条都值得改","effort":"","tokens":"","outline":[]},{"id":"sv-lang","n":"SystemVerilog + 断言（SVA）","k":"pattern","lic":"—","repo":"","note":"把接口协议写成断言（「req 拉高后 4 拍内必须有 ack」），仿真时自动检查；比人眼看波形可靠得多","effort":"","tokens":"","outline":[]},{"id":"eng-rtl-write","n":"AI 帮你写 RTL 与规范","k":"build","lic":"","repo":"","note":"","effort":"3 天","tokens":"约 60 万","outline":["按接口表生成模块骨架（端口/参数/时钟复位）","写 lint 规则集与 CI 门禁（位宽、跨时钟域、组合环）","生成模块清单与接口表，供集成与验证复用"]}]},{"id":"eng.sim","name":"仿真与验证","kind":"module","dom":"eng","abstract":"跑 testbench 看波形：功能对不对、覆盖率够不够、改一行有没有弄坏别的","note":"验证通常占芯片项目 50–70% 的工作量，原因很简单：**流片后改不了**。这一格要建立的是「可回归」：不是跑一次看起来对，而是每次改动都能自动跑完几百个 case 并给出通过率与覆盖率。三件事必须一起有：① 自检 testbench（自己判对错，不靠人看波形）；② 覆盖率（行/分支/状态机/断言，缺哪块一目了然）；③ 随机 + 定向结合（随机撞边界，定向测协议）。坑：只看波形不看覆盖率。波形过了只说明你测的那条路对，没跑到的那 30% 里可能就藏着流片后才能发现的死锁。","ins":"原始文件","outs":"结构化记录 + 界面","pv":[{"id":"verilator","n":"Verilator（编译成 C++ 跑）","k":"oss","lic":"LGPL-3.0","repo":"verilator/verilator","note":"比事件驱动仿真器快 10–100 倍，几十万门的设计也能天天回归；不支持部分 SV 语法（如部分断言），要提前确认","effort":"","tokens":"","outline":[]},{"id":"iverilog","n":"Icarus Verilog + GTKWave","k":"oss","lic":"GPL-2.0","repo":"steveicarus/iverilog","note":"轻、装起来就能跑，适合小模块与教学；GTKWave 看波形够用，大设计会慢到不能忍","effort":"","tokens":"","outline":[]},{"id":"cocotb","n":"cocotb（Python 写 testbench）","k":"oss","lic":"BSD-3-Clause","repo":"cocotb/cocotb","note":"用 Python 写激励与检查，能直接调 numpy 造数据、调 matplotlib 画图；验证工程师不必是 SV 专家","effort":"","tokens":"","outline":[]},{"id":"eng-sim-write","n":"AI 帮你写 testbench","k":"build","lic":"","repo":"","note":"","effort":"2 天","tokens":"约 40 万","outline":["按接口协议生成定向 case + 随机约束","自检机制：期望值与实际值比对、超时检测、断言","覆盖率收集与缺口报告（哪些分支从没跑到）"]}]},{"id":"eng.synth","name":"综合与物理实现","kind":"module","dom":"eng","abstract":"RTL → 门级网表 → 布局布线 → 版图：把代码变成真的能造出来的几何图形","note":"这一步是「代码世界」与「物理世界」的分界。综合把 always 块变成标准单元，布局布线决定这些单元在硅片上的位置与连线。约束文件（SDC）比代码更决定结果：时钟频率、输入输出延迟、false path 与 multicycle 写错一条，时序报告就全是假的。面积、功耗、频率三者互斥——想把频率从 200MHz 提到 400MHz，要么加流水线（改 RTL），要么换更贵的工艺，没有第三条路。坑：先用 FPGA 验证再流片，以为是一回事。FPGA 的 LUT 与 ASIC 的标准单元延迟特性完全不同，FPGA 能跑 100MHz 不代表 ASIC 能跑 500MHz，反过来也一样。","ins":"原始文件","outs":"板卡工程","pv":[{"id":"yosys","n":"Yosys（综合）","k":"oss","lic":"ISC","repo":"YosysHQ/yosys","note":"开源综合器，Verilog → 网表，能出面积/单元数报告；配合 ABC 做逻辑优化。大设计比商业工具慢，但完全够学习与小芯片","effort":"","tokens":"","outline":[]},{"id":"openroad","n":"OpenROAD / OpenLane（物理实现）","k":"oss","lic":"Apache-2.0","repo":"The-OpenROAD-Project/OpenROAD","note":"从网表到 GDS 全自动：floorplan、place、CTS、route、签核。配合 SkyWater 130nm PDK 能真的流片（多次流片项目如 Tiny Tapeout 就走这条）","effort":"","tokens":"","outline":[]},{"id":"vivado","n":"Vivado / Quartus（FPGA 原型）","k":"commercial","lic":"—","repo":"","note":"先上 FPGA 验证功能，比直接流片便宜几个数量级；但 FPGA 只验证「逻辑对不对」，不验证「时序能不能收敛」","effort":"","tokens":"","outline":[]},{"id":"eng-synth-write","n":"AI 帮你写约束与流程脚本","k":"build","lic":"","repo":"","note":"","effort":"2 天","tokens":"约 45 万","outline":["SDC 约束：时钟、IO 延迟、false path、multicycle","Makefile/Tcl 流程：综合 → 布局 → CTS → 布线 → 出报告","按报告定位瓶颈：是逻辑级数多、还是布线拥塞"]}]},{"id":"eng.signoff","name":"时序与功耗签核","kind":"module","dom":"eng","abstract":"流片前最后一道算术：每个路径的建立/保持时间是否为正，功耗与压降是否在预算内","note":"签核的意思是「签了就开始烧钱」。它不看功能，只看数字：**WNS（最差负裕量）必须 ≥ 0**，否则芯片在某个角落、某个电压、某个温度下会算错；**功耗**要分动态（翻转引起）与静态（漏电），28nm 以下漏电会占到一半；**IR drop** 要看电源网格能不能在峰值电流下把电压撑住。三种工艺角必须都过：慢速/高温/低压（SS）、快速/低温/高压（FF）、典型（TT）。坑：只跑 TT 角。TT 过了不代表 SS 能过——很多芯片是「常温好用、一冷就挂」。","ins":"板卡工程","outs":"结构化记录 + 界面","pv":[{"id":"opensta","n":"OpenSTA","k":"oss","lic":"GPL-3.0","repo":"The-OpenROAD-Project/OpenSTA","note":"开源静态时序分析，读 SDC + SPEF，出 WNS/TNS 与违例路径；OpenROAD 流程里已内置，单独用也方便","effort":"","tokens":"","outline":[]},{"id":"primetime","n":"PrimeTime / Tempus","k":"commercial","lic":"—","repo":"","note":"商业签核标准，精度与工艺库支持最全；贵，但流片前的签核通常不敢用开源工具","effort":"","tokens":"","outline":[]},{"id":"power-report","n":"功耗与 IR drop 报告","k":"pattern","lic":"—","repo":"","note":"按翻转率算动态功耗、按工艺库算漏电，再用峰值电流跑网格分析；三个数必须一起看，单看功耗会漏掉局部压降","effort":"","tokens":"","outline":[]},{"id":"eng-signoff-write","n":"AI 帮你读签核报告","k":"build","lic":"","repo":"","note":"","effort":"1 天","tokens":"约 20 万","outline":["解析时序报告：按路径分组、找出共性瓶颈（逻辑级数/扇出/长线）","三工艺角对比表：哪个角最差、差多少","给修改建议：加流水线、降频、改约束或换单元"]}]},{"id":"ai.model.dataset","name":"数据集版本与清洗","kind":"module","dom":"ai.model","abstract":"把训练数据变成「可复现的一份」：版本号、去重、配比、train/val 切分固定下来","note":"调参调不动，八成不是超参问题，是数据问题。这一格要钉死三件事：**版本**（数据集变了要能对应到哪次训练）、**去重**（训练集与测试集重叠会让指标虚高十几个点，且上线就崩）、**配比**（通用能力与领域能力的比例，改一次就是一个新实验）。切分必须固定并写进 manifest：每次随机切分等于每次换考卷，指标不可比，前面所有实验白做。坑：只存处理后的 jsonl，不存原始数据与清洗脚本。三个月后想复现，发现不知道当时过滤了什么。","ins":"原始文件","outs":"原始文件 + 结构化记录","pv":[{"id":"hf-datasets","n":"Hugging Face datasets","k":"oss","lic":"Apache-2.0","repo":"huggingface/datasets","note":"流式读取 + 内存映射，几十 GB 不用先塞进内存；push 到私有仓就自带版本（revision/commit hash）","effort":"","tokens":"","outline":[]},{"id":"dvc","n":"DVC / git-lfs","k":"oss","lic":"Apache-2.0","repo":"iterative/dvc","note":"数据与代码同仓管理：.dvc 文件进 git，大文件进对象存储；checkout 到某个 commit 就能拿回当时那份数据","effort":"","tokens":"","outline":[]},{"id":"minhash","n":"MinHash / SimHash 去重","k":"oss","lic":"MIT","repo":"ekzhu/datasketch","note":"近重复检测比精确去重重要得多（同一段话改两个标点仍是重复）；按 Jaccard 阈值 0.8 聚簇，每簇留一条","effort":"","tokens":"","outline":[]},{"id":"eng-dataset-write","n":"AI 帮你做数据流水线","k":"build","lic":"","repo":"","note":"","effort":"2 天","tokens":"约 40 万","outline":["清洗规则：编码、去 HTML、长度过滤、敏感内容过滤","去重 + 配比采样 + 固定切分，产出 manifest.json","质量抽检：按来源分层抽样，人工过 100 条再全量跑"]}]},{"id":"ai.model.train","name":"训练与微调编排","kind":"module","dom":"ai.model","abstract":"把「跑一次训练」变成可重复的任务：配置、显存、断点、日志，一条命令起","note":"训练这一格的价值不在「能跑起来」，在**「跑挂了不用从头来」**。全参微调 7B 要 8×A100，断在第 3000 步很常见——没有检查点就是白烧了几千卡时。三件事必须配好：**并行策略**（单卡装不下就用 ZeRO/FSDP 切参数，或者 LoRA/QLoRA 只训低秩增量，7B 在单张 24G 卡上就能跑）、**梯度累积**（小显存模拟大 batch，注意学习率要跟着开方调）、**日志粒度**（每步记 loss/lr/grad_norm，每 N 步存 ckpt）。坑：改了 batch size 不改学习率。线性缩放规则不是玄学，是 SGD 的方差补偿，batch 翻倍学习率不调，loss 曲线会先平后炸。","ins":"原始文件+结构化记录","outs":"外部动作","pv":[{"id":"llamafactory","n":"LLaMA-Factory","k":"oss","lic":"Apache-2.0","repo":"hiyouga/LLaMA-Factory","note":"一套 YAML 覆盖 SFT/DPO/LoRA/全参，一百多个模型开箱能跑；适合「先跑通再改代码」，最省事的一条路","effort":"","tokens":"","outline":[]},{"id":"axolotl","n":"Axolotl / torchtune","k":"oss","lic":"Apache-2.0","repo":"axolotl-ai-cloud/axolotl","note":"配置驱动、社区配方多（各尺寸的推荐超参），改并行策略比手写脚本清楚；torchtune 更贴近原生 PyTorch","effort":"","tokens":"","outline":[]},{"id":"unsloth","n":"Unsloth（QLoRA 加速）","k":"oss","lic":"Apache-2.0","repo":"unslothai/unsloth","note":"单卡 24G 训 7B 的现实解：4bit 量化 + 手写 kernel，显存省一半、速度快 2 倍；只支持部分模型结构，换模型前先查兼容表","effort":"","tokens":"","outline":[]},{"id":"eng-train-write","n":"AI 帮你写训练脚本","k":"build","lic":"","repo":"","note":"","effort":"2 天","tokens":"约 45 万","outline":["训练配置模板（模型/数据/并行/优化器/调度器）与校验","断点续训：从最新 ckpt 恢复优化器状态与步数","异常自愈：OOM 自动降 batch / 提高累积步数并重试"]}]},{"id":"ai.model.eval","name":"评测与回归","kind":"module","dom":"ai.model","abstract":"同一套题、同一个判分器，回答「这一版到底比上一版好还是坏」","note":"没有固定评测集，调参就是掷骰子。这一格要解决三个具体的坑：**题变了**（每次都临时想几个问题，前后不可比）、**判分器不一致**（一会儿人看、一会儿模型打分，标准漂移）、**只测能力不测退化**（领域能力涨了 5 分，通用指令跟随掉了 10 分，上线才发现）。所以要三层：能力集（目标任务）、回归集（上一版必须过的老题）、安全集（不该说的不说）。判分尽量用规则（精确匹配/包含/正则/代码单测），模型打分只做兜底并记录打分模型版本。坑：在测试集上反复调，调到 95% 然后上线 60%——那是过拟合评测集，不是模型变强。","ins":"外部动作+原始文件","outs":"结构化记录 + 界面","pv":[{"id":"lm-eval","n":"lm-evaluation-harness","k":"oss","lic":"MIT","repo":"EleutherAI/lm-evaluation-harness","note":"标准 benchmark 的参考实现，几十个任务、结果可复现；适合看通用能力有没有掉，不适合衡量你的业务效果","effort":"","tokens":"","outline":[]},{"id":"opencompass","n":"OpenCompass","k":"oss","lic":"Apache-2.0","repo":"open-compass/opencompass","note":"中文任务集更全，支持多模型对比与裁判模型；注意裁判模型本身有偏好（偏长、偏自己家的风格）","effort":"","tokens":"","outline":[]},{"id":"custom-eval","n":"自建任务集 + 规则判分","k":"pattern","lic":"—","repo":"","note":"从真实用户问题里抽 100–300 条，人工标注期望答案要点，用关键词/正则/单测判分。业务效果只能靠这个，公开榜参考价值有限","effort":"","tokens":"","outline":[]},{"id":"eng-eval-write","n":"AI 帮你搭评测台","k":"build","lic":"","repo":"","note":"","effort":"1.5 天","tokens":"约 30 万","outline":["任务集结构（能力/回归/安全）与标注模板","判分器：规则优先、模型兜底，记录判分版本","出对比报告：与上一版的逐项差异，标出退化的题"]}]},{"id":"ai.model.ckpt","name":"检查点与权重管理","kind":"module","dom":"ai.model","abstract":"把每一步的权重、配置、数据版本绑在一起存：能回退、能对比、能交付","note":"权重文件是这一行的「发布物」，但它有三个麻烦：**大**（7B fp16 约 14GB）、**多**（每 N 步存一个，跑一周就是几十份）、**缺上下文**（光有 .safetensors，不知道是哪份数据、哪套超参训出来的）。所以这一格不是「存文件」，是**三元组绑定**：权重 + 训练配置 + 数据 manifest hash，写进同一个目录的 meta.json。少了它，三个月后想复现最好那一版，只能靠猜。策略上：只留「最好的 + 最近的 + 每 N 步的一个」，其余按时间清理；对比实验只留最终权重，中间态扔对象存储冷备。坑：把 ckpt 提交进 git。一次 commit 十几 GB，仓库直接废掉。","ins":"外部动作","outs":"原始文件","pv":[{"id":"hf-hub","n":"Hugging Face 私有仓","k":"oss","lic":"Apache-2.0","repo":"huggingface/huggingface_hub","note":"自带版本与 diff（大文件走 LFS）、能直接给推理服务拉；私有仓按存储计费，几十份 ckpt 要算清成本","effort":"","tokens":"","outline":[]},{"id":"rclone-s3","n":"rclone + S3/MinIO","k":"oss","lic":"MIT","repo":"rclone/rclone","note":"便宜、能断点、能按前缀批量清理；自己定目录规范：`{实验}/{步数}/`，meta.json 与权重同目录","effort":"","tokens":"","outline":[]},{"id":"manifest","n":"meta.json 三元组绑定","k":"pattern","lic":"—","repo":"","note":"每次存 ckpt 写一份：git commit、数据集 manifest hash、超参文件、评测分数。体积几 KB，价值比权重本身高","effort":"","tokens":"","outline":[]},{"id":"eng-ckpt-write","n":"AI 帮你做权重台账","k":"build","lic":"","repo":"","note":"","effort":"1 天","tokens":"约 18 万","outline":["目录规范与自动归档（最好的/最近的/里程碑）","meta.json 生成与校验：权重能加载、hash 对得上","清理策略：按实验保留，冷备到对象存储"]}]},{"id":"site.space","name":"库位与动线","kind":"module","dom":"site","abstract":"给每个货架、每层、每个格子编号，再定「什么货放哪、人怎么走」——后面所有扫码都靠这套地址","note":"库位编码看着是件小事，实际决定了后面每一件事顺不顺：拣货单上写「A区3排2层左」，人一眼能找到；写「货架5」，人就站在那儿翻十分钟。编码要有层级、要能念出来、要贴在齐眼高度：`A-03-02-L`（区-排-层-位）。动线上最容易犯的错是「按品类分区」而不是「按出货频率分区」——卖得最快的放在最里面，拣货员一天多走八公里。正确做法是 ABC 分区：A 类（前 20% 出货量）贴着打包台，C 类（长尾）放最远的角落。坑：库位不设容量上限。一个格子塞三倍的货，扫码记录还在，实物早堆到过道上了。","ins":"文本","outs":"结构化记录 + 界面","pv":[{"id":"self-code","n":"自建编码规则 + 标签打印","k":"pattern","lic":"—","repo":"","note":"区-排-层-位四级，用连字符分隔、全大写、不用易混字符（0/O、1/I）；标签机打 50×20mm 的亚银纸，贴在每层横梁右端，人站着就能看见","effort":"","tokens":"","outline":[]},{"id":"odoo-loc","n":"Odoo 库位（父子层级）","k":"oss","lic":"LGPL-3.0","repo":"odoo/odoo","note":"库位是树：仓库/区/排/层，移动即调拨，历史全留；小仓库用社区版就够，别一上来买企业版","effort":"","tokens":"","outline":[]},{"id":"openboxes","n":"OpenBoxes","k":"oss","lic":"Eclipse-2.0","repo":"openboxes/openboxes","note":"专门做仓储的开源系统：库位、批次、效期、调拨都有；界面老、部署要 Java 环境，适合有人维护的仓","effort":"","tokens":"","outline":[]},{"id":"site-space-build","n":"AI 帮你排库位与动线","k":"build","lic":"","repo":"","note":"","effort":"1.5 天","tokens":"约 22 万","outline":["按出货频率做 ABC 分区，给每类货分配区域","生成库位编码表与标签打印文件（含二维码）","算一遍拣货动线长度，给出「哪些货该挪近」的清单"]}]},{"id":"site.in","name":"收货与上架","kind":"module","dom":"site","abstract":"对着送货单点数量、验外观、贴内部标签、扫进库位——这一步错了，后面全是错账","note":"收货台是整条链上唯一「实物和单据第一次见面」的地方，也是差错最容易进来的地方。标准动作四步：① 对单（供应商送的是什么、单上写的是什么）；② 点验（数量、外箱、效期）；③ 贴标（内部 SKU 码，覆盖或并列供应商条码）；④ 上架（扫库位码，系统记「谁在什么时候放进去」）。手持终端不是为了「高级」，是为了让人不用来回跑电脑：扫一下、按一下，两秒一格。坑一：先上架后录单。货已经上架了、单还没录，盘点时这堆货就是「幽灵库存」。坑二：整箱收货不拆验。供应商少装两盒，等你拆箱卖的时候才发现，已经过了索赔期。","ins":"原始文件+结构化记录","outs":"结构化记录 + 界面","pv":[{"id":"zebra-tc","n":"Zebra TC21 / 霍尼韦尔 EDA52 + 安卓扫码","k":"commercial","lic":"—","repo":"","note":"工业手持机，实体扳机键 + 激光头，戴手套也能按；比手机扫码快三倍，冬天手僵的时候差别明显。二手一千多一台","effort":"","tokens":"","outline":[]},{"id":"bt-scanner","n":"蓝牙扫码枪 + 手机/平板","k":"commercial","lic":"—","repo":"","note":"几百块就能起步，扫出来是键盘输入，任何网页都能接；缺点是每次要配对、续航一天，适合日均几百单的小仓","effort":"","tokens":"","outline":[]},{"id":"odoo-receipt","n":"Odoo 入库单（收货→质检→上架）","k":"oss","lic":"LGPL-3.0","repo":"odoo/odoo","note":"一张入库单走三步，状态看得见；支持部分收货与超收容差，供应商少送时不用整单退回","effort":"","tokens":"","outline":[]},{"id":"site-in-build","n":"AI 帮你做收货台","k":"build","lic":"","repo":"","note":"","effort":"1 天","tokens":"约 18 万","outline":["扫码页：料号/数量/库位三个大按钮，单手能操作","差异处理：少送、多送、破损三种分支与凭证","上架建议：按 ABC 分区自动推荐库位"]}]},{"id":"site.stock","name":"批次与效期","kind":"module","dom":"site","abstract":"同一件货不同批次要分开记：先进先出、临期预警、召回能追到具体哪几箱","note":"只要货有保质期或序列号，就不能只记「这个 SKU 有 100 件」，要记「哪 100 件、什么时候进的、什么时候过期」。咖啡豆、牛奶、药、化妆品、电池都吃这一套。三个必须：① 批次号跟入库单绑定；② 出库按 FIFO/FEFO（先到期先出）推荐；③ 临期有预警（提前 30/7 天两档），别等过期了才发现。坑：把批次当备注。写在备注里就查不了、算不了，等于没记。","ins":"结构化记录","outs":"结构化记录 + 界面","pv":[{"id":"odoo-lot","n":"Odoo 批次/序列号 + 到期日","k":"oss","lic":"LGPL-3.0","repo":"odoo/odoo","note":"批次与序列号都支持，FEFO 拣货能配；到期日提醒要自己配自动化规则","effort":"","tokens":"","outline":[]},{"id":"self-batch","n":"自建批次表（SQLite）","k":"pattern","lic":"—","repo":"","note":"一张表就够：sku、batch、qty、prod_date、exp_date、loc；查询按 exp_date 升序，就是 FEFO 的拣货顺序","effort":"","tokens":"","outline":[]},{"id":"site-stock-build","n":"AI 帮你做效期台账","k":"build","lic":"","repo":"","note":"","effort":"1 天","tokens":"约 15 万","outline":["批次表结构与入库时自动生成批次号","FEFO 拣货建议 + 临期两档预警","召回查询：输入批次号，列出流向与剩余库存"]}]},{"id":"site.pick","name":"拣货与复核","kind":"module","dom":"site","abstract":"把订单变成一条走得最短的路线，拣完在复核台再过一遍——错一件，退货成本是运费的三倍","note":"拣货的效率全在「路径」：一张单按库位排序，人走一趟拿完；不排序，人在仓库里来回折返。三个人为关键：① 波次（把几十张小单合成一批拣）；② 路径（按库位编码排序，S 形走法）；③ 复核（打包前逐件扫，扫错就红灯）。复核台是最后一道闸：错发一件，来回运费加客服时间，往往超过这件货的毛利。坑：只扫订单条码不扫商品条码。扫订单只证明「你打开了这单」，不证明「你拿对了货」。","ins":"结构化记录","outs":"结构化记录 + 产物文件 + 界面","pv":[{"id":"odoo-pick","n":"Odoo 波次拣货 + 条码复核","k":"oss","lic":"LGPL-3.0","repo":"odoo/odoo","note":"支持波次、集群拣货、按库位排序；条码应用里能逐件扫，扫错即时报错","effort":"","tokens":"","outline":[]},{"id":"self-pick","n":"自建拣货单（按库位排序）","k":"pattern","lic":"—","repo":"","note":"订单行 join 库位表，按 loc_code 排序输出，天然就是一条动线；纸质单 + 一支笔，小仓比上 PDA 更快","effort":"","tokens":"","outline":[]},{"id":"carrier-api","n":"快递面单 API（顺丰/中通/菜鸟）","k":"commercial","lic":"—","repo":"","note":"电子面单要签约与月结账号；菜鸟接口能一次对接多家，但每个网点开通要单独申请，别等到大促前才办","effort":"","tokens":"","outline":[]},{"id":"site-pick-build","n":"AI 帮你做拣货复核","k":"build","lic":"","repo":"","note":"","effort":"1.5 天","tokens":"约 24 万","outline":["波次合并规则与拣货单（按库位 S 形排序）","复核页：扫商品码比对，错件红屏 + 声音","装箱单与面单打印，支持一单多箱"]}]},{"id":"site.count","name":"盘点与差异","kind":"module","dom":"site","abstract":"停业盘还是循环盘、盲盘还是明盘、差异怎么定责——盘点的目的不是「数字好看」，是找出漏在哪","note":"盘点最容易做成形式：抄一遍账面数字，签个字，差异为零，问题还在。有效的做法是三条：① 循环盘点（每天盘一小块，不停业），而不是一年一次大盘；② 盲盘（不给账面数，盘完再比），否则人会「盘成账上的数」；③ 差异必查原因（收错、拣错、内盗、单据漏录），差异率按库位/按人统计。坑：盘点前不冻结出入库。这边盘、那边发货，永远盘不平。","ins":"结构化记录","outs":"结构化记录 + 界面","pv":[{"id":"odoo-count","n":"Odoo 循环盘点（Cycle Count）","k":"oss","lic":"LGPL-3.0","repo":"odoo/odoo","note":"按库位/品类分批盘，盘完自动生成调整单；开启「盘点时冻结」避免边盘边动","effort":"","tokens":"","outline":[]},{"id":"self-count","n":"自建盲盘表 + 扫码录入","k":"pattern","lic":"—","repo":"","note":"导出库位清单（不含数量）→ 现场填实际数 → 回传比对；差异超过阈值（如 2%）必须二次复盘","effort":"","tokens":"","outline":[]},{"id":"site-count-build","n":"AI 帮你做盘点","k":"build","lic":"","repo":"","note":"","effort":"1 天","tokens":"约 16 万","outline":["循环盘点计划：按 ABC 类定频次（A 类月盘、C 类季盘）","盲盘录入页与差异计算，自动出调整单","差异分析：按库位/按操作人聚合，找系统性漏洞"]}]},{"id":"site.order","name":"点单与出杯","kind":"module","dom":"site","abstract":"下单、付款、打小票、叫号取餐——高峰期八分钟四十杯，每一步都不能多点一下","note":"门店点单的核心指标不是功能，是**单手操作步数**：从「客人说要一杯冰美式」到「小票出来」，熟练店员应该三下点完。任何需要「先选分类、再翻页、再确认」的设计，高峰期都是灾难。四件必备：① 常点项置顶（按销量自动排）；② 加料/去冰/换奶用大按钮，不用下拉；③ 支付成功才出单（防止跑单）；④ 出杯叫号（屏 + 语音），别让店员喊。坑：把 POS 做成「后台管理界面」。后台是给老板看的，POS 是给站着的人用的，字号、按钮、颜色都该按「戴手套、手上有水」来设计。","ins":"文本+结构化记录","outs":"结构化记录 + 界面 + 外部动作","pv":[{"id":"loyverse","n":"Loyverse POS（免费）","k":"commercial","lic":"—","repo":"","note":"免费、离线可用、支持加料与改价；小票机与钱箱兼容性好；会员与库存要付费版，连锁多店要另想办法","effort":"","tokens":"","outline":[]},{"id":"square-rest","n":"Square for Restaurants","k":"commercial","lic":"—","repo":"","note":"桌台与出杯流程做得最顺，厨房显示屏（KDS）能直接接；国内用不了它的支付，只能当参考","effort":"","tokens":"","outline":[]},{"id":"odoo-pos","n":"Odoo POS（离线模式）","k":"oss","lic":"LGPL-3.0","repo":"odoo/odoo","note":"断网也能开单，回网自动同步；改菜单要重启 POS 会话，上线前先在备用平板演练一遍","effort":"","tokens":"","outline":[]},{"id":"site-order-build","n":"AI 帮你做点单台","k":"build","lic":"","repo":"","note":"","effort":"2 天","tokens":"约 32 万","outline":["点单页：常点置顶、加料大按钮、单手三步下单","支付回调与出单（微信/支付宝/现金）","叫号屏与语音播报，出杯状态可点「已取」"]}]},{"id":"site.recipe","name":"配方与损耗","kind":"module","dom":"site","abstract":"一杯用多少克豆、多少毫升奶，报废记在哪——毛利不是算出来的，是扣出来的","note":"门店的毛利有两个漏斗：**配方不统一**（今天多 2 克豆，一个月就是几百块）和**损耗不记录**（打翻的、过期的、员工餐的，全进了成本但没人知道）。做法：① 配方卡绑定到商品（一杯拿铁 = 18g 豆 + 200ml 奶 + 一个杯盖）；② 出单自动扣原料（按配方 × 数量）；③ 报废必须扫码登记（原因：过期/打翻/试饮/员工）；④ 每日原料账 vs 销售账，差多少一目了然。坑：只记销售不记原料。月底一算「怎么赚了这么多」，其实是库存被吃掉了。","ins":"结构化记录","outs":"结构化记录 + 界面","pv":[{"id":"self-recipe","n":"自建配方卡（BOM 式）","k":"pattern","lic":"—","repo":"","note":"一张表：商品 × 原料 × 用量（含单位换算）；出单时按数量展开扣减，改配方要留版本与生效时间，否则历史订单算不回去","effort":"","tokens":"","outline":[]},{"id":"odoo-bom","n":"Odoo 物料清单（BoM）","k":"oss","lic":"LGPL-3.0","repo":"odoo/odoo","note":"BoM 能挂到 POS 商品上，卖出自动扣组件；支持「套件」与「按订单生产」两种，饮品用前者","effort":"","tokens":"","outline":[]},{"id":"scale","n":"电子秤 + 定量出粉器","k":"commercial","lic":"—","repo":"","note":"配方要落地得靠器具：定量出粉器、量杯、糖浆泵。靠人「估」的配方，一周就漂了","effort":"","tokens":"","outline":[]},{"id":"site-recipe-build","n":"AI 帮你算配方与损耗","k":"build","lic":"","repo":"","note":"","effort":"1 天","tokens":"约 18 万","outline":["配方卡结构与单位换算（g/ml/份）","出单自动扣料 + 日报（销售账 vs 原料账）","损耗登记：原因分类、按人按品统计、异常提醒"]}]},{"id":"site.channel","name":"线上渠道与外卖","kind":"module","dom":"site","abstract":"美团/饿了么/抖音团购的单要进来、要能和堂食排同一个队、要对得上账","note":"线上单最容易被当成「另一套系统」：一台平板接美团、一台接饿了么、团购核销再一台，店员在三个屏之间来回切，出杯顺序全乱。正确做法是「一个队列」：所有渠道的订单汇到一个出杯队列，按承诺时间排序；渠道只提供「单从哪来」这个标签。对账是第二道坎：平台结算有账期、有佣金、有活动补贴，实收和订单金额对不上是常态，每天拉一次账单落库，月底才不用猜。坑：把平台平板当主系统。平台只负责接单，库存与出杯必须在自己这边。","ins":"结构化记录+原始文件","outs":"结构化记录 + 外部动作 + 界面","pv":[{"id":"meituan-open","n":"美团开放平台（外卖/团购）","k":"commercial","lic":"—","repo":"","note":"接单、拒单、菜品映射、账单下载都有接口；要企业资质与门店绑定，审核一周起，别在开业前一天才申请","effort":"","tokens":"","outline":[]},{"id":"eleme-open","n":"饿了么开放平台","k":"commercial","lic":"—","repo":"","note":"与美团接口结构不同，字段要各写一套映射；两家都有「自动接单」开关，先手动跑一周再开自动","effort":"","tokens":"","outline":[]},{"id":"aggregator","n":"第三方聚合（客如云/收银系统自带）","k":"commercial","lic":"—","repo":"","note":"一次对接多家，省开发；按月收费，且数据在别人手里——要确认能导出原始订单，否则换供应商时搬不走","effort":"","tokens":"","outline":[]},{"id":"site-channel-build","n":"AI 帮你做渠道中台","k":"build","lic":"","repo":"","note":"","effort":"2 天","tokens":"约 34 万","outline":["统一订单模型：渠道、承诺时间、菜品映射","接单/拒单/改单动作与超时提醒","每日账单拉取与差异表（订单额 vs 实收）"]}]},{"id":"site.shift","name":"班次与交接","kind":"module","dom":"site","abstract":"开班点备用金、交班点现金、日结对账——钱和货的差，必须在当天说清楚","note":"门店一天至少两次交接（早班→晚班、晚班→闭店）。交接不清，第二天就开始扯皮。三张单：① 开班单（备用金多少、设备是否正常、昨日遗留）；② 交班单（现金实点、移动支付汇总、退款、挂账）；③ 日结单（营业额 - 退款 - 折扣 = 实收，与微信/支付宝/现金三方对）。关键设计：**差异必须写原因**，不能只填一个数。差额 20 块可能是找零错，也可能是漏单。坑：只对总额不对笔数。总额凑巧对上、笔数少一笔，问题被盖住了。","ins":"结构化记录","outs":"结构化记录 + 产物文件 + 界面","pv":[{"id":"self-shift","n":"自建交接班表（含三方对账）","k":"pattern","lic":"—","repo":"","note":"现金/微信/支付宝/银行卡四列，各自「系统金额 vs 实收金额」，差额必填原因；交班人、接班人双签（电子签名或工号）","effort":"","tokens":"","outline":[]},{"id":"wechat-bill","n":"微信支付/支付宝账单下载","k":"commercial","lic":"—","repo":"","note":"对账靠下载账单（CSV）逐笔核，不要靠人看流水；两个平台的退款字段命名不同，映射表要单独维护","effort":"","tokens":"","outline":[]},{"id":"site-shift-build","n":"AI 帮你做日结","k":"build","lic":"","repo":"","note":"","effort":"1 天","tokens":"约 16 万","outline":["开班/交班/日结三张单与差异原因字典","三方支付对账（按笔匹配，标出单边账）","日报：营业额、客单价、退款率、差异率"]}]},{"id":"site.ticket","name":"门票与手环","kind":"module","dom":"site","abstract":"售票、验票、手环充值、场内二次消费——逃票是小事，排队和纠纷才是大事","note":"游乐场的钱有两层：门票（一次性）和场内消费（二次）。手环把两层连起来：进门发一个、里面买吃的刷它、出门退押金。四件事必须清楚：① 票种与场次（全天/夜场/亲子套票）；② 核销（一票一人，防重复入园）；③ 手环余额与押金（可退、可挂失）；④ 免票与优惠（身高、老人、军人）的判定规则。坑：只做「卖票」不做「退票/改期」。下雨天退票量能到三成，没有流程就是现场吵架。","ins":"文本","outs":"结构化记录 + 界面 + 外部动作","pv":[{"id":"self-ticket","n":"自建票务（二维码 + 手环号绑定）","k":"pattern","lic":"—","repo":"","note":"一票一码，核销后置为已用并记时间与闸机号；手环号与票号绑定，丢了能按票号冻结余额","effort":"","tokens":"","outline":[]},{"id":"rfid-wrist","n":"Mifare/NFC 手环 + 读卡器","k":"commercial","lic":"—","repo":"","note":"手环成本 1–3 元，读卡器几百；充值写卡要防复制（用扇区密钥，别用明文 UID）","effort":"","tokens":"","outline":[]},{"id":"ota","n":"OTA 渠道（美团/携程/抖音）","k":"commercial","lic":"—","repo":"","note":"渠道卖出的票要能核销，通常走「券码」接口；各渠道退款规则不同，退票要回到原渠道，不能现场退现金","effort":"","tokens":"","outline":[]},{"id":"site-ticket-build","n":"AI 帮你做票务台","k":"build","lic":"","repo":"","note":"","effort":"2 天","tokens":"约 30 万","outline":["票种/场次/价格表与免票规则引擎","售票页与核销页（扫码 + 手环号）","退改签流程与押金退还，全程留痕"]}]},{"id":"site.gate","name":"闸机与场内设备","kind":"module","dom":"site","abstract":"扫码/刷卡开闸、设备在线状态、远程开闸——闸机连不上，人就堵在门口","note":"闸机是现场最硬的设备：它不认「稍后重试」，只认「开或不开」。所以这一格的重点是**离线授权**：票的有效性在本地缓存一份（当天场次），网络断了照样能验；网络回来再补核销记录。四件事：① 开闸方式（二维码/手环/人脸/人工）；② 防尾随（一人一闸）；③ 设备状态（在线、故障、离线缓存条数）；④ 应急（全断时一键常开 + 人工计数）。坑：把开闸逻辑放在云端。节假日园区网络一抖，几百人堵在门口，这时候再「修服务器」已经晚了。","ins":"结构化记录","outs":"测量读数 + 界面 + 外部动作","pv":[{"id":"zebra-gate","n":"Zebra/中控 闸机 + 二维码读头","k":"commercial","lic":"—","repo":"","note":"工业闸机自带继电器接口与离线白名单；接之前确认通信协议（韦根/RS485/TCP），别买回来发现接不上","effort":"","tokens":"","outline":[]},{"id":"mqtt-gate","n":"MQTT 下发开闸指令","k":"oss","lic":"EPL-2.0","repo":"eclipse/mosquitto","note":"闸机挂 MQTT，服务端发一条消息就开；断网时闸机本地缓存白名单，回网补传开闸记录","effort":"","tokens":"","outline":[]},{"id":"manual","n":"人工通道 + 计数器","k":"pattern","lic":"—","repo":"","note":"所有电子系统都要留一条人工通道：手持计数器 + 纸质票根。大客流时它比任何系统都可靠","effort":"","tokens":"","outline":[]},{"id":"site-gate-build","n":"AI 帮你接闸机","k":"build","lic":"","repo":"","note":"","effort":"1.5 天","tokens":"约 22 万","outline":["开闸协议适配层（继电器/MQTT/串口）","本地白名单缓存与离线核销补传","设备看板：在线率、故障、今日客流曲线"]}]},{"id":"site.safety",    从工作台进来时还没有 hub，塞进去会丢，回来又跳回「全部」。
   （这里不能读 S —— 上面 1000 行处 S 还没定义，会踩 TDZ。） */
let lastSg = "all";
/* 漏一个场景就会「查不到」，所以在启动时对一次账（控制台会报，界面上不吵人） */
(function(){
  const seen = SCAT.reduce((n, g) => n.concat(g.ids), []);
  const miss = SCENES.filter(s => !seen.includes(s.id)).map(s => s.id);
  const ghost = seen.filter(id => !SCENES.some(s => s.id === id));
  if(miss.length || ghost.length) console.warn("[SCAT] 分组与场景不一致", {miss, ghost});
})();

   极简与场景无关（只留地基），中等勾场景包的必装+推荐，齐全把场景包全勾上。 */
function sceneById(id){ return SCENES.find(x => x.id === id) || SCENES[0]; }
function scenePacks(id){ return sceneById(id).packs; }
/* 一个包在本次装配里的「有效等级」：场景把它列为核心、而它本身是可选包时，升一档。
   这样「仓库管理」里的交易包不会被当成可有可无——同一个包在「个人中台」里仍然是可选。 */
function packTierEff(pid){
  const sc = sceneById((S.hub || {}).scene || "hub");
  const core = (sc.must || ["core"]).includes(pid);
  const t = packOf(pid).tier;
  if(core && t === "opt") return "rec";
  return t;
}
function modTierEff(m, sceneId){
  const sc = sceneById(sceneId || (S.hub || {}).scene || "hub");
  /* 只有一种情况会升档：这格所在的某个包被场景列为 must，而那个包本身是可选包。
     不能按「它所有包里最高的一档」算——那样 ai+dev 里的可选模块会被 ai 的推荐档带上来，
     均衡档会莫名多出十几个模块。 */
  const boosted = m.pks.some(pid => packOf(pid).tier === "opt" && (sc.must || []).includes(pid));
  return boosted && m.tier === "opt" ? "rec" : m.tier;
}
/* 场景 + 规格 + 形态 → 默认勾哪些模块。
   简约与场景无关（只留地基），均衡勾场景包的必装+推荐，齐全把场景包全勾上。
   形态在最后一道过滤：CLI 下没有看板、没有主题、没有地图。 */
function defaultMods(sceneId, styId, form){
  const pids = scenePacks(sceneId);
  const f = form || formOf();
  const ok = m => formOk(m, f);
  if(styId === "min") return HUB.filter(m => m.tier === "must" && ok(m)).map(m => m.id);
  if(styId === "mid") return HUB.filter(m => ok(m) && m.pks.some(p => pids.includes(p)) && modTierEff(m, sceneId) !== "opt").map(m => m.id);
  return HUB.filter(m => ok(m) && m.pks.some(p => pids.includes(p))).map(m => m.id);
}
function styCount(styId, sceneId, form){
  const mods = defaultMods(sceneId, styId, form);
  return {n: mods.length, cells: hubCells(mods).length};
}
function modPacks(m){ return m.pks.map(packOf); }

/* ────────── 需求解析（与 arch/match.py 同序） ────────── */
const norm = s => s.toLowerCase().replace(/[\s,，。；;、！!？?（）()【】\[\]「」“”"'—\-]+/g, "");
function hit(t, w){
  w = norm(w);
  let i = t.indexOf(w);
  while(i >= 0){
    const pre = t.slice(Math.max(0, i - 3), i);
    if(!D.neg.some(n => pre.includes(n))) return true;
    i = t.indexOf(w, i + 1);
  }
  return false;
}
/* 硬件格前置并按选型顺序排：用户最关心「这设备怎么做」，先给主控/传感/供电；
   而且从传感开始看，会先挑传感器，然后发现主控得反过来配。软件格按域顺序跟在后面。 */
const HW_ORDER = ["hw.mcu","hw.sense","hw.display","hw.power","hw.wireless",
                  "hw.firmware","hw.pcb","hw.enclosure","hw.gateway","hw.cert"];
function ord(ids){
  const rk = c => { const i = HW_ORDER.indexOf(c); return i < 0 ? 99 : i; };
  const hw = ids.filter(c => c.indexOf("hw.") === 0).sort((x, y) => rk(x) - rk(y));
  const rest = ids.filter(c => c.indexOf("hw.") !== 0)
    .sort((x, y) => D.domOrder.indexOf(byId[x].dom) - D.domOrder.indexOf(byId[y].dom));
  return hw.concat(rest);
}

function matchNeed(need){
  const t = norm(need), score = {}, why = {};
  const add = (cid, w, r) => { if(!byId[cid]) return; score[cid] = (score[cid] || 0) + w; (why[cid] = why[cid] || []).push(r); };
  for(const cid in D.trig){
    const [st, wk] = D.trig[cid];
    const ns = st.filter(w => hit(t, w));
    if(ns.length){ add(cid, 3 * Math.min(ns.length, 3), "命中「" + ns.slice(0, 3).join("、") + "」"); continue; }
    const nw = wk.filter(w => hit(t, w));
    if(nw.length) add(cid, 1, "沾到「" + nw.slice(0, 2).join("、") + "」");
  }
  const scen = [];
  for(const [label, words, mods] of D.scen){
    const ns = words.filter(w => hit(t, w));
    if(!ns.length) continue;
    scen.push(label);
    mods.forEach(c => add(c, 5, "场景「" + label + "」"));
  }
  const prefs = {};
  for(const k in D.cons){ const v = D.cons[k].filter(w => hit(t, w)); if(v.length) prefs[k] = v; }

  let must = [], opt = [];
  for(const cid in score) (score[cid] >= 3 ? must : opt).push(cid);
  const pulled = {}, q = [...must];
  while(q.length){
    const cid = q.shift();
    for(const dep of (D.req[cid] || [])){
      if(must.includes(dep) || !byId[dep]) continue;
      must.push(dep); pulled[dep] = cid; q.push(dep);
    }
  }
  const aiSel = must.some(c => byId[c] && !["app","ai.deliver","ai.model","hw"].includes(byId[c].dom));
  if(aiSel && !must.includes("ai.model.gateway") && byId["ai.model.gateway"]){
    must.push("ai.model.gateway"); pulled["ai.model.gateway"] = "AI 域兜底";
  }
  opt = opt.filter(c => !must.includes(c)).sort((x, y) => score[y] - score[x]);

  const core = [], rec = [];
  const giv = new Set(); must.forEach(c => (W[c] || [null, []])[1].forEach(x => giv.add(x)));
  if(giv.has("R") && !must.includes("app.data") && byId["app.data"]) rec.push("app.data");
  if((giv.has("T") || giv.has("R") || giv.has("F")) && !giv.has("X") && !must.includes("app.ui") && byId["app.ui"]) rec.push("app.ui");
  must.forEach(cid => {
    if(!pulled[cid]) return core.push(cid);
    (cid === "ai.model.gateway" || cid.indexOf("hw.") === 0 ? core : rec).push(cid);
  });
  const scene = opt.filter(c => !rec.includes(c)).slice(0, Math.max(0, 14 - core.length - rec.length));
  const uniq = a => [...new Set(a)];
  const gaps = [];
  D.gap.forEach(([words, name, how]) => { if(words.some(w => hit(t, w))) gaps.push({name, how}); });
  return { core: ord(uniq(core)), rec: ord(uniq(rec)), scene: ord(uniq(scene)), scen, score, why, gaps, prefs };
}

/* ────────── 连通检查 ────────── */
function check(picks, form){
  /* CLI 形态没有图形界面：终端本身就是入口，也是输出。
     所以 X（界面）在这里算「系统天然提供」，R/F（记录与产物）算「打印出来了」。
     不这么特判，任何 CLI 组合都会被判成「缺界面、产出没人接」——那是判据错了，不是方案错了。 */
  const cli = ((form || (S.hub && S.hub.form)) === "cli");
  const ext = cli ? [...D.ext, "X"] : D.ext;
  const term = cli ? ["X", "Q", "E", "S", "R", "F"] : ["X", "Q", "E", "S"];
  const given = {};
  picks.forEach(c => (W[c] || [null, []])[1].forEach(x => (given[x] = given[x] || []).push(c)));
  const breaks = [];
  picks.forEach(cid => {
    if(cid === "app.ui") return;
    (W[cid] || [[], []])[0].forEach(grp => {
      const ok = grp.some(x => ext.includes(x) || (given[x] || []).some(o => o !== cid));
      if(!ok){
        const fix = [];
        grp.forEach(x => (D.patch[x] || []).forEach(p => { if(!picks.includes(p) && byId[p]) fix.push(byId[p].name); }));
        breaks.push({who: byId[cid].name, cid, need: grp.map(x => TC[x]).join("或"), fix: fix.slice(0, 3)});
      }
    });
  });
  const done = new Set(), order = [], placed = new Set();
  let pool = [...picks];
  while(pool.length){
    let ready = pool.filter(cid => {
      // 手工钉的前后关系：网关接的是主控吐出来的数据
      const af = (D.after || {})[cid];
      if(af && picks.indexOf(af) >= 0 && !placed.has(af)) return false;
      return cid === "app.ui" || (W[cid] || [[], []])[0].every(grp => grp.some(x => ext.includes(x) || done.has(x)));
    });
    if(!ready.length){ order.push(...pool); break; }
    const used = cid => {
      const outs = (W[cid] || [null, []])[1].filter(x => !["T","S","E"].includes(x));
      return picks.filter(o => o !== cid && (W[o] || [[], []])[0].some(g => g.some(x => outs.includes(x)))).length;
    };
    ready.sort((x, y) => {
      const hx = x.indexOf("hw.") === 0 ? 0 : 1, hy = y.indexOf("hw.") === 0 ? 0 : 1;
      if (hx !== hy) return hx - hy;
      const a = (W[x] || [[], []])[0].length ? 1 : 0, b = (W[y] || [[], []])[0].length ? 1 : 0;
      if(a !== b) return a - b;
      const d = used(y) - used(x); if(d) return d;
      return D.domOrder.indexOf(byId[x].dom) - D.domOrder.indexOf(byId[y].dom);
    });
    order.push(...ready);
    ready.forEach(c => placed.add(c));
    ready.forEach(c => (W[c] || [null, []])[1].forEach(x => done.add(x)));
    pool = pool.filter(c => !ready.includes(c));
  }
  const dead = [];
  picks.forEach(cid => {
    if(cid.startsWith("ai.deliver") || cid === "app.ui") return;
    const outs = (W[cid] || [null, []])[1];
    /* 只要这一格有「终点型」产出（界面/动作/事件/会话），剩下的中间产物就不算死端：
       全文检索的片段可能没人接，但它的结果本来就摆在界面上给人看 */
    if(outs.some(x => term.includes(x))) return;
    outs.forEach(x => {
      if(!picks.some(o => o !== cid && (W[o] || [[], []])[0].some(g => g.includes(x)))) dead.push({who: byId[cid].name, type: TC[x]});
    });
  });
  const lines = Object.values(given).reduce((n, v) => n + v.length, 0);
  return {breaks, order, lines, dead};
}

/* 存储不可用时（预览面板 iframe 沙箱、隐私模式、file:// 限制）只降级为「不记忆」，
   绝不能把异常抛到点击回调里——否则点卡片的跳转也会被一起吞掉 */
let LSOK = true, MEM = null;
function save(){
  const data = {need:S.need, picks:S.picks, sels:S.sels, hub:S.hub, drafts:S.drafts, pro:S.pro};
  MEM = data;
  const raw = JSON.stringify(data);

  MEM = {need:S.need, picks:S.picks, sels:S.sels, hub:S.hub, drafts:S.drafts, pro:S.pro};
  clearTimeout(_saveT);

function load(){
  let raw = null;
  try{ raw = localStorage.getItem(KEY); }catch(e){ LSOK = false; }
  if(raw == null){
    try{ if(window.name && window.name.indexOf("MOSHAN:") === 0) raw = window.name.slice(7); }catch(e){}
  }
  if(raw == null && MEM) raw = JSON.stringify(MEM);
  try{
    const o = JSON.parse(raw || "{}");
    if(o.need) S.need = o.need;
    if(o.sels) S.sels = o.sels;
    if(o.picks) S.picks = o.picks;
    if(Array.isArray(o.drafts)) S.drafts = o.drafts;
    if(o.hub && o.hub.mods && o.hub.mods.length) S.hub = o.hub;
    if(o.pro) S.pro = true;
  }catch(e){}
}

let CUR = "home";
const FLOW = {
  hub:  [["hub-scene","◧","场景"],["hub-style","◩","形态"],["hub-mods","▤","包"],
         ["hub-plans","◈","方案"],["hub-wire","⌗","连线"],["confirm","✓","确认"],
         ["build","⚙","组装"],["pack","⇩","交付"]],
  need: [["new","＋","写需求"],["plan","◈","选型"],["confirm","✓","确认"],
         ["build","⚙","组装"],["done","✓","完成"]]
};
const FLOWIDX = {
  hub:  {"hub-scene":0, "hub-style":1, "hub-mods":2, "hub-plans":3, "hub-wire":4,
         confirm:5, build:6, done:7, trial:7, pack:7},
  need: {new:0, plan:1, confirm:2, build:3, done:4}
};
function renderNav(name){
  const isHub = !!(S.hub && S.hub.mods.length);
  const list = isHub ? FLOW.hub : FLOW.need;
  const cur = isHub ? FLOWIDX.hub[name] : FLOWIDX.need[name];
  const at = cur == null ? -1 : cur;
  const lbl = $("#flowLbl");
  if(lbl) lbl.textContent = isHub
    ? `当前中台 · ${S.hub.mods.length} 个模块`
    : (S.need ? "当前装配" : "还没有在做的");
  const box = $("#navFlow");
  if(!box) return;
  /* 还没进中台时，留一个「开个中台」入口——不能因为流程合进侧栏就把入口弄丢 */
  const gate = isHub ? "" : `<a href="#/hub-scene" data-nav="hub-scene"><i>▩</i>开个中台</a>`;
  box.innerHTML = gate + list.map(([r, ic, nm], i) => {
    const on = i === at ? " on" : (at > i ? " done" : "");
    return `<a href="#/${r}" data-nav="${r}" class="${on.trim()}"><i>${at > i ? "✓" : ic}</i>${nm}</a>`;
  }).join("");
}

function route(){
  const h = (location.hash || "#/home").replace(/^#\//, "").split("?")[0];
  const name = ROUTES.includes(h) ? h : "home";
  CUR = name;
  const hasHub = !!(S.hub && S.hub.mods.length);
  if(name === "plan" && !S.need && !hasHub){ location.hash = "#/new"; return; }
  if(name === "confirm" && !S.need && !hasHub){ location.hash = "#/new"; return; }
  if((name === "hub-mods" || name === "hub-plans" || name === "hub-wire") && !hasHub){ location.hash = "#/hub-scene"; return; }
  if((name === "trial" || name === "pack") && !hasHub){ location.hash = "#/hub-scene"; return; }
  renderNav(name);
  ({home:viewHome, new:viewNew, plan:viewPlan, confirm:viewConfirm, build:viewBuild, done:viewDone, lib:viewLib,
    "hub-scene":viewHubScene, "hub-style":viewHubStyle, "hub-mods":viewHubMods, "hub-plans":viewHubPlans,
    "hub-wire":viewHubWire, trial:viewTrial, pack:viewPack})[name]();
  $("main").scrollTop = 0;
}
function go(h){ flushSave(); if(location.hash === h) route(); else location.hash = h; }

/* 顶栏 */
/* 顶栏。steps 传数字走默认四步，传字符串则原样用（个人中台那条路是 风格/模块/方案/组装） */
function topbar(crumb, steps, right){
  const names = ["需求", "选型", "确认", "组装"];
  const st = steps == null ? "" : (typeof steps === "string" ? steps : `<div class="steps">` + names.map((n, i) => {
    const cls = i < steps ? "done" : (i === steps ? "on" : "");
    return `<div class="s ${cls}"><em>${i < steps ? "✓" : i + 1}</em>${n}</div>` + (i < 3 ? `<div class="bar"></div>` : "");
  }).join("") + `</div>`);
  /* 只要有活儿在手，每页顶栏都带一个「存草稿」——草稿不是某个页面专属功能 */
  const canDraft = CUR !== "home" && CUR !== "lib" && !!(S.need || (S.hub && S.hub.mods.length));
  const dft = canDraft ? `<button class="btn sm ghost" id="bDraft" title="把当前进度存成草稿，回头接着做">存草稿</button>` : "";
  /* 专业模式：同一页多露一层底层（能力格、吃什么吐什么、接线）。不是另一套页面。 */
  const pro = (CUR !== "home" && CUR !== "lib")
    ? `<button class="btn sm ${S.pro ? "proon" : "ghost"}" id="bPro" title="显示底层：能力格编号、吃什么、吐什么、谁接谁">专业${S.pro ? " ✓" : ""}</button>` : "";
  $("#top").innerHTML = `<div class="crumb">${crumb}</div>${st}<div class="right">${pro}${dft}${right || ""}</div>`;
  const bd = $("#bDraft");
  if(bd) bd.onclick = () => draftBox(bd);
  const bp = $("#bPro");
  if(bp) bp.onclick = () => { S.pro = !S.pro; save(); route(); };
}

/* ────────── 草稿：把当前进度存下来，回头接着做 ────────── */
const ROUTE_NM = {"hub-scene":"场景","hub-style":"形态","hub-mods":"包","hub-plans":"方案","hub-wire":"连线",
                  confirm:"确认", build:"组装", done:"交付", trial:"试用", pack:"打包", new:"需求", plan:"选型", home:"工作台"};
function ago(ts){
  const d = Date.now() - ts;
  if(d < 0 || d < 60000) return "刚刚";
  if(d < 3600000) return Math.floor(d / 60000) + " 分钟前";
  if(d < 86400000) return Math.floor(d / 3600000) + " 小时前";
  if(d < 86400000 * 30) return Math.floor(d / 86400000) + " 天前";
  return new Date(ts).toLocaleDateString("zh-CN", {month:"2-digit", day:"2-digit"});
}
function draftLabel(d){
  const n = (d.hub && d.hub.mods && d.hub.mods.length) || 0;
  if(!n) return `一句话需求 · ${(d.picks || []).length} 格`;
  const sc = SCENES.find(x => x.id === (d.hub.scene || "hub")) || SCENES[0];
  const sty = STYLES.find(x => x.id === d.hub.sty);
  return `${sc.nm}${sty ? " · " + sty.nm : ""} · ${n} 模块 · ${d.picks ? d.picks.length : 0} 格`;
}
function draftDefName(){
  if(S.hub && S.hub.mods.length) return `${hubLabel()} · ${S.hub.mods.length} 模块`;
  return (S.need || "未命名装配").slice(0, 22);
}
function draftBox(btn){
  const isHub = !!(S.hub && S.hub.mods.length);
  const step = ROUTE_NM[CUR] || "—";
  const def = draftDefName();
  modal(`<div class="mh"><b>存草稿</b><button class="x" data-x="1">✕</button></div>
    <div class="mb">
      <div class="kv"><b>内容</b><span>${isHub
        ? `${esc(hubLabel())} · ${S.hub.mods.length} 个模块 · ${S.picks.length} 格`
        : esc((S.need || "").slice(0, 40) || "空")}</span></div>
      <div class="kv"><b>进度</b><span>停在「${step}」，恢复后从这里接着做</span></div>
      <div style="margin-top:14px">
        <div style="font-size:12px;color:var(--dim);margin-bottom:6px">给这份草稿起个名字</div>
        <input class="inp" id="dName" value="${esc(def)}" maxlength="40" placeholder="例如：我的工作台中台">
      </div>
      <p style="color:var(--faint);font-size:11.5px;line-height:1.7;margin-top:10px">
        草稿存在这台电脑的浏览器里，换设备、清缓存会丢。同名再存会覆盖旧的。</p>
    </div>`,
    `<button class="btn" data-x="1">取消</button><button class="btn primary" id="dSave">保存草稿</button>`);
  $("#modal").querySelectorAll("[data-x]").forEach(x => x.onclick = closeModal);
  const inp = $("#dName");
  inp.focus(); inp.select();
  inp.addEventListener("keydown", e => { if(e.key === "Enter") $("#dSave").click(); });
  $("#dSave").onclick = () => {
    const nm = (inp.value || "").trim() || def;
    const hit = draftSave(nm);
    closeModal();
    toast(hit ? "已更新草稿「" + nm + "」" : "已存草稿「" + nm + "」");
    if(btn){ btn.textContent = "已存 ✓"; setTimeout(() => { btn.textContent = "存草稿"; }, 1600); }
  };
}
function draftSave(nm){
  const snap = {
    id: "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
    nm,
    kind: (S.hub && S.hub.mods.length) ? "hub" : "need",
    at: Date.now(),
    route: "#/" + CUR,
    need: S.need,
    picks: [...S.picks],
    sels: JSON.parse(JSON.stringify(S.sels || {})),
    hub: S.hub ? JSON.parse(JSON.stringify(S.hub)) : null
  };
  const i = S.drafts.findIndex(d => d.nm === nm);
  if(i >= 0){ snap.id = S.drafts[i].id; S.drafts[i] = snap; }
  else S.drafts.unshift(snap);
  S.drafts.sort((a, b) => b.at - a.at);
  save();
  return i >= 0;
}
function draftOpen(id){
  const d = S.drafts.find(x => x.id === id);
  if(!d) return toast("草稿不见了，刷新看看");
  S.build = null;
  S.need = d.need || "";
  S.sels = JSON.parse(JSON.stringify(d.sels || {}));
  S.hub = d.hub ? JSON.parse(JSON.stringify(d.hub)) : null;
  S.picks = [...(d.picks || [])];
  const isHub = !!(S.hub && S.hub.mods.length);
  if(isHub){ S.cov = hubCov(); if(!S.picks.length) S.picks = hubCells(S.hub.mods); }
  else if(S.need){ S.cov = matchNeed(S.need); }
  save();
  /* 组装/交付那两步的运行时状态存不进草稿，所以退回到「试用」重开一次——
     试用用的就是打包出去的那份文档，打开就能点，比回到确认清单更有用。 */
  let to = d.route || (isHub ? "#/hub-mods" : "#/plan");
  if(to === "#/build" || to === "#/done") to = isHub ? "#/trial" : "#/confirm";
  if(to === "#/trial" || to === "#/pack"){ if(!isHub) to = "#/confirm"; }
  toast(`已恢复「${d.nm}」`);
  go(to);
}
function draftDel(id){
  const d = S.drafts.find(x => x.id === id);
  if(!d) return;
  S.drafts = S.drafts.filter(x => x.id !== id);
  save(); route(); toast("已删除草稿");
}
/* 导出一份文件带走：换电脑、清缓存、或者从预览面板里搬出来时用 */
function draftExport(){
  if(!S.drafts.length) return toast("还没有草稿可导出");
  const blob = new Blob([JSON.stringify({v:1, at:Date.now(), drafts:S.drafts}, null, 2)],
                        {type:"application/json;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "墨山草稿.json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1200);
  toast("已导出 " + S.drafts.length + " 份草稿");
}
function draftImport(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if(!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      let o;
      try{ o = JSON.parse(String(fr.result)); }catch(e){ return toast("这个文件读不出 JSON"); }
      const arr = Array.isArray(o) ? o : (o && o.drafts);
      if(!Array.isArray(arr) || !arr.length) return toast("文件里没有草稿");
      let add = 0, upd = 0;
      arr.forEach(d => {
        if(!d || !d.nm) return;
        const rec = {
          id: d.id || ("d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5)),
          nm: d.nm, kind: d.kind || ((d.hub && d.hub.mods) ? "hub" : "need"),
          at: d.at || Date.now(), route: d.route || "#/plan",
          need: d.need || "", picks: d.picks || [], sels: d.sels || {}, hub: d.hub || null
        };
        const i = S.drafts.findIndex(x => x.nm === rec.nm);
        if(i >= 0){ rec.id = S.drafts[i].id; S.drafts[i] = rec; upd++; }
        else { S.drafts.unshift(rec); add++; }
      });
      S.drafts.sort((a, b) => b.at - a.at);
      save(); route();
      toast("导入 " + add + " 份" + (upd ? "，覆盖 " + upd + " 份同名" : ""));
    };
    fr.readAsText(f);
  };
  inp.click();
}

    停在试用/打包那两步的草稿，点开就直接回到试用页，里面点过的东西也还在。</div>`;
  $("#view").innerHTML = `<div class="page">
    <div class="pagehd">
      <div><h1>工作台</h1><p>${S.projects.length} 个装配项目 · ${drafts.length
        ? drafts.length + " 份草稿没做完" : "做不完可以随时存草稿"}</p></div>
      <div class="right"><button class="btn" id="bLib">浏览模块库</button><button class="btn primary" id="bNew2">＋ 新建装配</button></div>
    </div>
    <div class="starts">
      <div class="start hero" id="bHub" role="button" tabindex="0" aria-label="开始装配：从 20 个场景里挑一个">
        <div class="ic a">${art("shell", 30)}</div>
        <div class="hx">
          <span class="kick">从这里开始</span>
          <b>装一个自己用的东西</b>
          <p>${SCENES.length} 个场景 · ${PACKS.length} 个包 · ${HUB.length} 个模块。

        </div>
        <span class="go" aria-hidden="true">开始装配 <em>→</em></span>
      </div>
      <div class="start" id="bAsk" role="button" tabindex="0" aria-label="从一句话需求开始">
        <div class="ic b">${art("ai", 26)}</div>
        <div class="hx"><b>从一句话需求开始</b>
          <p>写清「拿什么进来、变成什么出去」，系统反推要哪些能力格</p></div>

    S.cov = matchNeed(p.need);
    S.picks = [...S.cov.core, ...S.cov.rec];
    S.sels = {};
    save(); go("#/plan");
  };
  $("#bNew").onclick = $("#bNew2").onclick = () => { S.need = ""; go("#/new"); };
  $("#bHub").onclick = () => { S.hub = null; go("#/hub-scene"); };
  $("#bHub").onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); S.hub = null; go("#/hub-scene"); } };
  $("#bAsk").onclick = () => { S.need = ""; go("#/new"); };
  $("#bLib").onclick = $("#bLib2").onclick = () => go("#/lib");
  /* 草稿箱：整行可点，按钮独立，删除要确认 */
  const delDraft = id => {
    const d = S.drafts.find(x => x.id === id);
    if(!d) return;
    modal(`<div class="mh"><b>删掉这份草稿？</b><button class="x" data-x="1">✕</button></div>
      <div class="mb"><p style="margin:0">「${esc(d.nm)}」和它记住的进度都会消失，删了找不回来。</p></div>`,
      `<button class="btn" data-x="1">先留着</button><button class="btn danger" id="dDel2">删除</button>`);
    $("#modal").querySelectorAll("[data-x]").forEach(x => x.onclick = closeModal);
    $("#dDel2").onclick = () => { closeModal(); draftDel(id); };
  };
  document.querySelectorAll("[data-dopen]").forEach(b => b.onclick = e => {
    e.stopPropagation(); draftOpen(b.dataset.dopen);
  });
  $("#bDftExp").onclick = draftExport;
  $("#bDftImp").onclick = draftImport;
  document.querySelectorAll("[data-ddel]").forEach(b => b.onclick = e => {
    e.stopPropagation(); delDraft(b.dataset.ddel);
  });
  document.querySelectorAll("[data-dft]").forEach(n => {
    n.onclick = e => { if(!e.target.closest("button")) draftOpen(n.dataset.dft); };
    n.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); draftOpen(n.dataset.dft); } };
  });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const p = S.projects.find(x => x.id === b.dataset.del);

      <div class="mb"><p style="margin:0">「${esc(p.name)}」会从列表里移除。这是原型，刷新页面就回来了。</p></div>`,
      `<button class="btn" data-x="1">取消</button><button class="btn danger" id="bDel">删除</button>`);
    $("#modal").querySelectorAll("[data-x]").forEach(x => x.onclick = closeModal);
    $("#bDel").onclick = () => {
      S.projects = S.projects.filter(x => x.id !== p.id);
      closeModal(); route(); toast("已删除");

  });
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = e => { e.stopPropagation(); open(b.dataset.open); });
  document.querySelectorAll(".proj").forEach(c => {
    c.onclick = () => open(c.dataset.pid);
    c.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); open(c.dataset.pid); } };
  });
}

/* ────────── 视图：需求 ────────── */
function viewNew(){

/* ────────── 视图：个人中台 ────────── */
function hubSteps(n){
  const names = ["场景", "形态", "包", "方案", "连线", "确认", "组装", "交付"];
  return `<div class="hubstep" style="margin-left:14px">` + names.map((x, i) => {
    const cls = i < n ? "done" : (i === n ? "on" : "");
    return `<div class="s ${cls}"><em>${i < n ? "✓" : i + 1}</em>${x}</div>` +
           (i < names.length - 1 ? `<div class="b"></div>` : "");
  }).join("") + `</div>`;
}
function hubCov(){
  /* 分组按「包」的等级走：包是必装，里面的格就是地基；包可选，就是场景格。
     多包时按最靠前的一档算——一格只要有一个包是必装，它就是地基。 */
  const rk = {must:0, rec:1, opt:2};
  const bestTier = m => m.pks.reduce((acc, pid) => {
    const t = packTierEff(pid);
    return rk[t] < rk[acc] ? t : acc;
  }, "opt");
  const pick = t => hubCells(S.hub.mods.filter(id => {
    const m = hubMod(id);
    return m && bestTier(m) === t;
  }));
  return {core: pick("must"), rec: pick("rec"), scene: pick("opt"), gaps: [], hits: {}};
}
function hubStyleName(){ const s = STYLES.find(x => x.id === (S.hub || {}).sty); return s ? s.nm : "自定义"; }
function hubLabel(){
  return sceneName() + " · " + formDef().nm + " · " + hubStyleName();
}

/* 建一份新的中台状态：形态/规格/平台/动效/预算都带着走，只重算模块 */
function hubNew(sceneId, styId, extra){
  const open = S.hub || {};
  const o = {
    scene: sceneId,
    sty: styId || open.sty || "mid",
    form: open.form || "app",
    plat: (open.plat || ["mac","win"]).slice(),
    anim: open.anim || "lego",
    mem: open.mem || 16,
    model: open.model || "qwen2.5:3b",
    min: !!open.min,
    sg: open.sg || "all",
    plans: open.plans || {}, glue: open.glue || {}, base: open.base || {}
  };
  Object.assign(o, extra || {});
  o.mods = defaultMods(sceneId, o.sty, o.form);
  return o;
}

/* 包与模块：按包成组。包有颜色、有全选；模块跟着包上色，一眼能分开 */
function viewHubMods(){
  /* 中台的能力格永远由模块摊开决定：进这一页就重算，免得把上一次「一句话需求」的格串进来 */
  S.picks = hubCells(S.hub.mods); S.cov = null;
  S.hub.plans = S.hub.plans || {};
  S.hub.mods.forEach(id => {
    const m = hubMod(id);
    if(m && !S.hub.plans[id]) S.hub.plans[id] = (m.provs.find(p => p.lv === "rec") || m.provs[0]).id;
  });
  const sc = sceneById(S.hub.scene), form = formOf();
  const inScene = pid => sc.packs.includes(pid);
  const seen = new Set();
  const order = [...sc.packs.map(packOf), ...PACKS].filter(p => !seen.has(p.id) && seen.add(p.id));
  topbar(`工作台 <span>/</span> <b>${esc(sc.nm)}</b>`, hubSteps(2),
    `<button class="btn sm ghost" id="bSty">换形态/规格</button>
     <button class="btn sm ghost" id="bHome2">返回工作台</button>`);
  const warn = () => {
    const lost = HUB.filter(m => m.tier === "must" && modTierEff(m, sc.id) === "must" && !S.hub.mods.includes(m.id));
    return lost.length ? `<div class="warnbox">⚠ 你叉掉了地基：<b>${lost.map(m => esc(m.nm)).join("、")}</b>。
      界面或数据会缺一块——不会报错，但装出来是半成品。</div>` : "";
  };
  /* 一格可能同时属于几个包：卡片上标出来，免得用户在两个包里看到同一个模块以为是两个 */
  const otherPacks = (m, pid) => m.pks.filter(x => x !== pid).map(x => packOf(x).nm);
  const proWrap = m => !S.pro ? "" : `<div class="proline">${m.cells.map(c => {

    const on = S.hub.mods.includes(m.id);
