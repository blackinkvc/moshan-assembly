<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>墨山 · 装配台</title>
<style>
  :root{
    --bg:#fbfbfa; --panel:#fff; --side:#f7f6f2; --line:#e6e4df; --line2:#efedE8;
    --ink:#1d1d1b; --dim:#6b6a66; --faint:#a3a099; --soft:#f4f2ee;
    --brand:#3c3a35; --green:#2f6f4e; --red:#b3261e; --amber:#8a6d1f;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer}
  a{color:inherit;text-decoration:none}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  /* ── 外壳 ── */
  .app{display:grid;grid-template-columns:208px minmax(0,1fr);height:100vh}
  aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px}
  .logo{display:flex;align-items:center;gap:8px;padding:2px 8px 16px}
  .logo i{width:22px;height:22px;border-radius:6px;background:var(--brand);display:grid;place-items:center;
    color:#fff;font-style:normal;font-size:12px;font-weight:700}
  .logo b{font-size:14px;font-weight:640;letter-spacing:.3px}
  .logo span{font-size:11px;color:var(--faint);margin-left:2px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav #navFlow{display:flex;flex-direction:column;gap:2px;min-width:0}
  .nav a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;font-size:13px;color:#4a4944}
  .nav a:hover{background:#eeece6}
  .nav a.on{background:#e9e6de;color:var(--ink);font-weight:600}
  .nav a i{font-style:normal;width:15px;text-align:center;color:var(--faint);font-size:13px}
  .nav a.on i{color:var(--brand)}
  .nav .lbl{font-size:11px;color:var(--faint);padding:16px 10px 6px;letter-spacing:.5px}
  .sidefoot{margin-top:auto;padding:10px 8px 2px;font-size:11.5px;color:var(--faint);line-height:1.7}

  main{overflow:auto;min-width:0}
  .top{position:sticky;top:0;z-index:20;background:rgba(251,251,250,.92);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);padding:0 28px;height:52px;display:flex;align-items:center;gap:14px}
  .crumb{font-size:12.5px;color:var(--faint);display:flex;align-items:center;gap:7px}
  .crumb b{color:var(--ink);font-weight:600}
  .top .right{margin-left:auto;display:flex;gap:8px;align-items:center;
    /* 右侧按钮不参与收缩：一收缩「专业」「存草稿」就变成一个字一行 */
    flex:0 0 auto;white-space:nowrap}

  /* 步骤条 */
  .steps{display:flex;align-items:center;gap:0;font-size:12px;color:var(--faint)}
  .steps .s{display:flex;align-items:center;gap:6px;padding:0 4px}
  .steps .s em{font-style:normal;width:17px;height:17px;border-radius:50%;border:1px solid var(--line);
    background:#fff;display:grid;place-items:center;font-size:10.5px;color:var(--faint)}
  .steps .s.on{color:var(--ink);font-weight:600}
  .steps .s.on em{background:var(--brand);border-color:var(--brand);color:#fff}
  .steps .s.done em{background:#eef6f1;border-color:#bcd8c8;color:var(--green)}
  .steps .bar{width:22px;height:1px;background:var(--line)}

  /* ── 通用 ── */
  .page{padding:26px 28px 70px;max-width:1180px}
  .pagehd{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
  .pagehd h1{margin:0;font-size:20px;font-weight:650;letter-spacing:.2px}
  .pagehd p{margin:4px 0 0;font-size:12.5px;color:var(--dim)}
  .pagehd .right{margin-left:auto;display:flex;gap:8px;flex:0 0 auto;
    flex-wrap:wrap;justify-content:flex-end}

  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 13px;font-size:13px;
    display:inline-flex;align-items:center;gap:6px;transition:.12s}
  .btn:hover{background:var(--soft);border-color:#d5d1c7}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:#2b2a26}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--dim)}
  .btn.ghost:hover{background:var(--soft);color:var(--ink)}
  .btn.danger{color:var(--red);border-color:#e8c3bf;background:#fdf6f5}
  .btn.danger:hover{background:#fbeeec}
  .btn.sm{padding:3px 9px;font-size:12px;border-radius:6px}
  .btn.lg{padding:9px 20px;font-size:14px;border-radius:9px}
  /* 一步到底的那种按钮：这一页唯一「不用想」的出口，得让人一眼看见 */
  .btn.xl{padding:12px 26px;font-size:15px;font-weight:560;border-radius:10px;letter-spacing:.2px}
  .btn:disabled{opacity:.45;cursor:not-allowed;background:#f6f5f2}
  .btn.icon{padding:4px 7px}
  .recbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:14px 18px;margin:0 0 18px;border:1px solid var(--line);border-radius:12px;
    background:linear-gradient(180deg,#fff,#fbfaf6)}
  .recbar .rb{min-width:220px;flex:1 1 320px}
  .recbar .rb b{display:block;font-size:13.5px;font-weight:640;margin-bottom:3px}
  .recbar .rb span{font-size:12px;color:var(--dim);line-height:1.7}
  .recbar .btn{flex:0 0 auto}
  @media(max-width:700px){ .recbar .btn{width:100%;justify-content:center} }

  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px}
  .box{padding:14px 16px}
  .bh{font-size:12.5px;font-weight:640;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .bh .sp{margin-left:auto;font-weight:400;font-size:11.5px;color:var(--faint)}
  .badge{font-size:11.5px;border-radius:20px;padding:1px 9px;border:1px solid;font-weight:400;
    white-space:nowrap}
  .badge.ok{color:var(--green);border-color:#bcd8c8;background:#eef6f1}
  .badge.bad{color:var(--red);border-color:#e8c3bf;background:#fcf0ef}
  .badge.warn{color:#8a4a12;border-color:#f0e0c6;background:#fdf6ec}
  .badge.mute{color:var(--dim);border-color:var(--line);background:#faf9f7}
  .muted{color:var(--dim)}
  .faint{color:var(--faint)}
  .warnbox{font-size:12.5px;color:#8a4a12;background:#fdf6ec;border:1px solid #f0e0c6;border-radius:8px;padding:8px 10px;margin:7px 0}
  .brk{border-left:2px solid #e8c3bf;padding:1px 0 1px 10px;margin:9px 0;font-size:12.5px}
  .brk .fix{color:var(--dim);font-size:12px;margin-top:2px}
  .brk .fix em{font-style:normal;color:var(--green)}

  /* ── 工作台 ── */
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .proj{padding:16px;display:flex;flex-direction:column;gap:9px;transition:.15s;cursor:pointer}
  .proj:hover{border-color:#d5d1c7;box-shadow:0 6px 18px rgba(0,0,0,.045)}
  .proj h3{margin:0;font-size:14.5px;font-weight:620;display:flex;align-items:center;gap:8px}
  .proj .q{font-size:12px;color:var(--dim);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden;min-height:38px}
  .proj .foot{display:flex;align-items:center;gap:8px;margin-top:2px;font-size:11.5px;color:var(--faint)}
  .proj .foot .btn{margin-left:auto}
  .bar{height:4px;border-radius:3px;background:var(--soft);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--brand);border-radius:3px}
  .bar i.g{background:var(--green)}

  /* ── 需求页 ── */
  .askwrap{max-width:760px}
  .askwrap h1{font-size:26px;margin:8px 0 6px;font-weight:650;letter-spacing:.2px}
  .askwrap .sub{color:var(--dim);font-size:13.5px;margin:0 0 20px}
  textarea{width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);border-radius:10px;
    padding:13px 15px;font:14px/1.7 inherit;background:#fff;outline:none;color:var(--ink)}
  textarea:focus{border-color:#b9b5ab;box-shadow:0 0 0 3px #f0eee8}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 0}
  .chip{font-size:12px;border:1px dashed #ddd9cd;border-radius:20px;padding:3px 11px;color:var(--dim);background:#fff;cursor:pointer}
  .chip:hover{color:var(--ink);border-color:#c9c3b3;background:#fdfcfa}
  .askfoot{display:flex;align-items:center;gap:10px;margin-top:18px}
  .askfoot .faint{font-size:11.5px}
  .tips{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:12.5px;color:var(--dim);line-height:1.85}
  .tips b{color:var(--ink)}

  /* ── 选型页 ── */
  .planwrap{display:grid;grid-template-columns:minmax(0,1fr) 344px;gap:20px;align-items:start}
  .needbar{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;margin-bottom:14px}
  .needbar .q{font-size:13.5px;line-height:1.65;flex:1}
  .needbar .q em{font-style:normal;color:var(--faint);font-size:12px;display:block;margin-bottom:2px}
  .toolbar{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:12.5px;color:var(--dim)}
  .toolbar .k{display:flex;gap:14px;margin-right:auto}
  .toolbar .k span b{color:var(--ink)}

  .group{margin-bottom:18px}
  .gt{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:12.5px;font-weight:640}
  .gt .dot{width:7px;height:7px;border-radius:50%}
  .gt i{font-style:normal;font-weight:400;font-size:11.5px;color:var(--faint)}
  .mod{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:7px;
    display:grid;grid-template-columns:20px minmax(0,1fr);gap:9px;transition:.15s}
  .mod:hover{border-color:#d5d1c7}
  .mod.off{background:#faf9f6;opacity:.6}
  .mod input{margin:3px 0 0;width:15px;height:15px;accent-color:#3c3a35}
  .mod .h{display:flex;align-items:baseline;gap:7px}
  .mod .nm{font-weight:620;font-size:13.5px}
  .mod .cid{font:10.5px/1 ui-monospace,Menlo,monospace;color:#b3b0a7}
  .mod .lk{margin-left:auto;font-size:11.5px;color:var(--faint);border-bottom:1px dashed #d8d4c9;cursor:pointer;white-space:nowrap;flex:0 0 auto}
  .mod .lk:hover{color:var(--ink)}
  .mod .ab{font-size:12.5px;color:#4a4944;margin-top:1px}
  .mod .io{font-size:11.5px;color:var(--dim);margin-top:4px}
  .mod .io b{font-weight:500;color:#57554f}
  .pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  .pill{font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:1px 8px;color:#4a4944;background:#fff;cursor:pointer}
  .pill:hover{border-color:#c3bfb4}
  .pill.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .pill.on i{color:#c8c4ba}
  .pill i{font-style:normal;color:#a3a099;margin-left:4px;font-size:10px}
  .pill.more{color:var(--faint);border-style:dashed;cursor:default}

  aside.right{position:sticky;top:68px;display:flex;flex-direction:column;gap:11px}
  ol.seq{margin:0;padding-left:19px;font-size:12.5px}
  ol.seq li{margin:3px 0}
  ol.seq li small{color:#b3b0a7;font-size:10.5px;margin-left:5px;font-family:ui-monospace,Menlo,monospace}
  .gapbox{font-size:12px;color:#8a4a12;background:#fdf6ec;border:1px solid #f0e0c6;border-radius:8px;padding:8px 10px;margin-top:6px}
  .cta{display:flex;flex-direction:column;gap:7px}
  .cta .hint{font-size:11.5px;color:var(--faint);text-align:center}

  /* ── 确认页 ── */
  .conf{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
  th{font-size:11.5px;color:var(--dim);font-weight:600;background:#faf9f7;border-top:1px solid var(--line)}
  tr:last-child td{border-bottom:none}
  td.nm{font-weight:600}
  td .sub{color:var(--faint);font-size:11px;font-family:ui-monospace,Menlo,monospace}
  .stat{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
  .stat div{background:#fff;padding:12px 14px}
  .stat b{display:block;font-size:20px;font-weight:640;line-height:1.2}
  .stat span{font-size:11.5px;color:var(--dim)}
  .stat b.g{color:var(--green)} .stat b.a{color:var(--amber)} .stat b.r{color:var(--red)}

  /* ── 组装页 ── */
  .buildwrap{max-width:820px;margin:0 auto;padding:34px 28px}
  .ring{width:132px;height:132px;position:relative;margin:0 auto 6px}
  .ring svg{transform:rotate(-90deg)}
  .ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
  .ring .c b{font-size:24px;font-weight:650;letter-spacing:-.5px}
  .ring .c span{font-size:11px;color:var(--faint)}
  .stage{display:flex;justify-content:center;gap:0;margin:16px 0 22px}
  .stage .s{font-size:11.5px;color:var(--faint);padding:0 12px;position:relative;display:flex;align-items:center;gap:5px}
  .stage .s:after{content:"";position:absolute;right:-3px;width:6px;height:1px;background:var(--line)}
  .stage .s:last-child:after{display:none}
  .stage .s i{width:6px;height:6px;border-radius:50%;background:#dcd8cd}
  .stage .s.on{color:var(--ink);font-weight:600}
  .stage .s.on i{background:var(--brand)}
  .stage .s.done i{background:var(--green)}
  .log{background:#faf9f7;border:1px solid var(--line);border-radius:10px;padding:12px 14px;height:246px;
    overflow:auto;font:12px/1.95 ui-monospace,Menlo,monospace;color:#4a4944}
  .log div{white-space:pre-wrap}
  .log .t{color:#b3b0a7}
  .log .ok{color:var(--green)}
  .log .now{color:var(--ink);font-weight:600}
  .log .dim{color:var(--dim)}
  .buildbar{display:flex;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap}
  .buildbar .back{margin-right:auto}

  /* ── 完成页 ── */
  /* 注意：完成页容器不能叫 .done —— 阶段条里「已完成的步骤」也是 .s.done，
     两者一撞，max-width + margin:0 auto 会把阶段条上的项撑成居中块（真踩过） */
  .donewrap{max-width:760px;margin:0 auto;padding:44px 28px;text-align:center}
  .donewrap .tick{width:56px;height:56px;border-radius:50%;background:#eef6f1;border:1px solid #bcd8c8;
    display:grid;place-items:center;margin:0 auto 14px;color:var(--green);font-size:26px}
  .donewrap h1{margin:0;font-size:22px;font-weight:650}
  .donewrap p{margin:6px 0 0;color:var(--dim);font-size:13px}
  .tree{text-align:left;background:#faf9f7;border:1px solid var(--line);border-radius:10px;padding:13px 16px;
    margin:22px 0;font:12px/1.95 ui-monospace,Menlo,monospace;color:#4a4944;white-space:pre;overflow:auto}
  .tree .d{color:var(--brand);font-weight:600}
  .tree .m{color:var(--faint)}
  .donebtns{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}

  /* ── 试用 / 打包 ── */
  .trialbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .trialbox{display:block;width:100%;height:640px;border:1px solid var(--line);border-radius:12px;
    background:#f4f3ef;box-shadow:0 1px 0 #fff inset}
  .packlist{background:#faf9f7;border:1px solid var(--line);border-radius:10px;padding:4px 0;margin:14px 0;
    font:12px/1.9 ui-monospace,Menlo,monospace;overflow:auto}
  .packlist .row{display:flex;gap:10px;padding:5px 14px;border-bottom:1px solid var(--line2)}
  .packlist .row:last-child{border-bottom:0}
  .packlist .row b{font-weight:600;color:var(--ink);min-width:130px}
  .packlist .row span{color:var(--dim);font-family:inherit}
  @media(max-width:720px){.trialbox{height:540px}}

  /* ── 库 ── */
  .libbar{display:flex;gap:9px;align-items:center;margin-bottom:16px}
  input.search{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:13px inherit;outline:none;background:#fff}
  input.search:focus{border-color:#b9b5ab;box-shadow:0 0 0 3px #f0eee8}
  .libdom{margin-bottom:18px}
  .librow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .libitem{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 12px;cursor:pointer}
  .libitem:hover{border-color:#d5d1c7}
  .libitem b{font-size:13px;font-weight:600}
  .libitem .cid{font:10.5px/1 ui-monospace,Menlo,monospace;color:#b3b0a7;margin-left:6px}
  .libitem p{margin:2px 0 0;font-size:11.5px;color:var(--dim);line-height:1.55}

  /* ── 弹窗 / toast ── */
  .mask{position:fixed;inset:0;background:rgba(20,20,18,.28);display:grid;place-items:center;z-index:80;padding:24px}
  .modal{background:#fff;border-radius:13px;max-width:640px;width:100%;max-height:84vh;display:flex;flex-direction:column;
    box-shadow:0 24px 70px rgba(0,0,0,.18);overflow:hidden}
  .modal .mh{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .modal .mh b{font-size:14.5px;font-weight:640}
  .modal .mh .x{margin-left:auto;border:0;background:transparent;color:var(--faint);font-size:17px;line-height:1;padding:2px 5px;border-radius:5px}
  .modal .mh .x:hover{background:var(--soft);color:var(--ink)}
  .modal .mb{padding:16px 18px;overflow:auto}
  .modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#fcfbf9}
  .modal p{margin:8px 0;font-size:13px;line-height:1.75}
  .modal .kv{display:flex;gap:8px;font-size:12px;color:var(--dim);margin:3px 0}
  .modal .kv b{color:var(--ink);font-weight:500;min-width:52px;flex:0 0 auto}
  .pvrow{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin:7px 0}
  .pvrow.on{border-color:var(--brand);background:#fcfbf9}
  .pvrow .h{display:flex;align-items:center;gap:8px}
  .pvrow .h b{font-size:13px}
  .pvrow p{margin:4px 0 0;font-size:12px;color:var(--dim)}
  .pvrow ul{margin:5px 0 0;padding-left:16px;font-size:12px;color:var(--dim);line-height:1.7}
  #toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:#2b2a26;color:#fff;
    font-size:12.5px;padding:8px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:.22s;z-index:99}
  #toast.on{opacity:1;transform:translate(-50%,0)}

  .empty{color:var(--faint);font-size:12.5px}
  .mobar{display:none}
  @media(max-width:1080px){
    .mobar{display:flex;position:sticky;bottom:0;z-index:15;align-items:center;gap:10px;
      background:rgba(251,251,250,.95);backdrop-filter:blur(6px);border-top:1px solid var(--line);
      padding:9px 14px;margin:0 -14px}
  }
  .feed div{font-size:12.5px;color:#3a3934;padding:5px 0;border-bottom:1px dashed var(--line2)}
  .feed div:last-child{border-bottom:0}
  .feed .t{color:var(--faint);font-size:11.5px;margin-right:9px;font-family:ui-monospace,Menlo,monospace}
  .mini div{display:flex;align-items:center;font-size:12.5px;color:#3a3934;padding:4px 0}
  .mini div span{flex:1}
  .mini div i{font-style:normal;color:var(--faint);font-size:11.5px}
  @media(max-width:1080px){.page>div[style*="grid-template-columns:minmax(0,1fr) 320px"]{grid-template-columns:1fr!important}}
  @media(max-width:1080px){
    .planwrap,.conf{grid-template-columns:1fr}
    aside.right{position:static}
    .grid3{grid-template-columns:1fr}
    .librow{grid-template-columns:1fr}
  }
  @media(max-width:820px){
    .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
    aside{flex-direction:row;align-items:center;gap:6px;border-right:0;border-bottom:1px solid var(--line);
      padding:7px 12px;overflow-x:auto}
    .logo{padding:0 10px 0 0}
    .logo b{display:none}
    .logo span{display:none}
    /* 横排时 nav 不能被压缩：flex-shrink 会把每个入口挤到一个字宽，中文就竖排了 */
    .nav{flex-direction:row;gap:2px;flex:0 0 auto}
    .nav #navFlow{flex-direction:row;gap:2px;flex:0 0 auto}
    .nav a{white-space:nowrap;flex:0 0 auto}
    .nav .lbl{display:none}
    .sidefoot{display:none}
    .top{padding:0 14px;height:46px;gap:8px}
    /* crumb 本身是 flex，text-overflow 对它无效——会把场景名硬切一半。
       要让里面的 b 去省略，才出得来「仓库管理…」 */
    .top .crumb{white-space:nowrap;overflow:hidden;min-width:0}
    .top .crumb b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
    .top .right{flex:0 0 auto;white-space:nowrap;display:flex;gap:7px}
    .steps{display:none}
    .top .hubstep{display:none}
    .page{padding:18px 14px 60px}
    .pagehd{flex-wrap:wrap}
  }
  /* ── 个人中台：风格 / 模块 / 方案 ── */
  .hubstep{display:flex;align-items:center;gap:0;font-size:12px;color:var(--faint)}
  .hubstep .s{display:flex;align-items:center;gap:6px}
  /* 顶栏里这三样都不能被压成竖排：中文在 flex 收缩时会一个字一行。
     桌面端也要 nowrap —— 面包屑变长（「芯片 EDA 设计台」）以后 1280 就开始挤。 */
  .top .crumb,.top .hubstep,.top .hubstep .s{white-space:nowrap}
  .top .hubstep{flex:0 1 auto;min-width:0;overflow:hidden}
  .top .crumb{min-width:0;overflow:hidden}
  .top .crumb b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  /* 1240 以下步骤条只留序号圆点：八步的文字加起来比面包屑还宽，先砍它 */
  @media(max-width:1240px){
    .top .hubstep .s{font-size:0}
    .top .hubstep .s em{font-size:10px}
    .top .hubstep .b{margin:0 3px;width:12px}
  }
  .hubstep .s em{font-style:normal;width:17px;height:17px;border-radius:50%;border:1px solid var(--line);
    background:#fff;display:grid;place-items:center;font-size:10.5px;color:var(--faint)}
  .hubstep .s.on{color:var(--ink);font-weight:600}
  .hubstep .s.on em{background:var(--brand);border-color:var(--brand);color:#fff}
  .hubstep .s.done em{background:#eef6f1;border-color:#bcd8c8;color:var(--green)}
  .hubstep .b{width:20px;height:1px;background:var(--line);margin:0 6px}

  .styles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .sty{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;
    transition:.16s;display:flex;flex-direction:column;gap:9px}
  .sty:hover{border-color:#cfcabd;box-shadow:0 8px 22px rgba(0,0,0,.06);transform:translateY(-1px)}
  .sty.on{border-color:var(--brand);box-shadow:0 0 0 2px #eceae4}
  .sty .nm{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:640}
  .sty .nm .n{margin-left:auto;font-size:11.5px;color:var(--faint);font-weight:400}
  .sty .d{font-size:12.5px;color:var(--dim);line-height:1.7;min-height:44px}
  .sty .keep{font-size:11.5px;color:#4a4944;background:#faf9f7;border:1px dashed var(--line);
    border-radius:7px;padding:7px 9px;line-height:1.65}
  .sty .keep b{color:var(--ink);font-weight:600}
  .sty svg{display:block;width:100%;height:auto;border-radius:8px;background:#f8f7f4;border:1px solid var(--line2)}


  /* ── 场景：选「我要做什么」 ── */
  /* 场景一多，一张平铺网格就找不着了。按「装给谁」分组，
     顶上一条吸顶索引：点一下就只看这一组，再点「全部」回来。 */
  .scidx{position:sticky;top:52px;z-index:8;display:flex;gap:7px;align-items:center;flex-wrap:wrap;
    padding:9px 0 10px;margin-bottom:2px;background:#fff;border-bottom:1px solid var(--line2)}
  .scidx .lb{font-size:11.5px;color:var(--faint);margin-right:2px}
  .scg{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;font-size:12.5px;
    color:var(--dim);display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:.13s;font-weight:500}
  .scg i{font-style:normal;font-size:10.5px;color:var(--faint);background:#f4f2ec;border-radius:10px;
    padding:0 5px;line-height:15px}
  .scg:hover{border-color:#d5d1c7;color:var(--ink)}
  .scg.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .scg.on i{background:rgba(255,255,255,.18);color:#fff}
  .scgh{display:flex;align-items:baseline;gap:9px;margin:16px 0 9px}
  .scgh b{font-size:13.5px;font-weight:640}
  .scgh span{font-size:11.5px;color:var(--faint)}
  .scgh:first-child{margin-top:6px}
  .sctip{font-size:12px;color:var(--dim);margin:6px 0 2px}
  .sctip .lnk{border:0;background:none;padding:0;margin-left:8px;color:var(--ink);text-decoration:underline;
    text-underline-offset:2px;cursor:pointer;font-size:12px}
  .scenes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .sc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;
    cursor:pointer;transition:.16s;display:flex;flex-direction:column;gap:7px}
  .sc:hover{border-color:#cfcabd;box-shadow:0 8px 22px rgba(0,0,0,.06);transform:translateY(-1px)}
  .sc.on{border-color:var(--brand);box-shadow:0 0 0 2px #eceae4}
  .sc .sh{display:flex;align-items:center;gap:8px}
  .sc .sico{width:30px;height:30px;border-radius:8px;background:#f4f2ec;display:grid;place-items:center;
    color:#6a675d;border:1px solid var(--line2);flex:0 0 auto}
  .sc .sh b{font-size:14px;font-weight:640}
  .sc .ss{font-size:12px;color:var(--dim);line-height:1.6}
  .sc .so{font-size:11.5px;color:#5c5a53;line-height:1.6;background:#faf9f6;border-radius:7px;padding:7px 8px}
  .sc .so em{font-style:normal;color:var(--faint);margin-right:5px}
  .sc .sp{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;padding-top:5px}
  .sc .sp span{font-size:10.5px;border-radius:20px;padding:2px 7px;font-weight:500;
    background:hsl(var(--h) 70% 94%);color:hsl(var(--h) 46% 30%);border:1px solid hsl(var(--h) 52% 84%)}

  /* ── 包：成套的功能，带色相 ── */
  .packs{display:flex;flex-direction:column;gap:15px}
  .pk{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden;
    border-left:3px solid hsl(var(--h) 60% 64%)}
  .pk.out{border-left-style:dashed}
  .pk.off{background:#fcfbf9}
  .pk .ph{display:flex;align-items:center;gap:8px;padding:10px 13px;
    background:hsl(var(--h) 54% 97%);border-bottom:1px solid var(--line2)}
  .pk .pico{width:26px;height:26px;border-radius:7px;background:#fff;flex:0 0 auto;
    border:1px solid hsl(var(--h) 42% 88%);display:grid;place-items:center}
  .pk .ph b{font-size:13.5px;font-weight:650;color:hsl(var(--h) 32% 24%)}
  .pk .ptk{font-size:10.5px;border-radius:20px;padding:2px 7px;border:1px solid transparent;white-space:nowrap}
  .pk .ptk.must{background:#eef6f1;color:#2f6b4a;border-color:#cfe4d8}
  .pk .ptk.rec{background:#fdf3e3;color:#8a5a12;border-color:#f0dcbc}
  .pk .ptk.opt{background:#f4f3ef;color:#7a776d;border-color:var(--line)}
  .pk .pout{font-size:10.5px;color:var(--faint);border:1px dashed var(--line);border-radius:20px;padding:1px 6px;white-space:nowrap}
  .pk .pn{margin-left:auto;font-size:11.5px;color:hsl(var(--h) 28% 40%);font-variant-numeric:tabular-nums}
  .pk .pall{border:1px solid hsl(var(--h) 38% 85%);background:#fff;color:hsl(var(--h) 36% 34%);
    font-size:11px;border-radius:6px;padding:2px 8px;cursor:pointer;white-space:nowrap}
  .pk .pall:hover{background:hsl(var(--h) 68% 96%)}
  .pk .ps{font-size:11.5px;color:var(--dim);line-height:1.6;padding:8px 14px 0}
  .pk .plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:10px 12px 12px}

  /* 模块卡：左边一条这个包的颜色，图标底色也带色 */
  .plist .hm{grid-template-columns:40px minmax(0,1fr) auto;padding:9px 10px;gap:10px;
    border-left:3px solid hsl(var(--h) 55% 68%)}
  .plist .hm .ico{width:40px;height:40px;background:hsl(var(--h) 62% 96%);border-color:hsl(var(--h) 44% 89%)}
  .plist .hm.off{border-left-color:var(--line)}
  .plist .hm.off .ico{background:#f6f4ef}
  .hm .nm .mc{font-size:10.5px;color:var(--faint);font-weight:400;margin-left:auto;white-space:nowrap}

  /* 方案页的三段标题与胶水卡 */
  .secttl{display:flex;align-items:baseline;gap:9px;margin:18px 0 10px;scroll-margin-top:70px}
  .secttl.first{margin-top:12px}
  .secttl b{font-size:14px;font-weight:650;white-space:nowrap}
  .secttl span{font-size:11.5px;color:var(--faint)}
  .pm .pdot{width:22px;height:22px;display:grid;place-items:center;border-radius:6px;flex:0 0 auto;
    background:hsl(var(--h) 62% 96%);border:1px solid hsl(var(--h) 44% 89%)}
  .pm .ptag{font-size:10.5px;color:hsl(var(--h) 34% 36%);background:hsl(var(--h) 58% 96%);
    border:1px solid hsl(var(--h) 44% 87%);border-radius:20px;padding:1px 7px;white-space:nowrap}
  .plans.glue{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
  .pm.g .why{font-size:11.5px;color:var(--dim);line-height:1.65;padding:0 14px 9px;
    border-bottom:1px solid var(--line2);background:#fcfbf9}
  @media(max-width:1180px){.pk .plist{grid-template-columns:1fr}}
  @media(max-width:1100px){.plans.glue{grid-template-columns:1fr}}
  @media(max-width:900px){.scenes{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:680px){
    .scenes{grid-template-columns:1fr}.pk .ph{flex-wrap:wrap}
    .scidx{top:46px;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:8px;
      scrollbar-width:none;-ms-overflow-style:none}
    .scidx::-webkit-scrollbar{display:none}
    .scg{flex:0 0 auto}
    .scidx .lb{display:none}}

  .hubmods{display:flex;flex-direction:column;gap:16px}
  .hm{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 14px;
    display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:start;
    transition:.14s;position:relative;cursor:pointer}
  .hm:hover{border-color:#d5d1c7}
  .hm.off{background:#fbfaf8;border-style:dashed}
  .hm.off .nm,.hm.off .sb{color:var(--faint)}
  .hm .ico{width:44px;height:44px;border-radius:9px;background:#f4f2ec;display:grid;place-items:center;border:1px solid var(--line2)}
  .hm.off .ico{opacity:.5}
  .hm .nm{font-size:13.5px;font-weight:620;display:flex;align-items:center;gap:8px}
  .hm .nm .tk{font-size:11px;font-weight:400;color:var(--faint);border:1px solid var(--line);
    border-radius:20px;padding:0 7px}
  .hm .sb{font-size:12px;color:var(--dim);line-height:1.65;margin-top:3px}
  .hm .cells{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .hm .cells span{font:10.5px/1 ui-monospace,Menlo,monospace;color:#8b8880;background:#f7f5f1;
    border:1px solid var(--line2);border-radius:5px;padding:2px 5px}
  .hm .act{display:flex;align-items:center;gap:8px;padding-top:2px}
  .hm .tick{width:19px;height:19px;border-radius:5px;border:1.5px solid #cdc8bb;background:#fff;
    display:grid;place-items:center;color:#fff;font-size:12px;transition:.12s}
  .hm:not(.off) .tick{background:var(--green);border-color:var(--green)}
  .hm .x{border:0;background:transparent;color:var(--faint);font-size:15px;line-height:1;padding:2px 4px;border-radius:5px}
  .hm .x:hover{background:var(--soft);color:var(--ink)}
  .hm.just .tick{animation:tickPop .3s cubic-bezier(.34,1.45,.5,1)}
  @keyframes tickPop{0%{transform:scale(.5)}65%{transform:scale(1.16)}100%{transform:scale(1)}}

  .plans{display:flex;flex-direction:column;gap:12px}
  .pm{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .pm .h{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#faf9f7;border-bottom:1px solid var(--line2)}
  .pm .h b{font-size:13px;font-weight:620}
  .pm .h .cells{margin:0;display:flex;gap:5px}
  .pm .h .cells span{font:10.5px/1 ui-monospace,Menlo,monospace;color:#8b8880}
  .pm .body{padding:6px 10px 10px}
  .pv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;
    border:1px solid transparent;border-radius:9px;padding:9px 10px;cursor:pointer}
  .pv:hover{background:#fcfbf9;border-color:var(--line2)}
  .pv.on{background:#fcfbf9;border-color:var(--brand)}
  .pv .n{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .pv .nt{font-size:11.5px;color:var(--dim);line-height:1.6;margin-top:2px}
  .pv .lv{font-size:11px;border-radius:20px;padding:0 7px;border:1px solid;font-weight:400}
  .lv.rec{color:var(--green);border-color:#bcd8c8;background:#eef6f1}
  .lv.ok{color:var(--dim);border-color:var(--line);background:#faf9f7}
  .lv.warn{color:#8a4a12;border-color:#f0e0c6;background:#fdf6ec}
  .lv.build{color:#5b4a8a;border-color:#d8d0ea;background:#f5f2fb}
  .pv .rd{width:15px;height:15px;border-radius:50%;border:1.5px solid #cdc8bb;background:#fff;margin-top:2px}
  .pv.on .rd{border-color:var(--brand);background:var(--brand);box-shadow:inset 0 0 0 3px #fff}

  /* ── PCB 插模块 ── */
  .pcb{background:#2b473d;border:1px solid #1e332b;border-radius:14px;padding:14px;position:relative;
    overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
  .pcb:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:linear-gradient(rgba(148,196,175,.10) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(148,196,175,.10) 1px,transparent 1px);
    background-size:22px 22px}
  .pcb .hd{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#a8cbba;margin-bottom:10px;
    position:relative;font-family:ui-monospace,Menlo,monospace;letter-spacing:.5px}
  .pcb .hd i{font-style:normal;color:#6f9b86}
  .pcb .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;position:relative}
  .slot{height:54px;border-radius:7px;border:1px dashed rgba(170,205,188,.35);
    display:flex;align-items:center;justify-content:center;font-size:11px;color:rgba(170,205,188,.55);
    text-align:center;padding:0 6px;line-height:1.35;background:rgba(0,0,0,.10)}
  .mchip{height:54px;border-radius:7px;color:#2a2824;padding:6px 8px 12px;
    background:linear-gradient(hsl(var(--h,45) 52% 93%),hsl(var(--h,45) 44% 86%));
    display:flex;align-items:center;justify-content:center;text-align:center;font-size:11.5px;line-height:1.3;
    position:relative;box-shadow:0 1px 2px rgba(0,0,0,.25),inset 0 -1px 0 rgba(0,0,0,.06)}
  .mchip .nm{font-weight:600}
  .mchip:after{content:"";position:absolute;left:8px;right:8px;bottom:4px;height:4px;
    background-image:radial-gradient(circle,#c9a227 1.1px,transparent 1.2px);background-size:6px 4px}
  .mchip.just{animation:plugIn .5s cubic-bezier(.2,1.5,.35,1) both}
  .mchip.solder{box-shadow:0 0 0 2px rgba(201,162,39,.85),0 1px 2px rgba(0,0,0,.3)}
  @keyframes plugIn{
    0%{transform:translateY(-26px) scale(.92);opacity:.15}
    65%{transform:translateY(3px) scale(1.03);opacity:1}
    100%{transform:none;opacity:1}
  }
  @media(prefers-reduced-motion:reduce){.mchip.just,.hm.just .tick{animation:none}}

  /* ── 形态·规格·平台：三组竖着排 ── */
  .pgrp{margin-bottom:20px}
  .pgt{display:flex;align-items:baseline;gap:10px;margin:0 0 9px}
  .pgt b{font-size:13.5px;font-weight:650}
  .pgt span{font-size:11.5px;color:var(--faint)}
  .sty.frm{align-items:flex-start}
  .sty.frm .fico{width:44px;height:44px;border-radius:11px;background:#f4f2ec;border:1px solid var(--line2);
    display:grid;place-items:center;color:#6a675d}
  .sty.frm.on .fico{background:#f0efe9;border-color:#cfcabd;color:var(--ink)}
  .plats{display:flex;flex-wrap:wrap;gap:9px}
  .plat{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);
    border-radius:9px;padding:8px 12px;cursor:pointer;transition:.14s;font-size:12.5px}
  .plat:hover{border-color:#cfcabd}
  .plat .pi{display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:#f1efe8;color:#6a675d}
  .plat b{font-weight:600}
  .plat .pn{font-size:10.5px;color:var(--faint)}
  .plat.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .plat.on .pi{background:rgba(255,255,255,.16);color:#fff}
  .plat.on .pn{color:rgba(255,255,255,.6)}
  .plat.no{opacity:.45;cursor:not-allowed;border-style:dashed}
  .hintline{font-size:11.5px;color:var(--dim);line-height:1.75;background:#faf9f6;border:1px dashed var(--line);
    border-radius:8px;padding:8px 10px;margin-top:9px}
  .hintline b{color:var(--ink)}

  /* ── 模块卡上的「多包」标 ── */
  .hm .nm .mp{font-size:10px;color:hsl(var(--h) 40% 34%);background:hsl(var(--h) 62% 95%);
    border:1px solid hsl(var(--h) 44% 86%);border-radius:20px;padding:1px 6px;font-weight:500;white-space:nowrap}
  .proline{margin-top:5px;display:flex;flex-direction:column;gap:2px}
  .proline .ce{font:10px/1.5 ui-monospace,Menlo,monospace;color:#8b8880;display:flex;gap:6px}
  .proline .ce em{font-style:normal;color:#6a675d;flex:0 0 auto}
  .proline .ce i{font-style:normal;color:#a19d92}
  .proon{background:var(--ink);border-color:var(--ink);color:#fff}
  .proon:hover{background:#3a3830}
  .protbl{width:100%;border-collapse:collapse;font-size:12px}
  .protbl th{text-align:left;font-size:10.5px;color:var(--faint);font-weight:500;padding:6px 10px;
    border-bottom:1px solid var(--line2);background:#faf9f7}
  .protbl td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
  .protbl tr:last-child td{border-bottom:0}
  .protbl .mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#5f5d55}

  /* ── 包图：左包右模块，中间连线 ── */
  .pmap{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:8px 12px}
  .prow{display:grid;grid-template-columns:178px minmax(0,1fr);gap:12px;align-items:start;
    padding:7px 0;border-top:1px dashed var(--line2)}
  .prow:first-child{border-top:0}
  .pnode{display:flex;align-items:center;gap:7px;border:1px solid hsl(var(--h) 42% 86%);
    background:hsl(var(--h) 60% 97%);border-radius:8px;padding:5px 9px;font-size:12px}
  .pnode .pd{display:grid;place-items:center}
  .pnode b{font-weight:600;color:hsl(var(--h) 34% 24%);font-size:12px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .pnode i{margin-left:auto;font-style:normal;font-size:10.5px;color:hsl(var(--h) 30% 44%)}
  .pchips{display:flex;flex-wrap:wrap;gap:5px;padding-top:1px}
  .mnode{display:inline-flex;align-items:center;gap:4px;border:1px solid hsl(var(--h) 40% 86%);
    background:hsl(var(--h) 55% 97%);border-radius:6px;padding:3px 7px;font-size:11.5px;
    color:hsl(var(--h) 32% 26%);overflow:hidden;white-space:nowrap}
  .mnode em{font-style:normal;font-size:9.5px;color:#fff;background:hsl(var(--h) 45% 58%);
    border-radius:20px;padding:0 4px;flex:0 0 auto}

  /* ── 逻辑图：能力格 DAG ── */
  .lgwrap{border:1px solid var(--line);border-radius:12px;overflow-x:auto;background:
    linear-gradient(#fbfaf7,#fbfaf7) padding-box,repeating-linear-gradient(0deg,transparent,transparent 21px,rgba(0,0,0,.03) 21px,rgba(0,0,0,.03) 22px);
    padding:6px;overflow:hidden}
  .lg .node rect{transition:opacity .2s}
  /* SVG 的 <g> 默认绕 viewBox 原点做 transform，rotate/scale 会变成整块位移——
     五套动效原来都"往下掉一段"，就是这么来的。锁成绕自己那一格的中心。 */
  .lg .node{transform-box:fill-box;transform-origin:50% 50%}
  .lg .edge{stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
  .lg.play .edge{animation:edgeDraw .5s linear forwards;animation-delay:var(--ed)}
  @keyframes edgeDraw{to{stroke-dashoffset:0}}
  .lg.play .node{animation:ndLego .46s cubic-bezier(.2,1.5,.4,1) both;animation-delay:var(--d)}
  /* ① 平涂方块：不位移、不缩放、没有厚度，只是"啪"地刷上去（4 段跳变 + 直角块） */
  .lg[data-anim="flat"] .node rect:first-child{filter:none}
  .lg[data-anim="flat"].play .node{animation:ndFlat .22s steps(4,end) both;
    animation-delay:calc(var(--d) * .3)}
  @keyframes ndFlat{0%{opacity:0}100%{opacity:1}}
  /* ② 立体乐高：掉下来、压一下、回弹，落定后仍留一层向下的厚度阴影 */
  .lg[data-anim="lego"] .node rect:first-child{filter:drop-shadow(0 3px 0 rgba(120,112,92,.32))}
  .lg[data-anim="lego"].play .node{animation:ndLego .46s cubic-bezier(.2,1.5,.4,1) both;animation-delay:var(--d)}
  @keyframes ndLego{0%{opacity:0;transform:translateY(-40px) scale(1.1)}
    56%{opacity:1;transform:translateY(4px) scale(.975)}
    78%{transform:translateY(-2px) scale(1.008)}100%{transform:none}}
  /* ③ 焊接：从左边滑进槽位，接触瞬间迸一点黄火，收尾在端口留个金色焊点 */
  .lg[data-anim="solder"] .node rect:nth-child(2){fill:#c9a227}
  .lg[data-anim="solder"].play .node{animation:ndSolder .5s cubic-bezier(.35,.05,.35,1) both;animation-delay:var(--d)}
  @keyframes ndSolder{0%{opacity:0;transform:translateX(-52px)}
    56%{opacity:1;transform:translateX(4px);filter:drop-shadow(0 0 9px rgba(214,164,40,.95))}
    76%{transform:translateX(-2px);filter:drop-shadow(0 0 3px rgba(214,164,40,.6))}
    100%{transform:none;filter:none}}
  /* ④ 电路点亮：位置完全不动，只有光——格子从暗爆到亮再稳住；线本身也提亮加粗，先亮线后亮格 */
  .lg[data-anim="glow"] .edge{stroke-width:1.7;opacity:.82}
  .lg[data-anim="glow"] .node rect:first-child{stroke-width:1.7}
  .lg[data-anim="glow"].play .node{animation:ndGlow .62s ease-out both;animation-delay:calc(var(--d) + 110ms)}
  @keyframes ndGlow{0%{opacity:.06;filter:brightness(3.4) saturate(.2)}
    50%{opacity:1;filter:brightness(1.32)}100%{opacity:1;filter:none}}
  /* ⑤ 卡片堆叠：像发牌，左右交替歪着落，落定才对齐（--r 由格子序号给定，奇偶相反） */
  .lg[data-anim="stack"].play .node{animation:ndStack .54s cubic-bezier(.25,.9,.3,1) both;
    animation-delay:calc(var(--d) * 1.2)}
  @keyframes ndStack{0%{opacity:0;transform:translateY(-30px) translateX(-8px) rotate(var(--r,-10deg))}
    70%{opacity:1;transform:translateY(3px) translateX(0) rotate(calc(var(--r,-10deg) * -.14))}
    100%{transform:none}}
  @keyframes dashIn{to{stroke-dashoffset:0}}
  .wbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:9px}
  .achip{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:3px 10px;
    font-size:11.5px;cursor:pointer;color:#57544c;transition:.14s}
  .achip:hover{border-color:#cfcabd}
  .achip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .animnote{font-size:11.5px;color:var(--faint);margin-top:7px;line-height:1.7}

  /* ── 自动自检条：进页面就自己跑，不指望用户去点「走一遍」 ── */
  .testbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 9px;
    border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:8px 12px;transition:.25s}
  .testbar.run{border-color:#ded8c8;background:#fdfcf7}
  .testbar.ok{border-color:#cfe4d8;background:#f2f8f4}
  .testbar.bad{border-color:#efd0ca;background:#fdf3f1}
  .testbar .tst{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:560;white-space:nowrap}
  .testbar .tdot{width:7px;height:7px;border-radius:50%;background:#c9c5ba;flex:0 0 auto}
  .testbar.run .tdot{background:var(--amber);animation:tpulse .9s ease-in-out infinite}
  .testbar.ok .tdot{background:var(--green)}
  .testbar.bad .tdot{background:#b4483c}
  @keyframes tpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.75)}}
  .testbar .tnum{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .testbar .tline{flex:1 1 110px;min-width:70px;max-width:280px;height:5px;border-radius:20px;background:#f0eee7;overflow:hidden}
  .testbar .tline i{display:block;height:100%;width:0;border-radius:20px;background:#b8922f;transition:width .1s linear,background .25s}
  .testbar.ok .tline i{background:var(--green)}
  .testbar.bad .tline i{background:#b4483c}
  .testbar .tres{font-size:11.5px;color:var(--dim);line-height:1.55}
  .testbar .tres b{font-weight:600;color:var(--ink)}
  .testbar .tgo{color:#b4483c;text-decoration:underline;cursor:pointer;margin-left:8px}
  .lg .okd{opacity:0;transition:opacity .16s}
  .lg g.node[data-t="1"] .okd{opacity:1}
  /* 正在测的那一格：金色描边，像探针压上去。
     不能用 filter 做发光——节点的入场动画里就有 filter，fill:both 会把它盖掉 */
  .lg g.node[data-c="1"] rect:first-child{stroke:#c9a227;stroke-width:2.2}
  .okline{margin-top:14px;font-size:12.5px;color:#2f6b4a;background:#eef6f1;border:1px solid #cfe4d8;
    border-radius:9px;padding:9px 12px}
  .gapbox.warn{background:#fdf3e3;border-color:#f0dcbc}

  /* ── 确认页的四个小卡 ── */
  .dgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:10px}
  .dcard{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:10px 12px}
  .dcard span{display:block;font-size:10.5px;color:var(--faint)}
  .dcard b{display:block;font-size:16px;font-weight:640;margin:2px 0 1px}
  .dcard i{font-style:normal;font-size:11px;color:var(--dim);line-height:1.5;display:block}

  /* ── 内存模拟 ── */
  .memcard{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:13px 14px}
  .memtop{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
  .memb{display:flex;gap:18px}
  .memb>div b{display:block;font-size:19px;font-weight:640;line-height:1.2}
  .memb>div b.a{color:#b4483c}
  .memb>div span{font-size:10.5px;color:var(--faint)}
  .memctl{margin-left:auto;display:flex;flex-direction:column;gap:7px}
  .memctl .row2{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .memctl .row2>span{font-size:11px;color:var(--dim);min-width:96px}
  .membar{height:9px;border-radius:20px;background:#f1efe8;display:flex;overflow:hidden;margin:12px 0 7px}
  .membar .seg{height:100%}
  .membar .seg.over{background:repeating-linear-gradient(45deg,#d8b0a8,#d8b0a8 4px,#c98f84 4px,#c98f84 8px)}
  .memlg{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--dim)}
  .memlg span{display:flex;align-items:center;gap:5px}
  .memlg i{width:8px;height:8px;border-radius:2px;display:block}
  .memnote{font-size:11.5px;color:#57544c;line-height:1.75;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}

  /* ── 安装说明 ── */
  .inst{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:11px}
  .icard{border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:11px 13px;overflow-wrap:anywhere}
  .icard .ih{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .icard .ih b{font-size:13px}
  .irow{display:flex;gap:8px;font-size:11.5px;line-height:1.75;color:var(--dim);padding:4px 0;
    border-top:1px solid var(--line2)}
  .irow:first-of-type{border-top:0}
  .irow em{font-style:normal;color:var(--ink);flex:0 0 62px;font-weight:600}
  .irow code{font:11px/1.4 ui-monospace,Menlo,monospace;background:#f4f2ec;border-radius:4px;padding:1px 4px}

  /* ── 最小包开关 ── */
  .minbox{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:11px;
    background:var(--panel);padding:11px 13px}
  .minbox.on{border-color:#bcd8c8;background:#f7fbf8}
  .switch{width:38px;height:22px;border-radius:20px;background:#dcd8cd;position:relative;cursor:pointer;
    flex:0 0 auto;transition:.16s}
  .switch:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;
    top:2px;left:2px;transition:.16s;box-shadow:0 1px 2px rgba(0,0,0,.18)}
  .switch.on{background:#3f7d5a}
  .switch.on:after{left:18px}

  /* ── 装完的模拟结果 ── */
  .resgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .rcell{border:1px solid var(--line);border-radius:10px;background:#fbfaf7;padding:9px 11px}
  .rcell span{display:block;font-size:10.5px;color:var(--faint)}
  .rcell b{display:block;font-size:16px;font-weight:640;line-height:1.3}
  .rcell b.ok{color:#2f6b4a}.rcell b.a{color:#b4483c}
  .rcell i{font-style:normal;font-size:11px;color:var(--dim);display:block;line-height:1.5}

  /* ── 组装台：动效变体 ── */
  .pcb .pcbfoot{margin-top:10px;font:10.5px/1.4 ui-monospace,Menlo,monospace;color:#7fa792;
    border-top:1px dashed rgba(170,205,188,.25);padding-top:7px;position:relative}
  .pcb[data-anim="flat"] .mchip.just{animation:pcbFlat .24s steps(4,end) both}
  .pcb[data-anim="lego"] .mchip.just{animation:plugIn .5s cubic-bezier(.2,1.5,.35,1) both}
  .pcb[data-anim="solder"] .mchip.just{animation:pcbSolder .5s cubic-bezier(.35,.05,.35,1) both}
  .pcb[data-anim="glow"] .mchip.just{animation:pcbGlow .62s ease-out both}
  .pcb[data-anim="stack"] .mchip.just{animation:pcbStack .54s cubic-bezier(.25,.9,.3,1) both}
  /* 静止时也要分得出来：乐高有厚度、平涂是直角且没影子、点亮常亮一圈光、焊接留金边 */
  .pcb[data-anim="lego"] .mchip{box-shadow:0 3px 0 #b9b3a1,0 6px 10px rgba(0,0,0,.3)}
  .pcb[data-anim="flat"] .mchip{border-radius:2px;box-shadow:none}
  .pcb[data-anim="glow"] .mchip{box-shadow:0 0 10px rgba(255,214,120,.45),inset 0 0 0 1px rgba(255,236,190,.6)}
  @keyframes pcbFlat{0%{opacity:0}100%{opacity:1}}
  @keyframes pcbSolder{0%{opacity:0;transform:translateX(-34px)}
    58%{opacity:1;transform:translateX(3px);box-shadow:0 0 13px rgba(255,201,64,.95)}
    100%{transform:none;box-shadow:0 0 0 2px rgba(201,162,39,.8)}}
  @keyframes pcbGlow{0%{opacity:.12;filter:brightness(2.8) saturate(.4)}
    55%{opacity:1;filter:brightness(1.3)}100%{opacity:1;filter:none}}
  @keyframes pcbStack{0%{opacity:0;transform:translateY(-16px) rotate(-9deg)}100%{transform:none}}
  @media(max-width:1080px){.dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .prow{grid-template-columns:1fr;gap:5px}}

  @media(max-width:1080px){.pcb .grid{grid-template-columns:repeat(2,minmax(0,1fr))}.styles{grid-template-columns:1fr}}

  .stepnav{display:flex;gap:9px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
  .stepnav .back{margin-right:auto}
  /* 窄屏：上一步在上、下一步在下，各占一整行——拇指够得着，也不会两个挤成一团 */
  @media(max-width:620px){
    .stepnav{flex-direction:column;align-items:stretch;gap:8px}
    .stepnav .back{margin-right:0}
    .stepnav .btn{width:100%;justify-content:center;min-height:42px}
  }

  /* 首页两个入口。第一个是主入口：用色块、大图标、明确按钮告诉人「点这里开始」，
     不要做成一张和普通卡片没差别的白卡（用户根本不知道能点）。 */
  .starts{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;margin-bottom:16px}
  .start{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
    display:flex;gap:13px;align-items:center;cursor:pointer;transition:.15s}
  .start:hover{border-color:#cfcabd;box-shadow:0 8px 20px rgba(0,0,0,.05)}
  .start:focus-visible{outline:2px solid #d8d3c4;outline-offset:2px}
  .start .ic{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto}
  .start .ic.a{background:#eef4ef}
  .start .ic.b{background:#f6f3eb}
  .start b{font-size:14px;font-weight:640;display:block}
  .start p{margin:2px 0 0;font-size:12px;color:var(--dim);line-height:1.6}
  .start .hx{min-width:0}

  .start.hero{position:relative;overflow:hidden;padding:18px 20px;gap:16px;align-items:flex-start;
    background:linear-gradient(135deg,#f2f5e8 0%,#e5eddd 55%,#f7f3e5 100%);
    border-color:#ced3b6;box-shadow:0 1px 2px rgba(60,58,53,.04)}
  /* 右上角一个很淡的光斑，把主入口和右边那张普通卡片区分开 */
  .start.hero:after{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;
    border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,255,255,0) 70%);
    pointer-events:none}
  .start.hero:hover{transform:translateY(-2px);border-color:#b8b09a;box-shadow:0 14px 30px rgba(60,58,53,.11)}
  .start.hero .ic{width:56px;height:56px;border-radius:15px;background:#fff;border:1px solid #e2ddca;
    box-shadow:0 2px 8px rgba(60,58,53,.07)}
  .start.hero .kick{display:inline-block;font-size:10.5px;letter-spacing:.08em;color:#7a7458;background:#fff;
    border:1px solid #e3dfce;border-radius:20px;padding:1px 9px;margin-bottom:6px}
  .start.hero b{font-size:18px;letter-spacing:-.2px}
  .start.hero p{font-size:12.5px;color:#5c5a53;max-width:56ch}
  .start.hero .go{margin-left:auto;flex:0 0 auto;align-self:center;display:inline-flex;align-items:center;gap:8px;
    background:var(--brand);color:#fff;border-radius:10px;padding:13px 20px;font-size:14px;font-weight:650;
    box-shadow:0 6px 16px rgba(60,58,53,.18);transition:.16s;white-space:nowrap}
  .start.hero .go em{font-style:normal;transition:transform .16s}
  .start.hero:hover .go{background:#2b2a26;box-shadow:0 10px 22px rgba(60,58,53,.26)}
  .start.hero:hover .go em{transform:translateX(3px)}
  /* 一直轻轻呼吸，眼睛能扫到；系统开了「减少动态效果」就不动 */
  .start.hero .go{animation:heroBreathe 3s ease-in-out infinite}
  @keyframes heroBreathe{
    0%,100%{box-shadow:0 4px 12px rgba(60,58,53,.14)}
    50%{box-shadow:0 9px 24px rgba(60,58,53,.28)}}
  @media(prefers-reduced-motion:reduce){
    .start.hero .go{animation:none}
    .start.hero:hover{transform:none}}
  @media(max-width:980px){
    .start.hero{flex-wrap:wrap;gap:12px}
    .start.hero .hx{flex:1 1 240px}
    .start.hero .go{width:100%;justify-content:center;margin-left:0}
  }
  .dftbox{margin-top:14px}
  .dft{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:6px}
  .dft:last-child{border-bottom:0}
  .dft:hover{background:#fcfbf8}
  .dft:focus-visible{outline:2px solid #d8d3c4;outline-offset:1px}
  .dft .dm{flex:1;min-width:0}
  .dft .dm b{display:block;font-size:13px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dft .dm span{font-size:11.5px;color:var(--dim)}
  .dft .dftat{font-size:11.5px;color:var(--faint);flex:0 0 auto;min-width:56px;text-align:right}
  .dft .badge{flex:0 0 auto}
  @media(max-width:620px){
    .dft{flex-wrap:wrap;row-gap:6px}
    .dft .dm{flex:1 1 100%}
    .dft .dftat{margin-left:auto}
  }
  @media(max-width:820px){.starts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo"><i>墨</i><b>装配台</b><span>v0.3</span></div>
    <nav class="nav">
      <a href="#/home" data-nav="home"><i>▤</i>工作台</a>
      <a href="#/new" data-nav="new"><i>＋</i>新建装配</a>
      <a href="#/lib" data-nav="lib"><i>▦</i>模块库</a>
      <div class="lbl" id="flowLbl">当前装配</div>
      <div id="navFlow"></div>
    </nav>
    <div class="sidefoot">
      <a href="#/home" id="btnHelp" style="display:block;margin-bottom:4px">说明与帮助</a>
      <a href="#/home" id="btnSetting" style="display:block">设置</a>
      <div style="margin-top:10px">原型：无真实后端</div>
    </div>
  </aside>

  <main>
    <div class="top" id="top"></div>
    <div id="view"></div>
  </main>
</div>
<div id="modal"></div>

<script>
const D = {"comps":[{"id":"ai.chat.core","name":"对话内核","kind":"module","dom":"ai.chat","abstract":"多轮上下文管理 + 流式输出 + 会话状态","note":"解决三件事：历史怎么裁（超长时丢头还是摘要）、流怎么推（SSE/WebSocket）、状态存哪（内存/Redis/SQLite）。常见坑：把整个历史每轮全量重发，token 成本随轮次平方涨——实测跑到第 30 轮，单轮成本是第 1 轮的 12 倍；正确做法是滑动窗口 + 关键事实摘要，或者干脆按任务切新会话。不需要它的场合：单轮问答、批处理脚本。","ins":"文本","outs":"文本 + 会话","pv":[{"id":"ollama-webui","n":"Open WebUI","k":"oss","lic":"BSD-3-Clause(需核)","repo":"open-webui/open-webui","note":"自带完整对话层，可直接当外壳用","effort":"","tokens":"","outline":[]},{"id":"vercel-ai-sdk","n":"Vercel AI SDK","k":"oss","lic":"Apache-2.0","repo":"vercel/ai","note":"只做流式与状态编排，UI 自己写；TypeScript 生态最省事","effort":"","tokens":"","outline":[]},{"id":"litellm","n":"LiteLLM","k":"oss","lic":"MIT(需核)","repo":"BerriAI/litellm","note":"入口统一，但会话层要自己补","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"轮子不复杂，难的是裁剪策略，适合自己写并沉淀成自己的风格","effort":"3–5 天","tokens":"约 300 万","outline":["Message 表 + 会话表，SQLite 存，按会话 id 取历史","上下文裁剪：保留最近 N 轮 + 早期摘要，摘要用便宜模型生成","输出走 SSE，前端用 ReadableStream 接；断线用 messageId 续传","加 usage 记账（token 与耗时），否则没法优化成本"]}]},{"id":"ai.chat.memory","name":"长期记忆","kind":"module","dom":"ai.chat","abstract":"跨会话记住用户偏好与事实","note":"和「对话历史」不是一回事：历史是原始流水，记忆是提炼后的结论。需要它的场景：用户反复说「我不吃香菜」却每次都要重说。不需要的场景：一次性任务。坑在于写入时机——每轮都写会污染，只在用户明确表达偏好时写又漏。主流做法是先抽取候选事实再让用户确认，或者设阈值只在重复出现时固化。","ins":"文本+会话","outs":"会话","pv":[{"id":"mem0","n":"Mem0","k":"oss","lic":"Apache-2.0(需核)","repo":"mem0ai/mem0","note":"专门做记忆层，抽取+去重+检索一条龙","effort":"","tokens":"","outline":[]},{"id":"letta","n":"Letta (MemGPT)","k":"oss","lic":"Apache-2.0(需核)","repo":"letta-ai/letta","note":"把记忆做成可编辑的内存块，思路值得抄","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"逻辑简单，关键在「什么时候不该记」","effort":"2–3 天","tokens":"约 150 万","outline":["事实表：subject / predicate / object / 来源消息 / 时间","抽取：每轮结束让便宜模型抽「值得记的事实」，宁少勿多","写入前查重，冲突时以时间新的为准并保留旧的","检索：按当前对话做向量召回，拼进 system prompt 前 300 字"]}]},{"id":"ai.chat.multimodal","name":"多模态输入","kind":"module","dom":"ai.chat","abstract":"图片、文件、语音进入对话","note":"不是「支持上传」这么简单，核心是分流：图片走视觉模型还是先 OCR、PDF 先解析还是直塞、语音先转录还是原样喂给支持音频的模型。选错分流，成本差十倍（一张图直接喂视觉模型约 1000+ token，OCR 后可能只有 200）。不需要的场合：纯文本工具。坑：大文件不切块直接塞上下文，一次就爆窗口。","ins":"原始文件","outs":"文本","pv":[{"id":"docling","n":"Docling","k":"oss","lic":"MIT","repo":"docling-project/docling","note":"PDF/Office 解析，版面与表格都保得住","effort":"","tokens":"","outline":[]},{"id":"markitdown","n":"MarkItDown","k":"oss","lic":"MIT","repo":"microsoft/markitdown","note":"最轻的转 Markdown，复杂版式会丢结构","effort":"","tokens":"","outline":[]},{"id":"tesseract","n":"Tesseract","k":"oss","lic":"Apache-2.0","repo":"tesseract-ocr/tesseract","note":"纯图 PDF 的兜底 OCR","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"分流规则比代码重要，先写一张判定表","effort":"2 天","tokens":"约 120 万","outline":["按 MIME 分流：文本直读、PDF 走解析、图片走 OCR 或视觉模型","超过阈值先摘要再入上下文，原文落盘保留引用","统一成 [{type, content, source}] 的结构，后面接什么都行"]}]},{"id":"ai.agent.loop","name":"执行主循环","kind":"module","dom":"ai.agent","abstract":"想—做—看，直到完成或放弃","note":"整个 Agent 的心脏。必须有的三件：最大步数（防死循环）、每步的结果回灌（否则模型不知道成没成）、失败的重试与放弃判定。实测最常见的坑是没有步数上限，遇到工具一直报错就无限重试烧 token。另一个坑是把所有工具结果原样塞回上下文，几轮就把窗口撑满——要做摘要或截断。","ins":"文本","outs":"文本 + 外部动作","pv":[{"id":"langgraph","n":"LangGraph","k":"oss","lic":"MIT","repo":"langchain-ai/langgraph","note":"图式编排，状态与分支显式，适合复杂流程","effort":"","tokens":"","outline":[]},{"id":"pydantic-ai","n":"PydanticAI","k":"oss","lic":"MIT(需核)","repo":"pydantic/pydantic-ai","note":"类型安全，循环逻辑藏在框架里，改起来快","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"两百行能跑通，但要做好失败恢复和轨迹记录才可用","effort":"4–6 天","tokens":"约 350 万","outline":["定义 Step{thought, tool, args, observation} 与最大步数","循环：调模型 → 解析工具调用 → 执行 → 结果截断后回灌","失败处理：同工具连续失败 2 次换策略，3 次则终止并报告","轨迹落库，便于回放与调参（这一步不做，后面无法优化）"]}]},{"id":"ai.agent.plan","name":"任务规划","kind":"module","dom":"ai.agent","abstract":"把一句话需求拆成可执行步骤","note":"规划与执行分开做的好处：可以先让人确认计划再动手，避免跑偏烧钱。需要它的场合：跨多文件、跨多系统的任务。不需要：单步能完成的事，硬加规划只是多花一次调用。坑是规划粒度过细——拆成 20 步反而每步都在丢上下文；经验是 3–7 步最稳。","ins":"文本","outs":"结构化记录","pv":[{"id":"llm-planner","n":"直接提示词规划","k":"pattern","lic":"","repo":"","note":"不引依赖：让强模型输出 JSON 步骤数组，最省","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"核心不是拆得细，是「完成判据」写清楚","effort":"2–3 天","tokens":"约 180 万","outline":["先用强模型出计划（JSON：steps[{goal, done_when}]）","人工确认环节可选，命令行里按 y 继续","执行中每步回报实际结果，允许重规划（最多 2 次）","计划与偏差都落库，用于后面调提示词"]}]},{"id":"ai.agent.tool","name":"工具调用","kind":"module","dom":"ai.agent","abstract":"把外部能力包成模型能调的接口","note":"本质是「函数签名 + 参数校验 + 结果裁剪」三件事。坑极多：参数不做类型校验，模型传个字符串数字就崩；结果不做裁剪，一次 grep 返回 5000 行直接爆窗口；错误信息不回传，模型不知道错在哪只能瞎试。不需要的场合：模型只用来生成文本。","ins":"结构化记录+文本","outs":"外部动作","pv":[{"id":"mcp","n":"MCP 标准","k":"oss","lic":"MIT","repo":"modelcontextprotocol/servers","note":"协议层已标准化，现成 server 最多","effort":"","tokens":"","outline":[]},{"id":"openai-fc","n":"OpenAI Function Calling","k":"pattern","lic":"","repo":"","note":"事实标准，各家模型都兼容这种 schema","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"协议用现成的，执行层自己写更可控","effort":"3 天","tokens":"约 200 万","outline":["工具注册表：name / 描述 / JSON Schema 参数 / 执行函数","参数先过 pydantic 校验，失败把错误原文回给模型让它改","结果统一截断到 N 字符，超出部分落盘给路径","加超时与并发上限，防止某个工具把进程挂住"]}]},{"id":"ai.agent.mcp","name":"MCP 接入","kind":"module","dom":"ai.agent","abstract":"按统一协议挂外部工具与数据源","note":"MCP 的价值在于「一次实现，所有客户端能用」。选型判断：只在自家产品里用的工具，自己写工具调用更省；要被 Claude Code / Cursor / 自家客户端同时用，就值得包成 MCP server。坑：server 的生命周期管理（stdio 还是 SSE）、权限边界（给了文件系统就等于给了全部）。","ins":"（不需要输入）","outs":"外部动作","pv":[{"id":"mcp-python","n":"MCP Python SDK","k":"oss","lic":"MIT","repo":"modelcontextprotocol/python-sdk","note":"写 server 最直接","effort":"","tokens":"","outline":[]},{"id":"mcp-servers","n":"官方 servers 合集","k":"oss","lic":"MIT","repo":"modelcontextprotocol/servers","note":"文件/数据库/搜索都有现成的，别重写","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"协议实现别自己写，用 SDK","effort":"2 天","tokens":"约 130 万","outline":["先定 server 的 3–5 个工具，别一上来铺开","stdio 传输最简单，远程再考虑 SSE","每个工具加白名单与路径校验，禁止越界读","写一份 tools 清单文档，客户端才能正确路由"]}]},{"id":"ai.agent.skill","name":"技能沉淀","kind":"module","dom":"ai.agent","abstract":"把一次做成的流程固定成可复用的技能","note":"这是「越用越顺手」的关键：同样的活做第二次不该从头教。形态可以是提示词模板、脚本、或带前置条件的说明文件。坑：技能没有触发条件就永远不会被用上；没有版本就会互相覆盖。需要它的场合：重复性任务（周报、发布、数据清洗）。不需要：一次性探索。","ins":"文本","outs":"外部动作","pv":[{"id":"claude-skills","n":"Claude Skills 格式","k":"oss","lic":"","repo":"anthropics/skills","note":"目录约定 + SKILL.md，跨客户端通用（该仓无 LICENSE，需留意）","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"格式很简单，难在写得让人（和模型）都能读懂触发条件","effort":"2 天","tokens":"约 110 万","outline":["技能目录：name / 何时用 / 步骤 / 依赖 / 示例","触发条件写成可判断的描述，别写「需要时」","从成功轨迹里自动抽取初稿，人再删改","加版本号，改了就升版，避免静默失效"]}]},{"id":"ai.model.gateway","name":"模型网关","kind":"module","dom":"ai.model","abstract":"一个入口对接多家，屏蔽协议差异","note":"需要它的信号：代码里出现第二个 `if provider ==`。网关做三件事：协议转换（OpenAI/Anthropic/Gemini 格式互转）、密钥与配额管理、用量记账。坑：流式输出的格式各家不同，转换时最容易丢 tool_call 分片；还有重试策略，一个供应商 429 要能自动切下一个。","ins":"文本","outs":"文本","pv":[{"id":"litellm","n":"LiteLLM","k":"oss","lic":"MIT","repo":"BerriAI/litellm","note":"100+ 供应商统一成 OpenAI 格式，事实标准","effort":"","tokens":"","outline":[]},{"id":"one-api","n":"One API / New API","k":"oss","lic":"MIT","repo":"songquanpeng/one-api","note":"带配额和渠道管理，适合多人共用","effort":"","tokens":"","outline":[]},{"id":"openrouter","n":"OpenRouter","k":"commercial","lic":"","repo":"","note":"省事但要抽成，数据出境需评估","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"两家以内不用写网关，直接 if/else 更省","effort":"4 天","tokens":"约 280 万","outline":["统一请求/响应模型，先把 OpenAI 格式当基准","适配器模式：每供应商一个 adapter，只做格式转换","流式转发按 chunk 透传，不要攒完整再发","记账：token、耗时、失败原因，按 task 聚合"]}]},{"id":"ai.model.local","name":"本地推理","kind":"module","dom":"ai.model","abstract":"在自己机器上跑权重，不联网","note":"选它的理由只有三个：数据不出门、无按量费用、离线可用。代价是显存/内存与速度。判断标准：模型参数量 × 量化位数要能塞进显存，塞不进就吃内存、速度掉一个量级。坑：以为装了 Ollama 就能跑一切——大模型在 8G 显存上基本只能跑 7B 量化版。","ins":"文本 或 原始文件","outs":"文本","pv":[{"id":"ollama","n":"Ollama","k":"oss","lic":"MIT","repo":"ollama/ollama","note":"一条命令跑起来，生态最全","effort":"","tokens":"","outline":[]},{"id":"llamacpp","n":"llama.cpp","k":"oss","lic":"MIT","repo":"ggml-org/llama.cpp","note":"底层引擎，量化格式多，适合嵌进自己的程序","effort":"","tokens":"","outline":[]},{"id":"vllm","n":"vLLM","k":"oss","lic":"Apache-2.0","repo":"vllm-project/vllm","note":"要并发吞吐时用它，单机交互反而重","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"这一格自研没有意义，用它包一层管理界面就够","effort":"不建议","tokens":"—","outline":["推理引擎不要自研，量化与 kernel 优化是专业活","自己写只做「启动/停止/健康检查」的进程管理壳"]}]},{"id":"ai.model.route","name":"路由与降级","kind":"module","dom":"ai.model","abstract":"按任务难度选模型，贵的只在难的地方用","note":"省钱的最大杠杆，比任何提示词优化都有效。做法：先按任务类型分档（分类/摘要用小模型，写代码/推理用大模型），再按失败升级（小模型答不出来或格式不对就换大的）。坑：级联重试会让延迟翻倍，交互场景要设总超时；还有缓存，相同前缀的请求命中缓存能省 10 倍——实测缓存命中 99% 时，一亿 token 只花 60 积分。","ins":"文本","outs":"文本","pv":[{"id":"litellm-router","n":"LiteLLM Router","k":"oss","lic":"MIT","repo":"BerriAI/litellm","note":"自带 fallback 与负载均衡","effort":"","tokens":"","outline":[]},{"id":"route-llm","n":"RouteLLM","k":"oss","lic":"Apache-2.0","repo":"lm-sys/RouteLLM","note":"按难度自动分流，学术实现的工程版","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"规则分类比模型分类更稳，先写规则","effort":"2 天","tokens":"约 120 万","outline":["任务分类器：规则优先（长度、是否含代码、是否要推理），规则不行再上小模型判","价目表配置化，别硬编码在代码里","失败升级链：小 → 中 → 大，最多两次","打日志记录每次选择与结果质量，否则无法调参"]}]},{"id":"kb.ingest","name":"文档入库","kind":"module","dom":"kb","abstract":"把各种格式变成干净的、可切片的文本","note":"流水线的第一段，也是决定上限的一段。质量差的表现：双栏 PDF 读成一行、表格变成乱码、扫描件直接空白。需要它的场合：资料以 PDF/Office 为主。不需要：纯网页或纯 Markdown 语料。坑：以为解析是小事，实际 60% 的问答失败追根溯源都在这。","ins":"原始文件","outs":"文本片段","pv":[{"id":"docling","n":"Docling","k":"oss","lic":"MIT","repo":"docling-project/docling","note":"版面、表格、阅读顺序都处理得最好，速度一般","effort":"","tokens":"","outline":[]},{"id":"unstructured","n":"Unstructured","k":"oss","lic":"Apache-2.0","repo":"Unstructured-IO/unstructured","note":"格式覆盖最广，复杂版式精度不如 Docling","effort":"","tokens":"","outline":[]},{"id":"mineru","n":"MinerU","k":"oss","lic":"AGPL-3.0(需核)","repo":"opendatalab/MinerU","note":"中文 PDF 与公式识别强","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"调度层可以自己写，解析内核必须用现成的","effort":"不建议","tokens":"—","outline":["解析器不要自研：PDF 的坑是十年积累出来的","自己写只做「格式判定 + 调用哪个解析器 + 结果规范化」的调度层"]}]},{"id":"kb.parse","name":"格式解析","kind":"part","dom":"kb","abstract":"把 PDF/Word/网页拆成阅读顺序正确的文本","note":"子模块存在的意义：它是最常被单独替换的一环。判断解析好不好，看三件事——双栏有没有串行、表格有没有散架、页眉页脚有没有混进正文。三者都过才叫能用。","ins":"原始文件","outs":"文本","pv":[{"id":"docling","n":"Docling","k":"oss","lic":"MIT","repo":"docling-project/docling","note":"首选","effort":"","tokens":"","outline":[]},{"id":"pymupdf","n":"PyMuPDF","k":"oss","lic":"AGPL-3.0","repo":"pymupdf/PyMuPDF","note":"快，但商业闭源项目要买授权——AGPL 是最容易踩的坑","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"只写校验不写解析","effort":"不建议","tokens":"—","outline":["解析内核别自研","自己写只做格式嗅探与结果校验（比如检测乱序）"]}]},{"id":"kb.chunk","name":"切块","kind":"part","dom":"kb","abstract":"把长文本切成适合检索的片段","note":"最被低估的一环。切太大：召回一段里一半是废话，浪费上下文还干扰判断；切太小：语义不完整，答非所问。经验值 300–800 token，按结构切（章节/段落）优于按字数切。坑：中文按字符数切会把句子拦腰截断；要按句子边界做。","ins":"文本","outs":"文本片段","pv":[{"id":"langchain-splitter","n":"LangChain Splitter","k":"oss","lic":"MIT","repo":"langchain-ai/langchain","note":"各种切法都有，按标题切最实用","effort":"","tokens":"","outline":[]},{"id":"chonkie","n":"Chonkie","k":"oss","lic":"Apache-2.0(需核)","repo":"chonkie-inc/chonkie","note":"轻量专用，语义切块效果好","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"结构切 + 句子边界就够了，语义切块收益有限","effort":"1–2 天","tokens":"约 80 万","outline":["先按结构切（Markdown 标题 / PDF 段落），保留层级路径","超长段落再按句子边界二次切，目标 500 token、重叠 50","每片带上「来自哪个文件、第几节」，供引用回溯","切完抽样人看 10 条，切歪了立刻能发现"]}]},{"id":"kb.rag","name":"向量检索","kind":"module","dom":"kb","abstract":"按语义找相关片段，换个说法也能搜到","note":"它的长处在「模糊匹配」，短处恰恰也是——型号、编号、专有名词这些精确串经常搜不准。所以真实系统几乎都是向量 + 关键词混检。需要它的场合：语料超过几十页、问题用词与原文不一致。不需要：库小到能整篇塞上下文，或者问题就是要精确匹配。","ins":"文本片段 或 文本","outs":"文本片段","pv":[{"id":"chroma","n":"Chroma","k":"oss","lic":"Apache-2.0","repo":"chroma-core/chroma","note":"原型期最省事，单机一把梭","effort":"","tokens":"","outline":[]},{"id":"qdrant","n":"Qdrant","k":"oss","lic":"Apache-2.0","repo":"qdrant/qdrant","note":"过滤条件强的场景更合适","effort":"","tokens":"","outline":[]},{"id":"lancedb","n":"LanceDB","k":"oss","lic":"Apache-2.0","repo":"lancedb/lancedb","note":"列存，多模态数据一起存","effort":"","tokens":"","outline":[]},{"id":"pgvector","n":"pgvector","k":"oss","lic":"PostgreSQL","repo":"pgvector/pgvector","note":"已有 Postgres 就别再引一个库","effort":"","tokens":"","outline":[]},{"id":"sqlite-vec","n":"sqlite-vec","k":"oss","lic":"Apache-2.0","repo":"asg017/sqlite-vec","note":"单文件零服务，桌面端首选","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"自己写会得到一个又慢又不准的索引","effort":"不建议","tokens":"—","outline":["向量索引与 ANN 算法不要自研","自己写只做「选库 + 建索引 + 查询封装」"]}]},{"id":"kb.embed","name":"嵌入","kind":"part","dom":"kb","abstract":"把一段文字压成固定长度的向量","note":"选嵌入模型的第一原则：换了就要全量重建索引，所以一开始就要选稳的。中文场景别直接用英文模型。坑：同一个库混用两个嵌入模型（比如中途升级），向量空间不一致，检索结果会莫名其妙地差。","ins":"文本片段","outs":"向量","pv":[{"id":"bge-m3","n":"BGE-M3","k":"oss","lic":"MIT","repo":"FlagOpen/FlagEmbedding","note":"中文强，支持多语言与长文本","effort":"","tokens":"","outline":[]},{"id":"nomic-embed","n":"Nomic Embed","k":"oss","lic":"Apache-2.0","repo":"nomic-ai/nomic-embed-text-v1.5","note":"英文场景性价比高","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"训模型不在这个任务范围内","effort":"不建议","tokens":"—","outline":["嵌入模型不要自己训，直接用现成权重","自己写只做「批量调用 + 缓存 + 维度校验」的封装"]}]},{"id":"kb.recall","name":"召回","kind":"part","dom":"kb","abstract":"从索引里取出候选片段","note":"注意它是「取候选」不是「定结果」——召回要给得多一点（top 20），后面再靠重排收敛。坑：只取 top 3 又不重排，答错率很高；相似度阈值设太高会完全没有召回，模型就开始编。","ins":"向量 或 文本","outs":"文本片段","pv":[{"id":"hybrid","n":"向量 + BM25 混检","k":"pattern","lic":"","repo":"","note":"不引额外依赖：两路各取 10 条按倒数排名融合","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"RRF 融合二十行代码，效果稳定","effort":"1 天","tokens":"约 60 万","outline":["向量召回 top 15 + 关键词召回 top 15","用 RRF（倒数排名融合）合并，不用调权重","去重后交给重排","记录每次召回了什么，便于事后归因"]}]},{"id":"kb.rerank","name":"重排","kind":"part","dom":"kb","abstract":"把真正相关的那条顶到最前","note":"投入产出比最高的一环：加个重排，问答准确率常有明显提升，代价只是一次小模型推理。不需要的场合：召回本身就很准、或者延迟极敏感。坑：把重排模型跑在 CPU 上，一次几百毫秒，交互体验直接崩。","ins":"文本片段 或 文本","outs":"文本片段","pv":[{"id":"bge-reranker","n":"BGE Reranker","k":"oss","lic":"MIT","repo":"FlagOpen/FlagEmbedding","note":"中文场景首选，小模型也能跑","effort":"","tokens":"","outline":[]},{"id":"cohere-rerank","n":"Cohere Rerank","k":"commercial","lic":"","repo":"","note":"效果稳，但是按次收费且数据出境","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"只写降级逻辑","effort":"不建议","tokens":"—","outline":["重排模型不要自研","自己写只做「批大小调节 + 超时降级（超时就不重排）」"]}]},{"id":"kb.fulltext","name":"关键词检索","kind":"module","dom":"kb","abstract":"精确串匹配：型号、编号、法规条号","note":"向量检索的死角由它补。需要它的信号：用户搜「RTX4090」「GB/T 1234」这类词，向量给出的是「语义相近」的废话。中文要分词，分词器选错会把专有名词拆碎。坑：只上向量不上全文，用户搜精确编号永远搜不到。","ins":"文本片段+文本","outs":"文本片段 + 界面","pv":[{"id":"meilisearch","n":"Meilisearch","k":"oss","lic":"MIT","repo":"meilisearch/meilisearch","note":"开箱即用，中文分词需配","effort":"","tokens":"","outline":[]},{"id":"tantivy","n":"Tantivy","k":"oss","lic":"MIT","repo":"quickwit-oss/tantivy","note":"Rust 的 Lucene，嵌进程序里","effort":"","tokens":"","outline":[]},{"id":"sqlite-fts","n":"SQLite FTS5","k":"oss","lic":"Public Domain","repo":"sqlite/sqlite","note":"零依赖，小库够用；中文要自己接分词","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"FTS5 + 分词器最省，自己写 BM25 也不难","effort":"2 天","tokens":"约 90 万","outline":["建倒排：词 → 片段 id 列表，中文先过分词","BM25 打分，参数用默认值起步","与向量结果做 RRF 融合","高频词做停用，否则全被「的」占满"]}]},{"id":"kb.manage","name":"库管理","kind":"module","dom":"kb","abstract":"多库隔离、增删改、重建索引","note":"看着无聊但必踩：文档一更新，旧的切片还在库里，检索就会召回过期内容。要处理的是增量与版本，不是简单的 insert。坑：改了嵌入模型却没重建，库就半废了；删文档只删了原文没删切片。","ins":"文本片段","outs":"文本片段","pv":[{"id":"ragflow-manage","n":"RAGFlow 的管理层","k":"oss","lic":"Apache-2.0","repo":"infiniflow/ragflow","note":"切片可视化并可手工改，这点比多数产品实在","effort":"","tokens":"","outline":[]},{"id":"anythingllm-ws","n":"AnythingLLM 工作区","k":"oss","lic":"MIT","repo":"Mintplex-Labs/anything-llm","note":"一工作区一库，隔离干净","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"切片可视化界面比算法更值得先做","effort":"3 天","tokens":"约 200 万","outline":["文档表 + 切片表，切片带 doc_id 与版本号","更新走「先标旧版本失效，再插新版本」，不做原地改","换嵌入模型时全库重建，用任务队列跑","提供切片浏览界面，能看能删——这是排障的命门"]}]},{"id":"ai.media.image","name":"图像生成","kind":"module","dom":"ai.media","abstract":"文字或参考图变成图片","note":"两条路：调商业 API（质量稳、按张收费）或本地跑（免费但要显卡、要调参）。判断标准：出图量。月出图几百张用 API 更划算；上千张且要批量试，本地更省。坑：本地模型的显存要求比宣传高，SDXL 至少 8G，Flux 建议 16G 起。","ins":"文本","outs":"产物文件","pv":[{"id":"comfyui","n":"ComfyUI","k":"oss","lic":"GPL-3.0","repo":"comfyanonymous/ComfyUI","note":"节点式，可控性最强，学习曲线陡","effort":"","tokens":"","outline":[]},{"id":"sd-webui","n":"SD WebUI","k":"oss","lic":"AGPL-3.0","repo":"AUTOMATIC1111/stable-diffusion-webui","note":"上手最快，插件生态老","effort":"","tokens":"","outline":[]},{"id":"fal","n":"Fal / Replicate","k":"commercial","lic":"","repo":"","note":"按张付费，免运维，适合先验证","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"自研=写调度与归档，不是写模型","effort":"不建议","tokens":"—","outline":["生成模型不训，只做调用与编排","自己写的是「提示词模板 + 批量队列 + 结果归档」这一层"]}]},{"id":"ai.media.video","name":"视频生成","kind":"module","dom":"ai.media","abstract":"文字或图变成视频片段","note":"目前全部依赖闭源模型（可灵、即梦、Runway、Veo），没有可用的开源权重能本地跑出可用质量。工程重点是「编排」：分镜、逐段生成、拼接、配音、字幕。坑：成本按秒计且很贵，一个 30 秒片试十次就是几百块；必须做预演和分镜确认。","ins":"文本","outs":"产物文件","pv":[{"id":"kling","n":"可灵 API","k":"commercial","lic":"","repo":"","note":"国内可用，按秒计费","effort":"","tokens":"","outline":[]},{"id":"jimeng","n":"即梦 API","k":"commercial","lic":"","repo":"","note":"与字节生态打通","effort":"","tokens":"","outline":[]},{"id":"veo","n":"Veo / Runway","k":"commercial","lic":"","repo":"","note":"质量好，需处理数据出境","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写（编排层）","k":"build","lic":"","repo":"","note":"自研边界：编排、重试、拼接、字幕；生成靠 API","effort":"5–8 天","tokens":"约 400 万","outline":["模型本身无开源可用，必须买 API——这里自研的是编排","分镜结构：scene[{prompt, duration, ref_image}]","逐段生成后 ffmpeg 拼接，音轨对齐","失败段单独重试，不要整片重跑（成本差十倍）"]}]},{"id":"ai.media.voice","name":"语音合成","kind":"module","dom":"ai.media","abstract":"文字变人声，或人声转文字","note":"TTS 与 ASR 常被混为一谈，其实是两个方向。选型看：要不要克隆音色（要则商业为主）、要不要离线（要则本地）。坑：中文多音字与英文混读，本地模型经常读错；ASR 对环境噪声极敏感，先降噪再说。","ins":"文本","outs":"产物文件","pv":[{"id":"gpt-sovits","n":"GPT-SoVITS","k":"oss","lic":"MIT","repo":"RVC-Boss/GPT-SoVITS","note":"少样本克隆音色，中文效果好","effort":"","tokens":"","outline":[]},{"id":"whisper","n":"Whisper","k":"oss","lic":"MIT","repo":"openai/whisper","note":"ASR 事实标准，本地可跑","effort":"","tokens":"","outline":[]},{"id":"faster-whisper","n":"faster-whisper","k":"oss","lic":"MIT","repo":"SYSTRAN/faster-whisper","note":"同质量快 4 倍，工程上更实用","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"ASR 用 faster-whisper，TTS 用现成模型","effort":"不建议","tokens":"—","outline":["语音模型不训","自己写只做「分段、静音切分、并发转录、结果合并」"]}]},{"id":"ai.media.music","name":"音乐生成","kind":"module","dom":"ai.media","abstract":"按风格描述生成一段配乐","note":"需求集中在短视频与游戏。开源权重（MusicGen 系）质量可用但节奏感一般；商业 API 明显更好。坑：版权——生成音乐的商用授权各家条款不同，做产品前必须先看条款。","ins":"文本","outs":"产物文件","pv":[{"id":"musicgen","n":"MusicGen","k":"oss","lic":"MIT","repo":"facebookresearch/audiocraft","note":"本地可跑，30 秒片段质量够用","effort":"","tokens":"","outline":[]},{"id":"suno","n":"Suno","k":"commercial","lic":"","repo":"","note":"质量最好，商用授权需细读","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"编排层为主","effort":"不建议","tokens":"—","outline":["模型不训","自己写只做「按场景选风格 + 批量生成 + 淡入淡出裁剪」"]}]},{"id":"dev.code.index","name":"代码索引","kind":"module","dom":"dev.code","abstract":"让模型知道这个仓库里有什么、在哪","note":"所有代码 Agent 的地基。做不好就表现为「改了不相关的文件」或「重复实现已有函数」。两种做法：全文 grep（简单、准、但上下文占得多）与向量索引（省 token、但会漏）。实测两者结合最好：先用结构信息（文件树、符号表）定位，再按需读片段。坑：大仓不做增量索引，每次全量 embed 要几十分钟。","ins":"原始文件","outs":"文本片段","pv":[{"id":"tree-sitter","n":"tree-sitter","k":"oss","lic":"MIT","repo":"tree-sitter/tree-sitter","note":"按语法解析，符号与调用关系都拿得到","effort":"","tokens":"","outline":[]},{"id":"ctags","n":"universal-ctags","k":"oss","lic":"GPL-2.0","repo":"universal-ctags/ctags","note":"最轻，几秒建完符号表","effort":"","tokens":"","outline":[]},{"id":"sourcegraph","n":"Sourcegraph / Zoekt","k":"oss","lic":"Apache-2.0","repo":"sourcegraph/zoekt","note":"大仓搜索的工业级方案","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"「先定位再读」比整仓向量化省一个数量级","effort":"5 天","tokens":"约 400 万","outline":["先建符号表：文件 → 函数/类 + 起止行（ctags 或 tree-sitter）","检索分两步：先按关键词/符号名定位文件，再按行范围读","需要语义时才对函数级 embed，别整仓 embed","增量：按文件 mtime + hash 判断是否重解析"]}]},{"id":"dev.code.complete","name":"行内补全","kind":"module","dom":"dev.code","abstract":"光标处的下几个 token","note":"要求延迟极低（<300ms），所以用小模型、本地优先。坑：上下文给太多反而慢且不准——给前后各 50 行 + 相关符号就够。另一个坑是「接受率」：补全太啰嗦会被忽略，宁可短而准。","ins":"文本","outs":"文本","pv":[{"id":"continue","n":"Continue","k":"oss","lic":"Apache-2.0","repo":"continuedev/continue","note":"开源补全插件，可换模型","effort":"","tokens":"","outline":[]},{"id":"fim","n":"FIM 小模型（如 Qwen2.5-Coder）","k":"pattern","lic":"","repo":"","note":"专用 fill-in-middle 模型，本地跑得快","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"防抖与取消比模型选择更影响体验","effort":"3 天","tokens":"约 220 万","outline":["上下文组装：前 50 行 + 后 20 行 + 同文件符号","请求做防抖（150ms）+ 取消旧请求，否则打字时全是废请求","输出截断到单行或单块，多了没人看","记录接受率，用来调上下文长度"]}]},{"id":"dev.code.edit","name":"批量改写","kind":"module","dom":"dev.code","abstract":"按需求跨文件修改并自验","note":"和补全的区别：要规划、要读写多文件、要能验证。核心是「改完怎么知道对」——必须跑测试或类型检查，否则只是在猜。坑：直接覆盖整文件会丢掉用户未提交的改动；应该用精确 patch。","ins":"文本+文本片段","outs":"产物文件 + 外部动作","pv":[{"id":"aider","n":"Aider","k":"oss","lic":"Apache-2.0","repo":"Aider-AI/aider","note":"diff 式改写 + git 提交，工程上最成熟","effort":"","tokens":"","outline":[]},{"id":"cline","n":"Cline","k":"oss","lic":"Apache-2.0","repo":"cline/cline","note":"IDE 内的编辑 Agent，能看到每一步","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"diff + 验证闭环是这一格的全部价值","effort":"5 天","tokens":"约 380 万","outline":["先让模型输出 unified diff，不要整文件重写","应用 patch 前先 dry-run，冲突就回退并要求重出","改完立刻跑 lint/test，把结果回灌给模型","每步落 git stash 或分支，方便人对比与回滚"]}]},{"id":"dev.code.review","name":"代码审查","kind":"module","dom":"dev.code","abstract":"找出改动里的问题","note":"价值在于「只看 diff 不看全仓」，否则上下文费用爆炸。坑：泛泛地说「建议加注释」毫无价值；有效的审查要绑定具体行号与具体风险（空指针、并发、SQL 注入）。","ins":"文本+产物文件","outs":"结构化记录","pv":[{"id":"reviewdog","n":"reviewdog","k":"oss","lic":"MIT","repo":"reviewdog/reviewdog","note":"把结果写回 PR，工程流水线用","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"约束输出格式比换模型更有效","effort":"3 天","tokens":"约 200 万","outline":["输入只给 diff + 被改函数的完整定义","提示词要求「每条必须带行号 + 风险类型 + 修复建议」","按严重度分级，只报高置信的","接 CI，输出统一 JSON 便于 reviewdog 消费"]}]},{"id":"ai.flow.canvas","name":"可视化画布","kind":"module","dom":"ai.flow","abstract":"拖节点、连线、试跑","note":"它解决的是「让非程序员也能改流程」。坑：画布好做、调试难做——没有单步执行与节点级日志，用户只能整条重跑，体验极差。做产品时优先做「单节点试跑 + 看输入输出」，比动画炫酷重要得多。","ins":"结构化记录","outs":"结构化记录","pv":[{"id":"reactflow","n":"React Flow","k":"oss","lic":"MIT","repo":"xyflow/xyflow","note":"前端画布事实标准，自己接后端","effort":"","tokens":"","outline":[]},{"id":"langflow","n":"Langflow","k":"oss","lic":"MIT","repo":"langflow-ai/langflow","note":"画布 + 执行一体，可直接当产品壳","effort":"","tokens":"","outline":[]},{"id":"flowise","n":"Flowise","k":"oss","lic":"Apache-2.0","repo":"FlowiseAI/Flowise","note":"偏 LLM 场景，开箱节点多","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"画布本身一周，值得花的是调试体验","effort":"7–10 天","tokens":"约 600 万","outline":["图结构：nodes[] / edges[]，节点带 inputSchema","前端用 React Flow，后端只存 JSON 图","执行器把图拓扑排序后逐节点跑，节点间传 JSON","必须做单节点试跑与断点，否则调试等于盲跑"]}]},{"id":"ai.flow.node","name":"节点与连接器","kind":"module","dom":"ai.flow","abstract":"预置的集成：数据库、HTTP、各家 SaaS","note":"节点数量决定「能接什么」，是这类产品最重的运营工作。判断标准：常见 20 个够用，剩下靠自定义 HTTP。坑：每个节点都写一套认证，重复且易泄露密钥；应统一凭证管理。","ins":"结构化记录","outs":"外部动作","pv":[{"id":"n8n-nodes","n":"n8n 节点生态","k":"oss","lic":"Sustainable-Use(非OSI)","repo":"n8n-io/n8n","note":"400+ 集成，注意它不是真开源，商用托管受限","effort":"","tokens":"","outline":[]},{"id":"activepieces","n":"Activepieces","k":"oss","lic":"MIT(需核)","repo":"activepieces/activepieces","note":"节点开源且许可更宽松，可作替代","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"节点是体力活，按需长，别一次铺满","effort":"按节点数递增","tokens":"每节点约 60 万","outline":["统一节点规范：认证、输入 schema、执行、输出 schema","先做 5 个最常用的（HTTP / 数据库 / 文件 / 邮件 / Webhook）","凭证统一进 vault，节点里只引用 id","每个节点配一个最小可跑示例，否则用户不会用"]}]},{"id":"ai.flow.trigger","name":"触发","kind":"module","dom":"ai.flow","abstract":"什么时候开始跑：定时、事件、Webhook","note":"没有它，流程只能手动点。三类触发各有坑：定时要考虑时区与错过补跑；事件要幂等（重复通知会跑两遍）；Webhook 要验签（否则谁都能触发你的流程）。","ins":"（不需要输入）","outs":"事件","pv":[{"id":"cron","n":"系统 cron / APScheduler","k":"oss","lic":"MIT","repo":"agronholm/apscheduler","note":"单机最省，复杂调度再上队列","effort":"","tokens":"","outline":[]},{"id":"webhook","n":"Webhook + HMAC 验签","k":"pattern","lic":"","repo":"","note":"自己实现十行，必须验签","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"轮询式调度最皮实","effort":"2 天","tokens":"约 120 万","outline":["触发器表：类型、表达式、下次执行时间、上次结果","定时用轮询而非常驻定时器，重启不丢","事件加幂等键，同键 5 分钟内只跑一次","Webhook 校验签名与时间戳，防重放"]}]},{"id":"ai.flow.run","name":"执行引擎","kind":"module","dom":"ai.flow","abstract":"真正把图跑起来：并发、重试、状态","note":"这类系统出问题九成在这里：并发跑同一流程导致数据错乱、失败没有重试、跑到一半重启就丢状态。最低要求：执行实例有 id 与状态机，每步落库，能从中断处续跑。","ins":"结构化记录 或 事件","outs":"外部动作 + 事件","pv":[{"id":"temporal","n":"Temporal","k":"oss","lic":"MIT","repo":"temporalio/temporal","note":"持久化工作流，崩了能续，工业级但重","effort":"","tokens":"","outline":[]},{"id":"bullmq","n":"BullMQ","k":"oss","lic":"MIT","repo":"taskforcesh/bullmq","note":"Redis 队列，中小规模够用","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"状态落库是核心，队列用现成的","effort":"6 天","tokens":"约 450 万","outline":["执行表：run_id / 节点 / 状态 / 输入 / 输出 / 错误","每节点跑完立即落库，重启按 status=running 续跑","失败重试带退避，同节点最多 3 次","加并发锁：同一流程同一 key 不并行"]}]},{"id":"ai.deliver.channel","name":"消息通道","kind":"module","dom":"ai.deliver","abstract":"从微信/飞书/钉钉/Telegram 收发消息","note":"让 Agent 长在用户已有的沟通工具里，而不是要求用户打开一个新 App。各家协议差异大：企业微信要自建应用、飞书有事件订阅、Telegram 最开放。坑：消息去重（平台会重推）、长任务超时（要分片回）、权限（谁能唤起 bot）。","ins":"事件 或 文本","outs":"（无产出）","pv":[{"id":"openclaw-gw","n":"OpenClaw 网关","k":"oss","lic":"MIT","repo":"openclaw/openclaw","note":"现成的多平台网关，直接复用","effort":"","tokens":"","outline":[]},{"id":"chatgpt-on-wechat","n":"chatgpt-on-wechat","k":"oss","lic":"MIT(需核)","repo":"zhayujie/chatgpt-on-wechat","note":"微信生态最成熟，注意合规风险","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"adapter 模式，先在 Telegram 上跑通再扩","effort":"4 天/平台","tokens":"约 300 万","outline":["统一 Message 结构：平台、会话、发送者、内容、原始事件","每平台一个 adapter，只做收发与签名","幂等：按平台消息 id 去重","长任务先回「收到」，完成后主动推送"]}]},{"id":"ai.deliver.publish","name":"发布托管","kind":"module","dom":"ai.deliver","abstract":"把应用变成别人能打开的链接或 API","note":"从「本机能跑」到「别人能用」的那一步。需要处理：鉴权（不能裸奔）、配额（防被刷）、HTTPS、域名。坑：把 API Key 写进前端；没有限流，被爬一次就破产。","ins":"界面","outs":"界面","pv":[{"id":"docker","n":"Docker + Caddy 反代","k":"pattern","lic":"","repo":"","note":"自托管最标准，配 Caddy 自动 HTTPS","effort":"","tokens":"","outline":[]},{"id":"vercel","n":"Vercel / Cloudflare","k":"commercial","lic":"","repo":"","note":"静态与边缘函数最省事","effort":"","tokens":"","outline":[]},{"id":"ai-write","n":"AI 自己写","k":"build","lic":"","repo":"","note":"发布本身不难，难在别把密钥漏出去","effort":"2–3 天","tokens"
