        <div class="cells">${m.cells.map(c => `<span>${c}</span>`).join("")}</div>
        ${proWrap(m)}
      </div>
      <div class="act">
        ${on ? `<button class="x" data-x="${m.id}" title="不要这个">✕</button>` : ""}
        <div class="tick">✓</div>
      </div>
    </div>`;
  };
  const packHTML = p => {
    const ms = packMods(p.id);
    const on = ms.filter(m => S.hub.mods.includes(m.id));
    const [tn] = TIER[packTierEff(p.id)];
    return `<div class="pk ${on.length ? "" : "off"} ${inScene(p.id) ? "" : "out"}" data-pk="${p.id}" style="--h:${p.hue}">
      <div class="ph">
        <span class="pico">${art(p.art, 20, hue(p.hue, 50, 42))}</span>
        <b>${esc(p.nm)}</b>
        <span class="ptk ${p.tier}">${tn}包</span>
        ${inScene(p.id) ? "" : `<span class="pout">场景外</span>`}
        <span class="pn">${on.length}/${ms.length}</span>
        <button class="pall" data-pall="${p.id}">${on.length === ms.length ? "全不选" : "全选"}</button>
      </div>
      <div class="ps">${esc(p.sub)}</div>
      <div class="plist">${ms.map(m => modCard(m, p)).join("")}</div>
    </div>`;
  };

  $("#view").innerHTML = `<div class="page">
    <div class="pagehd"><div><h1>要哪几包？</h1>
      <p>场景 <b>${esc(sc.nm)}</b>、形态 <b>${formDef().nm}</b>、规格 <b>${esc(hubStyleName())}</b>。
      包是一成套的功能：整包勾上最省事，也可以只留包里的一两个模块。
      同一个模块出现在两个包里是正常的——勾一次，两边都算。</p></div>
      <div class="right"><span class="badge mute" id="modCnt">已选 ${S.hub.mods.length} 个模块</span></div></div>

    if(n2) n2.disabled = !ms.length;
  };
  const repaintPack = pid => {
    const box = document.querySelector(`#view .pk[data-pk="${pid}"]`);
    if(!box) return;
    const p = packOf(pid), ms = packMods(pid);

    const has = S.hub.mods.includes(id);
    S.hub.mods = has ? S.hub.mods.filter(x => x !== id) : [...S.hub.mods, id];
    if(!has){ const m = hubMod(id); if(m && !S.hub.plans[id]) S.hub.plans[id] = (m.provs.find(p => p.lv === "rec") || m.provs[0]).id; }
    S.picks = hubCells(S.hub.mods);

    const m = hubMod(id);

/* ────────── 视图：选型 ────────── */
/* ────────── 连线：两张图 + 一次装模块的动画 ──────────
   上面那张是「包图」——用户视角：哪些包、包里装了哪几块，一个模块属于两个包就画两条线。
   下面那张是「逻辑图」——底层视角：模块摊开成能力格之后，谁吐什么、谁吃什么。
   两张图看的是同一份东西，只是站的位置不同。 */
const DOMHUE = {};
/* 连线页「滚到才开测」用的滚动监听，换页时要摘掉，不然每进一次挂一个 */
let wireScrollH = null;
function domHue(dom){
  if(DOMHUE[dom] == null){
    const i = Math.max(0, D.domOrder.indexOf(dom));
    DOMHUE[dom] = (205 + i * 41) % 360;
  }
  return DOMHUE[dom];
}
/* 逻辑图的层次：按「谁给它输入」排。断点格（没人产）放第一层，好看出断在哪 */
function wireLevels(picks){
  const given = {};
  picks.forEach(c => (W[c] || [[], []])[1].forEach(t => (given[t] = given[t] || []).push(c)));
  const lv = {}, seen = {};
  const of = cid => {
    if(lv[cid] != null) return lv[cid];
    if(seen[cid]) return 0;                       // 环：直接落第 0 层，别递归爆栈
    seen[cid] = 1;
    const req = (W[cid] || [[], []])[0];
    let max = -1;
    req.forEach(grp => grp.forEach(t => (given[t] || []).forEach(p => {
      if(p !== cid && picks.includes(p)) max = Math.max(max, of(p));
    })));
    lv[cid] = max + 1;
    return lv[cid];
  };
  picks.forEach(of);
  return lv;
}
function packMapHTML(){
  const mods = S.hub.mods.map(hubMod).filter(Boolean);
  /* 只列「这个包自己的模块被装了」的行。
     否则旅宿场景里会冒出「仓储作业包」，里头只有跨包的离线与点检两格，
     看着像装了个空包——其实那两个模块的主包在别处。 */
  const used = PACKS.filter(p => mods.some(m => m.pk === p.id));
  /* 按包分行：一行一个包，右边是它装的模块。
     同一个模块出现在两行不是重复——它确实同时属于两个包，两行都亮着就说明这一点。 */
  return `<div class="pmap">
    ${used.map(p => {
      const ms = mods.filter(m => m.pks.includes(p.id));
      return `<div class="prow" style="--h:${p.hue}">
        <div class="pnode" data-pk="${p.id}">
          <span class="pd">${art(p.art, 15, hue(p.hue, 50, 40))}</span>
          <b>${esc(p.nm)}</b><i>${ms.length}</i>
        </div>
        <div class="pchips">${ms.map(m => {
          const others = m.pks.filter(x => x !== p.id).map(x => packOf(x).nm);
          return `<span class="mnode" style="--h:${p.hue}" title="${esc(others.length ? "也在：" + others.join("、") : m.nm)}">
            ${esc(m.nm)}${others.length ? `<em>+${others.length}</em>` : ""}</span>`;
        }).join("")}</div>
      </div>`;
    }).join("")}
  </div>`;
}
function logicMapHTML(){
  const picks = S.picks.slice(), r = check(picks);
  const cli = ((S.hub && S.hub.form) === "cli");
  const ext = cli ? [...D.ext, "X"] : D.ext;
  /* 布局不用「依赖层级」——层级的代价是某一层挤十几个、其他层空着，图会又高又散。
     改成按施工序铺格子：一行 8 个，铺满换列。从左往右就是从先做到后做，
     而且高度恒定，屏幕上看得全。依赖用曲线连，交叉是必然的，但读得出流向。 */
  const seq = r.order.filter(c => picks.includes(c));
  const IDX = {}; seq.forEach((c, i) => IDX[c] = i);
  const ROWS = Math.min(8, Math.max(3, Math.ceil(seq.length / 6)));
  const NW = 120, NH = 29, GX = 176, GY = 33;
  const cols = Math.max(1, Math.ceil(seq.length / ROWS));
  const Wd = cols * GX + NW + 24, Ht = ROWS * GY + 46;
  const xy = {};
  seq.forEach((c, i) => { xy[c] = {x: 14 + Math.floor(i / ROWS) * GX, y: 34 + (i % ROWS) * GY}; });
  const given = {};
  picks.forEach(c => (W[c] || [[], []])[1].forEach(t => (given[t] = given[t] || []).push(c)));
  const badCell = new Set(r.breaks.map(b => b.cid));
  const deadCell = new Set(r.dead.map(b => picks.find(c => (byId[c] || {}).name === b.who)));
  const edges = [], missing = [];
  picks.forEach(cid => {
    const req = (W[cid] || [[], []])[0];
    req.forEach(grp => {
      const okP = [];
      grp.forEach(t => (given[t] || []).forEach(p => { if(p !== cid) okP.push([p, t]); }));
      if(okP.length) okP.forEach(([p, t]) => edges.push({a: p, b: cid, t}));
      else if(!grp.some(t => ext.includes(t))) missing.push({b: cid, t: grp});
    });
  });
  const edgeSVG = edges.map((e, i) => {
    const A = xy[e.a], B = xy[e.b]; if(!A || !B) return "";
    const x1 = A.x + NW, y1 = A.y + NH / 2, x2 = B.x, y2 = B.y + NH / 2;
    /* 同一个格子里的短边直接走直线，跨列的走曲线 */
    const d = Math.abs(x2 - x1) < 6
      ? `M${x1} ${y1} L${x2} ${y2}`
      : `M${x1} ${y1} C${(x1 + x2) / 2} ${y1} ${(x1 + x2) / 2} ${y2} ${x2} ${y2}`;
    const len = Math.abs(x2 - x1) + Math.abs(y2 - y1) + 40;
    /* 线跟着「两端都测过了」才画出来：原来按边序号铺时间，会出现线先画好、格子后落的错位感 */
    const dly = Math.max(0, Math.max(IDX[e.a] || 0, IDX[e.b] || 0) * 24 - 100);
    return `<path class="edge" d="${d}" fill="none"
      stroke="hsl(${domHue((byId[e.a] || {}).dom || "app")} 45% 62%)" stroke-width="1.2" opacity=".55"
      style="--len:${len};--ed:${dly}ms"/>`;
  }).join("");
  const missSVG = missing.map(m => {
    const B = xy[m.b]; if(!B) return "";
    return `<g class="miss"><path d="M${B.x - 22} ${B.y + NH / 2} L${B.x} ${B.y + NH / 2}"
      stroke="#c2534a" stroke-width="1.6" stroke-dasharray="3 3"/>
      <text x="${B.x - 26}" y="${B.y + NH / 2 - 4}" text-anchor="end" font-size="9" fill="#c2534a">缺 ${esc(m.t.map(t => TC[t] || t).join("/"))}</text></g>`;
  }).join("");
  const anm = (S.hub && S.hub.anim) || "lego";
  const nrx = anm === "flat" ? 2 : 6;          // 平涂方块是直角块，其余是圆角
  const nodes = seq.map((cid, i) => {
    const p = xy[cid], c = byId[cid] || {};
    const nm = (c.name || cid);
    const short = nm.length > 8 ? nm.slice(0, 8) + "…" : nm;
    const cls = badCell.has(cid) ? "bad" : (deadCell.has(cid) ? "warn" : "");
    /* --r 给卡片堆叠用：奇偶交替歪向两边，才像发牌而不是集体平移 */
    return `<g class="node ${cls}" style="--d:${i * 24}ms;--r:${i % 2 ? 10 : -10}deg" data-cid="${cid}">
      <rect x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="${nrx}"
        fill="hsl(${domHue(c.dom)} 62% 96%)" stroke="hsl(${domHue(c.dom)} 45% 70%)"/>
      <rect x="${p.x}" y="${p.y}" width="3" height="${NH}" rx="1.5" fill="hsl(${domHue(c.dom)} 55% 58%)"/>
      <text x="${p.x + 9}" y="${p.y + 18.5}" font-size="10.5" fill="#3a3831">${esc(short)}</text>
      ${cls ? "" : `<circle class="okd" cx="${p.x + NW - 7}" cy="${p.y + NH - 7}" r="2.2" fill="#2f6f4e"/>`}
      ${cls === "bad" ? `<circle cx="${p.x + NW - 7}" cy="${p.y + 7}" r="3" fill="#c2534a"/>` : ""}
      ${cls === "warn" ? `<circle cx="${p.x + NW - 7}" cy="${p.y + 7}" r="3" fill="#c8932a"/>` : ""}
    </g>`;
  }).join("");
  return `<div class="lgwrap">
    <svg class="lg" id="lgmap" data-anim="${(S.hub && S.hub.anim) || "lego"}"
      viewBox="0 0 ${Wd} ${Ht}" preserveAspectRatio="xMinYMin meet" style="width:${Wd}px;height:${Ht}px">
      <g class="edges">${edgeSVG}${missSVG}</g>
      <g class="nodes">${nodes}</g>
    </svg>
  </div>`;
}
/* 自动自检：进页面就自己跑一遍，从第一格测到最后一格。
   为什么要自动：用户不会主动去点「走一遍」，他只会看这页一眼就往下走——
   所以「能不能接上」得当场演给他看，跑完直接把结论写在那条上。 */
function playLogic(){
  const svg = $("#lgmap"); if(!svg) return;
  cancelAnimationFrame(playLogic._raf || 0);
  const ns = [...svg.querySelectorAll("g.node")], n = ns.length;
  const tb = $("#tbar"), st = $("#tst"), num = $("#tnum"),
        fill = $("#tfill"), res = $("#tres");
  let cur = null;
  if(!tb) return;
  const bad = +(tb.dataset.bad || 0), dead = +(tb.dataset.dead || 0), lines = +(tb.dataset.lines || 0);
  ns.forEach(g => g.removeAttribute("data-t"));
  tb.className = "testbar run";
  st.innerHTML = `<i class="tdot"></i>正在测试连线`;
  num.textContent = `0 / ${n} 格`;
  fill.style.width = "0%"; res.textContent = "";
  svg.classList.remove("play"); void svg.getBoundingClientRect(); svg.classList.add("play");
  let done = 0;
  const settle = () => {
    tb.className = "testbar " + (bad || dead ? "bad" : "ok");
    st.innerHTML = `<i class="tdot"></i>${bad || dead ? "自检没通过" : "自检通过"}`;
    num.textContent = `${n} / ${n} 格`;
    fill.style.width = "100%";
    res.innerHTML = bad || dead
      ? `<b>${bad} 个断点</b>${dead ? `、<b>${dead} 个死端</b>` : ""}　要的东西没人产出<span class="tgo" id="tgo">看哪里断了 →</span>`
      : `<b>${n} 格 · ${lines} 条连线</b>全部接上，没有死端`;
    const g2 = $("#tgo");
    if(g2) g2.onclick = () => { const t = $("#view .gapbox") || $("#view .okline"); if(t) t.scrollIntoView({behavior:"smooth", block:"center"}); };
  };
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){
    ns.forEach(g => g.dataset.t = "1"); settle(); return;
  }
  const STEP = 45, dur = n * STEP + 240, t0 = performance.now();
  const tick = now => {
    if(!document.body.contains(svg)) return;          // 中途切去别的页
    /* rAF 给的时间戳是「这一帧开始」的时刻，可能比刚取的 t0 还早几十毫秒，
       不夹一下会算出负的进度（分母变负数、ns[-2] 直接抛错，整条链就断了） */
    const el = Math.max(0, now - t0);
    const k = Math.min(n, Math.floor(el / STEP));
    if(k !== done){
      for(let i = done; i < k; i++) if(ns[i]) ns[i].dataset.t = "1";
      done = k;
      num.textContent = `${k} / ${n} 格`;
      fill.style.width = Math.round(k / n * 100) + "%";
    }
    if(ns[k - 1] && ns[k - 1] !== cur){ if(cur) cur.removeAttribute("data-c"); cur = ns[k - 1]; cur.dataset.c = "1"; }
    if(el < dur) playLogic._raf = requestAnimationFrame(tick);
    else { ns.forEach(g => g.dataset.t = "1"); if(cur) cur.removeAttribute("data-c"); settle(); }
  };
  playLogic._raf = requestAnimationFrame(tick);
}

    playLogic();
  });

        </div>
        ${empty ? `<div class="card box"><div class="bh">没有对应的能力格</div>
          <div class="empty">这句需求落在库的能力范围外。看右边「库外」，那里写了这类事通常怎么做；

      </div>

      <aside class="right" id="planAside">${asideHTML(r)}</aside>
    </div>
    <div class="mobar" id="planMob">${mobHTML(r)}</div>
  </div>`;

  // 勾一格只重画受影响的部分：左边卡片的勾选态、计数、右栏（断点/施工程序）、底栏。
  // 整页重绘会把 #main 的滚动位置弹回顶部，看着就像刷新了一次
  const redraw = () => {
    const r2 = check(S.picks);
    document.querySelectorAll("#view [data-cid]").forEach(n => {
      const on = S.picks.includes(n.dataset.cid);
      n.classList.toggle("off", !on);
      const cb = n.querySelector("[data-chk]");
      if(cb && cb.checked !== on) cb.checked = on;
    });
    document.querySelectorAll("#view [data-pv]").forEach(p => {
      const [cid, pid] = p.dataset.pv.split("|");
      const cur = prov(cid);
      p.classList.toggle("on", !!(cur && cur.id === pid));
    });
    const k = $("#planK"); if(k) k.innerHTML = kHTML();
    const as = $("#planAside"); if(as) as.innerHTML = asideHTML(r2);
    const mb = $("#planMob"); if(mb) mb.innerHTML = mobHTML(r2);
    bindNext();
    saveLater();
  };
  document.querySelectorAll("[data-chk]").forEach(cb => cb.onchange = () => {
    const cid = cb.dataset.chk;
    if(cb.checked){ if(!S.picks.includes(cid)) S.picks.push(cid); }
    else S.picks = S.picks.filter(x => x !== cid);
    redraw();
  });
  document.querySelectorAll("[data-pv]").forEach(p => p.onclick = () => {
    const [cid, pid] = p.dataset.pv.split("|");
    S.sels[cid] = pid; redraw();
  });
  document.querySelectorAll("[data-detail]").forEach(a => a.onclick = () => detail(a.dataset.detail));
  $("#bMin").onclick = () => { S.picks = [...cov.core]; redraw(); toast("只留必选：" + S.picks.length + " 格"); };
  $("#bAll").onclick = () => { S.picks = [...cov.core, ...cov.rec, ...cov.scene]; redraw(); toast("全开：" + S.picks.length + " 格"); };
  $("#bEdit").onclick = $("#bEdit2").onclick = () => go(isHub ? "#/hub-mods" : "#/new");
  $("#bRe").onclick = () => {
    if(isHub){ go("#/hub-plans"); return; }
    S.cov = matchNeed(S.need); S.picks = [...S.cov.core, ...S.cov.rec]; redraw(); toast("已重新解析");
  };
  bindNext();
}

/* ────────── 视图：确认 ────────── */
/* ────────── 内存模拟：装这台东西要吃掉多少 ──────────
   三笔账：外壳（运行时本身）+ 选中的包（每包一个基数）+ 本地模型（权重 + KV cache）。
   预算减掉系统与后台（桌面留 8G，安卓留 4G），剩下的才是「你的程序能用多少」。 */
function memSim(){
  const form = formOf();
  const pick = ((S.hub && S.hub.base) || {})["bs-shell"] || formDef().base;
  const shellMB = ({tauri:95, electron:225, web:45, cli:12}[pick] || 95);
  const used = new Set();
  S.hub.mods.forEach(id => { const m = hubMod(id); if(m) m.pks.forEach(p => used.add(p)); });
  const packMB = [...used].reduce((n, p) => n + (packOf(p).mb || 0), 0);
  const hasLLM = S.hub.mods.includes("llmrt") || S.hub.mods.includes("llmpull") || used.has("llm");
  const mdl = hasLLM ? modelOf() : null;
  const modelMB = mdl ? Math.round(mdl.ram * 1024) : 0;
  const total = shellMB + packMB + modelMB;
  const budget = memBudget() * 1024;
  /* 预留：桌面 8G、安卓 4G。但机器本身只有 8G 甚至 4G 时不能整块扣掉，
     否则「可用」会被扣成负数再被兜到 1G，所有组合一律「超了」——所以最多扣一半。 */
  const floorWant = platOf().includes("android") ? 4096 : 8192;
  const floor = Math.min(floorWant, Math.round(budget / 2));
  const avail = Math.max(1024, budget - floor);
  const pct = total / avail;
  /* 挤或超时都给一条具体的降级建议：找一个放得下的最大模型 */
  let down = null;
  if(pct > 0.92 && mdl){
    const room = avail - shellMB - packMB;
    /* 别推荐「就是当前这个」或同样大的——那等于没说 */
    down = LLM_MODELS.filter(m => m.ram < mdl.ram && m.ram * 1024 <= room).sort((a, b) => b.ram - a.ram)[0] || null;
  }
  return {form, pick, shellMB, packMB, modelMB, total, budget, floor, avail, pct,
          ok: pct <= 0.92, tight: pct > 0.75 && pct <= 0.92, mdl, down, packs: [...used]};
}
const mbTxt = n => n >= 1024 ? (n / 1024).toFixed(1) + " GB" : Math.round(n) + " MB";

      <button class="btn" id="bExport">导出清单</button>

}

function mdText(){
  const r = check(S.picks);
  const isHub = !!(S.hub && S.hub.mods.length);
  const L = isHub ? ["# " + hubLabel(), "", "共 " + S.hub.mods.length + " 个模块 · " +
                    S.picks.length + " 格 · " + r.lines + " 条连线", "",
                    "| 模块 | 实现方案 | 等级 | 说明 |", "|---|---|---|---|"] : [];
  if(isHub){
    const LV = {rec:"推荐", ok:"能用", warn:"慎选", build:"自研"};
    L.push("场景：" + sceneName() + "　形态：" + formDef().nm + "　规格：" + hubStyleName(), "");
    L.push("平台：" + platOf().map(x => (PLATS.find(p => p.id === x) || {}).nm).filter(Boolean).join(" / "), "");
    {
      const m = memSim();
      L.push("内存：" + mbTxt(m.total) + " / 预算 " + mbTxt(m.budget) + "（外壳 " + mbTxt(m.shellMB)
             + "、模块 " + mbTxt(m.packMB) + "、模型 " + (m.modelMB ? mbTxt(m.modelMB) : "无") + "）"
             + (m.ok ? "" : "　⚠ 超出 " + mbTxt(m.total - m.avail)), "");
    }
    S.hub.mods.forEach(id => {
      const m = hubMod(id), p = hubPlan(id);
      if(m && p) L.push(`| ${m.nm} | ${p.n} | ${LV[p.lv] || ""} | ${p.note} |`);
    });
    L.push("", "## 胶水", "", "| 项 | 做法 | 等级 | 说明 |", "|---|---|---|---|");
    GLUE.forEach(g => {
      const p = g.provs.find(x => x.id === (S.hub.glue || {})[g.id]) || g.provs[0];
      L.push(`| ${g.nm} | ${p.n} | ${LV[p.lv] || ""} | ${p.note} |`);
    });
    L.push("", "## 底座", "", "| 项 | 做法 | 等级 | 说明 |", "|---|---|---|---|");
    BASE.forEach(g => {
      const p = g.provs.find(x => x.id === (S.hub.base || {})[g.id]) || g.provs[0];
      L.push(`| ${g.nm} | ${p.n} | ${LV[p.lv] || ""} | ${p.note} |`);
    });
    L.push("", "## 安装（会被什么拦住）", "");
    installNotes(formOf(), platOf()).forEach(n => {
      L.push("### " + n.pl);
      n.items.forEach(it => L.push("- **" + it.ty + "**：" + it.body.replace(/<[^>]+>/g, "")));
    });
    L.push("", "## 底层能力格", "");
  }else{
    L.push("# " + S.need, "", "共 " + S.picks.length + " 格 · " + r.lines + " 条连线", "");
  }
  L.push("| 施工序 | 模块 | 方案 | 类型 |", "|---|---|---|---|");
  r.order.filter(c => S.picks.includes(c)).forEach((cid, i) => {
    const c = byId[cid], p = prov(cid);
    L.push(`| ${i + 1} | ${c.name} | ${p ? p.n : "—"} | ${p ? (KIND[p.k] || p.k) : "—"} |`);
  });
  if(S.cov && S.cov.gaps && S.cov.gaps.length){ L.push("", "## 库外", ""); S.cov.gaps.forEach(g => L.push(`- **${g.name}**：${g.how}`)); }
  return L.join("\n");
}

function exportMd(){
  const isHub = !!(S.hub && S.hub.mods.length);
  const blob = new Blob([mdText()], {type: "text/markdown;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = isHub ? sceneName() + "清单.md" : "装配清单.md"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("已导出 " + a.download);

/* ────────── 视图：组装 ────────── */
function startBuild(){
  const r = check(S.picks);
  const isHub = !!(S.hub && S.hub.mods.length);
  S.build = {order: isHub ? S.hub.mods.slice() : r.order.filter(c => S.picks.includes(c)),
             hub: isHub, i: 0, pct: 4, paused: false,
             busy: false, logs: [], t0: Date.now(), done: false};
  const isHw = !isHub && S.picks.some(c => c.indexOf("hw.") === 0);
  S.build.isHw = isHw;
  S.build.logs.push({t: "0.0s", c: "dim",
    s: isHub ? "→ 开板：先立外壳与数据仓，空槽留给还没插的模块"
            : (isHw ? "→ 建工程目录：原理图 / 结构 / 固件 / BOM 四套文件"
                    : "→ 初始化工程骨架（package.json / src / .env.example）")});
  renderBuild();
  setTimeout(tick, 500);
  save();
}

/* 一次只推进一步；离开页面就停下（回来时由 viewBuild 重新点火） */
function tick(){
  const b = S.build;
  if(!b || b.done || b.paused || b.busy) return;
  if((location.hash || "").indexOf("#/build") !== 0) return;
  b.busy = true;

  if(b.i < b.order.length){
    // 中台这套：一步 = 往板子上插一块模块；其余走原来的逐格安装
    if(b.hub){
      const mid = b.order[b.i], m = hubMod(mid), pl = hubPlan(mid);
      const what = "插上 " + (m ? m.nm : mid) + (pl ? " · " + pl.n : "");
      b.logs.push({t: el(b.t0), s: "→ " + what, c: "now"});
      b.pct = Math.round(8 + (b.i / Math.max(1, b.order.length)) * 82);
      renderBuild();
      setTimeout(() => {
        b.logs[b.logs.length - 1] = {t: el(b.t0), c: "ok", s: "✓ " + what};
        b.i++;
        b.pct = Math.round(8 + (b.i / Math.max(1, b.order.length)) * 82);
        b.busy = false; renderBuild();
        setTimeout(tick, 200);
      }, 620);
      return;
    }
    const cid = b.order[b.i], c = byId[cid], p = prov(cid);
    const label = c.name + " · " + (p ? p.n : "默认方案");
    // 硬件的「一步」不是装依赖：是打样、焊接、烧录、联调。同一套推进逻辑换个动词。
    const HW_STEP = {
      "hw.pcb": "出 Gerber，发去打样", "hw.enclosure": "出 STL，打首件",
      "hw.power": "上电测电流", "hw.sense": "焊接传感器并标定",
      "hw.mcu": "烧最小系统，自检", "hw.firmware": "编译固件并烧录",
      "hw.display": "点亮屏，刷第一帧", "hw.wireless": "配网联调",
      "hw.gateway": "打通一条数据到服务端", "hw.cert": "整理认证资料与送检样机"
    };
    const what = HW_STEP[cid] || ("安装 " + c.name);
    b.logs.push({t: el(b.t0), s: "→ " + what, c: "now"});
    b.pct = Math.round(8 + (b.i / Math.max(1, b.order.length)) * 82);
    renderBuild();
    setTimeout(() => {
      b.logs[b.logs.length - 1] = {t: el(b.t0), c: "ok",
        s: "✓ " + what + (p ? "（" + p.n + "）" : "")};
      b.i++;
      b.pct = Math.round(8 + (b.i / Math.max(1, b.order.length)) * 82);
      b.busy = false; renderBuild();
      setTimeout(tick, 200);
    }, 560);
    return;
  }
  if(b.pct < 92){
    b.logs.push({t: el(b.t0), c: "dim",
      s: b.isHw ? "→ 接线上电：每块板逐一通电，核对每格进出" : "→ 接线检查：按基板核对每格的进出"});
    b.pct = 94; b.busy = false; renderBuild();
    setTimeout(tick, 620); return;
  }
  if(b.pct < 99){
    b.logs.push({t: el(b.t0), c: "dim",
      s: b.isHw ? "→ 整机自检：连续跑 24 小时，看读数漂移与掉电" : "→ 自检：类型检查 / 依赖锁版本"});
    b.pct = 99; b.busy = false; renderBuild();
    setTimeout(tick, 620); return;
  }
  b.done = true; b.pct = 100; b.busy = false;
  b.logs.push({t: el(b.t0), s: "✓ 组装完成，用时 " + el(b.t0), c: "ok"});
  renderBuild();
  setTimeout(() => go("#/done"), 900);
}

function el(t0){ return ((Date.now() - t0) / 1000).toFixed(1) + "s"; }

function viewBuild(){
  const b = S.build;

  topbar(b.hub ? `工作台 <span>/</span> <b>${esc(sceneName())}</b>` : `工作台 <span>/</span> <b>组装中</b>`,
    b.hub ? hubSteps(6) : 3, `<span class="badge warn">模拟</span>`);

/* 中台：主板 + 插槽。每插一块，模块从上方落下、卡进槽位、焊点亮一下。
   动效由 S.hub.anim 决定（连线圈里选的，那边和这里共用同一套）。 */
function pcbHTML(b){
  const anim = (S.hub && S.hub.anim) || "lego";
  const chips = b.order.map((id, i) => {
    const m = hubMod(id);
    if(!m) return "";
    const pk = packOf(m.pk);
    if(i < b.i) return `<div class="mchip ${i === b.i - 1 && !b.done ? "just" : ""}" style="--h:${pk.hue};--i:${i}"><span class="nm">${esc(m.nm)}</span></div>`;
    return `<div class="slot">${esc(m.nm)}</div>`;
  }).join("");
  const ins = b.i, tot = b.order.length;
  return `<div class="pcb" data-anim="${anim}">
    <div class="hd"><i>◼</i> ${esc(sceneName())} · 主板 <i style="margin-left:auto">${ins}/${tot} 已插上</i></div>
    <div class="grid">${chips}</div>
    <div class="pcbfoot">${esc((ANIMS.find(a => a.id === anim) || ANIMS[0]).nm)} · ${esc(formDef().nm)} · ${esc(hubStyleName())}</div>
  </div>`;
}

function renderBuild(){
  const b = S.build; if(!b) return;
  const box = $("#bw"); if(!box) return;
  const stage = b.pct < 10 ? 0 : (b.pct < 92 ? 1 : (b.pct < 98 ? 2 : 3));
  const names = b.hub ? ["开板", "插模块", "通电", "自检"]
              : (b.isHw ? ["建目录", "打样与烧录", "接线上电", "整机自检"]
                        : ["脚手架", "逐格安装", "接线检查", "自检"]);
  const C = 2 * Math.PI * 54;
  box.innerHTML = `
    ${b.hub ? pcbHTML(b) : ""}
    <div class="ring" style="${b.hub ? "margin-top:14px" : ""}">
      <svg width="132" height="132" viewBox="0 0 132 132">
        <circle cx="66" cy="66" r="54" fill="none" stroke="#eeece6" stroke-width="9"/>
        <circle cx="66" cy="66" r="54" fill="none" stroke="#3c3a35" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - b.pct / 100)}" style="transition:stroke-dashoffset .45s"/>
      </svg>
      <div class="c"><b>${b.pct}%</b><span>${b.done ? "完成" : (b.paused ? "已暂停" : (b.hub ? "插模块" : "组装中"))}</span></div>
    </div>
    <div style="text-align:center;font-size:13px;color:var(--dim);margin-bottom:4px">
      ${b.done ? "全部就绪" : (b.paused ? "已暂停，点继续恢复"
        : (b.hub ? "正在插第 " + Math.min(b.i + 1, b.order.length) + " / " + b.order.length + " 个模块"
                 : "正在装第 " + Math.min(b.i + 1, b.order.length) + " / " + b.order.length + " 格"))}
    </div>
    <div class="stage">${names.map((n, i) => `<div class="s ${i === stage ? "on" : (i < stage ? "done" : "")}"><i></i>${n}</div>`).join("")}</div>
    <div class="log" id="log">${b.logs.map(l => `<div class="${l.c}"><span class="t">${l.t}</span>  ${esc(l.s)}</div>`).join("")}</div>
    <div class="buildbar">
      <button class="btn back" id="bBBack">← 上一步：回确认清单</button>
      ${b.done
        ? `<button class="btn primary" id="bFin">查看结果</button>`
        : `<button class="btn" id="bPause">${b.paused ? "继续" : "暂停"}</button>
           <button class="btn danger" id="bStop">中止</button>`}
    </div>`;
  const log = $("#log"); if(log) log.scrollTop = log.scrollHeight;
  const pz = $("#bPause");
  if(pz) pz.onclick = () => {
    b.paused = !b.paused;
    if(!b.paused) tick();
    renderBuild();
  };
  const st = $("#bStop");
  if(st) st.onclick = () => {
    modal(`<div class="mh"><b>中止组装？</b><button class="x" data-x="1">✕</button></div>
      <div class="mb"><p style="margin:0">已装好的格会保留，下次可以接着装。这是原型，实际上不会留下任何文件。</p></div>`,
      `<button class="btn" data-x="1">继续装</button><button class="btn danger" id="bYes">确认中止</button>`);
    $("#modal").querySelectorAll("[data-x]").forEach(x => x.onclick = closeModal);
    $("#bYes").onclick = () => { S.build = null; closeModal(); go("#/home"); toast("已中止"); };
  };
  const fin = $("#bFin"); if(fin) fin.onclick = () => go("#/done");
  /* 组装跑到一半发现选错了也能退：已装好的保留，回确认页改完再进来接着装 */
  const bk = $("#bBBack");
  if(bk) bk.onclick = () => { if(b.pct > 0 && !b.done) b.paused = true; go("#/confirm"); };
}

/* ────────── 试用：把选好的中台拼出来，先让人点一遍 ──────────
   试用和打包出去的是同一份文档：这里生成完整 HTML 字符串，
   页面里用 iframe.srcdoc 跑，打包时原文写进 zip 的 index.html。
   好处是「试的」和「带走的」不会分叉。 */
/* 试用数据的存储键按「装配签名」分桶：
   原来所有中台共用一个键，A 草稿的待办会串到 B 草稿里；分桶之后每套装配各存各的。 */
function sigOf(s){
  let h = 5381;
  for(let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}
function trialData(){
  const isHub = !!(S.hub && S.hub.mods.length);
  /* 最小包：只留地基（core 里必装的那几块）+ 扩展系统。
     扩展系统是「以后下载模块」的入口，最小包里必须留着，不然后面加不上东西。 */
  const min = !!(isHub && S.hub.min);
  const all = isHub ? S.hub.mods.map(hubMod).filter(Boolean) : [];
  const keepMin = m => (m.pks.includes("core") && m.tier === "must") || m.id === "plugin";
  /* 最小包必须带「扩展系统」——它就是以后下载模块的入口。
     用户没勾也要塞进去，不然这个包是个死的：既没法加东西，也没有商店页面。 */
  const minSet = () => {
    const a = all.filter(keepMin);
    return a.some(m => m.id === "plugin") ? a : [...a, hubMod("plugin")];
  };
  const mods = min ? minSet() : all;
  const ids = mods.map(m => m.id);
  const picks = min ? hubCells(ids) : S.picks.slice();
  const r = check(picks);
  const memo = isHub ? memSim() : null;
  return {
    sig: isHub ? sigOf([S.hub.scene, S.hub.sty, S.hub.form, ids.slice().sort().join(",")].join("|")) : "need",
    form: isHub ? formDef().id : "app",
    formNm: isHub ? formDef().nm : "自定义",
    plat: isHub ? platOf().slice() : [],
    platNm: isHub ? platOf().map(x => (PLATS.find(p => p.id === x) || {}).nm).filter(Boolean) : [],
    min: min,
    anim: (S.hub && S.hub.anim) || "lego",
    mem: memo ? {total: memo.total, budget: memo.budget, shell: memo.shellMB, pack: memo.packMB,
                 model: memo.modelMB, ok: memo.ok, modelNm: memo.mdl ? memo.mdl.nm : "",
                 tps: memo.mdl ? memo.mdl.tps : 0, gb: memo.mdl ? memo.mdl.gb : 0} : null,
    shop: (() => {
      if(!isHub) return [];
      /* 一个模块可能挂在几个包里；商店里只出现一次，否则「还剩 N 个」会数重 */
      const seenShop = {};
      const cut = [];
      PACKS.forEach(p => packMods(p.id).forEach(m => {
        if(ids.includes(m.id) || seenShop[m.id]) return;
        seenShop[m.id] = 1;
        cut.push({id: p.id, nm: p.nm, hue: p.hue, tier: p.tier, m});
      }));
      return PACKS.map(p => ({
        id: p.id, nm: p.nm, hue: p.hue, tier: p.tier,
        mods: cut.filter(x => x.id === p.id).map(x => ({id: x.m.id, nm: x.m.nm, tier: x.m.tier,
          sub: x.m.sub, why: x.m.pks.length > 1 ? "也在 " + x.m.pks.map(y => packOf(y).nm).join(" / ") : ""}))
      })).filter(p => p.mods.length);
    })(),
    name: isHub ? (sceneById(S.hub.scene).nm + " · " + hubStyleName()) : (S.need || "装配结果"),
    style: isHub ? hubStyleName() : "自定义需求",
    need: S.need || "",
    at: (() => { const d = new Date(); const p = n => (n < 10 ? "0" : "") + n;
                 return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes()); })(),
    mods: mods.map(m => {
      const p = hubPlan(m.id);
      return {id:m.id, nm:m.nm, tier:m.tier, cells:m.cells,
              prov: p ? {n:p.n, k:p.k, lv:p.lv, note:p.note} : null};
    }),
    cells: picks.slice(),
    lines: r.lines,
    scene: isHub ? sceneById(S.hub.scene).nm : "",
    packs: isHub ? PACKS.filter(p => mods.some(m => m.pks.includes(p.id))).map(p => {
      return {id:p.id, nm:p.nm, tier:p.tier, hue:p.hue, n:mods.filter(m => m.pks.includes(p.id)).length};
    }) : [],
    glue: isHub ? GLUE.map(g => {
      const pv = g.provs.find(x => x.id === (S.hub.glue || {})[g.id]) || g.provs[0];
      return {id:g.id, nm:g.nm, pick:pv.n, k:pv.k, why:g.why || g.sub};
    }) : [],
    base: isHub ? BASE.map(g => {
      const pv = g.provs.find(x => x.id === (S.hub.base || {})[g.id]) || g.provs[0];
      return {id:g.id, nm:g.nm, pick:pv.n, k:pv.k, why:g.sub};
    }) : [],
    order: r.order.filter(c => picks.includes(c)).map(c => ({id:c, nm:(byId[c] || {}).name || c}))
  };
}

@media(max-width:620px){.nav{width:112px}.hdr .badge.hide{display:none}main{padding:12px}.at{display:none}}`;
}

/* 试用页的运行时（toString 后会作为独立脚本写进文档，不能引用本页任何变量） */
function trialRuntime(D){
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const pad = n => (n < 10 ? "0" : "") + n;
  const ts = () => { const d = new Date(); return (d.getMonth()+1) + "-" + d.getDate() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); };
  /* 每套装配一份数据：同一个草稿再打开，里面点过的东西还在；换一套不会串味 */
  const K = "moshan.trial.v2:" + (D.sig || "x");
  const save = () => { try { localStorage.setItem(K, JSON.stringify(ST)); } catch(e){} };

  const seed = () => ({
    todo: [{t:"把这一版翻一遍，看看哪些模块其实用不上", done:false, at:ts()},
           {t:"叉掉不用的，回去重新装一次", done:false, at:ts()}],
    note: [{t:"中台的第一条笔记\n这段话只存在你自己的浏览器里。换台设备看不到——要跨设备，得装「多端同步」。", at:ts()}],
    clip: [{t:"https://news.ycombinator.com/item?id=39210000", k:"链接"},
           {t:'{"model":"gpt-5","tokens":842,"cost":0.0031}', k:"JSON"},
           {t:"/Users/me/Documents/发票 2026-11.pdf", k:"路径"}],
    plug: {pomo:true, git:false},
    board: [{t:"把这一版过一遍", c:0}, {t:"定下三个包的实现", c:1},
            {t:"数据仓建表", c:2}, {t:"连通检查跑通", c:0}],
    cal: [{d:0, t:"周会 10:00"}, {d:2, t:"交版本"}, {d:3, t:"对账"}, {d:5, t:"复盘"}],
    gen: [{p:"雨里的橘猫，赛博朋克", c:"#c9a227"}, {p:"一张能当封面的构图", c:"#7f9b6a"}],
    stock: [{sku:"SKU-001", nm:"帆布包 · 黑", qty:12, hold:2},
            {sku:"SKU-002", nm:"帆布包 · 米", qty:3, hold:1},
            {sku:"SKU-003", nm:"钥匙扣 · 共版", qty:0, hold:0}],
    syncOn: false, syncAt: "从未同步",
    launch: [{n:"VS Code", c:"#2f6feb"}, {n:"Chrome", c:"#e07b39"}, {n:"终端", c:"#26251f"}, {n:"备忘录", c:"#c9a227"}],
    tab: null
  });
  let ST = null;
  try { ST = JSON.parse(localStorage.getItem(K) || "null"); } catch(e){ ST = null; }
  if(!ST || !Array.isArray(ST.todo)) ST = seed();
  if(!ST.launch) ST.launch = seed().launch;
  if(!ST.plug) ST.plug = seed().plug;

  const NAV = [["todo","待办"],["note","速记"],["board","看板"],["cal","日程"],["search","搜索"],
               ["ai","AI 助手"],["imagegen","生图"],["stock","库存"],["clip","剪贴板"],
               ["launch","启动器"],["plugin","扩展"],["update","更新"],["sync","同步"],["data","数据"]];
  const have = id => D.mods.some(m => m.id === id);
  const tabs = NAV.filter(([id]) => have(id));
  /* 最小包里只有地基，但「模块商店」这个入口必须在——不然用户以后没法加模块 */
  if((D.shop || []).length) tabs.push(["shop", "模块商店"]);
  if(!ST.tab || !tabs.some(([id]) => id === ST.tab)) ST.tab = tabs.length ? tabs[0][0] : "data";

  const toast = txt => {
    let t = $("#tip");
    if(!t){ t = document.createElement("div"); t.id = "tip";
      t.style.cssText = "position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:#26251f;color:#fff;" +
        "font-size:12px;padding:7px 14px;border-radius:8px;opacity:0;transition:.18s;pointer-events:none;z-index:9";
      document.body.appendChild(t); }
    t.textContent = txt; t.style.opacity = 1;
    clearTimeout(t._h); t._h = setTimeout(() => { t.style.opacity = 0; }, 1600);
  };

  const P = {};

  /* ── CLI 形态：没有界面就没有面板，只有提示符。命令是真的会改 ST 的。 ── */
  if(D.form === "cli"){
    document.body.innerHTML = `<div class="cliwrap"><div class="clibar">
        <b>${esc(D.name)}</b><span class="badge">CLI</span><span class="badge sim">模拟</span>
        <span style="flex:1"></span><span class="badge">${D.mods.length} 模块 · ${D.cells.length} 格</span></div>
      <div class="cliscr" id="scr"></div>
      <div class="cliin"><span>$</span><input id="cin" autocomplete="off" spellcheck="false" placeholder="help"></div></div>`;
    const scr = $("#scr"), inp = $("#cin");
    const out = (t, c) => { const d = document.createElement("div"); if(c) d.className = c; d.textContent = t; scr.appendChild(d); scr.scrollTop = scr.scrollHeight; };
    const cmds = {
      help(){ out("可用命令："); ["todo  列出待办 / todo add <内容> / todo done <序号>",
        "note  列出笔记 / note add <内容>", "board 列出看板三列", "search <词> 搜待办与笔记",
        "stock 库存与占用", "status 这台东西装了什么", "clear 清屏"].forEach(x => out("  " + x)); },
      todo(a){
        if(a[0] === "add" && a[1]) { ST.todo.push({t:a.slice(1).join(" "), done:false, at:ts()}); save(); out("已添加：" + a.slice(1).join(" "), "ok"); return; }
        if(a[0] === "done" && a[1]) { const i = +a[1] - 1; if(ST.todo[i]){ ST.todo[i].done = true; save(); out("已完成：" + ST.todo[i].t, "ok"); } else out("没有第 " + a[1] + " 条", "err"); return; }
        if(!ST.todo.length) return out("（空）", "dim");
        ST.todo.forEach((t, i) => out(`  ${i + 1}. [${t.done ? "x" : " "}] ${t.t}`));
      },
      note(a){
        if(a[0] === "add" && a[1]) { ST.note.push({t:a.slice(1).join(" "), at:ts()}); save(); out("已记下", "ok"); return; }
        if(!ST.note.length) return out("（空）", "dim");
        ST.note.forEach((n, i) => out(`  ${i + 1}. ${n.t.split("\n")[0].slice(0, 60)}  ${n.at}`));
      },
      board(){
        ["待办", "进行中", "已完成"].forEach((nm, ci) => {
          out(nm, "grp"); ST.board.filter(b => b.c === ci).forEach(b => out("  · " + b.t));
        });
      },
      search(q){
        const w = (q || "").toLowerCase(); if(!w) return out("用法：search <词>");
        const hit = [];
        ST.todo.forEach(t => t.t.toLowerCase().includes(w) && hit.push(["待办", t.t]));
        ST.note.forEach(n => n.t.toLowerCase().includes(w) && hit.push(["笔记", n.t.split("\n")[0]]));
        if(!hit.length) return out("没搜到「" + q + "」", "dim");
        hit.forEach(([k, t]) => out(`  [${k}] ${t.slice(0, 70)}`));
      },
      stock(){
        out("SKU            名称              在库  占用", "grp");
        ST.stock.forEach(s => out(`  ${s.sku.padEnd(14)} ${s.nm.padEnd(16)} ${String(s.qty).padStart(3)}   ${s.hold}`));
        out("提示：扣减要用带条件的 UPDATE（qty >= n），先查后扣在大促那天必然超卖。", "dim");
      },
      status(){
        out(D.name, "grp");
        out(`  形态 ${D.formNm} · 平台 ${(D.platNm || []).join("/") || "—"} · 内存约 ${D.mem ? (D.mem.total / 1024).toFixed(1) + " GB" : "—"}`);
        out("  模块：" + D.mods.map(m => m.nm).join("、"));
        out("  能力格：" + D.cells.length + " 格 · 连线 " + D.lines + " 条");
        if((D.shop || []).length) out("  没装：" + D.shop.map(p => p.nm + "(" + p.mods.length + ")").join("、") + "　用 shop 看怎么装", "dim");
      },
      shop(){
        if(!(D.shop || []).length) return out("全都装上了。", "dim");
        D.shop.forEach(p => { out(p.nm + "（" + p.mods.length + "）", "grp"); p.mods.forEach(m => out("  · " + m.nm + "　" + m.sub)); });
        out("模拟版没有真的下载；真实版本这里会走「下载 → 校验 → 热加载」。", "dim");
      },
      clear(){ scr.innerHTML = ""; }
    };
    out(D.name + "　" + D.formNm + " · " + D.mods.length + " 个模块", "grp");
    out("输入 help 看命令。这是模拟，数据存在浏览器里。", "dim");
    inp.focus();
    inp.addEventListener("keydown", e => {
      if(e.key !== "Enter") return;
      const line = inp.value.trim(); inp.value = "";
      out("$ " + line, "cmd");
      if(!line) return;
      const [c, ...a] = line.split(/\s+/);
      if(cmds[c]) { try { cmds[c](a); } catch(err){ out("出错：" + err.message, "err"); } }
      else out("没有这个命令：" + c + "（输入 help）", "err");
    });
    return;
  }

  P.shop = el => {
    const ins = () => { try { return JSON.parse(localStorage.getItem(K + ".inst") || "[]"); } catch(e){ return []; } };
    const got = ins();
    const packs = (D.shop || []);
    const total = packs.reduce((n, p) => n + p.mods.length, 0);
    el.innerHTML = `<div class="hd">模块商店<span class="c">${total} 个模块没装 · 按需下载</span></div>
      <div class="card" style="margin-bottom:10px">
        <div style="font-size:12.5px;line-height:1.7">
          <b>最小包为什么留着这个页面：</b>先装一个能跑的地基（几十 MB），
          其余模块你以后用到哪个再下哪个。下载是「拿一个包 + 校验 + 热加载」，不用重装主程序。
        </div>
      </div>
      ${packs.map(p => `<div class="card" style="margin-bottom:9px;border-left:3px solid hsl(${p.hue} 55% 62%)">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <b style="font-size:13px">${esc(p.nm)}</b>
          <span class="badge">${p.mods.length} 个</span>
          <span style="flex:1"></span>
          <button class="btn" data-pall="${p.id}">整包安装</button>
        </div>
        ${p.mods.map(m => `<div class="row" data-mid="${m.id}" data-got="${got.includes(m.id) ? 1 : 0}">
          <div class="tx"><b style="font-weight:600">${esc(m.nm)}</b>
            <div style="font-size:11.5px;color:#96938a">${esc(m.sub)}${m.why ? "　·　" + esc(m.why) : ""}</div></div>
          <button class="btn" data-ins="${m.id}">${got.includes(m.id) ? "已装 ✓" : "下载"}</button>
        </div>`).join("")}
      </div>`).join("")}
      <div class="hint">点了「下载」只是把这一格标记成已装（模拟）。真实版本要做三件事：
        <b>分块下载 + sha256 校验 + 装完热加载</b>，任一失败要能回滚到上一个可用版本。</div>`;
    const mark = id => {
      const cur = ins(); if(!cur.includes(id)) cur.push(id);
      try { localStorage.setItem(K + ".inst", JSON.stringify(cur)); } catch(e){}
      paint(); toast("已装（模拟）：" + ((D.shop.flatMap(p => p.mods).find(m => m.id === id) || {}).nm || id));
    };
    $$("[data-ins]", el).forEach(b => b.onclick = () => mark(b.dataset.ins));
    $$("[data-pall]", el).forEach(b => b.onclick = () => {
      const p = packs.find(x => x.id === b.dataset.pall);
      const cur = ins();
      p.mods.forEach(m => { if(!cur.includes(m.id)) cur.push(m.id); });
      try { localStorage.setItem(K + ".inst", JSON.stringify(cur)); } catch(e){}
      paint(); toast("整包已装（模拟）：" + p.nm);
    });
  };

  P.board = el => {
    const COLS = ["待办", "进行中", "已完成"], CN = ["#c9a227", "#3f7d5a", "#6b6960"];
    el.innerHTML = `<div class="hd">看板<span class="c">${ST.board.length} 张卡 · 点一下挪到下一列</span></div>
      <div class="cols">${COLS.map((nm, ci) => {
        const list = ST.board.map((b, i) => [b, i]).filter(([b]) => b.c === ci);
        return `<div class="col"><h4><span class="tg" style="background:${CN[ci]};width:6px;height:6px;border-radius:50%;display:inline-block"></span>
          ${nm}<i>${list.length}</i></h4>
          ${list.length ? list.map(([b, i]) => `<div class="gc" data-mv="${i}">
            <span class="tg" style="background:${CN[ci]}"></span><span>${esc(b.t)}</span></div>`).join("")
            : `<div class="empty" style="padding:10px 0">空</div>`}</div>`;
      }).join("")}</div>

/* ────────── 打包：zip（store 模式，不压缩，够用且不引外部库） ────────── */
const CRC_T = (() => {
  const t = new Uint32Array(256);
  for(let i = 0; i < 256; i++){
    let c = i;
    for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for(let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files){
  const enc = new TextEncoder();
  const parts = [], central = [];
  let off = 0;
  const dt = new Date();
  const dtime = ((dt.getHours() << 11) | (dt.getMinutes() << 5) | (dt.getSeconds() >> 1)) & 0xFFFF;
  const ddate = (((dt.getFullYear() - 1980) << 9) | ((dt.getMonth() + 1) << 5) | dt.getDate()) & 0xFFFF;
  files.forEach(f => {
    const name = enc.encode(f.name);
    const data = typeof f.data === "string" ? enc.encode(f.data) : f.data;
    const crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, 0, true); lh.setUint16(10, dtime, true); lh.setUint16(12, ddate, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dtime, true); ch.setUint16(14, ddate, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
    ch.setUint16(28, name.length, true); ch.setUint16(30, 0, true); ch.setUint16(32, 0, true);
    ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true); ch.setUint32(42, off, true);
    central.push(new Uint8Array(ch.buffer), name);
    off += 30 + name.length + data.length;
  });
  const csize = central.reduce((n, u) => n + u.length, 0);
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true);
  eocd.setUint16(8, files.length, true); eocd.setUint16(10, files.length, true);
  eocd.setUint32(12, csize, true); eocd.setUint32(16, off, true); eocd.setUint16(20, 0, true);
  const all = [...parts, ...central, new Uint8Array(eocd.buffer)];
  const total = all.reduce((n, u) => n + u.length, 0);
  const out = new Uint8Array(total);
  let p = 0;
  all.forEach(u => { out.set(u, p); p += u.length; });
  return out;
}

## 一张对照表

| 平台 | 产物 | 默认会被拦 | 最快过法 | 彻底解决 |
|---|---|---|---|---|
| macOS | dmg / app | Gatekeeper：「无法验证开发者」或「已损坏」 | 右键 → 打开，或 \`xattr -dr com.apple.quarantine\` | Apple Developer 签名 + 公证（99 美元/年），或发源码 |

| Linux | AppImage / deb | 没有执行权限 / 缺依赖 | \`chmod +x\`、\`apt install ./x.deb\` | AppImage 自带运行时，或发源码 |
| 安卓 | apk | 未知来源被禁 | 设置里允许该来源安装 | 上架应用商店，或做成 PWA 加到主屏 |
| 网页 | 网址 | 没有安装这一步 | — | 走 HTTPS；本地打开时摄像头/定位多半被禁 |
| CLI | 单文件二进制 | 未签名二进制被拦 | \`chmod +x\`，右键打开 | 发源码让用户自己 \`build\`，或发脚本 |
`;
  return {manifest, readme, install};
}

        : (mm.ok
          ? (mm.tight ? `还剩 ${mbTxt(mm.avail - mm.total)}，偏紧：开长上下文或同时开别的程序时可能被系统换出去，速度会掉。` : `还剩 ${mbTxt(mm.avail - mm.total)}，稳。`)
          : `只剩 ${mbTxt(mm.avail - mm.total)} 余量，太挤了：模型降一档（<b>${esc(mm.down ? mm.down.nm : "Q 0.5B")}</b>）会舒服很多。`)}</div>
    </div>

    <div class="secttl"><b>② 安装时会被什么拦住</b><span>${esc(formDef().nm)} · ${esc(plats.map(p => (PLATS.find(x => x.id === p) || {}).nm).filter(Boolean).join(" / ") || "—")}</span></div>
    <div class="inst">
      ${notes.map(n => `<div class="icard"><div class="ih"><b>${esc(n.pl)}</b>
        <span class="badge ${n.pl === "安卓" ? "warn" : "mute"}">${form === "web" ? "免安装" : (form === "cli" ? "命令行" : "安装包")}</span></div>
        ${n.items.map(it => `<div class="irow"><em>${esc(it.ty)}</em><div>${it.body}</div></div>`).join("")}
      </div>`).join("")}
    </div>
    <div class="hintline">一句话：<b>被拦住的从来不是「你的程序不好」，是「系统不认识它」</b>。
      要么买证书让它认识你，要么发源码让用户自己编——后者零成本，而且用户能看到每一行。</div>

    <div class="secttl"><b>③ 打多大</b><span>最小包只装地基，其余以后按需下载</span></div>
    <div class="minbox ${data.min ? "on" : ""}">
      <div class="switch ${data.min ? "on" : ""}" id="bMin"></div>
      <div>
        <b>最小打包</b>
        <div class="faint" style="font-size:12px;line-height:1.7">
          只带 <b>${minN}</b> 个地基模块（core 里必装的几块 + 扩展系统），其余 <b>${S.hub.mods.length - minN}</b> 个模块在商店里按需下。
          <b>模块商店入口强制保留</b>——最小包要是连下载入口都没有，以后就再也加不上东西了。
        </div>
      </div>
      <span class="badge ${data.min ? "ok" : "mute"}" style="margin-left:auto">${data.min ? "只发 " + kb + " KB" : "全量"}</span>
    </div>

    <div class="secttl"><b>④ 包里有什么</b><span>${files.length} 个文件 · ${data.mods.length} 个模块 · ${data.cells.length} 格 · ${data.lines} 条连线</span></div>
    <div class="packlist">
      <div class="row"><b>index.html</b><span>${(htmlDoc.length / 1024).toFixed(1)} KB · ${data.form === "cli" ? "双击打开是一个能敲命令的终端" : "刚才试的那个东西，双击即开，不依赖网络"}</span></div>
      <div class="row"><b>manifest.json</b><span>模块、能力格、胶水、底座、内存估算、施工顺序</span></div>
      <div class="row"><b>README.md</b><span>怎么用、装了什么、施工顺序、三个提醒</span></div>
      <div class="row"><b>安装说明.md</b><span>${notes.length} 个平台：会被什么拦住、怎么过、怎么彻底绕开</span></div>
      <div class="row"><b>模块清单.md</b><span>按能力格展开的施工表，含每格选的方案与类型</span></div>
      ${(data.shop || []).length ? `<div class="row"><b>modules.json</b><span>还没装的 ${(data.shop || []).reduce((n, p) => n + p.mods.length, 0)} 个模块清单，商店照它去下</span></div>` : ""}
    </div>

    <div class="secttl"><b>⑤ 装完的模拟结果</b><span>这些数字会一起写进 manifest.json</span></div>
    <div class="resgrid">
      <div class="rcell"><span>运行时</span><b>${mbTxt(mm.shellMB)}</b><i>${esc(BASE[0].provs.find(p => p.id === mm.pick) ? BASE[0].provs.find(p => p.id === mm.pick).n : mm.pick)}</i></div>
      <div class="rcell"><span>模块与数据</span><b>${mbTxt(mm.packMB)}</b><i>${mm.packs.length} 个包</i></div>
      <div class="rcell"><span>本地模型</span><b>${mm.modelMB ? mbTxt(mm.modelMB) : "—"}</b><i>${mm.mdl ? esc(mm.mdl.nm) + " · 约 " + mm.mdl.tps + " 字/秒" : "未启用"}</i></div>
      <div class="rcell"><span>合计</span><b class="${mm.ok ? "ok" : "a"}">${mbTxt(mm.total)}</b><i>${mm.ok ? "在 " + mbTxt(mm.avail) + " 可用之内" : "超出 " + mbTxt(mm.total - mm.avail)}</i></div>
      <div class="rcell"><span>磁盘</span><b>${zipBytes.length >= 1048576 ? (zipBytes.length / 1048576).toFixed(1) + " MB" : kb + " KB"}</b><i>${data.min ? "最小包" : "全量包"}${mm.modelMB ? "（不含权重）" : ""}</i></div>
      <div class="rcell"><span>冷启动估计</span><b>${mm.modelMB ? (mm.mdl.gb < 2 ? "1 秒内" : "2–5 秒") : "0.5 秒内"}</b><i>${mm.modelMB ? "要先把权重读进内存" : "没有权重加载"}</i></div>
    </div>

    <div class="card box" style="margin:14px 0">
      <div class="bh">包里怎么来的 <span class="sp">${esc(data.at)}</span></div>
      <div class="kv"><b>形态 / 规格</b><span>${esc(formDef().nm)} · ${esc(data.style)}</span></div>
      <div class="kv"><b>平台</b><span>${esc(data.platNm.join(" / ") || "—")}</span></div>
      <div class="kv"><b>模块</b><span>${data.mods.map(m => esc(m.nm)).join("、")}</span></div>
      <div class="kv"><b>施工首格</b><span>${data.order.length ? esc(data.order[0].nm) + "（" + esc(data.order[0].id) + "）" : "—"}</span></div>
      <div class="kv"><b>施工末格</b><span>${data.order.length ? esc(data.order[data.order.length - 1].nm) + "（" + esc(data.order[data.order.length - 1].id) + "）" : "—"}</span></div>
    </div>

    <div style="display:flex;gap:9px;flex-wrap:wrap">
      <button class="btn back" id="bPBack2" style="margin-right:auto">← 上一步：回试用</button>
      <button class="btn primary lg" id="bZipDown">下载 .zip（${kb} KB）</button>
      <button class="btn" id="bOnlyHtml">只要 index.html</button>
      <button class="btn" id="bExpP">导出清单 .md</button>
      <button class="btn ghost" id="bPAgain">再做一个</button>
    </div>
    <p class="faint" style="font-size:11.5px;margin-top:12px">
      解开就是普通文件夹，没有安装脚本、没有运行时依赖——这一版是原型，装出来的东西还不能真跑，
      但界面、交互、安装说明照着它做即可。</p>
  </div>`;
  const dl = (blob, name) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
    toast("已下载 " + name);
  };
  $("#bZipDown").onclick = () => dl(new Blob([zipBytes], {type:"application/zip"}),
    (S.hub.min ? "moshan-min" : "moshan-hub") + ".zip");
  $("#bOnlyHtml").onclick = () => dl(new Blob([htmlDoc], {type:"text/html;charset=utf-8"}), "试用版.html");
  $("#bExpP").onclick = exportMd;
  $("#bPBack").onclick = $("#bPBack2").onclick = () => go("#/trial");
  $("#bPAgain").onclick = () => { S.need = ""; S.hub = null; save(); go("#/hub-style"); };
  $("#bMin").onclick = () => { S.hub.min = !S.hub.min; save(); route(); };
  document.querySelectorAll("[data-mem]").forEach(b => b.onclick = () => {
    S.hub.mem = +b.dataset.mem; save(); route();
  });
  document.querySelectorAll("[data-mdl]").forEach(b => b.onclick = () => {
    S.hub.model = b.dataset.mdl; save(); route();
  });
}

function viewDone(){
  const isHub = !!(S.hub && S.hub.mods.length);
  if(isHub && !S.picks.length){ S.cov = hubCov(); S.picks = hubCells(S.hub.mods); }
  const r = check(S.picks), b = S.build;
  topbar(isHub ? `工作台 <span>/</span> <b>${esc(sceneName())}</b>` : `工作台 <span>/</span> <b>完成</b>`,
    isHub ? hubSteps(7) : 4, "");
  const order = r.order.filter(c => S.picks.includes(c));
  const byDom = new Map();
  order.forEach(cid => {
    const c = byId[cid];
    if(!byDom.has(c.dom)) byDom.set(c.dom, []);
    byDom.get(c.dom).push(c.name);
  });
  const files = [...byDom.entries()].map(([d, ns]) =>
    d === "hw" ? `  ├─ hardware/   ${ns.join("、")}`
               : `  ├─ src/${d.replace(/\./g, "-")}/   ${ns.join("、")}`).join("\n");
  const board = isHub ? pcbHTML({order: S.hub.mods.slice(), i: S.hub.mods.length, hub: true, done: true}) : "";
  $("#view").innerHTML = `<div class="donewrap">
    ${board ? `<div style="width:100%;max-width:640px;margin:0 auto 18px">${board}</div>` : ""}
    <div class="tick">✓</div>
    <h1>${isHub ? "中台装配完成" : "装配完成"}</h1>
    <p>${isHub ? `${S.hub.mods.length} 个模块插在 ${S.picks.length} 格上，${r.lines} 条连线已接通。`
                : `${S.picks.length} 格全部就绪，${r.lines} 条连线已接通。`}</p>
    <div class="tree">${b && b.isHw ? "device/" : "app/"}
${files}
  ├─ <span class="d">${b && b.isHw ? "hardware/接口约定.md" : "src/wire.ts"}</span><span class="m">  ← 接口基板（${Object.keys(D.typeCn).length} 种类型）</span>
  ├─ <span class="d">.env.example</span><span class="m">      ← 商业服务的 key 占位</span>
  └─ <span class="d">README.md</span><span class="m">         ← 每格做什么、为什么选这个方案</span></div>
    <div class="donebtns">
      ${isHub
        ? `<button class="btn" id="bDoneBack">← 上一步：回组装</button>
           <button class="btn primary" id="bTrial">先试用一下</button>
           <button class="btn" id="bPack">打包带走</button>
           <button class="btn ghost" id="bDraft2">存草稿</button>
           <button class="btn ghost" id="bExp2">导出清单</button>
           <button class="btn ghost" id="bAgain">再做一个中台</button>`
        : `<button class="btn" id="bDoneBack">← 上一步：回组装</button>
           <button class="btn primary" id="bOpen">打开项目目录</button>
           <button class="btn" id="bExp2">导出清单</button>
           <button class="btn ghost" id="bAgain">再做一个</button>`}
    </div>
  </div>`;
  if($("#bTrial")) $("#bTrial").onclick = () => go("#/trial");
  if($("#bPack")) $("#bPack").onclick = () => go("#/pack");
  /* 组装状态可能已经没了（草稿恢复进来），那就退回确认页 */
  $("#bDoneBack").onclick = () => go(S.build ? "#/build" : "#/confirm");
  if($("#bDraft2")) $("#bDraft2").onclick = () => draftBox($("#bDraft2"));
  if($("#bOpen")) $("#bOpen").onclick = () => toast("原型：这里会打开本地项目目录");
  $("#bExp2").onclick = exportMd;
  $("#bAgain").onclick = () => { S.need = ""; S.hub = null; save(); go(isHub ? "#/hub-style" : "#/new"); };
}

/* ────────── 视图：模块库 ────────── */
function viewLib(){
  topbar(`<b>模块库</b>`, null, `<span class="faint" style="font-size:12px">${D.comps.length} 格 · ${D.comps.reduce((n, c) => n + c.pv.length, 0)} 个方案</span>`);
  $("#view").innerHTML = `<div class="page">
    <div class="pagehd"><div><h1>模块库</h1><p>按域分组。点任一格看它要什么、给什么、有哪些方案。</p></div></div>
    <div class="libbar"><input class="search" id="q" placeholder="搜模块名、编号、方案名…"></div>
    <div id="liblist"></div>
  </div>`;
  const draw = kw => {
    const q = (kw || "").trim().toLowerCase();
    const hitc = c => !q || c.name.includes(q) || c.id.includes(q) || (c.pv || []).some(p => p.n.toLowerCase().includes(q));
    const list = D.comps.filter(hitc);
    $("#liblist").innerHTML = D.domOrder.filter(d => list.some(c => c.dom === d)).map(d => {
      const items = list.filter(c => c.dom === d);
      return `<div class="libdom"><div class="gt"><span class="dot" style="background:var(--faint)"></span>
        ${esc(D.doms[d] || d)}<i>${items.length} 格</i></div>
        <div class="librow">${items.map(c => `<div class="libitem" data-lib="${c.id}">
          <b>${esc(c.name)}</b><span class="cid">${c.id}</span>
          <p>${esc(c.abstract)}</p></div>`).join("")}</div></div>`;
    }).join("") || `<div class="empty">没搜到</div>`;
    document.querySelectorAll("[data-lib]").forEach(n => n.onclick = () => detail(n.dataset.lib));
  };
  draw("");
  $("#q").oninput = e => draw(e.target.value);
}

/* ────────── 启动 ────────── */
$("#btnHelp").onclick = e => {
  e.preventDefault();
  modal(`<div class="mh"><b>怎么用</b><button class="x" data-x="1">✕</button></div>
    <div class="mb">
      <p style="margin-top:0">两条路，走到同一个地方——都落在同一套能力格上，都会检查能不能接上。</p>
      <p><b>① 装一个东西</b>　工作台第一张卡：选场景 → 定风格（极简 / 中等 / 齐全）→ 勾包与模块 → 给每块挑实现方案
        → 确认清单 → 像往主板上插模块一样装起来 → 试用 → 打包带走。</p>
      <p><b>② 一句话需求</b>　写一句大白话，说清「拿什么进来、变成什么出去」，系统反推要哪些能力格，
        再挑方案、看连通、开工。</p>
      <p><b>连通检查</b>　红色断点必须先修（要的类型没人产出），黄色死端是做出来没去处。</p>
      <p><b>草稿</b>　任意一步右上角点「存草稿」，起个名字；之后在工作台「草稿箱」里点「继续」，
        风格、模块、方案、勾选原样带回来。草稿箱还能导出成 JSON 文件带走、再导入回来。
        组装过程本身不存（它是过程不是结果），恢复后从「确认」重开一次。</p>
      <p class="faint" style="font-size:12px">快捷键：⌘/Ctrl + Enter 解析需求；Esc 关闭弹窗。</p>
    </div>`, `<button class="btn" data-x="1">知道了</button>`);
  $("#modal").querySelectorAll("[data-x]").forEach(x => x.onclick = closeModal);
};
$("#btnSetting").onclick = e => {
  e.preventDefault();
  modal(`<div class="mh"><b>设置</b><button class="x" data-x="1">✕</button></div>
    <div class="mb">
      <div class="kv"><b>当前需求</b><span>${esc(S.need || "（空）")}</span></div>
      <div class="kv"><b>当前模式</b><span>${S.hub && S.hub.mods.length
        ? esc(hubLabel()) + " · " + S.hub.mods.length + " 模块" : "一句话需求"}</span></div>
      <div class="kv"><b>已勾格数</b><span>${S.picks.length}</span></div>
      <div class="kv"><b>草稿</b><span>${S.drafts.length} 份</span></div>
      <div class="kv"><b>存储</b><span>${LSOK
        ? "浏览器 localStorage（键 " + KEY + "）"
        : "当前环境禁用了 localStorage，只记在内存里——要留着请导出草稿"}</span></div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn sm" id="sExp">导出全部草稿</button>
        <button class="btn sm" id="sImp">导入草稿</button>
      </div>
      <p class="faint" style="font-size:12px">接到真后端后，这里会有账号、项目仓库地址、默认模型供应商。</p>
    </div>`, `<button class="btn" data-x="1">关闭</button>`);
  $("#modal").querySelectorAll("[data-x]").forEach(x => x.onclick = closeModal);
  $("#sExp").onclick = () => { closeModal(); draftExport(); };
  $("#sImp").onclick = () => { closeModal(); draftImport(); };
};

load();
if(!location.hash) location.hash = "#/home";
route();
window.addEventListener("hashchange", route);
</script>
